name: analytics_track
description: CI analytics start / track / send (OpenTelemetry-shaped client)
inputs:
  command:
    required: false
    default: track
    description: start / end / track / send
  name:
    required: false
    default: ""
    description: Event or span name (e.g. ydbd_cached_build, build_info)
  source:
    required: false
    default: ""
    description: Producer id (workflow/script name)
  kind:
    required: false
    default: ""
    description: duration / gauge / count / event / info
  started-epoch:
    required: false
    default: ""
  finished-epoch:
    required: false
    default: ""
  duration-ms:
    required: false
    default: ""
  duration-sec:
    required: false
    default: ""
  value:
    required: false
    default: ""
  unit:
    required: false
    default: ""
  conclusion:
    required: false
    default: ""
  json:
    required: false
    default: ""
    description: Optional measurement JSON object (flat attrs or a snapshot)
  json-file:
    required: false
    default: ""
    description: Path to a large JSON snapshot (e.g. all-component build_info)
  runner:
    required: false
    default: "false"
    description: Collect static runner inventory (boot/cpu/ram/disks) once and reuse
  usage:
    required: false
    default: "false"
    description: Attach a fresh CPU/RAM/disk usage snapshot to this event only
  labels:
    required: false
    default: ""
    description: Comma-separated key=value labels
runs:
  using: composite
  steps:
    - name: Analytics ${{ inputs.command }}
      continue-on-error: true
      shell: bash
      run: |
        cmd="${{ inputs.command }}"
        cmd="${cmd:-track}"
        args=("$cmd")
        if [ -n "${{ inputs.name }}" ]; then args+=(--name "${{ inputs.name }}"); fi
        if [ -n "${{ inputs.source }}" ]; then args+=(--source "${{ inputs.source }}"); fi
        if [ -n "${{ inputs.kind }}" ]; then args+=(--kind "${{ inputs.kind }}"); fi
        if [ -n "${{ inputs.started-epoch }}" ]; then args+=(--started-epoch "${{ inputs.started-epoch }}"); fi
        if [ -n "${{ inputs.finished-epoch }}" ]; then args+=(--finished-epoch "${{ inputs.finished-epoch }}"); fi
        if [ -n "${{ inputs.duration-ms }}" ]; then args+=(--duration-ms "${{ inputs.duration-ms }}"); fi
        if [ -n "${{ inputs.duration-sec }}" ]; then args+=(--duration-sec "${{ inputs.duration-sec }}"); fi
        if [ -n "${{ inputs.value }}" ]; then args+=(--value "${{ inputs.value }}"); fi
        if [ -n "${{ inputs.unit }}" ]; then args+=(--unit "${{ inputs.unit }}"); fi
        if [ -n "${{ inputs.conclusion }}" ]; then args+=(--conclusion "${{ inputs.conclusion }}"); fi
        if [ -n "${{ inputs.json }}" ]; then args+=(--json "${{ inputs.json }}"); fi
        if [ -n "${{ inputs.json-file }}" ]; then args+=(--json-file "${{ inputs.json-file }}"); fi
        case "${{ inputs.runner }}" in true|TRUE|yes|YES|1) args+=(--runner);; esac
        case "${{ inputs.usage }}" in true|TRUE|yes|YES|1) args+=(--usage);; esac
        if [ -n "${{ inputs.labels }}" ]; then
          IFS=',' read -ra pairs <<< "${{ inputs.labels }}"
          for pair in "${pairs[@]}"; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            if [ -n "$pair" ]; then
              args+=(--label "$pair")
            fi
          done
        fi
        python3 .github/scripts/utils/analytics/ci_metrics.py "${args[@]}" || true
