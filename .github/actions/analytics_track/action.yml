name: analytics_track
description: CI analytics start / track / send (OpenTelemetry-shaped client)
inputs:
  command:
    required: false
    default: track
    description: start / end / track / send
  name:
    required: false
    default: ""
    description: Event or span name (e.g. ydbd_cached_build, build_info)
  source:
    required: false
    default: ""
    description: Producer id (workflow/script name)
  kind:
    required: false
    default: ""
    description: duration / gauge / count / event / info
  started-epoch:
    required: false
    default: ""
  finished-epoch:
    required: false
    default: ""
  duration-ms:
    required: false
    default: ""
  duration-sec:
    required: false
    default: ""
  value:
    required: false
    default: ""
  unit:
    required: false
    default: ""
  conclusion:
    required: false
    default: ""
  json:
    required: false
    default: ""
    description: Optional measurement JSON object (flat attrs or a snapshot)
  json-file:
    required: false
    default: ""
    description: Path to a large JSON snapshot (e.g. all-component build_info)
  runner:
    required: false
    default: "false"
    description: Collect static runner inventory (boot/cpu/ram/disks) once and reuse
  usage:
    required: false
    default: "false"
    description: Attach a fresh CPU/RAM/disk usage snapshot to this event only
  labels:
    required: false
    default: ""
    description: Comma-separated key=value labels
runs:
  using: composite
  steps:
    - name: Analytics ${{ inputs.command }}
      continue-on-error: true
      shell: bash
      env:
        ANALYTICS_COMMAND: ${{ inputs.command }}
        ANALYTICS_NAME: ${{ inputs.name }}
        ANALYTICS_SOURCE: ${{ inputs.source }}
        ANALYTICS_KIND: ${{ inputs.kind }}
        ANALYTICS_STARTED_EPOCH: ${{ inputs.started-epoch }}
        ANALYTICS_FINISHED_EPOCH: ${{ inputs.finished-epoch }}
        ANALYTICS_DURATION_MS: ${{ inputs.duration-ms }}
        ANALYTICS_DURATION_SEC: ${{ inputs.duration-sec }}
        ANALYTICS_VALUE: ${{ inputs.value }}
        ANALYTICS_UNIT: ${{ inputs.unit }}
        ANALYTICS_CONCLUSION: ${{ inputs.conclusion }}
        ANALYTICS_JSON: ${{ inputs.json }}
        ANALYTICS_JSON_FILE: ${{ inputs.json-file }}
        ANALYTICS_RUNNER: ${{ inputs.runner }}
        ANALYTICS_USAGE: ${{ inputs.usage }}
        ANALYTICS_LABELS: ${{ inputs.labels }}
      run: |
        cmd="${ANALYTICS_COMMAND:-track}"
        case "$cmd" in
          start|end|track|send|flush) ;;
          *) echo "Unknown analytics command: $cmd" >&2; exit 0 ;;
        esac
        args=("$cmd")
        if [ -n "$ANALYTICS_NAME" ]; then args+=(--name "$ANALYTICS_NAME"); fi
        if [ -n "$ANALYTICS_SOURCE" ]; then args+=(--source "$ANALYTICS_SOURCE"); fi
        if [ -n "$ANALYTICS_KIND" ]; then args+=(--kind "$ANALYTICS_KIND"); fi
        if [ -n "$ANALYTICS_STARTED_EPOCH" ]; then args+=(--started-epoch "$ANALYTICS_STARTED_EPOCH"); fi
        if [ -n "$ANALYTICS_FINISHED_EPOCH" ]; then args+=(--finished-epoch "$ANALYTICS_FINISHED_EPOCH"); fi
        if [ -n "$ANALYTICS_DURATION_MS" ]; then args+=(--duration-ms "$ANALYTICS_DURATION_MS"); fi
        if [ -n "$ANALYTICS_DURATION_SEC" ]; then args+=(--duration-sec "$ANALYTICS_DURATION_SEC"); fi
        if [ -n "$ANALYTICS_VALUE" ]; then args+=(--value "$ANALYTICS_VALUE"); fi
        if [ -n "$ANALYTICS_UNIT" ]; then args+=(--unit "$ANALYTICS_UNIT"); fi
        if [ -n "$ANALYTICS_CONCLUSION" ]; then args+=(--conclusion "$ANALYTICS_CONCLUSION"); fi
        if [ -n "$ANALYTICS_JSON" ]; then args+=(--json "$ANALYTICS_JSON"); fi
        if [ -n "$ANALYTICS_JSON_FILE" ]; then args+=(--json-file "$ANALYTICS_JSON_FILE"); fi
        case "$ANALYTICS_RUNNER" in true|TRUE|yes|YES|1) args+=(--runner);; esac
        case "$ANALYTICS_USAGE" in true|TRUE|yes|YES|1) args+=(--usage);; esac
        if [ -n "$ANALYTICS_LABELS" ]; then
          IFS=',' read -ra pairs <<< "$ANALYTICS_LABELS"
          for pair in "${pairs[@]}"; do
            pair="${pair#"${pair%%[![:space:]]*}"}"
            pair="${pair%"${pair##*[![:space:]]}"}"
            if [ -n "$pair" ]; then
              args+=(--label "$pair")
            fi
          done
        fi
        python3 .github/scripts/utils/analytics/ci_metrics.py "${args[@]}" || true
