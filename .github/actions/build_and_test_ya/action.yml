name: Ya-Build-and-Test
inputs:
  build_target:
    type: string
    default: "ydb/"
    description: "limit build and test to specific target"
  build_preset:
    type: string
  run_tests:
    type: boolean
    default: true
    description: "run tests"
  test_threads:
    type: string
    default: 64
    description: "Test threads count"
  link_threads:
    type: string
    default: 2
    description: "link threads count"
  test_size:
    type: string
    default: "small,medium,large"
  test_type:
    type: string
    default: ""
    description: "run only specific test types (or all by default)"
  increment:
    type: boolean
    required: true
    description: If true, compares build graphs between the current and previous commits to find a list of test suites to run. Otherwise, runs all tests.
  put_build_results_to_cache:
    type: boolean
    default: true
  additional_ya_make_args:
    type: string
    default: ""
  test_retry_count:
    default: ""
    description: "Maximum attempts including the initial run (positive integer). Default: 3, or 1 for TSAN/MSAN."
  secs:
    type: string
    default: ""
  vars:
    type: string
    default: ""
  custom_branch_name:
    description: "Custom branch name required when workflow branch != checkout branch"
    type: string
    required: false
  add_vcs_info:
    type: boolean
    default: false
    description: "add ya make vars with git info"
  collect_coredumps:
    type: boolean
    default: true
    description: "Collect coredumps to a 100G loop volume at /coredumps (for ya test recovery)"
  pull_number:
    type: string
    required: false
    description: "Pull request number (for workflow_call events)"
  custom_ya_bin_s3_uri:
    type: string
    required: false
    default: "s3://ydb-gh-logs/experimental/ya-cpu-quota/ya-bin-account-cgroup-20261026.tar.gz"
    description: "s3:// URI of a ya-bin tarball (ya-bin at archive root). Replaces ./ya and enables --account-test-cgroup."
defaults:
  run:
    shell: bash
runs:
  using: "composite"
  steps:
    - name: Configure runner limits
      shell: bash
      run: |
        # test_tool requests 1 MiB stderr pipes. Parallel runs can exhaust the
        # per-user pipe budget, preventing pipe growth. With a small buffer,
        # test_tool's 100 ms polling sleep can block chatty tests on stderr writes
        # and cause timeouts. Raise the soft budget to 8 GiB per user.
        sysctl fs.pipe-user-pages-soft fs.pipe-user-pages-hard fs.pipe-max-size
        pipe_soft_pages=$((8 * 1024 * 1024 * 1024 / $(getconf PAGESIZE)))
        current_soft_pages=$(sysctl -n fs.pipe-user-pages-soft)
        # Zero means unlimited; preserve it and any higher existing limit.
        if (( current_soft_pages > 0 && current_soft_pages < pipe_soft_pages )); then
          sudo -n sysctl -w "fs.pipe-user-pages-soft=$pipe_soft_pages"
        fi
        # Disable any preconfigured hard cap that could restrict this budget.
        sudo -n sysctl -w fs.pipe-user-pages-hard=0
        sysctl fs.pipe-user-pages-soft fs.pipe-user-pages-hard fs.pipe-max-size

    - name: Prepare folder prefix
      id: prepare_prefix
      shell: bash
      run: |
        # Check if custom_branch_name is set and not empty
        if [ -n "${{ inputs.custom_branch_name }}" ]; then
          # Extract and sanitize custom_branch_name
          CUSTOM_BRANCH_NAME="${{ inputs.custom_branch_name }}"
          # Replace all unsupported characters with hyphens
          SANITIZED_NAME="${CUSTOM_BRANCH_NAME//[^a-zA-Z0-9-]/-}"
          # Optionally limit the length to, say, 50 characters
          SANITIZED_NAME="${SANITIZED_NAME:0:50}"
          # Assign the sanitized name to the folder_prefix
          FOLDER_PREFIX="ya-${SANITIZED_NAME}-"
        else
          # If the branch name is not provided, use a default prefix
          FOLDER_PREFIX='ya-'
        fi
        # Output the folder_prefix for use in subsequent steps
        echo "folder_prefix=${FOLDER_PREFIX}" >> $GITHUB_ENV

    # Finalizers below must not run if this setup fails (the nested action was skipped).
    - name: Prepare s3cmd
      id: prepare_s3cmd
      uses: ./.github/actions/s3cmd
      with:
        s3_bucket: ${{ fromJSON( inputs.vars ).AWS_BUCKET }}
        s3_endpoint: ${{ fromJSON( inputs.vars ).AWS_ENDPOINT }}
        s3_key_id: ${{ fromJSON( inputs.secs ).AWS_KEY_ID }}
        s3_key_secret: ${{ fromJSON( inputs.secs ).AWS_KEY_VALUE }}
        folder_prefix: ${{ env.folder_prefix }}
        build_preset: ${{ inputs.build_preset }}

    - name: comment-build-start
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        BUILD_PRESET: ${{ inputs.build_preset }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        jobs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
        # tricky: we are searching job with name that contains build_preset
        check_url=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -s -H "Authorization: Bearer ${{github.token}}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$jobs_url" | jq --arg n "$BUILD_PRESET" -r '.jobs[] | select(.name | contains($n)) | .html_url')

        platform_name="$(echo "$(uname -s)-$(uname -p)" | tr '[:upper:]' '[:lower:]')-$BUILD_PRESET"
        echo "Pre-commit [check]($check_url) **$platform_name** for $(git rev-parse HEAD) has started." | .github/scripts/tests/comment-pr.py --rewrite

        curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
          -d '{"state":"pending","description":"The check has been started","context":"build_${{inputs.build_preset}}"}'

        if [[ "${{inputs.run_tests}}" == "true" ]]; then
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
            -d '{"state":"pending","description":"The check has been started","context":"test_${{inputs.build_preset}}"}'
        fi

    - name: Resolve analytics job name
      shell: bash
      env:
        WORKFLOW_NAME: ${{ github.workflow }}
        BUILD_PRESET: ${{ inputs.build_preset }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_NUMERIC_JOB_ID: ${{ job.check_run_id }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        ANALYTICS_JOB_NAME=$(python3 .github/scripts/analytics/resolve_ci_job_name.py "$WORKFLOW_NAME" "$BUILD_PRESET" "$EVENT_NAME")
        echo "ANALYTICS_JOB_NAME=$ANALYTICS_JOB_NAME" >> "$GITHUB_ENV"
        echo "PR_NUMBER=${{ github.event.number || inputs.pull_number }}" >> "$GITHUB_ENV"
        if [ -n "$GITHUB_NUMERIC_JOB_ID" ]; then
          echo "GITHUB_NUMERIC_JOB_ID=$GITHUB_NUMERIC_JOB_ID" >> "$GITHUB_ENV"
          job_name=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${GITHUB_NUMERIC_JOB_ID}" \
            | jq -r '.name // empty' || true)
          if [ -n "$job_name" ]; then
            echo "GITHUB_JOB_NAME=$job_name" >> "$GITHUB_ENV"
          fi
        else
          echo "job.check_run_id is empty; analytics rows of this job will be dropped" >&2
        fi

    - name: Init
      id: init
      shell: bash
      run: |
        set -x

        echo "$(pwd)/ydb/ci/scripts" >> $GITHUB_PATH

        export TMP_DIR=$(pwd)/tmp
        rm -rf $TMP_DIR
        mkdir -p $TMP_DIR
        echo "TMP_DIR=$TMP_DIR" >> $GITHUB_ENV

        # The whole dir will be uploaded to s3 with public (=wild internet) ACL
        export PUBLIC_DIR=$TMP_DIR/results
        echo "PUBLIC_DIR=$PUBLIC_DIR" >> $GITHUB_ENV
        export PUBLIC_DIR_URL=$S3_URL_PREFIX
        echo "PUBLIC_DIR_URL=$PUBLIC_DIR_URL" >> $GITHUB_ENV
        mkdir -p $PUBLIC_DIR

        echo "LAST_BUILD_RESULTS_REPORT=$PUBLIC_DIR/last_report.json" >> $GITHUB_ENV
        echo "SUMMARY_LINKS=$PUBLIC_DIR/summary_links.txt" >> $GITHUB_ENV
        echo "BUILD_PRESET=${{ inputs.build_preset }}" >> $GITHUB_ENV
        ANALYTICS_FILE=$TMP_DIR/analytics.jsonl
        export ANALYTICS_FILE
        echo "ANALYTICS_FILE=$ANALYTICS_FILE" >> $GITHUB_ENV
        mkdir -p "$(dirname "$ANALYTICS_FILE")"
        touch "$ANALYTICS_FILE"
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics start init

        python3 -m pip install ydb ydb[yc] codeowners humanize plotly pyyaml
        analytics end init --conclusion success
        if [ "${GH_PROXY_MEASURED:-}" = 1 ]; then
          chosen_mbps="${GH_PROXY_DIRECT_MBPS}"
          if [ "${GH_PROXY_USED}" = true ]; then
            chosen_mbps="${GH_PROXY_PROXY_MBPS}"
          fi
          analytics track github_proxy --kind info --source ya_phase \
            --value "$chosen_mbps" --unit "MB/s" \
            --label "use_proxy=${GH_PROXY_USED}" \
            --label "direct_mbps=${GH_PROXY_DIRECT_MBPS}" \
            --label "proxy_mbps=${GH_PROXY_PROXY_MBPS}"
          analytics flush
        fi

    - name: Clean ya cache
      id: clean_ya_cache
      shell: bash
      run: |
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics_run clean_ya_cache rm -rf ~/.ya

    - name: Setup cache
      id: setup_cache
      shell: bash
      run: |
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics start setup_cache
        export BAZEL_REMOTE_PASSWORD_FILE=$(mktemp)
        echo -n "${{ fromJSON( inputs.secs ).REMOTE_CACHE_PASSWORD || '' }}" > $BAZEL_REMOTE_PASSWORD_FILE
        echo "BAZEL_REMOTE_PASSWORD_FILE=$BAZEL_REMOTE_PASSWORD_FILE" >> $GITHUB_ENV

        export TELEGRAM_BOT_TOKEN_FILE=$(mktemp)
        echo -n "${{ fromJSON( inputs.secs ).YDBOT_TELEGRAM_BOT_TOKEN || '' }}" > $TELEGRAM_BOT_TOKEN_FILE
        echo "TELEGRAM_BOT_TOKEN_FILE=$TELEGRAM_BOT_TOKEN_FILE" >> $GITHUB_ENV
        analytics end setup_cache --conclusion success

    - name: ya build and test
      id: build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COLLECT_COREDUMPS: ${{ inputs.collect_coredumps != 'false' }}
        PR_NUMBER: ${{ github.event.number || inputs.pull_number }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CUSTOM_YA_BIN_S3_URI: ${{ inputs.custom_ya_bin_s3_uri }}
      run: |
        set -ex
        . .github/scripts/custom_ya_launch.sh
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        trap 'trap - EXIT; analytics send --conclusion cancelled' TERM INT
        trap 'rc=$?; trap - EXIT; analytics send --rc "$rc"; exit $rc' EXIT

        if [ "${COLLECT_COREDUMPS}" = "true" ]; then
          # Bounded loop volume so a flaky suite cannot fill the runner root FS.
          # File pattern (not a pipe): ya recovers via core_pattern and /coredumps/%p.%s.
          # %e is the crashing thread's comm, which actor pools rename (ydbd.System),
          # so a name-based pattern does not match the core ya looks up.
          COREDUMP_SIZE_GB=100
          COREDUMP_IMG=/var/lib/ydb-ci-coredumps.img
          COREDUMP_MNT=/coredumps

          if mountpoint -q "$COREDUMP_MNT"; then
            sudo umount "$COREDUMP_MNT" || true
          fi
          sudo rm -f "$COREDUMP_IMG"
          sudo mkdir -p "$COREDUMP_MNT"

          avail_kb=$(df -Pk "$(dirname "$COREDUMP_IMG")" | awk 'NR==2 {print $4}')
          need_kb=$((COREDUMP_SIZE_GB * 1024 * 1024))
          if [ "$avail_kb" -lt "$need_kb" ]; then
            echo "Not enough space for ${COREDUMP_SIZE_GB}G coredump volume (available ${avail_kb} KiB)"
            exit 1
          fi

          if ! sudo fallocate -l "${COREDUMP_SIZE_GB}G" "$COREDUMP_IMG"; then
            sudo dd if=/dev/zero of="$COREDUMP_IMG" bs=1M count=$((COREDUMP_SIZE_GB * 1024)) status=none
          fi
          sudo mkfs.ext4 -q -F "$COREDUMP_IMG"
          sudo mount -o loop,rw,nosuid,nodev "$COREDUMP_IMG" "$COREDUMP_MNT"
          sudo chmod 1777 "$COREDUMP_MNT"

          echo "/coredumps/%p.%s" | sudo tee /proc/sys/kernel/core_pattern

          echo "COREDUMP_IMG=$COREDUMP_IMG" >> "$GITHUB_ENV"
          echo "COREDUMP_MNT=$COREDUMP_MNT" >> "$GITHUB_ENV"

          echo "::group::coredump diagnostics"
          echo "core_pattern=$(cat /proc/sys/kernel/core_pattern)"
          echo "coredump_img=$COREDUMP_IMG (${COREDUMP_SIZE_GB}G)"
          ls -la "$COREDUMP_MNT"
          df -h "$COREDUMP_MNT" /
          echo "::endgroup::"
        else
          ulimit -c 0
        fi

        echo "Artifacts will be uploaded [here](${PUBLIC_DIR_URL}/index.html)" | GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py

        # Save original HEAD before any git operations (checkout scripts, graph_compare, etc.)
        ORIGINAL_HEAD=$(git rev-parse HEAD)
        echo "ORIGINAL_HEAD=$ORIGINAL_HEAD" >> $GITHUB_ENV

        readarray -d ',' -t test_size < <(printf "%s" "${{ inputs.test_size }}")
        readarray -d ',' -t test_type < <(printf "%s" "${{ inputs.test_type }}")

        export TEST_ICRDMA=1

        params=(
          -T
          ${test_size[@]/#/--test-size=} ${test_type[@]/#/--test-type=}
          --stat
          --test-threads "${{ inputs.test_threads }}" --link-threads "${{ inputs.link_threads }}"
          -DUSE_EAT_MY_DATA
          --add-peerdirs-tests all
          --cleanup-child-processes
        )

        TEST_RETRY_COUNT=${{ inputs.test_retry_count }}
        IS_TEST_RESULT_IGNORED=0
        DASHBOARD_SANITIZER=""

        case "$BUILD_PRESET" in
          debug)
            params+=(--build "debug")
            ;;
          relwithdebinfo)
            params+=(--build "relwithdebinfo")
            ;;
          release)
            params+=(--build "release")
            ;;
          release-asan)
            params+=(
              --build "release" --sanitize="address"
            )
            DASHBOARD_SANITIZER="address"
            ;;
          release-tsan)
            params+=(
              --build "release" --sanitize="thread"
            )
            DASHBOARD_SANITIZER="thread"
            if [ -z "$TEST_RETRY_COUNT" ]; then
              TEST_RETRY_COUNT=1
            fi
            IS_TEST_RESULT_IGNORED=1
            ;;
          release-msan)
            params+=(
              --build "release" --sanitize="memory"
            )
            DASHBOARD_SANITIZER="memory"
            if [ -z "$TEST_RETRY_COUNT" ]; then
              TEST_RETRY_COUNT=1
            fi
            IS_TEST_RESULT_IGNORED=1
            ;;
          *)
            echo "Invalid preset: $BUILD_PRESET"
            exit 1
            ;;
        esac

        echo "IS_TEST_RESULT_IGNORED=$IS_TEST_RESULT_IGNORED" >> $GITHUB_ENV

        if [ -z "$TEST_RETRY_COUNT" ]; then
          # Default: 3 attempts; TSAN/MSAN select 1 above.
          TEST_RETRY_COUNT=3
        fi

        if [ ! -z "${{ inputs.additional_ya_make_args }}" ]; then
          params+=(${{ inputs.additional_ya_make_args }})
        fi

        params+=(
          -DCONSISTENT_DEBUG --no-dir-outputs
          # Keep chunk archives separate to avoid merging and repacking them.
          --dont-merge-split-tests
          --test-failure-code 0 --build-all
          --cache-size 2TB --force-build-depends
        )

        echo "inputs.custom_branch_name = ${{ inputs.custom_branch_name }}"
        echo "GITHUB_REF_NAME = ${GITHUB_REF_NAME}"
        echo "GITHUB_BASE_REF = ${GITHUB_BASE_REF}"
        echo "GITHUB_EVENT_NAME = ${GITHUB_EVENT_NAME}"

        if [ -z "${{ inputs.custom_branch_name }}" ]; then
          # Attribute PR results and history to the target branch.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            BRANCH_NAME="${GITHUB_BASE_REF}"
          else
            BRANCH_NAME="${GITHUB_REF_NAME}"
          fi
        else
          BRANCH_NAME="${{ inputs.custom_branch_name }}"
        fi

        if [[ "${{inputs.add_vcs_info}}" == "true" ]]; then
          params+=(
            -DGIT_BRANCH=$BRANCH_NAME
            -DGIT_COMMIT_SHA=$ORIGINAL_HEAD
          )
        fi

        echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
        echo "BRANCH_NAME is set to $BRANCH_NAME"

        echo "::debug::get version"
        use_custom_ya_bin
        "$YA_BIN" --version

        if [ -n "${CUSTOM_YA_BIN_S3_URI:-}" ]; then
            params+=(--account-test-cgroup)
        fi

        if [ true = ${{ inputs.run_tests }} ]; then
            params+=(-A)
        fi
        YA_MAKE_COMMAND="$YA_BIN make ${params[@]}"
        GRAPH_PATH=$(realpath graph.json)
        CONTEXT_PATH=$(realpath context.json)
        # Comparison draft PRs: always run the complete small/medium set with --retest
        # (skip graph_compare incremental filter). Force increment=false regardless of
        # pr_check.yml input. Same mode as prior telemetry A/B PRs.
        if false; then
          GRAPH_COMPARE_OUTPUT="$PUBLIC_DIR/graph_compare_log.txt"
          GRAPH_COMPARE_OUTPUT_URL="$PUBLIC_DIR_URL/graph_compare_log.txt"

          analytics start graph_compare
          set +e
          ./.github/scripts/graph_compare.py --ya-make-command="$YA_MAKE_COMMAND" --result-graph-path=$GRAPH_PATH --result-context-path=$CONTEXT_PATH $ORIGINAL_HEAD~1 $ORIGINAL_HEAD |& tee $GRAPH_COMPARE_OUTPUT
          RC=${PIPESTATUS[0]}
          set -e
          analytics end graph_compare --rc "$RC"
          analytics flush

          if [ $RC -ne 0 ]; then
            echo "graph_compare.py returned $RC, build failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            BUILD_FAILED=1
            echo "Graph compare failed, see the [logs]($GRAPH_COMPARE_OUTPUT_URL)." | GITHUB_TOKEN="${{ github.token }}"  .github/scripts/tests/comment-pr.py --color red
            exit $RC
          fi

          analytics start checkout_head
          git checkout $ORIGINAL_HEAD
          analytics end checkout_head
          YA_MAKE_TARGET="ydb"
        else
          YA_MAKE_TARGET=""
          for TARGET in ${{ inputs.build_target }}; do
             if [ -e $TARGET ]; then
                YA_MAKE_TARGET="$YA_MAKE_TARGET $TARGET"
             fi
          done
          if [ true = ${{ inputs.run_tests }} ]; then
            YA_MAKE_COMMAND+=" --retest"
          fi
          $YA_MAKE_COMMAND -k --cache-tests \
            --save-graph-to $GRAPH_PATH --save-context-to $CONTEXT_PATH \
            $YA_MAKE_TARGET
        fi

        export CI_YA_ATTEMPT=1
        analytics start prepare_ya_make
        export MUTED_YA_FILE="$(python3 .github/scripts/tests/mute/mute_helper.py resolve-path --preset "${{ inputs.build_preset }}")"
        echo "Mute list: MUTED_YA_FILE=$MUTED_YA_FILE"

        # Comparison draft PRs: disable remote build cache (read+write), same as
        # pr_like_test_benchmark (--no-bazel-remote-store, no put). Local ~/.ya is
        # already wiped earlier in this action; tests still forced via --retest.
        params+=(--no-bazel-remote-store)
        # Intentionally skip --bazel-remote-store / --bazel-remote-put even when
        # REMOTE_CACHE_URL / put_build_results_to_cache are set by pr_check.yml.

        analytics track runner_info --kind info --runner
        analytics flush

        if [ true = ${{ inputs.run_tests }} ]; then
          params+=(--retest)
        fi

        YA_MAKE_OUT_DIR=$TMP_DIR/out

        YA_MAKE_OUTPUT="$PUBLIC_DIR/ya_make_output.txt"
        YA_MAKE_OUTPUT_URL="$PUBLIC_DIR_URL/ya_make_output.txt"
        echo "20 [Ya make output]($YA_MAKE_OUTPUT_URL)" >> $SUMMARY_LINKS

        BUILD_FAILED=0

        for RETRY in $(seq 1 $TEST_RETRY_COUNT)
        do
          export CI_YA_ATTEMPT=$RETRY
          if [ $RETRY != 1 ]; then
            IS_RETRY=1
            analytics start prepare_ya_make
          else
            IS_RETRY=0
          fi

          CURRENT_PUBLIC_DIR_RELATIVE=try_$RETRY
          # Can be used in tests in which you want to publish the results in s3 for each retry separately
          export CURRENT_PUBLIC_DIR=$PUBLIC_DIR/$CURRENT_PUBLIC_DIR_RELATIVE
          export CURRENT_PUBLIC_DIR_URL=$PUBLIC_DIR_URL/$CURRENT_PUBLIC_DIR_RELATIVE
          mkdir $CURRENT_PUBLIC_DIR
          export TEST_META_INFO=$CURRENT_PUBLIC_DIR/tests_meta
          mkdir $TEST_META_INFO

          CURRENT_MESSAGE="ya make is running..."
          PREV_REPORT="$CURRENT_REPORT"
          CURRENT_REPORT=$CURRENT_PUBLIC_DIR/report.json

          if [ $IS_RETRY = 0 ]; then
            RERUN_FAILED_OPT=""
          else
            CURRENT_MESSAGE="$CURRENT_MESSAGE (failed tests rerun, try $RETRY)"
            if [ -z "$GRAPH_PATH" ]; then
              MUTED_YAML_PATH="$CURRENT_PUBLIC_DIR/muted_tests.yaml"
              python3 .github/scripts/tests/mute/mute_utils.py convert_muted_txt_to_yaml "$MUTED_YA_FILE" "$PREV_REPORT" > $MUTED_YAML_PATH
              RERUN_FAILED_OPT="-X --build-only-test-deps --test-blacklist-path $MUTED_YAML_PATH"
            else
              RERUN_FAILED_OPT=""
            fi
          fi

          echo $CURRENT_MESSAGE | GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py

          monitor_memory() {
              set +x
              rm -f ram_usage.txt
              while true; do
                  used_kb=$(grep -E 'MemTotal|MemAvailable' /proc/meminfo |
                            awk 'NR==1{t=$2} NR==2{a=$2} END{print t - a}')
                  echo "$(date +%s) $used_kb" >> ram_usage.txt
                  sleep 3
              done
          }

          monitor_memory &
          MONITOR_PID=$!

          RESOURCES_JSONL="$CURRENT_PUBLIC_DIR/resources_monitor.jsonl"
          rm -f "$RESOURCES_JSONL"
          python3 .github/scripts/utils/metrics/monitor_resources.py \
            --output "$RESOURCES_JSONL" \
            --interval 3 &
          MONITOR_RESOURCES_PID=$!

          if [ -n "$GRAPH_PATH" ] && [ -n "$CONTEXT_PATH" ]; then
            GRAPH_OPTS="--build-custom-json=$GRAPH_PATH --custom-context=$CONTEXT_PATH"
          else
            GRAPH_OPTS=""
          fi

          TOTAL_MEM_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          # Allocate 95% of total memory to ya make cgroup.
          YA_MAKE_MEM_MAX_KB=$(( TOTAL_MEM_KB * 95 / 100 ))
          YA_MAKE_MEM_MAX="${YA_MAKE_MEM_MAX_KB}K"
          YA_MAKE_SCOPE_NAME="ya-make-${GITHUB_RUN_ID:-local}-${RETRY}-$$.scope"

          echo "Launching $YA_BIN make under systemd-run scope=${YA_MAKE_SCOPE_NAME} with MemoryMax=${YA_MAKE_MEM_MAX}"

          YA_MAKE_CMD=(
            "$YA_BIN" make "${params[@]}" $YA_MAKE_TARGET $GRAPH_OPTS
            $RERUN_FAILED_OPT --log-file "$PUBLIC_DIR/ya_log.txt"
            --evlog-file "$CURRENT_PUBLIC_DIR/ya_evlog.jsonl"
            --build-results-report "$CURRENT_REPORT" --output "$YA_MAKE_OUT_DIR"
          )

          # With custom ya --account-test-cgroup: Delegate=yes + ya_cgroup_exec so the
          # scope can host nested ya-test-* cgroups (monitor kind=test samples).
          # Otherwise keep the usual core-dump / sudo drop path.
          install_cpu_quota_wrapper

          # Timestamp for filtering dmesg to this try only.
          DMESG_SINCE=$(date '+%Y-%m-%d %H:%M:%S')
          # Store the attempt start, not the upload time.
          ATTEMPT_STARTED_AT=$(date +%s)
          analytics end prepare_ya_make
          YA_MAKE_NAME="ya_make_try_${RETRY}"
          analytics start "ya_make_try_${RETRY}"

          set +e
          # sudo -u / setpriv restore supplementary groups (e.g. docker); --uid/--gid on systemd-run does not.
          # Inner sudo -E keeps job env (needs SETENV in sudoers; standard on self-hosted runners).
          (sudo -n -E systemd-run --scope \
             --unit="${YA_MAKE_SCOPE_NAME}" \
             -p MemoryMax="${YA_MAKE_MEM_MAX}" \
             -p MemorySwapMax=0 \
             "${DELEGATE_CPU[@]}" \
             -- "${YA_MAKE_RUN_CMD[@]}"
           echo $? > exit_code) </dev/null >> $YA_MAKE_OUTPUT 2>&1
          set -e
          RC=`cat exit_code`
          if [ $RC -eq 0 ]; then
            analytics end "$YA_MAKE_NAME"
          else
            analytics end "$YA_MAKE_NAME" --rc "$RC" --error "ya make rc=${RC}"
          fi
          analytics start postprocess_try
          # Optional sub-steps use || true so they don't abort the step.
          # Remember if any failed so we don't write conclusion=success.
          POSTPROCESS_RC=0
          if [ -f "$CURRENT_PUBLIC_DIR/ya_evlog.jsonl" ]; then
            python3 .github/scripts/utils/analytics/github_actions/ya_evlog_phases.py \
              --evlog "$CURRENT_PUBLIC_DIR/ya_evlog.jsonl" \
              --parent "$YA_MAKE_NAME" \
              --ya-attempt "$RETRY" || POSTPROCESS_RC=$?
          fi

          # Per-try dmesg OOM dump (--since avoids stale events from previous tries/jobs).
          OOM_DMESG_LOG="$CURRENT_PUBLIC_DIR/oom_dmesg.txt"
          OOM_DMESG_LOG_URL="$CURRENT_PUBLIC_DIR_URL/oom_dmesg.txt"
          sudo dmesg -T --since="$DMESG_SINCE" 2>/dev/null | grep -i -E "out of memory|oom-killer|Killed process|Memory cgroup out of memory" | tail -n 200 > "$OOM_DMESG_LOG" || true
          if [ -s "$OOM_DMESG_LOG" ]; then
            echo "35 [OOM dmesg (try $RETRY)]($OOM_DMESG_LOG_URL)" >> $SUMMARY_LINKS
          fi

          for p in "$MONITOR_PID" "$MONITOR_RESOURCES_PID"; do
            { [ -n "$p" ] && kill "$p" 2>/dev/null && wait "$p" 2>/dev/null; } || true
          done

          .github/scripts/tests/report_analyzer.py --report_file "$CURRENT_REPORT" --summary_file $CURRENT_PUBLIC_DIR/summary_report.txt || POSTPROCESS_RC=$?

          GH_ALERTS_TG_LOGINS='${{ fromJSON( inputs.vars ).GH_ALERTS_TG_LOGINS || '' }}' \
          .github/scripts/report_ram_analyzer.py \
            --report-file "$CURRENT_REPORT" \
            --output-file $CURRENT_PUBLIC_DIR/ram_report.html \
            --output-file-url $CURRENT_PUBLIC_DIR_URL/ram_report.html \
            --ram-usage-file ram_usage.txt \
            --bot-token-file "$TELEGRAM_BOT_TOKEN_FILE" \
            --chat-id '${{ fromJSON( inputs.vars ).GH_ALERTS_TG_CHAT || '' }}' \
            --memory-threshold 97 || POSTPROCESS_RC=$?

          # convert to chromium trace
          # seems analyze-make don't have simple "output" parameter, so change cwd
          ya_dir=$(pwd)
          (cd $CURRENT_PUBLIC_DIR && $ya_dir/ya analyze-make timeline --evlog ya_evlog.jsonl) || true

          CURRENT_REPORT="$CURRENT_REPORT" RESOURCES_JSONL="$RESOURCES_JSONL" YA_MAKE_OUT_DIR="$YA_MAKE_OUT_DIR" \
          RETRY="$RETRY" DASHBOARD_SANITIZER="$DASHBOARD_SANITIZER" \
          BRANCH_NAME="$BRANCH_NAME" ORIGINAL_HEAD="$ORIGINAL_HEAD" \
          bash .github/scripts/utils/dashboard/build_tests_dashboard.sh || true

          # generate test_bloat
          ./ydb/ci/build_bloat/test_bloat.py --build-results-report $CURRENT_REPORT --output_dir $CURRENT_PUBLIC_DIR/test_bloat || POSTPROCESS_RC=$?
          analytics end postprocess_try --rc "$POSTPROCESS_RC"

          if [ $RC -ne 0 ]; then
            echo "ya make returned $RC, build failed"
            echo "status=failed" >> $GITHUB_OUTPUT
            BUILD_FAILED=1
            # sed is to remove richness (tags like '[[rst]]')
            (( \
              cat $CURRENT_REPORT \
              | jq -r '.results[] | select((.status == "FAILED") and (.error_type == "REGULAR") and (.type = "build")) | "path: " + .path + "\n\n" + ."rich-snippet" + "\n\n\n"' \
              | sed 's/\[\[[^]]*]\]//g' \
            ) || true) > $CURRENT_PUBLIC_DIR/fail_summary.txt
            echo "Build failed, see the [logs]($YA_MAKE_OUTPUT_URL). Also see [fail summary]($CURRENT_PUBLIC_DIR_URL/fail_summary.txt)" | GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py --color red
            analytics enrich "$YA_MAKE_NAME" \
              --label "error=ya make rc=${RC}" \
              --label "ya_make_log_url=${YA_MAKE_OUTPUT_URL}" \
              --label "fail_summary_url=${CURRENT_PUBLIC_DIR_URL}/fail_summary.txt"
            analytics flush
            break
          fi

          # archive build results report (orig)
          gzip -c $CURRENT_REPORT > $CURRENT_PUBLIC_DIR/orig_report.json.gz

          # postprocess build results report (add links, logs, mute tests etc)
          analytics start transform_build_results
          TRANSFORM_RC=0
          .github/scripts/tests/transform_build_results.py \
            --build-results-report "$CURRENT_REPORT" \
            --test_dir="$TEST_META_INFO" \
            -m "$MUTED_YA_FILE" \
            --ya_out "$YA_MAKE_OUT_DIR" \
            --public_dir "$PUBLIC_DIR" \
            --public_dir_url "$PUBLIC_DIR_URL" \
            --log_out_dir "$CURRENT_PUBLIC_DIR_RELATIVE/artifacts/logs/" \
            --test_stuff_out "$CURRENT_PUBLIC_DIR_RELATIVE/test_artifacts/" || TRANSFORM_RC=$?
          analytics end transform_build_results --rc "$TRANSFORM_RC"
          cp $CURRENT_REPORT $LAST_BUILD_RESULTS_REPORT

          TESTS_RESULT=0
          analytics start fail_checker
          .github/scripts/tests/fail-checker.py "$CURRENT_REPORT" --output_path $CURRENT_PUBLIC_DIR/failed_count.txt || TESTS_RESULT=$?
          FAILED_TESTS_COUNT=$(cat $CURRENT_PUBLIC_DIR/failed_count.txt)
          analytics enrich "$YA_MAKE_NAME" --report "$CURRENT_REPORT"
          if [ $TESTS_RESULT = 0 ]; then
            analytics end fail_checker
            analytics enrich "$YA_MAKE_NAME" --label "tests_status=passed"
          else
            analytics end fail_checker --rc "$TESTS_RESULT" --error "failed_tests=${FAILED_TESTS_COUNT}"
            analytics enrich "$YA_MAKE_NAME" --label "tests_status=failed" --label "failed_tests=${FAILED_TESTS_COUNT}"
          fi

          IS_LAST_RETRY=0

          if [ $TESTS_RESULT = 0 ] || [ $RETRY = $TEST_RETRY_COUNT ]; then
            IS_LAST_RETRY=1
          fi

          if [ $FAILED_TESTS_COUNT -gt 500 ]; then
            IS_LAST_RETRY=1
            TOO_MANY_FAILED="Too many tests failed, NOT going to retry"
            echo $TOO_MANY_FAILED | GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py --color red
          fi

          if [ "${{ inputs.run_tests }}" = "true" ]; then
            # Set PR number only if it exists (for pull request events)
            PR_ARG=""
            if [ -n "${{ github.event.number }}" ]; then
              PR_ARG="--pr_number ${{ github.event.number }}"
            fi

            # Set the correct commit SHA - use original head for accurate version tracking
            export GITHUB_HEAD_SHA="$ORIGINAL_HEAD"

            analytics start generate_summary
            GITHUB_TOKEN=${{ github.token }} .github/scripts/tests/generate-summary.py \
              --summary_links "$SUMMARY_LINKS" \
              --public_dir "$PUBLIC_DIR" \
              --public_dir_url "$PUBLIC_DIR_URL" \
              --build_preset "$BUILD_PRESET" \
              --branch "$BRANCH_NAME" \
              --status_report_file statusrep.txt \
              --is_retry $IS_RETRY \
              --is_last_retry $IS_LAST_RETRY \
              --is_test_result_ignored $IS_TEST_RESULT_IGNORED \
              --comment_color_file summary_color.txt \
              --comment_text_file summary_text.txt \
              $PR_ARG \
              --workflow_run_id "${{ github.run_id }}" \
              --oom_dmesg_log "$OOM_DMESG_LOG" \
              "Tests" $CURRENT_PUBLIC_DIR/ya-test.html "$CURRENT_REPORT"
            analytics end generate_summary
          fi

          analytics start s3_sync_try
          s3cmd sync --follow-symlinks --acl-public --no-progress --stats --no-mime-magic --guess-mime-type --no-check-md5 "$PUBLIC_DIR/" "$S3_BUCKET_PATH/"
          analytics end s3_sync_try
          analytics enrich "$YA_MAKE_NAME" \
            --label "report_url=${CURRENT_PUBLIC_DIR_URL}/ya-test.html" \
            --label "ya_make_log_url=${YA_MAKE_OUTPUT_URL}" \
            --label "artifacts_url=${CURRENT_PUBLIC_DIR_URL}/"
          analytics flush

          if [ "${{ inputs.run_tests }}" = "true" ]; then
            cat summary_text.txt | GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py --color `cat summary_color.txt`
          fi

          # upload tests results to YDB
          # Create run name based on event type and retry number
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              run_name="${{ github.run_id }}_manual"
              ;;
            pull_request | pull_request_target)
              pr_number="${{ github.event.number }}"
              if [ -n "$pr_number" ]; then
                run_name="${{ github.run_id }}_PR_${pr_number}"
              else
                run_name="${{ github.run_id }}_PR"
              fi
              ;;
            schedule)
              run_name="${{ github.run_id }}_schedule"
              ;;
            push)
              run_name="${{ github.run_id }}_POST"
              ;;
            *)
              run_name="${{ github.run_id }}"
              ;;
          esac
          run_name="${run_name}_attempt_${RETRY}"
          analytics start upload_tests_results
          # Stream logs instead of buffering and replaying them through xtrace.
          .github/scripts/analytics/upload_tests_results.py \
            --test-results-file "${CURRENT_REPORT}" \
            --run-timestamp "${ATTEMPT_STARTED_AT}" \
            --commit "${ORIGINAL_HEAD}" \
            --build-type "${BUILD_PRESET}" \
            --pull "${run_name}" \
            --job-name "${ANALYTICS_JOB_NAME}" \
            --job-id "${{ github.run_id }}" \
            --branch "${BRANCH_NAME}"
          analytics end upload_tests_results
          analytics flush

          if [ $IS_LAST_RETRY = 1 ]; then
            break
          fi

          # Free the bounded coredump volume for the next try (ya already postprocessed dumps).
          if [ "${COLLECT_COREDUMPS}" = "true" ]; then
            echo "Cleaning /coredumps before retry $((RETRY + 1))"
            sudo find /coredumps -mindepth 1 -delete || true
            df -h /coredumps || true
          fi

          if [ -n "$GRAPH_PATH" ] && [ -n "$CONTEXT_PATH" ]; then
              GRAPH_PATH=""
              CONTEXT_PATH=""
          fi
        done;

        # Drop dump files after the last try; volume teardown is in a dedicated always() step.
        if [ "${COLLECT_COREDUMPS}" = "true" ]; then
          echo "Cleaning /coredumps after all test tries"
          sudo find /coredumps -mindepth 1 -delete || true
        fi

        if [ $BUILD_FAILED = 0 ]; then
          echo "status=true" >> $GITHUB_OUTPUT
          echo "Build successful." |  GITHUB_TOKEN="${{ github.token }}" .github/scripts/tests/comment-pr.py --color green
        fi

    - name: resolve-status-sha
      shell: bash
      run: |
        status_sha="$ORIGINAL_HEAD"
        if [[ -n "${{ github.event.pull_request.head.sha }}" ]]; then
          status_sha="${{ github.event.pull_request.head.sha }}"
        fi
        echo "STATUS_SHA=$status_sha" >> $GITHUB_ENV

    - name: comment-build-status
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -x

        if [ "${{ steps.build.outputs.status }}" == "failed" ]; then
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
            -d '{"state":"failure","description":"The check has been failed","context":"build_${{inputs.build_preset}}"}'
        else
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
            -d '{"state":"success","description":"The check has been completed successfully","context":"build_${{inputs.build_preset}}"}'
        fi

    - name: analyze tests results
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -x
        if [ true = ${{ inputs.run_tests }} ]; then
          teststatus=$(cat statusrep.txt)
          if [[ $teststatus == "success" ]]; then
            testmessage="The check has been completed successfully"
          else
            testmessage="The check has been failed"
          fi
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
              -d '{"state":"'$teststatus'","description":"'"$testmessage"'","context":"test_${{inputs.build_preset}}"}'

          if [[ $teststatus != "success" ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
        fi

    - name: check test results
      if: inputs.run_tests
      shell: bash
      run: |
        if [ $IS_TEST_RESULT_IGNORED == 0 ]; then
          .github/scripts/tests/fail-checker.py "$LAST_BUILD_RESULTS_REPORT"
        fi

    - name: sync results to s3 and publish links
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      shell: bash
      run: |
        set -x
        echo "::group::s3-sync"
        .github/scripts/Indexer/indexer.py -r "$PUBLIC_DIR/"
        echo "00 [Artifacts](${PUBLIC_DIR_URL}/index.html)" >> $SUMMARY_LINKS
        s3cmd sync --follow-symlinks --acl-public --no-progress --stats --no-mime-magic --guess-mime-type --no-check-md5 "$PUBLIC_DIR/" "$S3_BUCKET_PATH/"
        cat $SUMMARY_LINKS | python3 -c 'import sys; print(" | ".join([v for _, v in sorted([l.strip().split(" ", 1) for l in sys.stdin], key=lambda a: (int(a[0]), a))]))' >> $GITHUB_STEP_SUMMARY
        echo "::endgroup::"

    - name: Flush analytics JSONL
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # In-job phases from this runner. Job/step timings come from
        # collect_analytics_fast.yml after the run, not from here.
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        conclusion="${{ job.status }}"
        if [ -z "$conclusion" ]; then
          conclusion=failure
        fi
        analytics send --conclusion "$conclusion"

    - name: show free space
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      shell: bash
      run: df -h

    - name: cleanup coredump volume
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      shell: bash
      env:
        COLLECT_COREDUMPS: ${{ inputs.collect_coredumps != 'false' }}
      run: |
        if [ "${COLLECT_COREDUMPS}" != "true" ]; then
          exit 0
        fi
        set -x
        COREDUMP_MNT="${COREDUMP_MNT:-/coredumps}"
        COREDUMP_IMG="${COREDUMP_IMG:-/var/lib/ydb-ci-coredumps.img}"

        # No-op if volume was never created (collect disabled or setup failed early).
        if mountpoint -q "$COREDUMP_MNT"; then
          sudo find "$COREDUMP_MNT" -mindepth 1 -delete || true
          sudo umount "$COREDUMP_MNT" || true
        fi
        sudo rm -f "$COREDUMP_IMG" || true
        df -h / || true

    - name: build_stats
      shell: bash
      continue-on-error: true
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      run: |
        set -x
        export build_preset="${{ inputs.build_preset }}"
        export commit_git_sha="$ORIGINAL_HEAD"

        python3 .github/scripts/send_build_stats.py

    - name: show_build_size_diff
      shell: bash
      continue-on-error: true
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -x
        export build_preset="${{ inputs.build_preset }}"
        export branch_to_compare="$BRANCH_NAME"
        export yellow_treshold=102400
        export commit_git_sha="$ORIGINAL_HEAD"

        get_sizes_comment_script=.github/scripts/get_build_diff.py
        comment_raw=`$get_sizes_comment_script`
        if [[ -z "$comment_raw" ]]; then
          echo "Skipped build size difference: no comparison available"
          exit 0
        fi

        IFS=';;;'
        read -ra comment_arr <<< "$comment_raw"

        if [[ ${comment_raw} != "Error"* ]]; then
          color=${comment_arr[0]}
          replace=$color";;;"
          comment=${comment_raw/$replace/""}

          printf "$comment" | .github/scripts/tests/comment-pr.py --color $color

        else
          echo "Skipped build size difference, comment_raw = ${comment_raw}"
        fi

    - name: comment-if-cancel
      shell: bash
      if: cancelled() && steps.prepare_s3cmd.outcome == 'success' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      env:
        BUILD_PRESET: ${{ inputs.build_preset }}
        GITHUB_TOKEN: ${{ github.token }}
      run:  echo "Check cancelled" | .github/scripts/tests/comment-pr.py --color black

    - name: cleanup tmp
      if: always() && steps.prepare_s3cmd.outcome == 'success'
      shell: bash
      run: |
        set +e
        set -x
        if [ -n "${TMP_DIR:-}" ]; then
          rm -rf "$TMP_DIR"
        fi
        # mktemp / graph_compare leftovers; does not match /tmp/systemd-private-*
        rm -rf /tmp/tmp*
        df -h / || true
