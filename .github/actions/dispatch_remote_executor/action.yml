name: Dispatch remote executor
description: Start, wait+mirror, or cancel a CI remote executor workflow_dispatch
inputs:
  command:
    description: start | wait | cancel
    required: true
  token:
    description: PAT that can dispatch/cancel workflows (GITHUB_TOKEN cannot start new runs)
    required: true
  repository:
    description: owner/repo
    required: true
  workflow_file:
    description: Executor workflow filename (e.g. ci_remote_executor.yml)
    required: true
  workflow_name:
    description: Executor workflow name: value (S3 key segment)
    required: true
  executor_ref:
    description: Git ref that hosts the executor workflow YAML (start)
    required: false
    default: ''
  code_ref:
    description: YDB ref/SHA for the executor to checkout (start)
    required: false
    default: ''
  test_targets:
    required: false
    default: ''
  build_preset:
    required: false
    default: ''
  wait_mode:
    description: wait+mirror | fire-and-forget (start summary only)
    required: false
    default: ''
  executor_run_id:
    description: Required for wait/cancel
    required: false
    default: ''
  executor_run_url:
    required: false
    default: ''
  aws_endpoint:
    description: Required for wait (S3 job_summary.md)
    required: false
    default: ''
  aws_bucket:
    description: Required for wait
    required: false
    default: ''
outputs:
  executor_run_id:
    description: Dispatched run id (start)
    value: ${{ steps.run.outputs.executor_run_id }}
  executor_run_url:
    description: Dispatched run URL (start)
    value: ${{ steps.run.outputs.executor_run_url }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        WORKFLOW_FILE: ${{ inputs.workflow_file }}
        WORKFLOW_NAME: ${{ inputs.workflow_name }}
        EXECUTOR_REF: ${{ inputs.executor_ref }}
        CODE_REF: ${{ inputs.code_ref }}
        TEST_TARGETS: ${{ inputs.test_targets }}
        BUILD_PRESET: ${{ inputs.build_preset }}
        WAIT_MODE: ${{ inputs.wait_mode }}
        EXECUTOR_RUN_ID: ${{ inputs.executor_run_id }}
        EXECUTOR_RUN_URL: ${{ inputs.executor_run_url }}
        AWS_ENDPOINT: ${{ inputs.aws_endpoint }}
        AWS_BUCKET: ${{ inputs.aws_bucket }}
      run: python3 "${{ github.action_path }}/../../scripts/ci/dispatch_remote_executor.py" "${{ inputs.command }}"
