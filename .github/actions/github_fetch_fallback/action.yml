name: Probe GitHub fetch speed
description: |
  Download from GitHub for 10 seconds. If the rate is below 3 MB/s, later git
  commands in this job fetch https://github.com/ through gh-proxy.com.

outputs:
  use_proxy:
    description: true when git fetches should go through gh-proxy.com
    value: ${{ steps.probe.outputs.use_proxy }}
  speed_bps:
    description: Measured download rate in bytes per second
    value: ${{ steps.probe.outputs.speed_bps }}

runs:
  using: composite
  steps:
    - name: Probe
      id: probe
      shell: bash
      run: |
        set +e
        speed=$(curl -L --http2 --max-time 10 -o /dev/null -sS -w '%{speed_download}' \
          https://github.com/git/git/archive/refs/tags/v2.46.0.tar.gz)
        set -euo pipefail
        threshold=3000000
        use_proxy=false
        if awk -v s="${speed:-0}" -v t="$threshold" 'BEGIN { exit !(s+0 < t) }'; then
          use_proxy=true
        fi
        echo "speed_bps=${speed:-0}" >> "$GITHUB_OUTPUT"
        echo "use_proxy=$use_proxy" >> "$GITHUB_OUTPUT"
        mb=$(awk -v s="${speed:-0}" 'BEGIN { printf "%.2f", (s+0)/1000000 }')
        echo "GitHub sample ${mb} MB/s, threshold 3 MB/s, use_proxy=${use_proxy}"
        if [ "$use_proxy" = true ]; then
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.https://gh-proxy.com/https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"
        fi
