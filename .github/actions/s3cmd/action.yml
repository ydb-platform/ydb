name: configure s3cmd
description: configure s3cmd
inputs:
  s3_key_id:
    required: true
    description: "s3 key id"
  s3_key_secret:
    required: true
    description: "s3 key secret"
  s3_bucket:
    required: false
    description: "s3 bucket"
  s3_endpoint:
    required: true
    description: "s3 endpoint"
  folder_prefix:
    required: false
    description: "folder prefix"
  build_preset:
    required: false
    description: "build preset like relwithdebinfo"
  target_platform:
    required: false
    description: "target platform name"
runs:
  using: "composite"
  steps:
    - name: configure s3cmd
      shell: bash
      run: |
        export S3CMD_CONFIG=$(mktemp)
        echo "S3CMD_CONFIG=$S3CMD_CONFIG" >> $GITHUB_ENV
        cat <<EOF > $S3CMD_CONFIG
        [default]
        access_key = ${s3_key_id}
        secret_key = ${s3_secret_access_key}
        bucket_location = ru-central1
        host_base = storage.yandexcloud.net
        host_bucket = %(bucket)s.storage.yandexcloud.net
        EOF

        # specify mime type for correct content-type in s3cmd sync 
        # we want to .out/.err files treat as text
        MIME_TYPES_LINE="text/plain                                      out err log"
        MIME_TYPES_FILE='/etc/mime.types'
        # add if not exists
        sudo bash -c "grep -qF -- '$MIME_TYPES_LINE' '$MIME_TYPES_FILE' || echo '$MIME_TYPES_LINE' >> '$MIME_TYPES_FILE'"
      env:
        s3_key_id: ${{ inputs.s3_key_id }}
        s3_secret_access_key: ${{ inputs.s3_key_secret }}

    - name: export s3 path variables
      shell: bash
      if: inputs.build_preset
      env:
        INPUT_BUILD_PRESET: ${{ inputs.build_preset }}
        INPUT_TARGET_PLATFORM: ${{ inputs.target_platform }}
        INPUT_S3_BUCKET: ${{ inputs.s3_bucket }}
        INPUT_S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        INPUT_FOLDER_PREFIX: ${{ inputs.folder_prefix }}
      run: |
        export_github_env() {
          local name="$1"
          local value="$2"

          case "$value" in
            *$'\n'*|*$'\r'*)
              printf 'Cannot export %s: value contains a newline\n' "$name" >&2
              return 1
              ;;
          esac

          printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
        }

        if [[ -n "$INPUT_TARGET_PLATFORM" ]]; then
          folder="$INPUT_TARGET_PLATFORM"
        else
          case "$RUNNER_ARCH" in
            X64) folder="x86-64" ;;
            ARM64) folder="arm64" ;;
            *) folder="unknown" ;;
          esac
        fi
        
        case "$INPUT_BUILD_PRESET" in
          relwithdebinfo)
            ;;
          debug)
            folder+="-debug"
            ;;
          release*)
            folder+="-${INPUT_BUILD_PRESET/release-/}"
            ;;
          *)
            echo "Invalid preset: $INPUT_BUILD_PRESET"
            exit 1
            ;;
        esac

        export_github_env S3_BUCKET_PATH "s3://${INPUT_S3_BUCKET}/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}/${GITHUB_RUN_ID}/${INPUT_FOLDER_PREFIX}${folder}"
        export_github_env S3_URL_PREFIX "${INPUT_S3_ENDPOINT}/${INPUT_S3_BUCKET}/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}/${GITHUB_RUN_ID}/${INPUT_FOLDER_PREFIX}${folder}"
        export_github_env S3_TEST_ARTIFACTS_BUCKET_PATH "s3://${INPUT_S3_BUCKET}/testing_out_stuff/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}/${GITHUB_RUN_ID}/${INPUT_FOLDER_PREFIX}${folder}"
        export_github_env S3_TEST_ARTIFACTS_URL_PREFIX "${INPUT_S3_ENDPOINT}/${INPUT_S3_BUCKET}/testing_out_stuff/${GITHUB_REPOSITORY}/${GITHUB_WORKFLOW}/${GITHUB_RUN_ID}/${INPUT_FOLDER_PREFIX}${folder}"
