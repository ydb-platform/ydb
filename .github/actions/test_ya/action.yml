name: Run build and tests (ya make)
description: Run test targets listed in repository root ya.make (to be created previously)
inputs:
  build_target:
    required: true
  build_preset:
    required: true
    default: "relwithdebinfo"
    description: "relwithdebinfo, release-asan, release-tsan"
  test_type:
    required: false
    type: string
    default: ""
    description: "run only specific test types (or all by default)"
  test_size:
    required: false
    default: "small,medium,large"
    description: "small or small-medium or all"
  test_threads:
    required: false
    default: "56"
    description: "Test threads count"
  link_threads:
    required: false
    default: "12"
    description: "link threads count"
  additional_ya_make_args:
    type: string
    default: ""
  increment:
    type: boolean
    required: true
    description: If true, compares build graphs between the current and previous commits to find a list of test suites to run. Otherwise, runs all tests.
  put_build_results_to_cache:
    required: false
    default: "true"
  bazel_remote_uri:
    required: false
    description: "bazel-remote endpoint"
  bazel_remote_username:
    required: false
    description: "bazel-remote username"
  bazel_remote_password:
    required: false
    description: "bazel-remote password"
  run_tests:
    type: boolean
    default: true
    description: "run tests"
  test_retry_count:
    type: string
    default: ""
    description: "how many times to retry failed tests"
  custom_branch_name:
    description: "Custom branch name required when workflow branch != checkout branch"
    type: string
    required: false
  add_vcs_info:
    type: boolean
    default: false
    description: "add ya make vars with git info"
  telegram_ydbot_token:
    type: string
    required: false
    description: "Telegram bot token"
  telegram_alert_logins:
    type: string
    required: false
    description: "Telegram alert logins"
  telegram_alert_chat:
    type: string
    required: false
    description: "Telegram alert chat"
  collect_coredumps:
    type: boolean
    default: true
    description: "Collect coredumps to a 100G loop volume at /coredumps (for ya test recovery)"
  pull_number:
    type: string
    required: false
    description: "Pull request number (for workflow_call events)"
  save_test_graph:
    type: boolean
    default: false
    description: "Save graph.json and context.json, then skip the test loop. Run-tests uses this when shard_count > 1."
  skip_graph_compare:
    type: boolean
    default: false
    description: "Replay prebuilt_graph_path instead of configuring a new graph."
  prebuilt_graph_path:
    type: string
    default: ""
    description: "Filtered graph.json for one shard. Requires skip_graph_compare."
  prebuilt_context_path:
    type: string
    default: ""
    description: "Filtered context.json for one shard. Requires skip_graph_compare."
  publish_github_status:
    type: boolean
    default: true
    description: "Post build_*/test_* statuses and the monolithic PR comment. Shard jobs set this false; shard_progress owns that comment."

outputs:
  success:
    value: ${{ steps.build.outputs.status }}
    description: "build success"
  build_result:
    value: ${{ steps.build.outputs.build_result }}
    description: "success or failure of ya make itself"
  test_result:
    value: ${{ steps.build.outputs.test_result }}
    description: "success, failure, or skipped when tests did not run"

runs:
  using: "composite"
  steps:
    - name: comment-build-start
      if: inputs.publish_github_status == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        BUILD_PRESET: ${{ inputs.build_preset }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        jobs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
        # tricky: we are searching job with name that contains build_preset
        check_url=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -s -H "Authorization: Bearer ${{github.token}}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$jobs_url" | jq --arg n "$BUILD_PRESET" -r '.jobs[] | select(.name | contains($n)) | .html_url')

        platform_name="$(echo "$(uname -s)-$(uname -p)" | tr '[:upper:]' '[:lower:]')-$BUILD_PRESET"
        echo "Pre-commit [check]($check_url) **$platform_name** for $(git rev-parse HEAD) has started." | .github/scripts/tests/comment-pr.py --rewrite

        curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
          -d '{"state":"pending","description":"The check has been started","context":"build_${{inputs.build_preset}}"}'

        if [[ "${{inputs.run_tests}}" == "true" ]]; then
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
            -d '{"state":"pending","description":"The check has been started","context":"test_${{inputs.build_preset}}"}'
        fi

    - name: Resolve analytics job name
      shell: bash
      env:
        WORKFLOW_NAME: ${{ github.workflow }}
        BUILD_PRESET: ${{ inputs.build_preset }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_NUMERIC_JOB_ID: ${{ job.check_run_id }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        ANALYTICS_JOB_NAME=$(python3 .github/scripts/analytics/resolve_ci_job_name.py "$WORKFLOW_NAME" "$BUILD_PRESET" "$EVENT_NAME")
        echo "ANALYTICS_JOB_NAME=$ANALYTICS_JOB_NAME" >> "$GITHUB_ENV"
        echo "PR_NUMBER=${{ github.event.number || inputs.pull_number }}" >> "$GITHUB_ENV"
        if [ -n "$GITHUB_NUMERIC_JOB_ID" ]; then
          echo "GITHUB_NUMERIC_JOB_ID=$GITHUB_NUMERIC_JOB_ID" >> "$GITHUB_ENV"
          job_name=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail -sS \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${GITHUB_NUMERIC_JOB_ID}" \
            | jq -r '.name // empty' || true)
          if [ -n "$job_name" ]; then
            echo "GITHUB_JOB_NAME=$job_name" >> "$GITHUB_ENV"
          fi
        else
          echo "job.check_run_id is empty; analytics rows of this job will be dropped" >&2
        fi

    - name: Init
      id: init
      shell: bash
      run: |
        set -x

        echo "$(pwd)/ydb/ci/scripts" >> $GITHUB_PATH

        export TMP_DIR=$(pwd)/tmp
        rm -rf $TMP_DIR
        mkdir -p $TMP_DIR
        echo "TMP_DIR=$TMP_DIR" >> $GITHUB_ENV

        # The whole dir will be uploaded to s3 with public (=wild internet) ACL
        export PUBLIC_DIR=$TMP_DIR/results
        echo "PUBLIC_DIR=$PUBLIC_DIR" >> $GITHUB_ENV
        export PUBLIC_DIR_URL=$S3_URL_PREFIX
        echo "PUBLIC_DIR_URL=$PUBLIC_DIR_URL" >> $GITHUB_ENV
        mkdir -p $PUBLIC_DIR

        echo "LAST_BUILD_RESULTS_REPORT=$PUBLIC_DIR/last_report.json" >> $GITHUB_ENV
        echo "SUMMARY_LINKS=$PUBLIC_DIR/summary_links.txt" >> $GITHUB_ENV
        echo "BUILD_PRESET=${{ inputs.build_preset }}" >> $GITHUB_ENV
        ANALYTICS_FILE=$TMP_DIR/analytics.jsonl
        export ANALYTICS_FILE
        echo "ANALYTICS_FILE=$ANALYTICS_FILE" >> $GITHUB_ENV
        mkdir -p "$(dirname "$ANALYTICS_FILE")"
        touch "$ANALYTICS_FILE"
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics start init

        python3 -m pip install ydb ydb[yc] codeowners humanize plotly pyyaml
        analytics end init --conclusion success

    - name: Clean ya cache
      id: clean_ya_cache
      shell: bash
      run: |
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics_run clean_ya_cache rm -rf ~/.ya

    - name: Setup cache
      id: setup_cache
      shell: bash
      run: |
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        analytics start setup_cache
        export BAZEL_REMOTE_PASSWORD_FILE=$(mktemp)
        echo -n "${{ inputs.bazel_remote_password }}" > $BAZEL_REMOTE_PASSWORD_FILE
        echo "BAZEL_REMOTE_PASSWORD_FILE=$BAZEL_REMOTE_PASSWORD_FILE" >> $GITHUB_ENV

        export TELEGRAM_BOT_TOKEN_FILE=$(mktemp)
        echo -n "${{ inputs.telegram_ydbot_token }}" > $TELEGRAM_BOT_TOKEN_FILE
        echo "TELEGRAM_BOT_TOKEN_FILE=$TELEGRAM_BOT_TOKEN_FILE" >> $GITHUB_ENV
        analytics end setup_cache --conclusion success

    - name: ya build and test
      id: build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        COLLECT_COREDUMPS: ${{ inputs.collect_coredumps != 'false' }}
        PR_NUMBER: ${{ github.event.number || inputs.pull_number }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_BASE_REF: ${{ github.base_ref }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        INPUT_GITHUB_EVENT_NUMBER: ${{ github.event.number }}
        INPUT_PUBLISH_GITHUB_STATUS: ${{ inputs.publish_github_status }}
        INPUT_TEST_SIZE: ${{ inputs.test_size }}
        INPUT_TEST_TYPE: ${{ inputs.test_type }}
        INPUT_TEST_THREADS: ${{ inputs.test_threads }}
        INPUT_LINK_THREADS: ${{ inputs.link_threads }}
        INPUT_TEST_RETRY_COUNT: ${{ inputs.test_retry_count }}
        INPUT_ADDITIONAL_YA_MAKE_ARGS: ${{ inputs.additional_ya_make_args }}
        INPUT_CUSTOM_BRANCH_NAME: ${{ inputs.custom_branch_name }}
        INPUT_ADD_VCS_INFO: ${{ inputs.add_vcs_info }}
        INPUT_SAVE_TEST_GRAPH: ${{ inputs.save_test_graph }}
        INPUT_RUN_TESTS: ${{ inputs.run_tests }}
        INPUT_SKIP_GRAPH_COMPARE: ${{ inputs.skip_graph_compare }}
        INPUT_PREBUILT_GRAPH_PATH: ${{ inputs.prebuilt_graph_path }}
        INPUT_PREBUILT_CONTEXT_PATH: ${{ inputs.prebuilt_context_path }}
        INPUT_BUILD_TARGET: ${{ inputs.build_target }}
        INPUT_INCREMENT: ${{ inputs.increment }}
        INPUT_BAZEL_REMOTE_URI: ${{ inputs.bazel_remote_uri }}
        INPUT_BAZEL_REMOTE_USERNAME: ${{ inputs.bazel_remote_username }}
        INPUT_PUT_BUILD_RESULTS_TO_CACHE: ${{ inputs.put_build_results_to_cache }}
        INPUT_BUILD_PRESET: ${{ inputs.build_preset }}
        INPUT_TELEGRAM_ALERT_LOGINS: ${{ inputs.telegram_alert_logins }}
        INPUT_TELEGRAM_ALERT_CHAT: ${{ inputs.telegram_alert_chat }}
      run: bash .github/scripts/tests/ya_build_and_test.sh
    - name: resolve-status-sha
      shell: bash
      run: |
        status_sha="$ORIGINAL_HEAD"
        if [[ -n "${{ github.event.pull_request.head.sha }}" ]]; then
          status_sha="${{ github.event.pull_request.head.sha }}"
        fi
        echo "STATUS_SHA=$status_sha" >> $GITHUB_ENV

    - name: comment-build-status
      if: inputs.publish_github_status == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -x

        if [ "${{ steps.build.outputs.status }}" == "failed" ]; then
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
            -d '{"state":"failure","description":"The check has been failed","context":"build_${{inputs.build_preset}}"}'
        else
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
            -d '{"state":"success","description":"The check has been completed successfully","context":"build_${{inputs.build_preset}}"}'
        fi

    - name: analyze tests results
      if: inputs.publish_github_status == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -x
        if [ true = ${{ inputs.run_tests }} ]; then
          teststatus=$(cat statusrep.txt)
          if [[ $teststatus == "success" ]]; then
            testmessage="The check has been completed successfully"
          else
            testmessage="The check has been failed"
          fi
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{github.repository}}/statuses/${STATUS_SHA} \
              -d '{"state":"'$teststatus'","description":"'"$testmessage"'","context":"test_${{inputs.build_preset}}"}'

          if [[ $teststatus != "success" ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
        fi

    - name: check test results
      if: inputs.run_tests
      shell: bash
      run: |
        if [ "${{ steps.build.outputs.status }}" = "failed" ]; then
          echo "Build failed and no successful test report was produced."
          exit 1
        fi
        if [ $IS_TEST_RESULT_IGNORED == 0 ]; then
          .github/scripts/tests/fail-checker.py "$LAST_BUILD_RESULTS_REPORT"
        fi

    - name: sync results to s3 and publish links
      if: always()
      shell: bash
      run: |
        set -x
        echo "::group::s3-sync"
        if [ "${{ inputs.save_test_graph }}" = "true" ]; then
          if [ -f graph.json ]; then
            cp -f graph.json "$PUBLIC_DIR/graph.json"
          fi
          if [ -f context.json ]; then
            cp -f context.json "$PUBLIC_DIR/context.json"
          fi
        fi
        .github/scripts/Indexer/indexer.py -r "$PUBLIC_DIR/"
        if [ -n "${S3_SUBDIR:-}" ]; then
          echo "00 [Artifacts ${S3_SUBDIR}](${PUBLIC_DIR_URL}/index.html)" >> $SUMMARY_LINKS
        else
          echo "00 [Artifacts](${PUBLIC_DIR_URL}/index.html)" >> $SUMMARY_LINKS
        fi
        s3cmd sync --follow-symlinks --acl-public --no-progress --stats --no-mime-magic --guess-mime-type --no-check-md5 "$PUBLIC_DIR/" "$S3_BUCKET_PATH/"
        cat $SUMMARY_LINKS | python3 -c 'import sys; print(" | ".join([v for _, v in sorted([l.strip().split(" ", 1) for l in sys.stdin], key=lambda a: (int(a[0]), a))]))' >> $GITHUB_STEP_SUMMARY
        echo "::endgroup::"

    - name: Flush analytics JSONL
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # In-job phases from this runner. Job/step timings come from
        # collect_analytics_fast.yml after the run, not from here.
        . .github/scripts/utils/analytics/github_actions/analytics.sh
        conclusion="${{ job.status }}"
        if [ -z "$conclusion" ]; then
          conclusion=failure
        fi
        analytics send --conclusion "$conclusion"

    - name: show free space
      if: always()
      shell: bash
      run: df -h

    - name: cleanup coredump volume
      if: always()
      shell: bash
      env:
        COLLECT_COREDUMPS: ${{ inputs.collect_coredumps != 'false' }}
      run: |
        if [ "${COLLECT_COREDUMPS}" != "true" ]; then
          exit 0
        fi
        set -x
        COREDUMP_MNT="${COREDUMP_MNT:-/coredumps}"
        COREDUMP_IMG="${COREDUMP_IMG:-/var/lib/ydb-ci-coredumps.img}"

        # No-op if volume was never created (collect disabled or setup failed early).
        if mountpoint -q "$COREDUMP_MNT"; then
          sudo find "$COREDUMP_MNT" -mindepth 1 -delete || true
          sudo umount "$COREDUMP_MNT" || true
        fi
        sudo rm -f "$COREDUMP_IMG" || true
        df -h / || true

    - name: build_stats
      shell: bash
      continue-on-error: true
      if: always()
      run: |
        set -x
        export build_preset="${{ inputs.build_preset }}"
        export commit_git_sha="$ORIGINAL_HEAD"

        python3 .github/scripts/send_build_stats.py

    - name: comment-if-cancel
      shell: bash
      if: cancelled() && inputs.publish_github_status == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      env:
        BUILD_PRESET: ${{ inputs.build_preset }}
        GITHUB_TOKEN: ${{ github.token }}
      run:  echo "Check cancelled" | .github/scripts/tests/comment-pr.py --color black
