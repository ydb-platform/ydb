# Codecov config for ydb-platform/ydb (C++ SDK + CLI + workload).
# Separate from per-language SDK repos (java/go/js) and their native-sdk component.

codecov:
  # strict_yaml_branch is omitted only in this dogfood harness so Codecov can
  # evaluate the candidate config before it reaches the default branch.
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  status:
    # Only publish checks for suite flags with a fresh upload on this commit.
    # Historical main reports remain available as comparison baselines.
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default: off
      cpp_sdk:
        flags:
          - cpp_sdk
        target: auto
        threshold: 0.1%
      cli:
        flags:
          - cli
        target: auto
        threshold: 5%
      cli_workload:
        flags:
          - cli_workload
        target: auto
        threshold: 5%
    patch:
      default: off
      cpp_sdk:
        flags:
          - cpp_sdk
        target: 80%
        informational: true
      cli:
        flags:
          - cli
        target: 80%
        informational: true
      cli_workload:
        flags:
          - cli_workload
        target: 80%
        informational: true

flag_management:
  default_rules:
    # Every relevant main push uploads all three flags. PRs intentionally
    # upload only affected flags, so no synthetic carryforward is needed.
    carryforward: false
  individual_flags:
    - name: cpp_sdk
      paths:
        - ydb/public/sdk/cpp/**
    - name: cli
      paths:
        - ydb/apps/ydb/**
        - ydb/public/lib/ydb_cli/**
    - name: cli_workload
      paths:
        - ydb/library/workload/**

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  # Selective PR uploads make the unscoped project aggregate misleading.
  # Show only freshly measured suite flags.
  hide_project_coverage: true
