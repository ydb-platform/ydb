# Codecov config for ydb-platform/ydb (C++ SDK + CLI + workload).
# Separate from per-language SDK repos (java/go/js) and their native-sdk component.

coverage:
  status:
    # Only publish checks for components with a fresh upload on this commit.
    # Carried flags remain available as comparison baselines, but stay hidden.
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default: off
      cpp_sdk:
        flags:
          - cpp_sdk
        target: auto
        threshold: 0.1%
      cli:
        flags:
          - cli
        target: auto
        threshold: 5%
      cli_workload:
        flags:
          - cli_workload
        target: auto
        threshold: 5%
    patch:
      default: off
      cpp_sdk:
        flags:
          - cpp_sdk
        target: 80%
        informational: true
      cli:
        flags:
          - cli
        target: 80%
        informational: true
      cli_workload:
        flags:
          - cli_workload
        target: 80%
        informational: true

flag_management:
  default_rules:
    # Every relevant main push uploads all three flags. PRs intentionally
    # upload only affected flags, so no synthetic carryforward is needed.
    carryforward: false
  individual_flags:
    - name: cpp_sdk
      paths:
        - ydb/public/sdk/cpp/**
    - name: cli
      paths:
        - ydb/apps/ydb/**
        - ydb/public/lib/ydb_cli/**
    - name: cli_workload
      paths:
        - ydb/library/workload/**

component_management:
  individual_components:
    - component_id: cli_app
      name: apps/ydb
      paths:
        - ydb/apps/ydb/**
    - component_id: cli_core
      name: ydb_cli lib
      paths:
        - ydb/public/lib/ydb_cli/**

comment:
  layout: "diff, flags, components, files"
  behavior: default
  require_changes: false
  # Selective PR uploads make the unscoped project aggregate misleading.
  # Show only freshly measured component flags.
  hide_project_coverage: true
