# Codecov config for ydb-platform/ydb (C++ SDK + CLI + workload).
# Separate from per-language SDK repos (java/go/js) and their native-sdk component.

codecov:
  # strict_yaml_branch is omitted only in this dogfood harness so Codecov can
  # evaluate the candidate config before it reaches the default branch.
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

github_checks: false

coverage:
  status:
    project: off
    patch: off

flag_management:
  default_rules:
    # Every relevant main push uploads all three flags. PRs intentionally
    # upload only affected flags, so no synthetic carryforward is needed.
    carryforward: false
  individual_flags:
    - name: cpp_sdk
      paths:
        - ydb/public/sdk/cpp/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
          flag_coverage_not_uploaded_behavior: exclude
        - type: patch
          target: 80%
          informational: true
          flag_coverage_not_uploaded_behavior: exclude
    - name: cli
      paths:
        - ydb/apps/ydb/**
        - ydb/public/lib/ydb_cli/**
      statuses:
        - type: project
          target: auto
          threshold: 5%
          flag_coverage_not_uploaded_behavior: exclude
        - type: patch
          target: 80%
          informational: true
          flag_coverage_not_uploaded_behavior: exclude
    - name: cli_workload
      paths:
        - ydb/library/workload/**
      statuses:
        - type: project
          target: auto
          threshold: 5%
          flag_coverage_not_uploaded_behavior: exclude
        - type: patch
          target: 80%
          informational: true
          flag_coverage_not_uploaded_behavior: exclude

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: false
  hide_project_coverage: true
