# Именованные профили компиляции релиза и бинарника для приёмки.
# definition_flags задаёт переменные ya; cflags/cxxflags — флаги компилятора, включая -DNAME=value.
any:
  build_profiles:
    release: &release
      build_type: release
      thinlto: true
      definition_flags: -DDEBUGINFO_LINES_ONLY
      cflags: ""
      cxxflags: ""
      sanitize: ""
      profile_memory: false
      collect_flamegraphs: false
    release_no_lto:
      <<: *release
      thinlto: false

    relwithdebinfo:
      <<: *release
      build_type: relwithdebinfo
      thinlto: false
    asan:
      <<: *release
      build_type: relwithdebinfo
      thinlto: false
      sanitize: address
    tsan:
      <<: *release
      build_type: relwithdebinfo
      thinlto: false
      sanitize: thread
    profile:
      <<: *release
      build_type: profile
      thinlto: false
      collect_flamegraphs: true
