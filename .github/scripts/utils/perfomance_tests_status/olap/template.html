<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OLAP Now</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230969da'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='15' font-weight='800' fill='white'%3EO%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328;
    --muted: #656d76; --bad: #cf222e; --warn: #bf8700; --ok: #1a7f37; --info: #0969da;
    /* severity ladder: broken > missing > regression > stale > in_progress > ok */
    --broken: #a40e26; --broken-bg: #ffd7d5;
    --regress: #bc4c00; --regress-bg: #fff1e5;
    --miss: #8250df; --miss-bg: #fbefff;
  }
  * { box-sizing: border-box; }
  html { max-width: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4;
    max-width: 100%; overflow-x: hidden; /* page never grows; panes scroll inside */
  }
  .wrap {
    max-width: 1400px; width: 100%; margin: 0 auto; padding: 14px 14px 48px;
    min-width: 0;
  }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .note {
    background: #ddf4ff; border: 1px solid #54aeff66; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: #0550ae; margin: 0 0 8px;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 999px; text-transform: uppercase; white-space: nowrap;
  }
  .badge.broken { background: var(--broken-bg); color: var(--broken); }
  .badge.missing { background: var(--miss-bg); color: var(--miss); }
  .badge.regression, .badge.both { background: var(--regress-bg); color: var(--regress); }
  .badge.failing { background: #ffebe9; color: var(--bad); }
  .badge.slower { background: #fff8c5; color: var(--warn); }
  .badge.stale, .badge.watch { background: #fff8c5; color: var(--warn); }
  .badge.in_progress { background: #ddf4ff; color: var(--info); }
  .badge.ok { background: #dafbe1; color: var(--ok); }
  .badge.nodata { background: var(--miss-bg); color: var(--miss); box-shadow: inset 0 0 0 1px #8250df66; }
  .badge.noruns { background: #f6f8fa; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
  .pill {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: #eaeef2; color: var(--muted); font-weight: 600;
  }
  .counters {
    display: flex; flex-wrap: nowrap; gap: 10px; margin: 0 0 16px;
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .counter {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; flex: 1 1 0; min-width: 96px;
  }
  .counter .n {
    font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.1; white-space: nowrap;
  }
  .counter .n .sel { font-size: 0.85em; opacity: .85; }
  .counter .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .counter.hot .n { color: var(--broken); }
  .counter.regress .n { color: var(--regress); }
  .counter.miss .n { color: var(--miss); }
  .counter.info .n { color: var(--info); }
  .counter.warn .n { color: var(--warn); }
  .counter.ok .n { color: var(--ok); }
  .counter.nodata .n { color: var(--miss); }
  .counter.noruns .n { color: var(--muted); }
  .counter.ticket .n { color: #8250df; }
  .counter.newfail .n { color: var(--broken); }
  .pill.ticket { background: #ddf4ff; color: #0550ae; }
  .pill.ticket.needs-branch { background: #fff8c5; color: #9a6700; }
  .pill.ticket.closed { background: #f6f8fa; color: #656d76; box-shadow: inset 0 0 0 1px #d0d7de; }
  .pill.ticket.no-ticket { background: var(--broken-bg); color: var(--broken); }
  a.pill.ticket.wait-next {
    background: #ddf4ff; color: #0550ae; box-shadow: inset 0 0 0 1px #0969da44;
  }
  a.pill.ticket.wait-next:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #0969da66; }
  .run-card .run-tickets {
    margin-top: 3px; font-size: 10px; line-height: 1.35;
    display: flex; flex-wrap: wrap; gap: 2px; max-width: 100%;
  }
  .run-card .run-tickets .pill {
    font-size: 10px; padding: 1px 5px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .heat-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    max-width: 100%; min-width: 0; margin-bottom: 18px;
    overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  table.heat {
    border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px;
  }
  table.heat th, table.heat td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
  table.heat th:first-child, table.heat td:first-child {
    text-align: left; position: sticky; left: 0; z-index: 2;
    background: #fafbfc; box-shadow: 1px 0 0 var(--border);
  }
  table.heat th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  .cell {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 72px; padding: 6px 8px; border-radius: 8px; font-weight: 650; cursor: default;
  }
  .cell.ok { background: #dafbe1; color: var(--ok); cursor: pointer; }
  .cell.broken { background: var(--broken-bg); color: var(--broken); cursor: pointer; box-shadow: inset 0 0 0 1px #ff818266; }
  .cell.regression, .cell.slower, .cell.slow { background: var(--regress-bg); color: var(--regress); cursor: pointer; }
  .cell.failing, .cell.fail, .cell.both { background: #ffebe9; color: var(--bad); cursor: pointer; }
  .cell.missing { background: var(--miss-bg); color: var(--miss); cursor: pointer; }
  .cell.stale, .cell.watch { background: #fff8c5; color: var(--warn); cursor: pointer; }
  .cell.in_progress { background: #ddf4ff; color: var(--info); cursor: pointer; }
  /* query gaps (no data N) = critical purple; empty cell (no runs) = muted grey */
  .cell.nodata { background: var(--miss-bg); color: var(--miss); cursor: pointer; box-shadow: inset 0 0 0 1px #8250df66; }
  .cell.noruns { background: #f6f8fa; color: var(--muted); cursor: pointer; box-shadow: inset 0 0 0 1px var(--border); }
  /* compare deltas: 40% was · 20% blend · 40% now (not a smear across the whole chip) */
  .cell.delta-worse {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #ffebe9 60%, #ffebe9 100%);
    color: var(--bad); cursor: pointer;
  }
  .cell.delta-better {
    background: linear-gradient(90deg, #ffebe9 0%, #ffebe9 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; cursor: pointer;
  }
  /* nodata compare: green↔purple (query gaps), not red fail gradient */
  .cell.delta-worse.delta-nodata, .cell.delta-worse-nodata {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #fbefff 60%, #fbefff 100%);
    color: var(--miss); cursor: pointer;
  }
  .cell.delta-better.delta-nodata, .cell.delta-better-nodata {
    background: linear-gradient(90deg, #fbefff 0%, #fbefff 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; cursor: pointer;
  }
  .cell.delta-mixed {
    background: linear-gradient(90deg, #fff8c5 0%, #fff8c5 40%, #ddf4ff 60%, #ddf4ff 100%);
    color: #9a6700; cursor: pointer;
  }
  .cell.delta-same { background: #f6f8fa; color: var(--muted); cursor: pointer; }
  .cell.selected { outline: 2px solid var(--info); outline-offset: 2px; box-shadow: 0 0 0 3px #0969da33; }
  .cell .cnt { font-size: 11px; opacity: .85; }
  .cmp-cell { text-align: left; vertical-align: middle; min-width: 200px; }
  .cmp-cell select {
    max-width: 260px; width: 100%; padding: 4px 6px; font: inherit; font-size: 11px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  .run-card { cursor: pointer; transition: box-shadow .12s, border-color .12s; }
  .run-card:hover { border-color: var(--info); }
  .run-card.active { border-color: var(--info); box-shadow: 0 0 0 2px #0969da33; background: #f6f8fa; }
  .run-card.cmp { border-color: #9a6700; box-shadow: 0 0 0 2px #9a670033; }
  /* Compare pills: default = fail pink↔green; typed accents below. */
  .pill.delta-better {
    background: linear-gradient(90deg, #ffebe9 0%, #ffebe9 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; box-shadow: inset 0 0 0 1px #1a7f3766;
  }
  .pill.delta-worse {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #ffebe9 60%, #ffebe9 100%);
    color: var(--bad); box-shadow: inset 0 0 0 1px #cf222e66;
  }
  .pill.delta-better.delta-nodata, .pill.delta-better-nodata {
    background: linear-gradient(90deg, #fbefff 0%, #fbefff 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; box-shadow: inset 0 0 0 1px #8250df66;
  }
  .pill.delta-worse.delta-nodata, .pill.delta-worse-nodata {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #fbefff 60%, #fbefff 100%);
    color: var(--miss); box-shadow: inset 0 0 0 1px #8250df66;
  }
  .pill.delta-better.delta-slow, .pill.delta-better-slow {
    background: linear-gradient(90deg, #fff1e5 0%, #fff1e5 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; box-shadow: inset 0 0 0 1px #bc4c0066;
  }
  .pill.delta-worse.delta-slow, .pill.delta-worse-slow {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #fff1e5 60%, #fff1e5 100%);
    color: var(--regress); box-shadow: inset 0 0 0 1px #bc4c0066;
  }
  .pill.delta-better.delta-soft, .pill.delta-better-soft, .pill.delta-soft {
    background: linear-gradient(90deg, #fff8c5 0%, #fff8c5 40%, #dafbe1 60%, #dafbe1 100%);
    color: #9a6700; box-shadow: inset 0 0 0 1px #9a670066;
  }
  .pill.delta-worse.delta-soft, .pill.delta-worse-soft {
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #fff8c5 60%, #fff8c5 100%);
    color: #9a6700; box-shadow: inset 0 0 0 1px #9a670066;
  }
  .heat-legend {
    display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 8px 12px 12px;
    font-size: 11px; color: var(--muted);
  }
  .heat-legend .swatch {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .heat-legend .dot {
    width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto;
  }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0;
    background: transparent; border: 0; border-radius: 0; padding: 0;
  }
  label { display: grid; gap: 2px; font-size: 10px; color: var(--muted); }
  select, input[type="date"] {
    min-width: 110px; padding: 4px 6px; border: 1px solid var(--border);
    border-radius: 5px; background: #fff; font: inherit; font-size: 12px;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .toolbar button, .btn {
    border: 1px solid var(--border); background: var(--panel); border-radius: 5px;
    padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .toolbar button:hover, .btn:hover { border-color: var(--info); color: var(--info); }
  .top-filters {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 8px 10px;
    margin: 0 0 12px; padding: 6px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .top-filters .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
  .top-filters .sep { width: 1px; height: 22px; background: var(--border); flex: 0 0 auto; }
  .top-filters .react-btn, .top-filters .wave-btn {
    padding: 3px 8px; font-size: 11px; border-radius: 999px;
  }
  .top-filters .filters { flex-wrap: nowrap; align-items: center; gap: 6px; }
  .top-filters label { display: flex; flex-direction: row; align-items: center; gap: 4px; white-space: nowrap; }
  .top-filters select, .top-filters input[type="date"] { min-width: 0; }

  #inbox {
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  table.inbox {
    width: 100%; border-collapse: collapse; font-size: 13px;
    background: transparent; border: 0;
    table-layout: auto;
  }
  table.inbox th {
    text-align: left; font-size: 11px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); background: #fafbfc;
  }
  table.inbox td {
    padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  table.inbox tr:last-child td { border-bottom: 0; }
  table.inbox tr.row { cursor: pointer; }
  table.inbox tr.row:hover { filter: brightness(0.985); }
  table.inbox tr.row.open { background: #f6f8fa; }
  table.inbox tr.detail td {
    background: #f6f8fa; padding: 12px 14px;
    /* Keep dive/charts inside the visible inbox width (not clipped by page). */
    max-width: 0; /* colspan cell inherits table width */
    overflow-x: auto;
  }
  table.inbox tr.detail.hidden { display: none; }
  .cluster { font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--info); }
  .muted { color: var(--muted); font-size: 12px; }
  .bad { color: var(--bad); }
  .good { color: var(--ok); }
  .num { text-align: right; }
  /* Inbox metrics: big now, quiet base, loud Δ */
  .mcell { min-width: 132px; text-align: left; line-height: 1.25; }
  .mcell .big {
    font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .mcell .big.bad { color: var(--bad); }
  .mcell .big.muted { color: var(--muted); }
  .mcell .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mcell .delta {
    margin-top: 4px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .mcell .delta.bad { color: var(--bad); }
  .mcell .delta.good { color: var(--ok); }
  .stat-cell { text-align: left; min-width: 120px; }
  .stat-cell .qline { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-cell .qline b { color: var(--text); font-weight: 650; }

  .dive {
    display: grid; gap: 12px; min-width: 0; max-width: 100%;
  }
  .runs {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;
  }
  @media (max-width: 900px) {
    .runs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .runs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .run-card {
    background: #fff; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 6px; font-size: 10px; line-height: 1.25; min-width: 0;
  }
  .run-card .t {
    font-weight: 650; margin-bottom: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .run-card .muted { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* active/hover styles declared above with delta cells */
  .qlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .q-split {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 12px;
    align-items: stretch; margin-top: 4px; min-height: 420px; min-width: 0; width: 100%;
  }
  .q-split-list {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; min-width: 0; display: flex; flex-direction: column; gap: 6px;
  }
  .q-split-list .qlist {
    display: flex; flex-direction: column; flex-wrap: nowrap; align-items: stretch;
    gap: 4px; margin-top: 0; overflow-y: auto; max-height: 560px; flex: 1;
  }
  .q-split-list .qlist .q-row {
    display: flex; flex-direction: column; align-items: stretch; gap: 2px;
    min-width: 0;
  }
  .q-split-list .qlist .q-row-tickets {
    display: flex; flex-wrap: wrap; gap: 3px; padding: 0 2px 2px 8px;
    min-height: 0;
  }
  .q-split-list .qlist .q-row-tickets .pill.ticket {
    font-size: 10px; padding: 1px 6px; margin: 0;
    max-width: 100%;
  }
  .q-split-list .qlist .pill,
  .q-split-list button.pill {
    width: 100%; border-radius: 6px; text-align: left; justify-content: flex-start;
    white-space: normal; line-height: 1.25; padding: 5px 8px;
  }
  /* Compare query pills: name | was → now (centered) | extra */
  .q-split-list .qlist .pill.q-pill-cmp {
    display: grid;
    grid-template-columns: minmax(64px, 26%) minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px 10px;
    text-align: left;
  }
  .q-split-list .qlist .pill .q-name {
    font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .q-split-list .qlist .pill .q-cmp-mid {
    display: flex; align-items: baseline; justify-content: center; gap: 8px;
    min-width: 0; font-variant-numeric: tabular-nums;
  }
  .q-split-list .qlist .pill .q-was {
    flex: 1 1 0; text-align: right; opacity: .78; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .q-split-list .qlist .pill .q-arrow {
    flex: 0 0 auto; opacity: .45; font-weight: 700;
  }
  .q-split-list .qlist .pill .q-now {
    flex: 1 1 0; text-align: left; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .q-split-list .qlist .pill .q-extra {
    opacity: .7; font-size: 11px; white-space: nowrap;
  }
  .q-split-charts {
    min-width: 0; display: flex; flex-direction: column;
  }
  .q-split-charts .qdetail {
    margin-top: 0; flex: 1; display: flex; flex-direction: column; min-height: 0;
  }
  .q-split-charts .q-charts-stack {
    display: grid; grid-template-columns: 1fr; gap: 10px; flex: 1;
  }
  .q-split-charts .chart-box { height: 240px; min-height: 200px; min-width: 0; max-width: 100%; }
  .q-split-charts .q-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px dashed var(--border); border-radius: 8px;
    color: var(--muted); padding: 24px; text-align: center;
  }
  @media (max-width: 1000px) {
    .q-split { grid-template-columns: 1fr; min-height: 0; }
    .q-split-list .qlist { max-height: 220px; flex-direction: row; flex-wrap: wrap; }
    .q-split-list .qlist .pill { width: auto; }
  }
  /* soft vs hard: pale amber outline vs solid orange fill */
  .pill.watch { background: #fffdf5; color: #9a6700; box-shadow: inset 0 0 0 1.5px #d4a72c; }
  .pill.slow { background: #e8590c; color: #fff; }
  .pill.fail { background: #ffebe9; color: var(--bad); }
  a.pill.ticket {
    display: inline-block; background: #ddf4ff; color: #0969da; text-decoration: none;
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    vertical-align: middle; margin: 2px 2px 0 0;
  }
  a.pill.ticket:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #0969da66; }
  a.pill.ticket.closed {
    background: #f6f8fa; color: #656d76; box-shadow: inset 0 0 0 1px #d0d7de;
  }
  a.pill.ticket.closed:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #8c959f66; }
  .pill.qok { background: #dafbe1; color: var(--ok); }
  .pill.nodata { background: var(--miss-bg); color: var(--miss); box-shadow: inset 0 0 0 1px #8250df66; }
  .pill.noruns { background: #f6f8fa; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
  button.pill {
    border: 0; cursor: pointer; font: inherit; font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 999px;
  }

<!-- Huge payload as JSON text (not JS AST) — much faster than const DATA = {...} -->
<script type="application/json" id="olap-report-data">__OLAP_REPORT_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('olap-report-data').textContent);
const charts = {};
const UI = DATA.ui || {};
let winFrom = UI.default_from || null;
let winTo = UI.default_to || null;
const REACT_KEY = 'olap_now_react_signals';
const WAVE_KEY = 'olap_now_wave_view';
function defaultReact() { return { fail: true, new: false, hard: false, soft: false, nodata: true }; }
function loadReact() {
  try {
    const o = JSON.parse(localStorage.getItem(REACT_KEY) || '');
    if (!o || typeof o !== 'object') return defaultReact();
    return {
      fail: !!o.fail,
      new: !!o.new,
      hard: !!o.hard,
      soft: !!o.soft,
      nodata: !!o.nodata,
    };
  } catch (_) {
    return defaultReact();
  }
}
let reactState = loadReact();
function reactSignals() { return reactState; }
function syncReactButtons() {
  const s = reactSignals();
  document.querySelectorAll('#reactBar .react-btn').forEach(btn => {
    const k = btn.dataset.react;
    btn.setAttribute('aria-pressed', s[k] ? 'true' : 'false');
  });
}
function setReact(key) {
  reactState = { ...reactState, [key]: !reactState[key] };
  try { localStorage.setItem(REACT_KEY, JSON.stringify(reactState)); } catch (_) {}
  syncReactButtons();
  destroyCharts();
  renderAll();
}
function defaultWave() { return 'finished'; }
function loadWave() {
  try {
    const v = localStorage.getItem(WAVE_KEY);
    return (v === 'all' || v === 'finished') ? v : defaultWave();
  } catch (_) {
    return defaultWave();
  }
}
let waveState = loadWave();
function waveView() { return waveState; }
function syncWaveButtons() {
  const v = waveView();
  document.querySelectorAll('#waveBar .wave-btn').forEach(btn => {
    btn.setAttribute('aria-pressed', btn.dataset.wave === v ? 'true' : 'false');
  });
}
function setWave(v) {
  if (v !== 'all' && v !== 'finished') return;
  waveState = v;
  try { localStorage.setItem(WAVE_KEY, waveState); } catch (_) {}
  syncWaveButtons();
  destroyCharts();
  renderAll();
}

const CMP_KEY = 'olap_now_compare_waves';
let compareState = {};
try { compareState = JSON.parse(sessionStorage.getItem(CMP_KEY) || '{}') || {}; } catch (_) { compareState = {}; }
/** suiteKey → selected now_runs index (default = last) */
const diveRunFocus = {};
/** suiteKey → selected query test name (sticky across Last-runs focus changes) */
const diveQueryFocus = {};

function cmpKey(branch, db) { return `${branch || ''}|${db || ''}`; }
function getCompareId(branch, db) {
  return compareState[cmpKey(branch, db)] || '';
}
function setCompareId(branch, db, id) {
  const k = cmpKey(branch, db);
  if (!id) delete compareState[k];
  else compareState[k] = id;
  try { sessionStorage.setItem(CMP_KEY, JSON.stringify(compareState)); } catch (_) {}
}
/** Keep dive/query "now" on latest when compare changes (cards ↔ heatmap stay in sync). */
function clearDiveFocusForDb(branch, db) {
  const prefix = `${branch || ''}|${db || ''}|`;
  for (const k of Object.keys(diveRunFocus)) {
    if (k.startsWith(prefix)) delete diveRunFocus[k];
  }
}
function waveListFor(branch, db) {
  return (DATA.wave_list && DATA.wave_list[cmpKey(branch, db)]) || [];
}
function waveEntry(branch, db, id) {
  if (!id) return null;
  return waveListFor(branch, db).find(w => w.id === id || w.ci_version === id) || null;
}
function alertRules() {
  const r = DATA.rules || {};
  const ui = DATA.ui || {};
  return {
    failBroken: r.fail_broken ?? 0.5,
    failHot: r.fail_hot ?? 0.1,
    failRise: r.fail_rise ?? 0.05,
    durTol: (r.dur_tol != null ? r.dur_tol : 0.1) * 100,
    durHard: (r.dur_hard != null ? r.dur_hard : 0.25) * 100,
    noiseK: r.noise_k ?? 2,
    outlierMult: r.outlier_mult ?? 3,
    slowPersist: r.slow_persist_min ?? 1,
    baseline: r.baseline_runs || ui.baseline_runs || 7,
  };
}
function medianNums(arr) {
  const a = (arr || []).filter(x => x != null && Number.isFinite(Number(x))).map(Number).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function avgNums(arr) {
  const a = (arr || []).filter(x => x != null && Number.isFinite(Number(x))).map(Number);
  if (!a.length) return null;
  return a.reduce((s, v) => s + v, 0) / a.length;
}
function pstdevNums(arr) {
  const a = (arr || []).filter(x => x != null && Number.isFinite(Number(x))).map(Number);
  if (a.length < 2) return 0;
  const m = a.reduce((s, v) => s + v, 0) / a.length;
  return Math.sqrt(a.reduce((s, v) => s + (v - m) * (v - m), 0) / a.length);
}
function findHistIndexForWave(hist, wave) {
  if (!hist || !wave) return -1;
  const civs = hist.ci_versions || [];
  const id = wave.id || wave.ci_version;
  for (let i = civs.length - 1; i >= 0; i--) {
    if (civs[i] && civs[i] === id) return i;
  }
  const lo = Date.parse(wave.min_ts);
  const hi = Date.parse(wave.max_ts);
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) return -1;
  const labels = hist.labels || [];
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < labels.length; i++) {
    const t = Date.parse(labels[i]);
    if (!Number.isFinite(t)) continue;
    if (t < lo - 120000 || t > hi + 120000) continue;
    const d = Math.abs(t - hi);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return best;
}
function findHistIndexForRun(hist, run) {
  if (!hist || !run) return -1;
  const reports = hist.reports || [];
  if (run.report) {
    const i = reports.lastIndexOf(run.report);
    if (i >= 0) return i;
  }
  const civs = hist.ci_versions || [];
  if (run.ci_version) {
    for (let i = civs.length - 1; i >= 0; i--) {
      if (civs[i] === run.ci_version) return i;
    }
  }
  const vers = hist.versions || [];
  if (run.version) {
    const want = String(run.version).slice(0, 8);
    for (let i = vers.length - 1; i >= 0; i--) {
      if (vers[i] && String(vers[i]).slice(0, 8) === want) return i;
    }
  }
  const runTs = Date.parse(run.ts || run.day);
  if (!Number.isFinite(runTs)) return -1;
  const labels = hist.labels || [];
  let best = -1, bestDist = Infinity;
  for (let i = 0; i < labels.length; i++) {
    const t = Date.parse(labels[i]);
    if (!Number.isFinite(t)) continue;
    const d = Math.abs(t - runTs);
    if (d < bestDist) { bestDist = d; best = i; }
  }
  return bestDist <= 6 * 3600 * 1000 ? best : -1;
}
/** Classify series at index idx (ydb raw, fail_rate as 0–100 from history). */
function histPointUsable(nodataArr, markersArr, i) {
  if (nodataArr && nodataArr[i]) return false;
  const m = markersArr && markersArr[i];
  if (m === 'in_progress' || m === 'missing') return false;
  return true;
}
/** Last real (non-synthetic) history index. */
function lastCompletedHistIndex(hist) {
  const ydb = (hist && hist.ydb) || [];
  const n = ydb.length;
  const nodata = (hist && hist.nodata) || [];
  const markers = (hist && hist.markers) || [];
  for (let i = n - 1; i >= 0; i--) {
    if (histPointUsable(nodata, markers, i)) return i;
  }
  return n > 0 ? n - 1 : -1;
}
/**
 * Mirror generate.classify_slice at history index.
 * @param baseEndIdx optional: take prev7 baseline ending at this index (for same-baseline compare).
 */
function classifyAtIndex(ydbArr, frPctArr, idx, nodataArr, markersArr, baseEndIdx) {
  const R = alertRules();
  if (idx < 0 || idx >= (ydbArr || []).length) {
    return { status: 'nodata', kind: 'nodata', ydb_pct: null, ydb_now: null, ydb_base: null, fail_rate: null, error_class: null };
  }
  if (!histPointUsable(nodataArr, markersArr, idx)) {
    const m = markersArr && markersArr[idx];
    if (m === 'in_progress') {
      return { status: 'in_progress', kind: 'in_progress', ydb_pct: null, ydb_now: null, ydb_base: null, fail_rate: null, error_class: null };
    }
    if (m === 'missing') {
      return { status: 'missing', kind: 'missing', ydb_pct: null, ydb_now: null, ydb_base: null, fail_rate: null, error_class: null };
    }
    return { status: 'nodata', kind: 'nodata', ydb_pct: null, ydb_now: null, ydb_base: null, fail_rate: null, error_class: null };
  }
  const nowY = ydbArr[idx];
  const baseEnd = (baseEndIdx != null && baseEndIdx >= 0) ? baseEndIdx : idx;
  const baseSlice = [];
  for (let i = Math.max(0, baseEnd - R.baseline); i < baseEnd; i++) {
    if (!histPointUsable(nodataArr, markersArr, i)) continue;
    if (ydbArr[i] != null) baseSlice.push(Number(ydbArr[i]));
  }
  const ydb_now = nowY == null ? null : Number(nowY);
  const ydb_base = medianNums(baseSlice);
  let ydb_pct = null;
  if (ydb_base != null && ydb_base > 0 && ydb_now != null) {
    ydb_pct = ((ydb_now - ydb_base) / ydb_base) * 100;
  }
  const frNow = frPctArr && frPctArr[idx] != null ? Number(frPctArr[idx]) / 100 : 0;
  const frBaseArr = [];
  for (let i = Math.max(0, baseEnd - R.baseline); i < baseEnd; i++) {
    if (!histPointUsable(nodataArr, markersArr, i)) continue;
    if (frPctArr && frPctArr[i] != null) frBaseArr.push(Number(frPctArr[i]) / 100);
  }
  // Match generate.classify_slice: last_fr ≥ failHot (≥10%) is always hot (rise only affects reason text).
  const is_fail = frNow >= R.failHot;
  let durStatus = 'ok';
  const noise = (ydb_base != null && ydb_base > 0) ? (pstdevNums(baseSlice) / ydb_base) * 100 : 0;
  const thr = Math.max(R.durTol, R.noiseK * noise);
  const hardFloor = Math.max(R.durHard, thr);
  const nAbove = (ydb_base != null)
    ? (ydb_now != null && ydb_now > ydb_base ? 1 : 0)
    : 0;

  }

  const is_watch = durStatus === 'watch';

  let status = 'ok';
  // Match Python: ≥50% → broken; ≥10% → failing (not broken); both keeps broken only if fail≥50% or dur outlier.
  if (is_fail && is_slow) {
    kind = 'both';
    status = (frNow >= R.failBroken || durStatus === 'broken') ? 'broken' : 'both';

function downloadDutyJson(filename, obj) {

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyDutyJson(obj) {
  const text = JSON.stringify(obj, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }
}

    toast.hidden = false;

    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.hidden = true; }, 1800);

  btn.textContent = ok ? okMsg : failMsg;
  setTimeout(() => { btn.textContent = prev; }, 1600);

    if (!q || !q.test) continue;
    if (!q.history) {
      const k = q.kind || 'ok';
      if (k === 'fail' || k === 'both') fails.push({ test: q.test, error_class: q.error_class || null });
      if (k === 'slow' || k === 'both') slows.push({ test: q.test, ydb_pct: q.ydb_pct });
      if (k === 'watch') softs.push({ test: q.test, ydb_pct: q.ydb_pct });
      if (k === 'nodata' || k === 'missing' || k === 'in_progress') nodatas.push({ test: q.test });
      continue;

    if (qi < 0) { nodatas.push({ test: q.test }); continue; }

      fails.push({ test: q.test, ydb_pct: qm.ydb_pct, error_class: qm.error_class || null });

    if (qm.kind === 'watch') softs.push({ test: q.test, ydb_pct: qm.ydb_pct });
    if (qm.kind === 'nodata' || qm.kind === 'missing' || qm.kind === 'in_progress') {

      test: q.test,
      kind,
      error_class: q.error_class || null,
      ydb_pct: q.ydb_pct != null ? q.ydb_pct : null,
      ydb_now: q.ydb_now != null ? q.ydb_now : null,
      fail_rate_late: q.fail_rate_late != null ? q.fail_rate_late : null,

    cg.fails.forEach(q => pushCmp(q, 'fail'));
    cg.nodatas.forEach(q => pushCmp(q, 'nodata'));
    cg.slows.slice(0, 8).forEach(q => pushCmp(q, 'slow'));
    compareBlock = {
      wave_id: cmpId,
      active: true,
      day: (cmpWave && cmpWave.day) || (cmpPack && cmpPack.day) || null,
      label: (cmpWave && cmpWave.label) || (cmpPack && cmpPack.label) || null,
      run: cmpPack,
      query_counts: cmpQc,
      queries: cmpQueries.slice(0, 200),
      note: 'Compare wave selected in heatmap — dig compare.run (Allure/sha/gaps) as well as selection.focus_run (now/latest). Do not stop at last only.',
    };
  }

  const known_tickets = (item.tickets || []).map(t => ({
    number: t.number,
    title: t.title,
    url: t.url,
    fingerprint: t.fingerprint || null,
    queries: t.queries || [],
    branch_match: t.branch_match !== false,
    needs_branch: t.needs_branch || null,
  }));

  const suiteDecision = packDutyDecision(
    (focusRun && focusRun.duty_decision) || item.duty_decision || data.duty_decision
  );
  const waitNextQueries = queries.filter(q => q.wait_next).map(q => q.test);

  return {
    schema: 'perf-duty-context/v1',
    generated_at: new Date().toISOString(),
    report: dutyReportMeta('olap'),
    selection: {
      branch: item.branch || null,
      db: item.db || null,
      suite: item.suite || null,
      family: item.family || null,
      focus_run: focusPack,
    },
    suite_now: {
      issue: view ? view.issue : item.issue,
      status: view ? view.status : item.status,
      fail_rate_now: view ? view.fail_rate_now : (item.fail_rate_now != null ? item.fail_rate_now : item.fail_rate),
      fail_rate_base: view ? view.fail_rate_base : item.fail_rate_base,
      ydb_now: view ? view.ydb_now : item.ydb_now,
      ydb_base: view ? view.ydb_base : item.ydb_base,
      ydb_pct: view ? view.ydb_pct : item.ydb_pct,
      n_fail: query_counts.fail,
      n_slow: query_counts.slow,
      n_soft: query_counts.soft,
      n_nodata: query_counts.nodata,
      n_ok: query_counts.ok,
      n_queries: query_counts.total,
      query_counts,
      reasons: item.reasons || [],
      ci_version: (view && view.ci_version) || item.ci_version || item.wave || null,
      last_ts: (view && view.last_ts) || item.last_ts || null,
      new_issue_count: newIssueCount,
      ticket_coverage: (focusPack && focusPack.ticket_coverage) || 'ok',
      duty_decision: suiteDecision,
      wait_next_queries: waitNextQueries,
    },
    // Fail + all nodata first (see push order/sort); soft samples truncated above.
    // Cap high enough for suite wipe (Clickbench ~43+); do not re-truncate nodata here.
    queries: queries.slice(0, 200),
    sticky_query: sticky,
    sticky_detail,
    suite_history: compactHist(data.history || item.history, 24),
    compare: compareBlock,
    hints: {
      react,
      wave_view: waveView(),
      investigate_uncovered_first: uncovered.length > 0 || react.includes('new'),
      compare_active: !!cmpId,
      wait_next_active: !!suiteDecision,
    },
    ticket_coverage: {
      status: (focusPack && focusPack.ticket_coverage) || (
        uncovered.length ? 'uncovered' : (wrongBranch.length ? 'wrong_branch' : (covered.length ? 'covered' : 'ok'))
      ),
      new_issue_count: newIssueCount,
      uncovered_queries: uncovered,
      wrong_branch_queries: wrongBranch,
      covered_queries: covered,
      wait_next_queries: waitNextQueries,
      investigate_uncovered_first: uncovered.length > 0 || wrongBranch.length > 0 || react.includes('new'),
      note: 'Uncovered / wrong_branch = problems without an open issue on this branch label — dig these first. Covered → prefer update_known (expand affected), do not open a duplicate. wait_next = duty already filed wait_next_wave for that query (see analysis_url).',
    },
    duty_decision: suiteDecision,
    known_tickets,
  };
}
function intOr0(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function diveHtml(r, id) {
  const fin = (r.issue === 'in_progress' && r.finished) ? r.finished : null;
  const data = fin || r;
  const waveNote = (r.issue === 'in_progress')
    ? `<div class="muted" style="margin-bottom:8px">Волна <code>${esc(r.ci_version || r.wave || '')}</code> in progress` +
      (r.last_seen ? ` · last seen ${esc(r.last_seen)}` : '') +
      (fin ? ` · ниже — <b>последний завершённый</b> (${esc(fin.issue || fin.status || 'ok')})` : ' · finished twin нет') +
      `</div>`
    : '';
  const focusIdx = diveFocusRunIndex(r, data);
  const cmpId = getCompareId(r.branch, r.db);
  const cmpWave = cmpId ? waveEntry(r.branch, r.db, cmpId) : null;
  const runs = (data.now_runs || []).map((run, ri) => {
    const covRun = runCoverageForDisplay(data, run);
    const link = run.report ? `<a href="${esc(run.report)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">report</a>` : '—';
    const isLatest = ri === (data.now_runs || []).length - 1;
    const active = ri === focusIdx ? ' active' : '';
    const isCmp = !!(cmpWave && run.ci_version && (
      run.ci_version === cmpWave.id || run.ci_version === cmpWave.ci_version || run.ci_version === cmpId
    ) && !isLatest);
    const cls = isLatest && active ? 'run-card active' : (isCmp ? 'run-card cmp' : `run-card${active}`);
    const sha = (run.version || run.label || '').toString();
    const shortLbl = run.label
      ? String(run.label).replace(/^(\d{4}-\d{2}-\d{2})_([a-f0-9]{7,8}).*$/i, '$1·$2')
      : sha.slice(0, 10);
    const tipBits = [
      run.label || '',
      run.ci_version || '',
      isCmp ? 'compare' : (isLatest ? 'now' : ''),
      covRun.ticket_coverage && covRun.ticket_coverage !== 'ok' ? `tickets:${covRun.ticket_coverage}` : '',
      (covRun.uncovered_queries || []).length ? `no ticket: ${(covRun.uncovered_queries || []).join(', ')}` : '',
    ].filter(Boolean);
    return `<div class="${cls}" data-run-card="${id}" data-run-idx="${ri}" data-ci="${esc(run.ci_version || '')}" title="${esc(tipBits.join(' · '))}">
      <div class="t">${esc(shortLbl)}</div>
      <div>${fmtFail(run.fail_rate)} · ${fmt(run.ydb)}</div>
      <div class="muted">${esc(run.ci_version || '—')}${isCmp ? ' · cmp' : (isLatest ? ' · now' : '')}</div>
      ${runTicketsHtml(covRun)}
      <div>${link}</div>
    </div>`;
  }).join('') || `<div class="muted">${
    r.issue === 'in_progress' && !fin
      ? `Волна <code>${esc(r.ci_version || r.wave || '')}</code> ещё едет — данных по suite пока нет` +
        (r.last_seen ? ` · last seen ${esc(r.last_seen)}` : '')
      : r.issue === 'missing'
        ? `Нет в завершённой волне <code>${esc(r.ci_version || r.wave || '')}</code>` +
          (r.last_seen ? ` · last seen ${esc(r.last_seen)}` : '')
        : 'Нет последних прогонов (missing/stale)'
  }</div>`;

  const reportUrl = (data.now_runs && data.now_runs[focusIdx] && data.now_runs[focusIdx].report)
    || data.report || r.report;
  const report = reportUrl
    ? `<a href="${esc(reportUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">report</a>`
    : '—';
  const view = suiteViewAtFocus(r, id);
  const R = alertRules();
  const focusLbl = (view && view.focusRun && (view.focusRun.label || view.focusRun.ci_version)) || 'focus';
  const summaryHtml = view
    ? `<div style="display:grid;gap:4px;margin-bottom:6px">
         <div style="font-weight:700">Focus <code>${esc(focusLbl)}</code></div>
         <div>fail rate: now <b>${fmtFail(view.fail_rate_now)}</b> · base <b>${fmtFail(view.fail_rate_base)}</b> (= avg prev${R.baseline}, не соседняя карточка)
           · Δ <b class="${(view.fail_rate_now||0) >= 0.1 ? 'bad' : ''}">${
             (view.fail_rate_now != null && view.fail_rate_base != null)
               ? `${((view.fail_rate_now - view.fail_rate_base) * 100) > 0 ? '+' : ''}${((view.fail_rate_now - view.fail_rate_base) * 100).toFixed(0)}pp`
               : '—'
           }</b></div>
         <div>ydb: now <b>${fmt(view.ydb_now)}</b> · base <b>${fmt(view.ydb_base)}</b> (= median prev${R.baseline})
           · Δ <b class="${view.ydb_pct != null && view.ydb_pct > 10 ? 'bad' : ''}">${
             (view.ydb_now != null && view.ydb_base != null)
               ? `${(view.ydb_now - view.ydb_base) > 0 ? '+' : ''}${fmt(view.ydb_now - view.ydb_base)} (${pct(view.ydb_pct)})`
               : '—'
           }</b></div>
         <div class="muted" style="font-size:11px">queries now: ${esc(fmtFS(
           view.fails.length, view.slows.length, (view.softs || []).length, (view.nodatas || []).length,
           newIssueQueryCount(r)
         ) || 'ok')} · ${report}</div>
       </div>`
    : `<div class="muted">${esc((r.reasons || []).join(' · '))} · ${report}</div>`;

  if (fin) {
    r.queries = data.queries;
    r.query_map = data.query_map;
    r.bad_queries = data.bad_queries;
    r.slow_queries = data.slow_queries;
    r.now_runs = data.now_runs;
    r.history = data.history || r.history;
  }

  const ticketsHtml = ticketPillsHtml(r.tickets);
  return `<div class="dive">
    ${waveNote}
    ${summaryHtml}
    ${ticketsHtml ? `<div style="margin:0 0 8px">${ticketsHtml}</div>` : ''}
    <div>
      <div class="muted" style="margin-bottom:6px"><b>Last runs</b> · клик = compare baseline (синхрон с heatmap) · latest = now и сбрасывает compare · % = fail rate${fin ? ' <span class="pill nodata">finished</span>' : ''}</div>
      <div class="runs">${runs}</div>
    </div>
    <div class="q-split">
      <div class="q-split-list" id="${id}_qblock">${buildQueryBlockHtml(r, id)}</div>
      <div class="q-split-charts" id="${id}_qhist">
        <div class="q-empty">Выбери query слева — справа YdbSumMeans и Fail rate</div>
      </div>
    </div>
    <div class="toolbar" style="margin:0">
      <button type="button" class="btn" data-hist="${id}">Show suite history</button>
      <span class="muted" style="font-size:12px">Save / Copy context → красная кнопка справа внизу</span>
    </div>
    <div id="${id}_hist"></div>
  </div>`;
}

function renderInbox() {
  destroyCharts();
  const rows = filteredInboxOrDrill();
  const root = document.getElementById('inbox');
  if (!rows.length) {
    const issue = document.getElementById('fIssue').value;
    const db = document.getElementById('fDb')?.value || '';
    const fam = document.getElementById('fFam')?.value || '';
    const br = selectedBranch();
    // Heatmap "no data" with zero suites in window = no runs (not "no hot problems").
    if (db && fam && !suitesInCell(br, db, fam).length) {
      root.innerHTML = '<div class="empty">no runs</div>';
      return;
    }
    if (issue === 'nodata') {
      root.innerHTML = '<div class="empty">Нет suite с no-data queries под фильтры.</div>';
      return;
    }
    root.innerHTML = issue === 'ok'
      ? '<div class="empty">Нет ok-slice под фильтры.</div>'
      : (db && fam
        ? '<div class="empty">Нет slice для этого DbAlias × family в выбранном окне.</div>'
        : '<div class="empty">Нет hot-проблем под фильтры — good. (Issue → ok чтобы смотреть зелёные)</div>');
    return;
  }
  const body = rows.map((r, idx) => {
    const id = 'dive_' + idx;
    const view = suiteViewAtFocus(r, id);
    const metrics = view || ((r.issue === 'in_progress' && r.finished) ? r.finished : r);
    const status = view ? view.status : r.status;
    const issue = view ? view.issue : r.issue;
    const civ = view ? view.ci_version : (r.ci_version || r.wave || '');
    const lastTs = view ? view.last_ts : r.last_ts;
    const R = alertRules();
    const dataRow = diveData(r);
    const runsRow = dataRow.now_runs || [];
    const focusRun = (view && view.focusRun) || (runsRow.length ? runsRow[runsRow.length - 1] : null);
    const cmpId = getCompareId(r.branch, r.db);
    const cmpWave = cmpId ? waveEntry(r.branch, r.db, cmpId) : null;
    const cmpIsFocus = !!(cmpWave && focusRun && (
      (focusRun.ci_version && (cmpWave.id === focusRun.ci_version || cmpWave.ci_version === focusRun.ci_version))
      || (focusRun.label && cmpWave.label && focusRun.label === cmpWave.label)
    ));
    const nowCounts = view
      ? {
          fail: view.fails.length,
          slow: view.slows.length,
          soft: (view.softs || []).length,
          nodata: (view.nodatas || []).length,
          new: newIssueQueryCount(r),
        }
      : (() => {
          const qs = querySplit(metrics);
          return {
            fail: qs.fail.size, slow: qs.slow.size, soft: qs.soft.size,
            nodata: qs.nodata.size, new: newIssueQueryCount(r),
          };
        })();
    // Status "was" only from compare wave (same axis as heatmap). No prev-card fallback —
    // metrics base is prev7, not the neighbor card.
    let prevCounts = null;
    let prevLabel = '';
    if (cmpWave && !cmpIsFocus) {
      prevCounts = queryCountsAtWave(dataRow, cmpWave);
      prevLabel = `compare ${cmpWave.day || cmpWave.id || cmpId}`;
    }
    const primary = inboxPrimaryStatus(status, issue, nowCounts, metrics.fail_rate_now);
    const failBits = view
      ? view.fails.slice(0, 3)
      : listedFail(r).slice(0, 3);
    const slowBits = view
      ? view.slows.slice(0, 3)
      : listedSlow(r).slice(0, 3);
    const softBits = view
      ? (view.softs || []).slice(0, 3)
      : [];
    const noFr = metrics.fail_rate_now == null && (issue === 'missing' || (issue === 'in_progress' && !r.finished));
    const ydbPct = metrics.ydb_pct;
    const focusHint = focusRun
      ? `focus ${focusRun.label || focusRun.ci_version || ''}`
      : '';
    const ticketsRow = ticketPillsHtml(r.tickets);
    return `
      <tr class="row" data-idx="${idx}" data-id="${id}">
        <td>${statusCellHtml(primary, nowCounts, prevCounts, prevLabel)}</td>
        <td><span class="cluster">${esc(r.db)}</span>
          <div class="muted">${esc(r.branch)}</div></td>
        <td>${esc(r.suite)} <span class="pill">${esc(r.family)}</span>
          <div class="muted mono">${esc(civ)}</div>
          ${ticketsRow ? `<div style="margin-top:3px">${ticketsRow}</div>` : ''}
          ${(() => {
            const nd = view ? [] : listedNodata(r);
            const bits = [];
            if (failBits.length) bits.push('fail: ' + failBits.map(q => q.test + (q.ydb_pct!=null?' '+pct(q.ydb_pct):'')).join(', '));
            if (slowBits.length) bits.push('slow: ' + slowBits.map(q => q.test + (q.ydb_pct!=null?' '+pct(q.ydb_pct):'')).join(', '));
            if (softBits.length) bits.push('soft: ' + softBits.map(q => q.test + (q.ydb_pct!=null?' '+pct(q.ydb_pct):'')).join(', '));
            if (nd.length) bits.push('no data: ' + nd.length + 'q');
            if (issue === 'in_progress' && r.finished) {
              bits.push('finished: ' + (r.finished.issue || r.finished.status || 'ok'));
            }
            return bits.length ? `<div class="muted">${esc(bits.join(' · '))}</div>` : '';
          })()}
        </td>
        <td>${noFr ? '<div class="mcell"><div class="big muted">—</div></div>' : metricCellHtml(
          metrics.fail_rate_base, metrics.fail_rate_now, null, '', `avg prev${R.baseline}`, 'fail'
        )}</td>
        <td>${metricCellHtml(
          metrics.ydb_base, metrics.ydb_now, ydbPct, '', `median prev${R.baseline}`, 'ydb'
        )}</td>
        <td class="muted">${esc(lastTs || '—')}
          ${!view && r.last_seen && r.last_seen !== r.last_ts ? `<div class="muted">seen ${esc(r.last_seen)}</div>` : ''}
          ${focusHint ? `<div class="muted">${esc(focusHint)}</div>` : ''}
        </td>
      </tr>
      <tr class="detail hidden" data-detail="${id}"><td colspan="6">${diveHtml(r, id)}</td></tr>`;
  }).join('');

  root.innerHTML = `<table class="inbox">
    <thead><tr>
      <th>Status</th><th>DbAlias</th><th>Suite</th>
      <th>Fail rate</th><th>YdbSumMeans</th><th>Wave / last</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table>
  <div class="muted" style="margin-top:8px">Показано ${rows.length} · клик = deep dive</div>`;

  root.querySelectorAll('tr.row').forEach(tr => {
    tr.addEventListener('click', () => {
      const id = tr.dataset.id;
      const detail = root.querySelector(`tr.detail[data-detail="${id}"]`);
      // One open dive at a time — FAB targets the visible row.
      root.querySelectorAll('tr.row.open').forEach(other => {
        if (other === tr) return;
        other.classList.remove('open');
        const od = root.querySelector(`tr.detail[data-detail="${other.dataset.id}"]`);
        if (od) od.classList.add('hidden');
        destroyCharts(other.dataset.id + '_');
      });
      const open = tr.classList.toggle('open');
      detail.classList.toggle('hidden', !open);
      if (!open) destroyCharts(id + '_');
      else {
        const idx = Number(tr.dataset.idx);
        const item = rows[idx];
        // auto-show history for coverage issues so synthetic point is visible
        if (item && (item.issue === 'missing' || item.issue === 'in_progress')) {
          mountHistory(item, id);
        }
        restoreDiveQueryFocus(item, id);
      }
      syncDutyFab(rows);
    });
  });
  syncDutyFab(rows);
  root.querySelectorAll('button[data-hist]').forEach(btn => {
    btn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const id = btn.dataset.hist;
      const idx = Number(root.querySelector(`tr.row[data-id="${id}"]`)?.dataset.idx);
      const item = rows[idx];
      if (item) mountHistory(item, id);
    });
  });
  function bindQPicks(scope) {
    (scope || root).querySelectorAll('button[data-qpick]').forEach(btn => {
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const id = btn.dataset.qpick;
        const test = btn.dataset.test;
        const idx = Number(root.querySelector(`tr.row[data-id="${id}"]`)?.dataset.idx);
        const item = rows[idx];
        if (item && test) mountQueryHistory(item, id, test);
      });
    });
  }
  bindQPicks(root);
  root.querySelectorAll('[data-run-card]').forEach(card => {
    card.addEventListener('click', (ev) => {
      if (ev.target.closest('a')) return;
      ev.stopPropagation();
      const id = card.dataset.runCard;
      const ri = Number(card.dataset.runIdx);
      const idx = Number(root.querySelector(`tr.row[data-id="${id}"]`)?.dataset.idx);
      const item = rows[idx];
      if (!item || !Number.isFinite(ri)) return;
      const data = diveData(item);
      const runs = data.now_runs || [];
      const run = runs[ri];
      // TPC-C parity: cards ↔ heatmap compare. Now always stays on latest.
      if (ri === runs.length - 1 || !run) {
        setCompareId(item.branch, item.db, '');
        diveRunFocus[suiteKey(item)] = runs.length - 1;
      } else if (run.ci_version) {
        setCompareId(item.branch, item.db, run.ci_version);
        clearDiveFocusForDb(item.branch, item.db);
      } else {
        diveRunFocus[suiteKey(item)] = ri;
      }
      const openKeys = [...root.querySelectorAll('tr.row.open')].map(tr => {
        const i = Number(tr.dataset.idx);
        return rows[i] ? suiteKey(rows[i]) : null;
      }).filter(Boolean);
      destroyCharts();
      renderAll();
      const curRows = filteredInboxOrDrill();
      curRows.forEach((r, i) => {
        if (!openKeys.includes(suiteKey(r))) return;
        const diveId = 'dive_' + i;
        const tr = document.querySelector(`#inbox tr.row[data-id="${diveId}"]`);
        const detail = document.querySelector(`#inbox tr.detail[data-detail="${diveId}"]`);
        if (tr && detail) {
          tr.classList.add('open');
          detail.classList.remove('hidden');
        }
        restoreDiveQueryFocus(r, diveId);
      });
      syncDutyFab(curRows);
    });
  });
}

function renderAll() {
  clearLiveViewCache();
  renderHeader();
  renderHeatmap();
  renderInbox();
}

function setupDateBar() {
  const fromEl = document.getElementById('winFrom');
  const toEl = document.getElementById('winTo');
  fromEl.value = winFrom || UI.default_from || '';
  toEl.value = winTo || UI.default_to || '';
  if (UI.default_from) {
    fromEl.min = UI.default_from;
    toEl.min = UI.default_from;
  }
  if (UI.default_to) {
    fromEl.max = UI.default_to;
    toEl.max = UI.default_to;
  }
  document.getElementById('winApply').addEventListener('click', () => {
    let a = fromEl.value || null;
    let b = toEl.value || null;
    if (a && b && a > b) { const t = a; a = b; b = t; }
    winFrom = a;
    winTo = b;
    fromEl.value = winFrom || '';
    toEl.value = winTo || '';
    destroyCharts();
    renderAll();
  });
  document.getElementById('winReset').addEventListener('click', () => {
    winFrom = UI.default_from || null;
    winTo = UI.default_to || null;
    fromEl.value = winFrom || '';
    toEl.value = winTo || '';
    destroyCharts();
    renderAll();
  });
  [fromEl, toEl].forEach(el => {
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') document.getElementById('winApply').click();
    });
  });
}

function setupFilters() {
  const ui = DATA.ui || {};
  const branches = uiBranches();
  const def = ui.default_branch || 'main';

    `<option value="">all</option>` +
    branches.map(b => `<option value="${esc(b)}"${b === def ? ' selected' : ''}>${esc(b)}</option>`).join('');

  const fams = [...new Set((DATA.inbox || []).map(r => r.family).filter(Boolean))].sort();
  document.getElementById('fFam').innerHTML = '<option value="">all</option>' +
    fams.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  refreshDbFilter();
  setupDateBar();
  syncReactButtons();
  syncWaveButtons();
  document.querySelectorAll('#reactBar .react-btn').forEach(btn => {
    btn.addEventListener('click', () => setReact(btn.dataset.react));
  });
  document.querySelectorAll('#waveBar .wave-btn').forEach(btn => {

      if (id === 'fBranch' || id === 'fIssue') refreshDbFilter();
      renderAll();
    });
  });
}

function refreshDbFilter() {
  const br = selectedBranch();
  const keep = document.getElementById('fDb').value;
  const issue = document.getElementById('fIssue')?.value || '';
  const pool = inboxPool(issue);
  const dbs = br
    ? dbsForBranch(br)
    : [...new Set(pool.map(r => r.db).filter(Boolean))].sort();
  document.getElementById('fDb').innerHTML = '<option value="">all</option>' +
    dbs.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  if (dbs.includes(keep)) document.getElementById('fDb').value = keep;
}

setupFilters();
document.getElementById('dutyFabSave')?.addEventListener('click', () => dutyFabAction('save'));
document.getElementById('dutyFabCopy')?.addEventListener('click', () => dutyFabAction('copy'));
renderAll();
</script>
</body>
</html>
