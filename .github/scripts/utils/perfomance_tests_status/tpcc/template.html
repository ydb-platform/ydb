<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TPC-C Now</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23bc4c00'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='14' font-weight='800' fill='white'%3ETC%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #d0d7de; --text: #1f2328;
    --muted: #656d76; --bad: #cf222e; --warn: #bf8700; --ok: #1a7f37; --info: #0969da;
    --broken: #a40e26; --broken-bg: #ffd7d5;
    --regress: #bc4c00; --regress-bg: #fff1e5;
    --miss: #8250df; --miss-bg: #fbefff;
  }
  * { box-sizing: border-box; }
  html { max-width: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.4;
    max-width: 100%; overflow-x: hidden; /* page never grows; panes scroll inside */
  }
  .wrap {
    max-width: 1400px; width: 100%; margin: 0 auto; padding: 14px 14px 48px;
    min-width: 0;
  }
  h1 { font-size: 20px; margin: 0 0 2px; }
  h2 { font-size: 15px; margin: 16px 0 8px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .note {
    background: #ddf4ff; border: 1px solid #54aeff66; border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: #0550ae; margin: 0 0 8px;
  }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
    border-radius: 999px; text-transform: uppercase; white-space: nowrap;
  }
  .badge.broken { background: var(--broken-bg); color: var(--broken); }
  .badge.missing { background: var(--miss-bg); color: var(--miss); }
  .badge.regression, .badge.both, .badge.lat, .badge.tpmc { background: var(--regress-bg); color: var(--regress); }
  .badge.lat_tpmc { background: var(--regress-bg); color: var(--regress); }
  .badge.stale, .badge.watch { background: #fff8c5; color: var(--warn); }
  .badge.in_progress { background: #ddf4ff; color: var(--info); }
  .badge.ok { background: #dafbe1; color: var(--ok); }
  .pill {
    display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px;
    background: #eaeef2; color: var(--muted); font-weight: 600;
  }
  a.pill.ticket {
    display: inline-block; background: #ddf4ff; color: #0969da; text-decoration: none;
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    vertical-align: middle; margin: 2px 2px 0 0;
  }
  a.pill.ticket:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #0969da66; }
  a.pill.ticket.closed {
    background: #f6f8fa; color: #656d76; box-shadow: inset 0 0 0 1px #d0d7de;
  }
  a.pill.ticket.closed:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #8c959f66; }
  a.pill.ticket.wait-next {
    background: #ddf4ff; color: #0550ae; box-shadow: inset 0 0 0 1px #0969da44;
  }
  a.pill.ticket.wait-next:hover { filter: brightness(0.97); box-shadow: inset 0 0 0 1px #0969da66; }
  .counters {
    display: flex; flex-wrap: nowrap; gap: 10px; margin: 0 0 16px;
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .counter {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; flex: 1 1 0; min-width: 96px;
  }
  .counter .n {
    font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1.1; white-space: nowrap;
  }
  .counter .n .sel { font-size: 0.85em; opacity: .85; }
  .counter .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .03em; }
  .counter.hot .n { color: var(--broken); }
  .counter.regress .n { color: var(--regress); }
  .counter.miss .n { color: var(--miss); }
  .counter.info .n { color: var(--info); }
  .counter.warn .n { color: var(--warn); }
  .counter.ok .n { color: var(--ok); }

  .heat-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    max-width: 100%; min-width: 0; margin-bottom: 18px;
    overflow-x: auto; overflow-y: visible; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  table.heat {
    border-collapse: collapse; width: max-content; min-width: 100%; font-size: 12px;
  }
  table.heat th, table.heat td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
  table.heat th:first-child, table.heat td:first-child {
    text-align: left; position: sticky; left: 0; z-index: 2;
    background: #fafbfc; box-shadow: 1px 0 0 var(--border);
  }
  table.heat th { color: var(--muted); font-weight: 600; background: #fafbfc; }
  .cell {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-width: 72px; padding: 6px 8px; border-radius: 8px; font-weight: 650; cursor: default;
  }
  .cell.ok { background: #dafbe1; color: var(--ok); cursor: pointer; }
  .cell.broken { background: var(--broken-bg); color: var(--broken); cursor: pointer; box-shadow: inset 0 0 0 1px #ff818266; }
  .cell.regression, .cell.lat, .cell.tpmc, .cell.both {
    background: var(--regress-bg); color: var(--regress); cursor: pointer;
  }
  .cell.missing { background: var(--miss-bg); color: var(--miss); cursor: pointer; }
  .cell.stale, .cell.watch { background: #fff8c5; color: var(--warn); cursor: pointer; }
  .cell.in_progress { background: #ddf4ff; color: var(--info); cursor: pointer; }
  .cell.nodata { background: #f6f8fa; color: #656d76; cursor: pointer; }
  /* compare deltas: 40% was · 20% blend · 40% now */
  .cell.delta-worse {
    /* ok → bad */
    background: linear-gradient(90deg, #dafbe1 0%, #dafbe1 40%, #ffebe9 60%, #ffebe9 100%);
    color: var(--bad); cursor: pointer;
  }
  .cell.delta-worse-hot {
    /* already bad → worse (lat/tpmC grew further): light red → dark red */
    background: linear-gradient(90deg, #ffebe9 0%, #ffebe9 40%, #ffcecb 60%, #ff8182 100%);
    color: var(--broken); cursor: pointer;
    box-shadow: inset 0 0 0 1px #ff818266;
  }
  .cell.delta-better {
    background: linear-gradient(90deg, #ffebe9 0%, #ffebe9 40%, #dafbe1 60%, #dafbe1 100%);
    color: #1a7f37; cursor: pointer;
  }
  .cell.delta-mixed {
    background: linear-gradient(90deg, #fff8c5 0%, #fff8c5 40%, #ddf4ff 60%, #ddf4ff 100%);
    color: #9a6700; cursor: pointer;
  }
  .cell.delta-same { background: #f6f8fa; color: var(--muted); cursor: pointer; }
  .cell.selected { outline: 2px solid var(--info); outline-offset: 2px; box-shadow: 0 0 0 3px #0969da33; }
  .cell .cnt { font-size: 11px; opacity: .85; }
  .cmp-cell { text-align: left; vertical-align: middle; min-width: 200px; }
  .cmp-cell select {
    max-width: 280px; width: 100%; padding: 4px 6px; font: inherit; font-size: 11px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  .heat-legend {
    display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 8px 12px 12px;
    font-size: 11px; color: var(--muted);
  }
  .heat-legend .swatch { display: inline-flex; align-items: center; gap: 6px; }
  .heat-legend .dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

  .filters {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin: 0;
    background: transparent; border: 0; border-radius: 0; padding: 0;
  }
  label { display: grid; gap: 2px; font-size: 10px; color: var(--muted); }
  select, input[type="date"] {
    min-width: 110px; padding: 4px 6px; border: 1px solid var(--border);
    border-radius: 5px; background: #fff; font: inherit; font-size: 12px;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; }
  .toolbar button, .btn {
    border: 1px solid var(--border); background: var(--panel); border-radius: 5px;
    padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer;
  }
  .toolbar button:hover, .btn:hover { border-color: var(--info); color: var(--info); }
  .top-filters {
    display: flex; flex-wrap: nowrap; align-items: center; gap: 8px 10px;
    margin: 0 0 12px; padding: 6px 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .top-filters .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
  .top-filters .sep { width: 1px; height: 22px; background: var(--border); flex: 0 0 auto; }
  .top-filters .wave-btn { padding: 3px 8px; font-size: 11px; border-radius: 999px; }
  .top-filters .filters { flex-wrap: nowrap; align-items: center; gap: 6px; }
  .top-filters label { display: flex; flex-direction: row; align-items: center; gap: 4px; white-space: nowrap; }
  .top-filters select, .top-filters input[type="date"] { min-width: 0; }
  .inbox-filters { margin: 0 0 8px; }

  #inbox {
    max-width: 100%; min-width: 0;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  }
  table.inbox {
    width: 100%; border-collapse: collapse; font-size: 13px;
    background: transparent; border: 0;
    table-layout: auto;
  }
  table.inbox th {
    text-align: left; font-size: 11px; color: var(--muted); font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border); background: #fafbfc;
  }
  table.inbox td {
    padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top;
    font-variant-numeric: tabular-nums;
  }
  table.inbox tr:last-child td { border-bottom: 0; }
  table.inbox tr.row { cursor: pointer; }
  table.inbox tr.row:hover { filter: brightness(0.985); }
  table.inbox tr.row.open { background: #f6f8fa; }
  table.inbox tr.detail td {
    background: #f6f8fa; padding: 12px 14px;
    /* Keep dive/charts inside the visible inbox width (not clipped by page). */
    max-width: 0; /* colspan cell inherits table width */
    overflow-x: auto;
  }
  table.inbox tr.detail.hidden { display: none; }
  .cluster { font-weight: 700; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--info); }
  .muted { color: var(--muted); font-size: 12px; }
  .bad { color: var(--bad); }
  .okish { color: var(--ok); }
  .num { text-align: right; }
  .mcell { min-width: 132px; text-align: left; line-height: 1.25; }
  .mcell .big {
    font-size: 17px; font-weight: 750; font-variant-numeric: tabular-nums; color: var(--text);
  }
  .mcell .big.bad { color: var(--bad); }
  .mcell .big.muted { color: var(--muted); }
  .mcell .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mcell .delta { margin-top: 4px; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mcell .delta.bad { color: var(--bad); }
  .mcell .delta.good { color: var(--ok); }

  .dive { display: grid; gap: 12px; min-width: 0; max-width: 100%; }
  .runs {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 5px;
  }
  .run-card {
    background: #fff; border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 6px; font-size: 10px; line-height: 1.25; min-width: 0;
    cursor: pointer; transition: box-shadow .12s, border-color .12s;
  }
  .run-card:hover { border-color: var(--info); }
  .run-card.active { border-color: var(--info); box-shadow: 0 0 0 2px #0969da33; background: #f6f8fa; }
  .run-card.cmp { border-color: #9a6700; box-shadow: 0 0 0 2px #9a670033; }
  .run-card .t {
    font-weight: 650; margin-bottom: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .run-card .muted { font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart-box {
    height: 260px; min-width: 0; max-width: 100%;
    background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  }
  .chart-box canvas { max-width: 100% !important; }
  .pair {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;
    min-width: 0; width: 100%;
  }
  @media (max-width: 900px) { .pair { grid-template-columns: 1fr; } }
  .empty { color: var(--muted); padding: 16px; text-align: center; }
  a { color: var(--info); }
  .wave-btn {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 12px; font-weight: 650;
    cursor: pointer; white-space: nowrap;
  }
  .wave-btn[aria-pressed="true"] { color: #fff; border-color: transparent; background: var(--info); }
  .wave-btn:hover { filter: brightness(0.97); }
  .counter.info .n { color: var(--info); }
  .badge.ok { background: #dafbe1; color: var(--ok); }

  /* Floating Save / Copy context — visible when a dive row is open */
  .duty-fab-wrap {
    position: fixed; right: 20px; bottom: 20px; z-index: 1200;
    display: none; flex-direction: column-reverse; align-items: flex-end; gap: 12px;
  }
  .duty-fab-wrap.visible { display: flex; }
  .duty-fab {
    width: 68px; height: 68px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(145deg, #e5534b 0%, #a40e26 100%);
    color: #fff; cursor: pointer;
    box-shadow: 0 8px 28px #cf222e88, 0 2px 8px #0004;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .duty-fab:hover { transform: scale(1.08); filter: brightness(1.06); }
  .duty-fab:active { transform: scale(0.96); }
  .duty-fab svg { width: 34px; height: 34px; display: block; }
  .duty-fab-copy {
    width: 48px; height: 48px; border-width: 2px;
    background: linear-gradient(145deg, #54aeff 0%, #0969da 100%);
    box-shadow: 0 6px 18px #0969da66, 0 2px 6px #0003;
  }
  .duty-fab-copy svg { width: 22px; height: 22px; }
  .duty-fab-toast {
    position: absolute; right: 80px; bottom: 18px;
    background: #24292f; color: #fff; font-size: 13px; font-weight: 650;
    padding: 8px 12px; border-radius: 8px; white-space: nowrap;
    box-shadow: 0 4px 16px #0004; pointer-events: none;
  }
  .duty-fab-toast.fail { background: #a40e26; }
  .duty-fab-hint {
    position: absolute; right: 80px; bottom: 52px;
    background: #fff; color: var(--text); font-size: 12px; font-weight: 650;
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    box-shadow: 0 4px 14px #0002; white-space: nowrap; pointer-events: none;
  }

  /* Mobile: keep wide tables inside scroll panes; do not grow the page width. */
  @media (max-width: 720px) {
    .wrap { padding: 10px 8px 80px; }
    h1 { font-size: 18px; }
    .note { font-size: 11px; }
    .cell { min-width: 56px; padding: 4px 6px; gap: 4px; font-size: 11px; }
    .cmp-cell { min-width: 140px; }
    .cmp-cell select { max-width: 160px; }
    .mcell { min-width: 96px; }
    table.heat { font-size: 11px; }
    table.heat th, table.heat td { padding: 6px; }
    table.inbox { font-size: 12px; }
    table.inbox th, table.inbox td { padding: 8px; }
    table.inbox th:nth-child(n+4),
    table.inbox tr.row td:nth-child(n+4) { display: none; }
    table.inbox tr.detail td { padding: 10px; }
    .filters { gap: 6px; }
    .filters label { min-width: 0; }
    .filters select { min-width: 0; max-width: 100%; }
    .duty-fab-wrap { right: 12px; bottom: 12px; gap: 8px; }
    .duty-fab { width: 56px; height: 56px; }
    .duty-fab svg { width: 28px; height: 28px; }
    .duty-fab-copy { width: 44px; height: 44px; }
    .duty-fab-hint, .duty-fab-toast { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>TPC-C Now</h1>
  <div class="sub" id="subtitle"></div>

  <div class="top-filters" id="topFilters">
    <span class="lbl">Wave</span>
    <span id="waveBar" style="display:inline-flex;gap:4px">
      <button type="button" class="wave-btn" data-wave="finished" aria-pressed="true" title="данные последнего завершённого">finished</button>
      <button type="button" class="wave-btn" data-wave="all" aria-pressed="false" title="latest в т.ч. in progress">all</button>
    </span>
    <span class="sep"></span>
    <div class="filters" id="branchBar">
      <label>Branch <select id="fBranch"></select></label>
      <label>From <input type="date" id="winFrom" /></label>
      <label>To <input type="date" id="winTo" /></label>
      <div class="toolbar">
        <button type="button" id="winApply">Apply</button>
        <button type="button" id="winReset">Reset</button>
      </div>
    </div>
  </div>

  <div class="counters" id="counters"></div>

  <h2>Heatmap · Cluster × run_type</h2>
  <div class="heat-wrap">
    <div class="heat-legend">
      <span class="swatch"><span class="dot" style="background:#ffd7d5;box-shadow:inset 0 0 0 1px #a40e26"></span>broken · lat cap / outlier</span>
      <span class="swatch"><span class="dot" style="background:#fff1e5;box-shadow:inset 0 0 0 1px #bc4c00"></span>lat↑ / tpmC↓ · с Δ%</span>
      <span class="swatch"><span class="dot" style="background:#fbefff;box-shadow:inset 0 0 0 1px #8250df"></span>missing</span>
      <span class="swatch"><span class="dot" style="background:#fff8c5;box-shadow:inset 0 0 0 1px #bf8700"></span>stale</span>
      <span class="swatch"><span class="dot" style="background:#ddf4ff;box-shadow:inset 0 0 0 1px #0969da"></span>in progress</span>
      <span class="swatch"><span class="dot" style="background:#dafbe1;box-shadow:inset 0 0 0 1px #1a7f37"></span>ok</span>
      <span class="swatch"><span class="dot" style="background:#f6f8fa;box-shadow:inset 0 0 0 1px #d0d7de"></span>no data</span>
      <span class="swatch"><span class="dot" style="background:linear-gradient(90deg,#dafbe1 0%,#dafbe1 40%,#ffebe9 60%,#ffebe9 100%);box-shadow:inset 0 0 0 1px #cf222e"></span>compare worse (ok→bad)</span>
      <span class="swatch"><span class="dot" style="background:linear-gradient(90deg,#ffebe9 0%,#ffebe9 40%,#ffcecb 60%,#ff8182 100%);box-shadow:inset 0 0 0 1px #a40e26"></span>compare worse (bad→worse)</span>
      <span class="swatch"><span class="dot" style="background:linear-gradient(90deg,#fff8c5 0%,#fff8c5 40%,#ddf4ff 60%,#ddf4ff 100%);box-shadow:inset 0 0 0 1px #9a6700"></span>compare mixed (lat↔tpmC)</span>
      <span class="swatch"><span class="dot" style="background:linear-gradient(90deg,#ffebe9 0%,#ffebe9 40%,#dafbe1 60%,#dafbe1 100%);box-shadow:inset 0 0 0 1px #1a7f37"></span>compare better</span>
    </div>
    <div id="heatmap"></div>
  </div>

  <h2>Inbox</h2>
  <div class="filters inbox-filters">
    <label>Issue
      <select id="fIssue">
        <option value="">all hot</option>
        <option value="ok">ok / watch</option>
        <option value="missing">missing</option>
        <option value="in_progress">in progress</option>
        <option value="broken">broken</option>
        <option value="lat">lat↑</option>
        <option value="tpmc">tpmC↓</option>
        <option value="both">lat+tpmc</option>
        <option value="stale">stale</option>
      </select>
    </label>
    <label>Cluster
      <select id="fDb"><option value="">all</option></select>
    </label>
    <label>Run type
      <select id="fFam"><option value="">all</option></select>
    </label>
  </div>
  <div id="inbox"></div>
</div>

<div id="dutyFab" class="duty-fab-wrap" aria-hidden="true">
  <span class="duty-fab-hint">Save context</span>
  <span class="duty-fab-toast" hidden></span>
  <button type="button" class="duty-fab" id="dutyFabSave"
    title="Save context — скачать JSON инцидента для duty_agent"
    aria-label="Save context">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path fill="currentColor" d="M8 6h24l8 8v28H8V6z"/>
      <path fill="#fff" d="M14 6h16v13H14z" opacity=".95"/>
      <path fill="#fff" d="M14 30h20v10H14z" opacity=".92"/>
      <circle cx="36" cy="14" r="11" fill="#fff"/>
      <path fill="#a40e26" d="M36 6.5l8.5 15h-17L36 6.5z"/>
      <rect x="34.6" y="12" width="2.8" height="5.5" rx="1" fill="#fff"/>
      <rect x="34.6" y="19" width="2.8" height="2.4" rx="1" fill="#fff"/>
    </svg>
  </button>
  <button type="button" class="duty-fab duty-fab-copy" id="dutyFabCopy"
    title="Copy context — скопировать JSON в буфер"
    aria-label="Copy context">

    : (item.history_by_commit || item.history || {});
  const histRun = sliceHist(srcRun);
  const histCommit = sliceHist(srcCommit);
  const box = document.getElementById(id + '_hist');
  if (!box) return;
  if (!(histRun.labels || []).length && !(histCommit.labels || []).length) {
    box.innerHTML = '<div class="empty">Нет истории в выбранном интервале дат</div>';
    return;
  }
  const win = (DATA.ui && DATA.ui.baseline_runs) || 7;
  const dm = resolveDisplayMetrics(item);
  const tpmcBase = dm.tpmc_base;
  const latBase = dm.lat_base;
  const baseMode = dm.mode;
  const baseStroke = baseMode === 'compare' ? '#9a6700' : '#0969da';
  const baseTitle = baseMode === 'compare'
    ? `compare baseline (${dm.cmp_day})`
    : `alert baseline (median prev${win})`;
  const dashUrl = datalensUrl(item);
  const cmpId = getCompareId(item.branch, item.db);
  const cmpWave = cmpId ? waveEntry(item.branch, item.db, cmpId) : null;
  let showBase = true;
  const deltaBits = [];
  if (dm.lat_pct != null) deltaBits.push(`lat ${fmt(dm.lat_base)} → ${fmt(dm.lat_now)}&nbsp;ms (${pct(dm.lat_pct)})`);
  if (dm.tpmc_pct != null) deltaBits.push(`tpmC ${fmt(dm.tpmc_base)} → ${fmt(dm.tpmc_now)} (${pct(dm.tpmc_pct)})`);
  box.innerHTML = `
  <label class="muted" style="display:inline-flex;gap:6px;align-items:center;margin-bottom:8px;cursor:pointer">
    <input type="checkbox" id="${id}_base" checked /> показать ${esc(baseTitle)}
  </label>
  ${deltaBits.length ? `<div class="muted" style="margin:0 0 8px;font-weight:650;color:${baseMode === 'compare' ? '#9a6700' : 'inherit'}">${baseMode === 'compare' ? 'Δ vs compare' : 'Δ vs alert'}: ${deltaBits.join(' · ')}</div>` : ''}
  <div class="muted" style="margin:8px 0 4px;font-weight:650">X = дата запуска</div>
  <div class="pair">
    <div class="chart-box" style="cursor:pointer"><canvas id="${id}_run_tpmc"></canvas></div>
    <div class="chart-box" style="cursor:pointer"><canvas id="${id}_run_lat"></canvas></div>
  </div>
  <div class="muted" style="margin:14px 0 4px;font-weight:650">X = дата коммита (git_commit_timestamp)</div>
  <div class="pair">
    <div class="chart-box" style="cursor:pointer"><canvas id="${id}_cmt_tpmc"></canvas></div>
    <div class="chart-box" style="cursor:pointer"><canvas id="${id}_cmt_lat"></canvas></div>
  </div>
  <div class="muted" style="margin-top:6px">
    Сырые прогоны · цвет vs median mavg(prev${win}) · тёмно-красный = lat cap ·
    синий = synthetic in_progress · оранжевый = synthetic missing ·
    <b>тёмная рамка</b> = now · <b>оранжевая</b> = все прогоны compare-дня ·
    <b>клик по столбцу → Allure report</b> (если есть; иначе DataLens)
    ${dashUrl ? ` · <a href="${esc(dashUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">DataLens</a>` : ''}
    ${(tpmcBase != null || latBase != null)
      ? ` · ${esc(baseTitle)}: tpmC ${fmt(tpmcBase)} · lat ${fmt(latBase)}&nbsp;ms`
      : ''}
  </div>`;

  function paint() {
    destroyCharts(id + '_');
    const cmpDay = cmpWave ? (cmpWave.day || cmpWave.id || cmpWave.ci_version || '') : '';
    // All run-date bars of the selected day (= cmp cards); numeric baseline still preferUsable.
    const runCmpDayIdxs = (cmpWave && cmpDay) ? histIndicesForDay(histRun, cmpDay) : [];
    const runCmpVers = new Set(
      runCmpDayIdxs.map(i => String((histRun.versions || [])[i] || '').slice(0, 8)).filter(Boolean)
    );
    function markIndices(hist) {
      const nowIdx = (hist.labels || []).length ? (hist.labels.length - 1) : -1;
      let compareIdxs = [];
      if (cmpWave && cmpDay) {
        if (hist === histRun) {
          compareIdxs = runCmpDayIdxs.slice();
        } else {
          // Same SHAs as run-date cmp cards (not "every commit that calendar day").
          const vers = hist.versions || [];
          for (let i = 0; i < vers.length; i++) {
            const v = String(vers[i] || '').slice(0, 8);
            if (v && runCmpVers.has(v)) compareIdxs.push(i);
          }
          if (!compareIdxs.length) compareIdxs = histIndicesForDay(hist, cmpDay);
        }
      }
      return { now: nowIdx, compareIdxs };
    }
    function bar(cid, hist, vals, label, colors, alertBase, unit) {
      const el = document.getElementById(cid);
      if (!el) return;
      if (!(hist.labels || []).length) {
        el.parentElement.innerHTML = '<div class="empty">нет точек</div>';
        return;
      }
      const markers = hist.markers || [];
      const marks = markIndices(hist);
      const cmpSet = new Set(marks.compareIdxs || []);
      const nBars = (hist.labels || []).length;
      const valueFont = nBars > 24 ? '8px sans-serif' : (nBars > 14 ? '9px sans-serif' : '10px sans-serif');
      const unitSuffix = unit ? ` ${unit}` : '';
      const fmtU = (v) => (v == null || Number.isNaN(v)) ? '—' : `${fmt(v)}${unitSuffix}`;
      // Keep status fill; now = dark border, all compare-day bars = orange.
      const bg = colors;
      const borderColors = (hist.labels || []).map((_, i) => (
        i === marks.now ? '#1f2328' : (cmpSet.has(i) ? '#9a6700' : 'transparent')
      ));
      const borderWidths = (hist.labels || []).map((_, i) => (
        (i === marks.now || cmpSet.has(i)) ? 3 : 0
      ));
      charts[cid] = new Chart(el, {
        type: 'bar',
        data: {
          labels: hist.labels,
          datasets: [{
            data: vals,
            backgroundColor: bg,
            borderColor: borderColors,
            borderWidth: borderWidths,
            borderSkipped: false,
            barPercentage: 0.9,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          layout: { padding: { top: 18 } },
          onClick: (_e, els) => {
            if (!els.length) return;
            openHistReport(hist, els[0].index, item);
          },
          plugins: {
            legend: { display: false },
            title: { display: true, text: label, color: '#656d76', font: { size: 12 } },
            tooltip: {
              callbacks: {
                label: (it) => {
                  const v = it.raw;
                  return v == null ? '—' : fmtU(v);
                },
                afterLabel: (it) => {
                  const bits = [];
                  const i = it.dataIndex;
                  if (i === marks.now) bits.push('now');
                  if (cmpSet.has(i)) bits.push('compare day');
                  const m = markers[i];
                  if (m === 'in_progress') bits.push('SYNTHETIC · day-wave in progress');
                  else if (m === 'missing') bits.push('SYNTHETIC · missing in completed wave');
                  else if (m === 'capped') bits.push('lat capped');
                  const ver = (hist.versions || [])[i];
                  if (ver) bits.push(`sha ${ver}`);
                  bits.push((hist.reports && hist.reports[i]) ? 'клик → report' : 'клик → DataLens');
                  const cur = vals[i];
                  const start = Math.max(0, i - win);
                  const ref = medianOf(vals.slice(start, i));
                  if (cur != null && ref != null && ref > 0) {
                    bits.push(`vs median mavg(${win} runs) ${pct(((cur - ref) / ref) * 100)} (ref ${fmtU(ref)})`);
                  }
                  if (showBase && alertBase != null) {
                    bits.push(`${baseTitle} ${fmtU(alertBase)}`);
                  }
                  return bits.join(' · ');
                }
              }
            }
          },
          scales: {
            x: { ticks: { maxRotation: 60, font: { size: 9 }, color: '#656d76' }, grid: { display: false } },
            y: {
              beginAtZero: true,
              grace: '18%',
              ticks: { color: '#656d76' },
              grid: { color: 'rgba(0,0,0,.06)' },
              title: unit ? { display: true, text: unit, color: '#656d76', font: { size: 11 } } : undefined,
            }
          }
        },
        plugins: [{
          id: 'tpccbase',
          afterDraw(chart) {
            if (!showBase || alertBase == null) return;
            const y = chart.scales.y.getPixelForValue(alertBase);
            const { left, right, top, bottom } = chart.chartArea;
            if (y < top || y > bottom) return;
            const ctx = chart.ctx;
            ctx.save();
            ctx.beginPath(); ctx.setLineDash([4, 3]); ctx.strokeStyle = baseStroke; ctx.lineWidth = 1;
            ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
            ctx.fillStyle = baseStroke; ctx.font = '10px sans-serif';
            ctx.fillText(`${baseTitle} ${fmtU(alertBase)}`, left + 4, Math.max(top + 10, y - 4));
            ctx.restore();
          }
        }, {
          id: 'barValueLabels',
          afterDatasetsDraw(chart) {
            const meta = chart.getDatasetMeta(0);
            if (!meta || !meta.data) return;
            const { top } = chart.chartArea;
            const ctx = chart.ctx;
            ctx.save();
            ctx.fillStyle = '#1f2328';
            ctx.font = valueFont;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            meta.data.forEach((bar, i) => {
              const v = vals[i];
              if (v == null || !Number.isFinite(Number(v))) return;
              const text = unit ? `${fmt(v)}${unit}` : fmt(v);
              const x = bar.x;
              let y = bar.y - 3;
              if (y < top + 10) y = top + 10;
              ctx.fillText(text, x, y);
            });
            ctx.restore();
          }
        }]
      });
    }
    function markColors(hist, colors) {
      const markers = hist.markers || [];
      return colors.map((c, i) => {
        const m = markers[i];
        if (m === 'in_progress') return '#54aeff';
        if (m === 'missing') return '#fb8500';
        if (m === 'capped') return '#8a1f1a';
        return c;
      });
    }
    if ((histRun.labels || []).length) {
      bar(id + '_run_tpmc', histRun, histRun.tpmc || [], 'tpmC · by run date (↑ better)',
        markColors(histRun, colorsTpmcVsMavg(histRun.tpmc)), tpmcBase, '');
      bar(id + '_run_lat', histRun, histRun.lat90 || [], 'NewOrder p90 · by run date (↓ better)',
        markColors(histRun, colorsLatVsMavg(histRun.lat90)), latBase, 'ms');
    }
    if ((histCommit.labels || []).length) {
      bar(id + '_cmt_tpmc', histCommit, histCommit.tpmc || [], 'tpmC · by commit date (↑ better)',
        markColors(histCommit, colorsTpmcVsMavg(histCommit.tpmc)), tpmcBase, '');
      bar(id + '_cmt_lat', histCommit, histCommit.lat90 || [], 'NewOrder p90 · by commit date (↓ better)',
        markColors(histCommit, colorsLatVsMavg(histCommit.lat90)), latBase, 'ms');
    }
  }

  const chk = document.getElementById(id + '_base');
  if (chk) {
    chk.addEventListener('change', () => { showBase = chk.checked; paint(); });
  }
  paint();
}
/** Compact history for duty context (day-grain). */
function compactHist(hist, maxPts) {
  if (!hist || !hist.labels) return null;
  const n = hist.labels.length;
  const start = Math.max(0, n - (maxPts || 24));
  const slice = (arr) => (arr || []).slice(start);
  return {
    mode: hist.mode || null,
    labels: slice(hist.labels),
    lat90: slice(hist.lat90),
    tpmc: slice(hist.tpmc),
    versions: slice(hist.versions),
    days: slice(hist.days),
    reports: slice(hist.reports),
    nodata: slice(hist.nodata),
  };
}

function dutyReportMeta(kind) {
  const ui = DATA.ui || {};
  let url = null;
  try { url = (location && location.href) ? location.href.split('#')[0] : null; } catch (_) {}
  return {
    kind,
    url,
    window: [ui.default_from || null, ui.default_to || null],
    generated_at: DATA.generated_at || null,
    source: DATA.source || null,
  };
}

function downloadDutyJson(filename, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copyDutyJson(obj) {
  const text = JSON.stringify(obj, null, 2);
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (_) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }
}

function flashDutyBtn(btn, okMsg, failMsg, ok) {
  const wrap = document.getElementById('dutyFab');
  const toast = wrap && wrap.querySelector('.duty-fab-toast');
  if (toast) {
    toast.textContent = ok ? okMsg : failMsg;
    toast.hidden = false;
    toast.classList.toggle('fail', !ok);
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.hidden = true; }, 1800);
    return;
  }
  const prev = btn.textContent;
  btn.textContent = ok ? okMsg : failMsg;
  setTimeout(() => { btn.textContent = prev; }, 1600);
}

let dutyFabRows = [];
function syncDutyFab(rows) {
  if (rows) dutyFabRows = rows;
  const wrap = document.getElementById('dutyFab');
  if (!wrap) return;
  const open = document.querySelector('#inbox tr.row.open');
  const on = !!open;
  wrap.classList.toggle('visible', on);
  wrap.setAttribute('aria-hidden', on ? 'false' : 'true');
  if (open) wrap.dataset.openId = open.dataset.id || '';
  else delete wrap.dataset.openId;
}
async function dutyFabAction(mode) {
  const wrap = document.getElementById('dutyFab');
  const id = wrap && wrap.dataset.openId;
  if (!id) return;
  const idx = Number(document.querySelector(`#inbox tr.row[data-id="${id}"]`)?.dataset.idx);
  const item = dutyFabRows[idx];
  if (!item) return;
  const pack = buildDutyContext(item, id);
  const sel = pack.selection || {};
  const sha = (sel.focus_run && (sel.focus_run.sha || sel.focus_run.day || sel.focus_run.label)) || 'run';
  const fname = `perf-duty-tpcc-${dutySafeName(sel.suite)}-${dutySafeName(sha)}.json`;
  const btn = document.getElementById(mode === 'save' ? 'dutyFabSave' : 'dutyFabCopy');
  if (mode === 'save') {
    downloadDutyJson(fname, pack);
    flashDutyBtn(btn, 'Saved ✓', 'Save failed', true);
  } else {
    const ok = await copyDutyJson(pack);
    flashDutyBtn(btn, ok ? 'Copied ✓' : 'Copy failed', 'Copy failed', ok);
  }
}

function dutySafeName(s) {
  return String(s || 'suite').replace(/[^\w.\-]+/g, '_').slice(0, 80);
}

/** Frozen incident pack for duty_agent (schema perf-duty-context/v1). */

    .map(b => b.dataset.react).filter(Boolean);

  return {
    schema: 'perf-duty-context/v1',

    report: dutyReportMeta('tpcc'),
    selection: {
      branch: item.branch || null,

        report: focusRun.report || data.report || item.report || null,
      } : null,
    },
    suite_now: {
      issue: item.issue || null,
      status: item.status || null,
      kind: item.kind || null,
      lat_now: dm.lat_now != null ? dm.lat_now : item.lat_now,
      lat_base: dm.lat_base != null ? dm.lat_base : item.lat_base,
      lat_pct: dm.lat_pct != null ? dm.lat_pct : item.lat_pct,
      tpmc_now: dm.tpmc_now != null ? dm.tpmc_now : item.tpmc_now,
      tpmc_base: dm.tpmc_base != null ? dm.tpmc_base : item.tpmc_base,
      tpmc_pct: dm.tpmc_pct != null ? dm.tpmc_pct : item.tpmc_pct,

      reasons: item.reasons || [],

}

  const waitPill = dutyDecisionPillHtml(r.duty_decision);
  const ticketRow = [ticketsHtml, waitPill].filter(Boolean).join(' ');
  return `<div class="dive" data-dive-branch="${esc(r.branch || '')}" data-dive-db="${esc(r.db || '')}" data-dive-latest-day="${esc(latestDay)}">
    ${waveNote}
    ${reasonHtml}
    ${ticketRow ? `<div style="margin:0 0 8px">${ticketRow}</div>` : ''}
    <div class="muted" style="margin-bottom:6px">${linksRow}</div>
    <div>
      <div class="muted" style="margin-bottom:6px"><b>Compare runs</b> (${nCmp} + now · ${nDays}d; клик = day-baseline; now очищает)${fin ? ' <span class="pill">finished</span>' : ''}</div>
      <div class="runs">${runs}</div>
    </div>
    <div class="toolbar" style="margin:8px 0 0">
      <span class="muted" style="font-size:12px">Save / Copy context → красная кнопка справа внизу</span>
    </div>
    <div id="${id}_hist"></div>
  </div>`;
}
function renderInbox() {
  destroyCharts();
  const rows = filteredInboxOrDrill();
  const root = document.getElementById('inbox');
  if (!rows.length) {
    const issue = document.getElementById('fIssue').value;
    const db = document.getElementById('fDb')?.value || '';
    const fam = document.getElementById('fFam')?.value || '';
    const drill = !!(db && fam);
    if (drill) {
      root.innerHTML = '<div class="empty">no runs</div>';
      return;
    }
    root.innerHTML = issue === 'ok'
      ? '<div class="empty">Нет ok-slice под фильтры.</div>'
      : '<div class="empty">Нет hot-проблем под фильтры — good.</div>';
    return;
  }
  const body = rows.map((r, idx) => {
    const id = 'dive_' + idx;
    const dm = resolveDisplayMetrics(r);
    const statusLbl = esc(statusLabel(r));
    const badgeCls = badgeClass(r);
    const latWorse = dm.lat_pct != null && dm.lat_pct >= 10;
    const tpmcWorse = dm.tpmc_pct != null && dm.tpmc_pct <= -10;
    const ticketsRow = ticketPillsHtml(r.tickets);
    return `
      <tr class="row" data-idx="${idx}" data-id="${id}">
        <td><span class="badge ${esc(badgeCls)}">${statusLbl}</span>
          <div class="muted" style="margin-top:4px">${dm.mode === 'compare' ? 'режим: compare' : 'режим: alert'}</div></td>
        <td><span class="cluster">${esc(r.db)}</span>
          <div class="muted">${esc(r.branch)}</div></td>
        <td>${esc(r.suite)} <span class="pill">${esc(r.family)}</span>
          <div class="muted">${esc(r.wh_label || '')} WH · ${esc(r.wave || r.version || '')}</div>
          ${ticketsRow ? `<div style="margin-top:3px">${ticketsRow}</div>` : ''}</td>
        <td>${metricCellHtml(dm.lat_base, dm.lat_now, dm.lat_pct, 'ms', dm, latWorse)}</td>
        <td>${metricCellHtml(dm.tpmc_base, dm.tpmc_now, dm.tpmc_pct, '', dm, tpmcWorse)}</td>
        <td class="muted">${esc(r.last_ts || '—')}
          ${r.last_seen && r.last_seen !== r.last_ts ? `<div class="muted">seen ${esc(r.last_seen)}</div>` : ''}
        </td>
      </tr>
      <tr class="detail hidden" data-detail="${id}"><td colspan="6">${diveHtml(r, id)}</td></tr>`;
  }).join('');

  root.innerHTML = `<table class="inbox">
    <thead><tr>
      <th>Status</th><th>Cluster</th><th>Slice</th>
      <th>Lat p90</th><th>tpmC</th><th>Wave / last</th>
    </tr></thead>
    <tbody>${body}</tbody>
  </table>
  <div class="muted" style="margin-top:8px">Показано ${rows.length} · клик = deep dive</div>`;

  root.querySelectorAll('tr.row').forEach(tr => {
    tr.addEventListener('click', () => {
      const id = tr.dataset.id;
      const detail = root.querySelector(`tr.detail[data-detail="${id}"]`);
      root.querySelectorAll('tr.row.open').forEach(other => {
        if (other === tr) return;
        other.classList.remove('open');
        const od = root.querySelector(`tr.detail[data-detail="${other.dataset.id}"]`);
        if (od) od.classList.add('hidden');
        destroyCharts(other.dataset.id + '_');
      });
      const open = tr.classList.toggle('open');
      detail.classList.toggle('hidden', !open);
      if (!open) destroyCharts(id + '_');
      else {
        const idx = Number(tr.dataset.idx);
        const item = rows[idx];
        if (item) {
          mountHistory(item, id);
          detail.querySelectorAll('.run-card[data-run-day]').forEach(card => {
            card.addEventListener('click', (ev) => {
              ev.stopPropagation();
              const dive = card.closest('.dive');
              const branch = dive?.dataset.diveBranch || item.branch;
              const db = dive?.dataset.diveDb || item.db;
              const day = card.dataset.runDay || '';
              const latest = card.dataset.runLatest === '1';
              if (latest || !day) {
                setCompareId(branch, db, '');
              } else {
                // Allow any day this slice has — incomplete cluster coverage is fine.
                setCompareId(branch, db, day);
              }
              destroyCharts();
              renderAll();
              // Re-open the same row after re-render.
              const again = document.querySelector(`#inbox tr.row[data-id="${id}"]`);
              if (again && !again.classList.contains('open')) again.click();
              else syncDutyFab(filteredInbox());
            });
          });
        }
      }
      syncDutyFab(rows);
    });
  });
  syncDutyFab(rows);
}
function renderAll() {
  renderHeader();
  renderHeatmap();
  renderInbox();
}
function setupDateBar() {
  const fromEl = document.getElementById('winFrom');
  const toEl = document.getElementById('winTo');
  fromEl.value = winFrom || UI.default_from || '';
  toEl.value = winTo || UI.default_to || '';
  if (UI.default_from) { fromEl.min = UI.default_from; toEl.min = UI.default_from; }
  if (UI.default_to) { fromEl.max = UI.default_to; toEl.max = UI.default_to; }
  document.getElementById('winApply').addEventListener('click', () => {
    let a = fromEl.value || null;
    let b = toEl.value || null;
    if (a && b && a > b) { const t = a; a = b; b = t; }
    winFrom = a; winTo = b;
    fromEl.value = winFrom || ''; toEl.value = winTo || '';
    destroyCharts(); renderAll();
  });
  document.getElementById('winReset').addEventListener('click', () => {
    winFrom = UI.default_from || null;
    winTo = UI.default_to || null;
    fromEl.value = winFrom || ''; toEl.value = winTo || '';
    destroyCharts(); renderAll();
  });
  [fromEl, toEl].forEach(el => {
    el.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') document.getElementById('winApply').click();
    });
  });
}
function setupFilters() {
  const ui = DATA.ui || {};
  const branches = uiBranches();
  const def = ui.default_branch || 'main';
  document.getElementById('fBranch').innerHTML =
    `<option value="">all</option>` +
    branches.map(b => `<option value="${esc(b)}"${b === def ? ' selected' : ''}>${esc(b)}</option>`).join('');
  if (branches.includes(def)) document.getElementById('fBranch').value = def;

  const fams = [...new Set([
    ...((DATA.heatmap && DATA.heatmap.families) || []),
    ...(DATA.inbox || []).map(r => r.family).filter(Boolean),
  ])].sort();
  document.getElementById('fFam').innerHTML = '<option value="">all</option>' +
    fams.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  refreshDbFilter();
  setupDateBar();
  syncWaveButtons();
  document.querySelectorAll('#waveBar .wave-btn').forEach(btn => {
    btn.addEventListener('click', () => setWave(btn.dataset.wave));
  });
  ['fBranch', 'fIssue', 'fDb', 'fFam'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      if (id === 'fBranch') refreshDbFilter();
      renderAll();
    });
  });
}
function refreshDbFilter() {
  const br = selectedBranch();
  const keep = document.getElementById('fDb').value;
  const dbs = br
    ? dbsForBranch(br)
    : [...new Set((DATA.inbox || []).map(r => r.db).filter(Boolean))].sort();
  document.getElementById('fDb').innerHTML = '<option value="">all</option>' +
    dbs.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');
  if (dbs.includes(keep)) document.getElementById('fDb').value = keep;
}

setupFilters();
document.getElementById('dutyFabSave')?.addEventListener('click', () => dutyFabAction('save'));
document.getElementById('dutyFabCopy')?.addEventListener('click', () => dutyFabAction('copy'));
renderAll();
</script>
</body>
</html>
