name: Alert Died Runners

on:
  # schedule is off: every 2h this took an analytic-node runner.
  # Re-enable when the pool is calm.
  workflow_dispatch:

jobs:
  check-died-runners:
    runs-on: [ self-hosted, auto-provisioned, build-preset-analytic-node]
    
    steps:
    - name: Checkout repository
      uses: rekby-tmp/bundle-checkout@74b111d51af1bee00b2609ed53e738974f75d7dd # main
      with:
        bundle-url: https://storage.yandexcloud.net/pg-ext-deploy/ydb-mirror/A5A269B5-E212-4167-916A-A937A0414866/ydb-mirror.bundle
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        
    - name: Run dead runner checker and send to Telegram
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.YDBOT_TELEGRAM_BOT_TOKEN }}
        GH_ALERTS_TG_LOGINS: ${{ vars.GH_ALERTS_TG_LOGINS }}
      run: |
        python .github/scripts/shutdown_runner_alert.py \
          --chat-id ${{ vars.GH_ALERTS_TG_CHAT }} \
          --token ${{ secrets.GITHUB_TOKEN }} \
          --hours-delta 3 \
          --max-rows 100
