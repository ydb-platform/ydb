name: Automerge PR
on:
  schedule:
    - cron: "17 * * * *"   # At minute 17 past every hour
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
jobs:
  check-pr:
    runs-on: [ self-hosted, auto-provisioned, build-preset-analytic-node]
    timeout-minutes: 70
    steps:
      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          archive=https://github.com/ydb-platform/ydb/archive/refs/heads/main.tar.gz

          # 30s of the ydb archive on both paths at once. Speed is the last 5s that still received bytes.
          measure() {
            local url=$1 out pid i now n last back
            out=$(mktemp /tmp/gh-probe.XXXXXX)
            local -a s=(0)
            curl -L --http1.1 --max-time 30 -o "$out" -fsS "$url" >/dev/null &
            pid=$!
            for i in $(seq 1 30); do
              sleep 1
              now=$(wc -c < "$out" | tr -d ' ' || true)
              s+=("${now:-0}")
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f "$out"
            n=${#s[@]}; last=$((n - 1))
            while [ "$last" -gt 0 ] && [ "${s[$last]}" -eq "${s[$((last - 1))]}" ]; do last=$((last - 1)); done
            if [ "$last" -lt 1 ]; then echo "0 0"; return; fi
            back=5; [ "$last" -lt 5 ] && back=$last
            echo "${s[$last]} $(( (${s[$last]} - ${s[$((last - back))]}) / back ))"
          }

          megabytes() {
            awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
          }

          direct_out=$(mktemp)
          proxy_out=$(mktemp)
          measure "$archive" >"$direct_out" &
          direct_pid=$!
          measure "${proxy_url}/${archive}" >"$proxy_out" &
          proxy_pid=$!
          wait "$direct_pid" || true
          wait "$proxy_pid" || true
          read -r direct_bytes direct_tail <"$direct_out" || true
          read -r proxy_bytes proxy_tail <"$proxy_out" || true
          rm -f "$direct_out" "$proxy_out"

          faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "archive GitHub $(megabytes "${direct_bytes:-0}") MB, last active 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last active 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
          {
            echo "GH_PROXY_MEASURED=1"
            echo "GH_PROXY_USED=$use_proxy"
            echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
            echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
          } >> "$GITHUB_ENV"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
              echo "GH_FETCH_PROXY_URL=${proxy_url}"
            } >> "$GITHUB_ENV"
          fi
      - name: checkout
        uses: actions/checkout@v5
        env:
          GIT_TRACE: "1"
        with:
          sparse-checkout: |
            .github
            ydb/ci/
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
      - name: install packages
        shell: bash
        run: |
          pip install PyGithub==2.5.0

      - name: configure
        shell: bash
        run: |
            git config --global user.name YDBot
            git config --global user.email ydbot@ydb.tech
            git config --local github.token ${{ env.GH_TOKEN }}

      - name: run-command
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ env.GH_TOKEN }}
        run: |
          set -euo pipefail
          cd ./ydb/ci/rightlib
          end_time=$(( SECONDS + 55 * 60 ))
          poll_interval=300
          iteration=1

          while (( SECONDS < end_time )); do
            echo "::group::automerge iteration ${iteration}"
            ./automerge.py || echo "::warning::automerge iteration ${iteration} failed with exit code $?"
            echo "::endgroup::"
            remaining=$(( end_time - SECONDS ))
            (( remaining > 0 )) && sleep $(( remaining < poll_interval ? remaining : poll_interval ))
            iteration=$(( iteration + 1 ))
          done
