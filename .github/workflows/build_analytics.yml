name: Build-analytics-run
on:
  schedule:
    - cron: "0 0 * * *"  # At 00:00 every day
  workflow_dispatch:
    inputs:
      build_preset:
        type: choice
        default: "relwithdebinfo"
        description: "Build preset"
        options:
          - debug
          - release
          - relwithdebinfo
          - release-asan
          - release-tsan
          - release-msan
      runner_label:
        type: string
        default: "auto-provisioned"
        description: "runner label"
      commit_sha:
        type: string
        default: ""
      build_target:
        type: string
        default: "ydb"
        description: "limit build and test to specific target"

jobs:
  main:
    name: Build and gather build analytics
    runs-on: [ self-hosted, "${{ inputs.runner_label || 'auto-provisioned' }}", "${{ format('build-preset-{0}', inputs.build_preset || 'relwithdebinfo') }}" ]
    steps:
    - name: Probe GitHub speed
      if: vars.GH_PROXY_URL != ''
      env:
        GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
      shell: bash
      run: |
        set -euo pipefail
        proxy_url="${GH_PROXY_URL:-}"
        proxy_url="${proxy_url%/}"
        if [ -z "$proxy_url" ]; then
          echo "GH_PROXY_URL is empty, checkout stays direct"
          exit 0
        fi

        archive=https://github.com/ydb-platform/ydb/archive/refs/heads/main.tar.gz

        # Total bytes, and bytes/sec over the last 5s. The average from the start hides the slow tail.
        measure() {
          local out pid i now n end start back bps
          out=$(mktemp)
          curl -L --http2 --max-time 30 -o "$out" -s "$1" &
          pid=$!
          local -a samples=()
          for i in $(seq 1 30); do
            sleep 1
            now=$(wc -c < "$out" | tr -d ' ')
            samples+=("${now:-0}")
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -f "$out"
          n=${#samples[@]}
          end=${samples[$((n - 1))]:-0}
          back=5
          if [ "$n" -le 5 ]; then
            back=$((n - 1))
          fi
          if [ "$back" -lt 1 ]; then
            back=1
          fi
          start=${samples[$((n - 1 - back))]:-0}
          bps=$(( (end - start) / back ))
          echo "$end $bps"
        }

        megabytes() {
          awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
        }

        read -r direct_bytes direct_tail <<< "$(measure "$archive")" || true
        read -r proxy_bytes proxy_tail <<< "$(measure "${proxy_url}/${archive}")" || true

        faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
          print (proxy + 0 > direct + 0) ? "proxy" : "github"
        }')
        use_proxy=false
        if [ "$faster" = proxy ]; then
          use_proxy=true
        fi

        echo "GitHub $(megabytes "${direct_bytes:-0}") MB, last 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"

        if [ "$use_proxy" = true ]; then
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"
        fi
    - name: Checkout
      uses: actions/checkout@v5
      env:
        GIT_TRACE: "1"
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Drop GitHub proxy
      if: vars.GH_PROXY_URL != ''
      shell: bash
      run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"

    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

    - name: Build and test
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ inputs.build_preset || 'relwithdebinfo'}}
        build_target: ${{ inputs.build_target || 'ydb/apps/ydbd'}}
        increment: false
        run_tests: false
        put_build_results_to_cache: false
        additional_ya_make_args: "-DDEBUGINFO_LINES_ONLY -DDUMP_LINKER_MAP -DCOMPILER_TIME_TRACE --add-result .json"
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}


    - name: Gather and send build analytics
      uses: ./.github/actions/build_analytics
      with:
        build_preset: ${{ inputs.build_preset || 'relwithdebinfo'}}
        build_target: ${{ inputs.build_target || 'ydb/apps/ydbd'}}
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}"}}', 
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA ) }}
