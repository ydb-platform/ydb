name: Ya-Build-and-Test

on:
  workflow_call:
    inputs:
      build_target:
        type: string
        default: "ydb/"
        description: "limit build and test to specific target"
      build_preset:
        type: string
      runner_label:
        type: string
        default: "linux"
        description: "runner label"
      runner_additional_label:
        type: string
        default: "linux"
        description: "additional runner label, can be empty"
      run_build:
        type: boolean
        default: true
        description: "run build"
      run_tests:
        type: boolean
        default: true
        description: "run tests"
      test_threads:
        type: string
        default: 64
        description: "Test threads count"
      link_threads:
        type: string
        default: 2
        description: "link threads count"
      test_size:
        type: string
        default: "small,medium,large"
      test_retry_count:
        type: string
        default: ""
        description: "how many times to retry failed tests"
      test_type:
        type: string
        default: ""
      folder_prefix:
        type: string
        default: "ya-"
      cache_tests:
        type: boolean
        default: false
        description: "Use cache for tests"
      put_build_results_to_cache:
        type: boolean
        default: true
      commit_sha:
        type: string
        default: ""
defaults:
  run:
    shell: bash
jobs:
  main:
    name: Build and test ${{ inputs.build_preset }}
    runs-on: [ self-hosted, "${{ inputs.runner_label }}", "${{ inputs.runner_additional_label || inputs.runner_label }}"]
    steps:
    - name: Probe GitHub speed
      if: vars.GH_PROXY_URL != ''
      env:
        GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
      shell: bash
      run: |
        set -euo pipefail
        proxy_url="${GH_PROXY_URL:-}"
        proxy_url="${proxy_url%/}"
        if [ -z "$proxy_url" ]; then
          echo "GH_PROXY_URL is empty, checkout stays direct"
          exit 0
        fi

        archive=https://github.com/ydb-platform/ydb/archive/refs/heads/main.tar.gz

        # 30s of the ydb archive on both paths at once. Speed is the last 5s that still received bytes.
        measure() {
          local url=$1 out pid i now n last back
          out=$(mktemp /tmp/gh-probe.XXXXXX)
          local -a s=(0)
          curl -L --http1.1 --max-time 30 -o "$out" -fsS "$url" >/dev/null &
          pid=$!
          for i in $(seq 1 30); do
            sleep 1
            now=$(wc -c < "$out" | tr -d ' ' || true)
            s+=("${now:-0}")
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          rm -f "$out"
          n=${#s[@]}; last=$((n - 1))
          while [ "$last" -gt 0 ] && [ "${s[$last]}" -eq "${s[$((last - 1))]}" ]; do last=$((last - 1)); done
          if [ "$last" -lt 1 ]; then echo "0 0"; return; fi
          back=5; [ "$last" -lt 5 ] && back=$last
          echo "${s[$last]} $(( (${s[$last]} - ${s[$((last - back))]}) / back ))"
        }

        megabytes() {
          awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
        }

        direct_out=$(mktemp)
        proxy_out=$(mktemp)
        measure "$archive" >"$direct_out" &
        direct_pid=$!
        measure "${proxy_url}/${archive}" >"$proxy_out" &
        proxy_pid=$!
        wait "$direct_pid" || true
        wait "$proxy_pid" || true
        read -r direct_bytes direct_tail <"$direct_out" || true
        read -r proxy_bytes proxy_tail <"$proxy_out" || true
        rm -f "$direct_out" "$proxy_out"

        faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
          print (proxy + 0 > direct + 0) ? "proxy" : "github"
        }')
        use_proxy=false
        if [ "$faster" = proxy ]; then
          use_proxy=true
        fi

        echo "archive GitHub $(megabytes "${direct_bytes:-0}") MB, last active 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last active 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
        {
          echo "GH_PROXY_MEASURED=1"
          echo "GH_PROXY_USED=$use_proxy"
          echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
          echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
        } >> "$GITHUB_ENV"

        if [ "$use_proxy" = true ]; then
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=https://github.com/"
          } >> "$GITHUB_ENV"
        fi
    - name: Checkout
      uses: actions/checkout@v5
      env:
        GIT_TRACE: "1"
      with:
        ref: ${{ inputs.commit_sha }}
    - name: Drop GitHub proxy
      if: vars.GH_PROXY_URL != ''
      shell: bash
      run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"

    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

    - name: Build and test
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ inputs.build_preset }}
        build_target: ${{ inputs.build_target }}
        increment: false
        run_tests: ${{ inputs.run_tests }}
        test_size: ${{ inputs.test_size }}
        test_type: ${{ inputs.test_type }}
        test_retry_count: ${{ inputs.test_retry_count }}
        test_threads: ${{ inputs.test_threads }}
        link_threads: ${{ inputs.link_threads }}
        put_build_results_to_cache: ${{ inputs.put_build_results_to_cache }}
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
