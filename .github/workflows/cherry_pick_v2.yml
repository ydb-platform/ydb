name: Cherry-pick_v2
on:
  workflow_dispatch:
    inputs:
      commits_and_prs:
        type: string
        default: ""
        description: |
          List of commit SHAs or PR numbers to cherry-pick.
          Can be represented as a full or short commit SHA or a PR number.
          Separated by space, comma or line end.
          Merged sources are applied in merge-time order regardless of input order,
          unmerged ones are applied after them in input order.
          Example: "sha5682 12345"
        required: true
      target_branches:
        default: ""
        description: Comma or space separated branches to cherry-pick
        required: true
      script_version_sha:
        type: string
        description: |
          (Optional) Commit SHA to use for checking out scripts.
          If not provided, the default branch will be used.
        default: ""
      allow_unmerged:
        type: boolean
        default: true
        description: Allow backporting unmerged PRs (uses commits from PR directly)

env:
  GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
jobs:
  create-pr:
    runs-on: [self-hosted, tiny-worker]
    steps:
      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          archive=https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz

          # Bytes, bytes/sec, seconds. The archive is about 1 GB, so 30s does not finish it.
          measure() {
            curl -L --http2 --max-time 30 -o /dev/null -s \
              -w '%{size_download} %{speed_download} %{time_total}' \
              "$1" 2>/dev/null || true
          }

          megabytes() {
            awk -v bytes="${1:-0}" -v digits="$2" 'BEGIN { printf "%.*f", digits, (bytes + 0) / 1000000 }'
          }

          read -r direct_bytes direct_bps direct_seconds <<< "$(measure "$archive")" || true
          read -r proxy_bytes proxy_bps proxy_seconds <<< "$(measure "${proxy_url}/${archive}")" || true

          faster=$(awk -v direct="${direct_bps:-0}" -v proxy="${proxy_bps:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "GitHub $(megabytes "${direct_bytes:-0}" 1) MB in ${direct_seconds:-0}s, $(megabytes "${direct_bps:-0}" 2) MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}" 1) MB in ${proxy_seconds:-0}s, $(megabytes "${proxy_bps:-0}" 2) MB/s; use_proxy=${use_proxy}"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
            } >> "$GITHUB_ENV"
          fi
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ inputs.script_version_sha }}
          sparse-checkout: |
            .github
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
      - name: install packages
        shell: bash
        run: |
          pip install PyGithub==2.5.0 requests

      - name: configure
        shell: bash
        run: |
          git config --global user.name YDBot
          git config --global user.email ydbot@ydb.tech
          git config --local github.token ${{ env.GH_TOKEN }}

      - name: run-command
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          export RESULTS_PATH=$(realpath created_pulls.json)
          python3 ./.github/scripts/cherry_pick_v2.py \
            --commits="${{ inputs.commits_and_prs }}" \
            --target-branches="${{ inputs.target_branches }}" \
            ${{ inputs.allow_unmerged == true && '--allow-unmerged' || '' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: created-pulls
          path: created_pulls.json
          archive: false
