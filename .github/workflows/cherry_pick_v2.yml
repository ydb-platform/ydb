name: Cherry-pick_v2
on:
  workflow_dispatch:
    inputs:
      commits_and_prs:
        type: string
        default: ""
        description: |
          List of commit SHAs or PR numbers to cherry-pick.
          Can be represented as a full or short commit SHA or a PR number.
          Separated by space, comma or line end.
          Merged sources are applied in merge-time order regardless of input order,
          unmerged ones are applied after them in input order.
          Example: "sha5682 12345"
        required: true
      target_branches:
        default: ""
        description: Comma or space separated branches to cherry-pick
        required: true
      script_version_sha:
        type: string
        description: |
          (Optional) Commit SHA to use for checking out scripts.
          If not provided, the default branch will be used.
        default: ""
      allow_unmerged:
        type: boolean
        default: true
        description: Allow backporting unmerged PRs (uses commits from PR directly)

env:
  GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
jobs:
  create-pr:
    runs-on: [self-hosted, tiny-worker]
    steps:
      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          repo_url=https://github.com/ydb-platform/ydb.git

          # Same transfer as actions/checkout: depth-1 clone. Both paths at once.
          # Speed is the last 5s that still received bytes. A finished clone is not 0.
          measure() {
            local git_config dest pid i now n last back start end bps
            git_config=$1
            dest=$(mktemp -d "${RUNNER_TEMP:-/tmp}/gh-probe.XXXXXX")
            if [ -n "$git_config" ]; then
              setsid git -c "$git_config" clone --depth 1 --single-branch --no-tags "$repo_url" "$dest" >/dev/null 2>&1 &
            else
              setsid git clone --depth 1 --single-branch --no-tags "$repo_url" "$dest" >/dev/null 2>&1 &
            fi
            pid=$!
            local -a samples=()
            for i in $(seq 1 30); do
              sleep 1
              now=$(du -sb "$dest" 2>/dev/null | awk '{print $1}')
              samples+=("${now:-0}")
            done
            kill -- -"$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -rf "$dest"
            n=${#samples[@]}
            last=$((n - 1))
            while [ "$last" -gt 0 ] && [ "${samples[$last]}" -eq "${samples[$((last - 1))]}" ]; do
              last=$((last - 1))
            done
            if [ "$last" -lt 1 ]; then
              echo "${samples[0]:-0} 0"
              return
            fi
            back=5
            if [ "$last" -lt 5 ]; then
              back=$last
            fi
            end=${samples[$last]:-0}
            start=${samples[$((last - back))]:-0}
            bps=$(( (end - start) / back ))
            echo "$end $bps"
          }

          megabytes() {
            awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
          }

          direct_out=$(mktemp)
          proxy_out=$(mktemp)
          measure "" >"$direct_out" &
          direct_pid=$!
          measure "url.${proxy_url}/https://github.com/.insteadOf=https://github.com/" >"$proxy_out" &
          proxy_pid=$!
          wait "$direct_pid" || true
          wait "$proxy_pid" || true
          read -r direct_bytes direct_tail <"$direct_out" || true
          read -r proxy_bytes proxy_tail <"$proxy_out" || true
          rm -f "$direct_out" "$proxy_out"

          faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "shallow clone GitHub $(megabytes "${direct_bytes:-0}") MB, last active 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last active 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
          {
            echo "GH_PROXY_MEASURED=1"
            echo "GH_PROXY_USED=$use_proxy"
            echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
            echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
          } >> "$GITHUB_ENV"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
              echo "GH_FETCH_PROXY_URL=${proxy_url}"
            } >> "$GITHUB_ENV"
          fi
      - name: checkout
        uses: actions/checkout@v5
        env:
          GIT_TRACE: "1"
        with:
          fetch-depth: 1
          ref: ${{ inputs.script_version_sha }}
          sparse-checkout: |
            .github
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
      - name: install packages
        shell: bash
        run: |
          pip install PyGithub==2.5.0 requests

      - name: configure
        shell: bash
        run: |
          git config --global user.name YDBot
          git config --global user.email ydbot@ydb.tech
          git config --local github.token ${{ env.GH_TOKEN }}

      - name: run-command
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ env.GH_TOKEN }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          export RESULTS_PATH=$(realpath created_pulls.json)
          python3 ./.github/scripts/cherry_pick_v2.py \
            --commits="${{ inputs.commits_and_prs }}" \
            --target-branches="${{ inputs.target_branches }}" \
            ${{ inputs.allow_unmerged == true && '--allow-unmerged' || '' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: created-pulls
          path: created_pulls.json
          archive: false
