name: CPP SDK coverage

on:
  pull_request_target:
    branches:
      - main
      - stable-*
      - prestable-*
      - stream-nb-*
      - dev-*
      - rc-*
      - q-stable-*
    types:
      - labeled

concurrency:
  group: cpp-sdk-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cpp_sdk_coverage:
    if: github.event.label.name == 'sdk-coverage' && github.event.pull_request.state == 'open'
    runs-on: [self-hosted, auto-provisioned, build-preset-relwithdebinfo]
    name: CPP SDK coverage
    timeout-minutes: 480
    steps:
      - name: Check label sender is collaborator
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          script: |
            const sender = context.payload.sender.login;
            try {
              await github.rest.repos.checkCollaborator({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: sender,
              });
            } catch (error) {
              if (!error.status || error.status != 404) throw error;
              core.setFailed(`Only repository collaborators can trigger CPP SDK coverage (sender: @${sender}).`);
            }

      - name: Verify PR is mergeable
        uses: actions/github-script@v8
        with:
          script: |
            let pr = context.payload.pull_request;
            if (pr.mergeable == null || !pr.merge_commit_sha) {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              pr = data;
            }
            if (!pr.mergeable || !pr.merge_commit_sha) {
              core.setFailed(
                'Unable to merge PR into the base branch. Please rebase or resolve conflicts and re-add the sdk-coverage label.'
              );
            }

      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          archive=https://github.com/ydb-platform/ydb/archive/refs/heads/main.tar.gz

          # Total bytes, and bytes/sec over the last 5s. The average from the start hides the slow tail.
          measure() {
            local out pid i now n end start back bps
            out=$(mktemp)
            curl -L --http2 --max-time 30 -o "$out" -s "$1" &
            pid=$!
            local -a samples=()
            for i in $(seq 1 30); do
              sleep 1
              now=$(wc -c < "$out" | tr -d ' ')
              samples+=("${now:-0}")
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f "$out"
            n=${#samples[@]}
            end=${samples[$((n - 1))]:-0}
            back=5
            if [ "$n" -le 5 ]; then
              back=$((n - 1))
            fi
            if [ "$back" -lt 1 ]; then
              back=1
            fi
            start=${samples[$((n - 1 - back))]:-0}
            bps=$(( (end - start) / back ))
            echo "$end $bps"
          }

          megabytes() {
            awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
          }

          read -r direct_bytes direct_tail <<< "$(measure "$archive")" || true
          read -r proxy_bytes proxy_tail <<< "$(measure "${proxy_url}/${archive}")" || true

          faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "GitHub $(megabytes "${direct_bytes:-0}") MB, last 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
          {
            echo "GH_PROXY_MEASURED=1"
            echo "GH_PROXY_USED=$use_proxy"
            echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
            echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
          } >> "$GITHUB_ENV"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
            } >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@v5
        env:
          GIT_TRACE: "1"
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build, test, and check coverage
        uses: ./.github/actions/test_cpp_sdk_with_coverage
        with:
          bazel_remote_uri: ${{ vars.REMOTE_CACHE_URL_YA }}
          bazel_remote_username: ${{ secrets.REMOTE_CACHE_USERNAME }}
          bazel_remote_password: ${{ secrets.REMOTE_CACHE_PASSWORD }}
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
