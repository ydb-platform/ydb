name: Check CPP SDK PEERDIRs

# SECURITY: pull_request_target keeps the workflow and checker trusted. The PR
# commit is fetched into Git's object database but is never checked out or run.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths: ['ydb/public/sdk/cpp/**', '.github/workflows/cpp_sdk_peerdirs_check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Irrelevant label events must not cancel a running check for the same PR.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request_target'
      && format('pr-{0}{1}', github.event.pull_request.number,
          github.event.action == 'labeled' && github.event.label.name != 'ok-to-test' && format('-ignore-{0}', github.run_id) || '')
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.state == 'open' &&
        (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test') &&
        (
          github.event.pull_request.head.repo.full_name == github.repository ||
          contains(
            fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
            github.event.pull_request.author_association
          ) ||
          contains(github.event.pull_request.labels.*.name, 'ok-to-test')
        )
      )
    runs-on: [self-hosted, tiny-worker]
    steps:
      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          archive=https://github.com/ydb-platform/ydb/archive/refs/heads/main.tar.gz

          # Total bytes, and bytes/sec over the last 5s. The average from the start hides the slow tail.
          measure() {
            local out pid i now n end start back bps
            out=$(mktemp)
            curl -L --http2 --max-time 30 -o "$out" -s "$1" &
            pid=$!
            local -a samples=()
            for i in $(seq 1 30); do
              sleep 1
              now=$(wc -c < "$out" | tr -d ' ')
              samples+=("${now:-0}")
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            rm -f "$out"
            n=${#samples[@]}
            end=${samples[$((n - 1))]:-0}
            back=5
            if [ "$n" -le 5 ]; then
              back=$((n - 1))
            fi
            if [ "$back" -lt 1 ]; then
              back=1
            fi
            start=${samples[$((n - 1 - back))]:-0}
            bps=$(( (end - start) / back ))
            echo "$end $bps"
          }

          megabytes() {
            awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
          }

          read -r direct_bytes direct_tail <<< "$(measure "$archive")" || true
          read -r proxy_bytes proxy_tail <<< "$(measure "${proxy_url}/${archive}")" || true

          faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "GitHub $(megabytes "${direct_bytes:-0}") MB, last 5s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, last 5s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
          {
            echo "GH_PROXY_MEASURED=1"
            echo "GH_PROXY_USED=$use_proxy"
            echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
            echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
          } >> "$GITHUB_ENV"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
            } >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@v5
        env:
          GIT_TRACE: "1"
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check PEERDIRs with the trusted main script
        env:
          GIT_TRACE: "1"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request_target ]; then
            git fetch --no-tags origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "refs/pull/$PR_NUMBER/head"
            git merge-base --is-ancestor "$BASE_SHA" origin/main
            git cat-file -e "$HEAD_SHA^{commit}"
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" \
              > "$RUNNER_TEMP/changed.txt"
            sdk_root="$(mktemp -d "$RUNNER_TEMP/cpp-sdk-peerdirs.XXXXXX")/sdk"
            mkdir -p "$sdk_root/scripts"
            cp ydb/public/sdk/cpp/scripts/check_peerdirs.py "$sdk_root/scripts/"
            cp ydb/public/sdk/cpp/allowed_peerdirs.txt "$sdk_root/"
            while IFS= read -r -d '' path; do
              rel="${path#ydb/public/sdk/cpp/}"
              case "$rel" in
                */ya.make) ;;
                *) continue ;;
              esac
              target="$sdk_root/$rel"
              mkdir -p -- "$(dirname -- "$target")"
              git show "$HEAD_SHA:$path" > "$target"
            done < <(git ls-tree -rz --name-only "$HEAD_SHA" -- ydb/public/sdk/cpp)
            python3 "$sdk_root/scripts/check_peerdirs.py" "$RUNNER_TEMP/changed.txt"
          else
            python3 ydb/public/sdk/cpp/scripts/check_peerdirs.py
          fi
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: echo "GIT_CONFIG_COUNT=0" >> "$GITHUB_ENV"
