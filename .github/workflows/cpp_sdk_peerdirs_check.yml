name: Check CPP SDK PEERDIRs

# SECURITY: this workflow executes PR-controlled Python, so it must use the
# unprivileged pull_request context on an ephemeral GitHub-hosted runner.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths: ['ydb/public/sdk/cpp/**', '.github/workflows/cpp_sdk_peerdirs_check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Irrelevant label events must not cancel a running check for the same PR.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request_target'
      && format('pr-{0}{1}', github.event.pull_request.number,
          github.event.action == 'labeled' && github.event.label.name != 'ok-to-test' && format('-ignore-{0}', github.run_id) || '')
      || github.ref
    }}
  cancel-in-progress: true

jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.state == 'open' &&
       (github.event.action != 'labeled' || github.event.label.name == 'ok-to-test'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch --no-tags origin "$BASE_REF"
            git diff --name-only --diff-filter=ACMRT "origin/$BASE_REF...HEAD" > changed.txt
            python3 ydb/public/sdk/cpp/scripts/check_peerdirs.py changed.txt
          else
            python3 ydb/public/sdk/cpp/scripts/check_peerdirs.py
          fi
