name: Dispatch remote executor

# pull (default): upload remote-ticket artifact → wait claim → ingest.
#   Webhook cannot carry workflow_dispatch inputs; the artifact does.
# push: workflow_dispatch via GH_PERSONAL_ACCESS_TOKEN (legacy).
# Config: resolve_remote_execution.py / REMOTE_PULL.md.
on:
  workflow_call:
    inputs:
      config:
        description: JSON from resolve_remote_execution (handoff, repos, S3, inputs, …)
        required: true
        type: string
    outputs:
      executor_run_id:
        value: ${{ jobs.wait.outputs.executor_run_id }}
      executor_run_url:
        value: ${{ jobs.wait.outputs.executor_run_url }}
      executor_conclusion:
        value: ${{ jobs.wait.outputs.executor_conclusion }}

jobs:
  enqueue:
    runs-on: ${{ fromJSON(inputs.config).wait && fromJSON('["self-hosted", "runner-waiter"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15
    outputs:
      platform_run_id: ${{ steps.handoff.outputs.platform_run_id }}
      ticket_url: ${{ steps.handoff.outputs.ticket_url }}
      ticket_artifact: ${{ steps.handoff.outputs.ticket_artifact }}
      executor_run_id: ${{ steps.handoff.outputs.executor_run_id }}
      executor_run_url: ${{ steps.handoff.outputs.executor_run_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/s3cmd
          sparse-checkout-cone-mode: false

      # Optional legacy S3 ticket mirror (only when remote JSON sets ticket_s3_*).
      - name: Configure ticket s3cmd
        if: >-
          (fromJSON(inputs.config).handoff || 'pull') != 'push' &&
          fromJSON(inputs.config).ticket_s3_bucket != '' &&
          fromJSON(inputs.config).ticket_s3_endpoint != ''
        uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ fromJSON(inputs.config).ticket_s3_bucket }}
          s3_endpoint: ${{ fromJSON(inputs.config).ticket_s3_endpoint }}
          build_preset: relwithdebinfo

      - name: Enqueue or push-dispatch
        id: handoff
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          CONFIG_JSON: ${{ inputs.config }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PLATFORM_RUN_ID: ${{ github.run_id }}
          PLATFORM_REPOSITORY: ${{ github.repository }}
          PLATFORM_WORKFLOW: ${{ github.workflow }}
          PLATFORM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TICKET_PATH: remote-ticket.json
          TICKET_AWS_ENDPOINT: ${{ fromJSON(inputs.config).ticket_s3_endpoint }}
          TICKET_AWS_BUCKET: ${{ fromJSON(inputs.config).ticket_s3_bucket }}
          REPO: ${{ fromJSON(inputs.config).repository || github.repository }}
          WORKFLOW_FILE: ${{ fromJSON(inputs.config).workflow_file }}
          WORKFLOW_NAME: ${{ fromJSON(inputs.config).workflow_name }}
          EXECUTOR_REF: ${{ fromJSON(inputs.config).executor_ref }}
          INPUTS_JSON: ${{ toJSON(fromJSON(inputs.config).inputs) }}
          WAIT_MODE: ${{ fromJSON(inputs.config).wait && 'wait+mirror' || 'fire-and-forget' }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py start

      - name: Upload remote-ticket artifact
        if: (fromJSON(inputs.config).handoff || 'pull') != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: remote-ticket
          path: remote-ticket.json
          if-no-files-found: error
          retention-days: 7

  wait:
    if: fromJSON(inputs.config).wait
    needs: enqueue
    runs-on: [self-hosted, runner-waiter]
    timeout-minutes: 1200
    outputs:
      executor_run_id: ${{ steps.wait.outputs.executor_run_id }}
      executor_run_url: ${{ steps.wait.outputs.executor_run_url }}
      executor_conclusion: ${{ steps.wait.outputs.executor_conclusion }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
          sparse-checkout-cone-mode: false

      - name: Wait for claim + executor
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          CONFIG_JSON: ${{ inputs.config }}
          PLATFORM_RUN_ID: ${{ github.run_id }}
          EXECUTOR_RUN_ID: ${{ needs.enqueue.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.enqueue.outputs.executor_run_url }}
          REPO: ${{ fromJSON(inputs.config).repository }}
          WORKFLOW_NAME: ${{ fromJSON(inputs.config).workflow_name }}
          AWS_ENDPOINT: ${{ fromJSON(inputs.config).summary_s3_endpoint || fromJSON(inputs.config).claim_s3_endpoint }}
          AWS_BUCKET: ${{ fromJSON(inputs.config).summary_s3_bucket || fromJSON(inputs.config).claim_s3_bucket }}
          FAIL_ON_REMOTE_FAILURE: ${{ fromJSON(inputs.config).fail_on_remote_failure }}
          CALLER_AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          CALLER_AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py wait

      - name: Cancel on caller cancel
        if: cancelled()
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          CONFIG_JSON: ${{ inputs.config }}
          PLATFORM_RUN_ID: ${{ github.run_id }}
          EXECUTOR_RUN_ID: ${{ steps.wait.outputs.executor_run_id || needs.enqueue.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ steps.wait.outputs.executor_run_url || needs.enqueue.outputs.executor_run_url }}
          REPO: ${{ fromJSON(inputs.config).repository }}
          TICKET_AWS_ENDPOINT: ${{ fromJSON(inputs.config).ticket_s3_endpoint }}
          TICKET_AWS_BUCKET: ${{ fromJSON(inputs.config).ticket_s3_bucket }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py cancel

  ingest:
    if: >-
      fromJSON(inputs.config).wait && always() && !cancelled() &&
      needs.enqueue.result == 'success' &&
      needs.wait.result != 'cancelled' &&
      needs.wait.outputs.executor_run_id != ''
    needs: [enqueue, wait]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/config
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq s3cmd awscli
          python3 -m pip install --user ydb 'ydb[yc]' codeowners jinja2 pyyaml

      - uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ vars.AWS_BUCKET }}
          s3_endpoint: ${{ vars.AWS_ENDPOINT }}
          build_preset: relwithdebinfo

      - name: Ingest remote artifacts
        env:
          CONFIG_JSON: ${{ inputs.config }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CALLER_AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          CALLER_AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          REMOTE_AWS_ENDPOINT: ${{ fromJSON(inputs.config).summary_s3_endpoint }}
          REMOTE_AWS_BUCKET: ${{ fromJSON(inputs.config).summary_s3_bucket }}
          EXECUTOR_RUN_ID: ${{ needs.wait.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.wait.outputs.executor_run_url }}
          SOURCE_EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PULL_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
          WORKSPACE: ${{ github.workspace }}
        run: python3 .github/scripts/ci/ingest_remote_executor_results.py
