name: Dispatch remote executor

# Reusable remote path: start → optional wait+mirror / cancel-on-caller-cancel.
# Call sites only map their contract into inputs_json.
#
# Approach A (optional): when runs_on is non-empty, copy workflow_file (+ nested
# local reusable workflows) from source_ref onto a tmp branch, rewrite self-hosted
# job runs-on, dispatch that ref, then delete the branch after wait/cancel.
on:
  workflow_call:
    inputs:
      workflow_file:
        description: Executor workflow filename (e.g. run_tests.yml); must exist on default branch
        required: true
        type: string
      workflow_name:
        description: "Executor workflow 'name:' value (S3 key segment for job_summary.md)"
        required: true
        type: string
      executor_ref:
        description: Git ref that hosts the executor workflow YAML (used as dispatch ref when runs_on is empty; fallback source_ref for approach A)
        required: true
        type: string
      inputs_json:
        description: JSON object of workflow_dispatch inputs for the executor
        required: true
        type: string
      wait:
        description: true = wait+mirror on runner-waiter; false = fire-and-forget
        required: false
        type: boolean
        default: true
      fail_on_remote_failure:
        description: When wait=true, fail this workflow if executor conclusion is not success
        required: false
        type: boolean
        default: true
      repository:
        description: owner/repo (empty = github.repository)
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Approach A: JSON array of runs-on labels; empty = dispatch executor_ref as-is (no tmp branch)'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Approach A: ref to copy workflow YAML from (empty = executor_ref)'
        required: false
        type: string
        default: ''
      cleanup_tmp_branch:
        description: 'Approach A: delete ci-remote-tmp/* branch after wait/cancel'
        required: false
        type: boolean
        default: true
      patch_self_hosted_only:
        description: 'Approach A: only rewrite runs-on that look self-hosted/auto-provisioned (keep ubuntu-latest)'
        required: false
        type: boolean
        default: true
    outputs:
      executor_run_id:
        description: Dispatched executor run id
        value: ${{ jobs.dispatch.outputs.executor_run_id }}
      executor_run_url:
        description: Dispatched executor run URL
        value: ${{ jobs.dispatch.outputs.executor_run_url }}
      executor_conclusion:
        description: Executor run conclusion after wait (empty if fire-and-forget)
        value: ${{ jobs.wait.outputs.executor_conclusion }}
      tmp_branch:
        description: Approach A tmp branch (empty if unused)
        value: ${{ jobs.dispatch.outputs.tmp_branch }}

jobs:
  dispatch:
    # When waiting, stay on runner-waiter (same pool as wait job). Fire-and-forget uses ubuntu-latest.
    runs-on: ${{ inputs.wait && fromJSON('["self-hosted", "runner-waiter"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15
    outputs:
      executor_run_id: ${{ steps.dispatch.outputs.executor_run_id }}
      executor_run_url: ${{ steps.dispatch.outputs.executor_run_url }}
      tmp_branch: ${{ steps.dispatch.outputs.tmp_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci/dispatch_remote_executor.py
          sparse-checkout-cone-mode: false

      - name: Install PyYAML
        if: inputs.runs_on != ''
        run: |
          # runner-waiter often lacks python3-venv; --target works with system pip.
          mkdir -p "$RUNNER_TEMP/ci-remote-pydeps"
          python3 -m pip install --target "$RUNNER_TEMP/ci-remote-pydeps" pyyaml
          echo "PYTHONPATH=$RUNNER_TEMP/ci-remote-pydeps${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Dispatch remote executor
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_REF: ${{ inputs.executor_ref }}
          INPUTS_JSON: ${{ inputs.inputs_json }}
          WAIT_MODE: ${{ inputs.wait && 'wait+mirror' || 'fire-and-forget' }}
          RUNS_ON: ${{ inputs.runs_on }}
          SOURCE_REF: ${{ inputs.source_ref }}
          PATCH_SELF_HOSTED_ONLY: ${{ inputs.patch_self_hosted_only }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py start

  wait:
    if: inputs.wait
    needs: dispatch
    runs-on: [self-hosted, runner-waiter]
    # Match run_tests.yml / long regression; must cover executor job wall time.
    timeout-minutes: 1200
    outputs:
      executor_conclusion: ${{ steps.wait.outputs.executor_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci/dispatch_remote_executor.py
          sparse-checkout-cone-mode: false

      - name: Wait and mirror executor summary
        id: wait
        env:
          GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_RUN_ID: ${{ needs.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.dispatch.outputs.executor_run_url }}
          TMP_BRANCH: ${{ needs.dispatch.outputs.tmp_branch }}
          CLEANUP_TMP_BRANCH: ${{ inputs.cleanup_tmp_branch }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          FAIL_ON_REMOTE_FAILURE: ${{ inputs.fail_on_remote_failure }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py wait

      - name: Cancel executor on caller cancel
        if: cancelled() && needs.dispatch.outputs.executor_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_RUN_ID: ${{ needs.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.dispatch.outputs.executor_run_url }}
          TMP_BRANCH: ${{ needs.dispatch.outputs.tmp_branch }}
          CLEANUP_TMP_BRANCH: ${{ inputs.cleanup_tmp_branch }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py cancel
