name: Dispatch remote executor

# Reusable remote path: start → optional wait+mirror / cancel-on-caller-cancel.
# Call sites only map their contract into inputs_json.
on:
  workflow_call:
    inputs:
      workflow_file:
        description: Executor workflow filename (e.g. run_and_debug_tests.yml)
        required: true
        type: string
      workflow_name:
        description: "Executor workflow 'name:' value (S3 key segment for job_summary.md)"
        required: true
        type: string
      executor_ref:
        description: Git ref that hosts the executor workflow YAML
        required: true
        type: string
      inputs_json:
        description: JSON object of workflow_dispatch inputs for the executor
        required: true
        type: string
      wait:
        description: true = wait+mirror on runner-waiter; false = fire-and-forget
        required: false
        type: boolean
        default: true
      fail_on_remote_failure:
        description: When wait=true, fail this workflow if executor conclusion is not success
        required: false
        type: boolean
        default: true
      repository:
        description: owner/repo (empty = github.repository)
        required: false
        type: string
        default: ''
      summary_s3_endpoint:
        description: Public S3 endpoint for job_summary.md mirror (empty = vars.AWS_ENDPOINT)
        required: false
        type: string
        default: ''
      summary_s3_bucket:
        description: Public S3 bucket for job_summary.md mirror (empty = vars.AWS_BUCKET)
        required: false
        type: string
        default: ''
      analytics_job_name:
        description: Job name for YDB QA uploads on ingest (empty = manifest / caller workflow)
        required: false
        type: string
        default: ''
      caller_workflow:
        description: Caller workflow name for analytics attribution (empty = this reusable workflow name)
        required: false
        type: string
        default: ''
    outputs:
      executor_run_id:
        description: Dispatched executor run id
        value: ${{ jobs.dispatch.outputs.executor_run_id }}
      executor_run_url:
        description: Dispatched executor run URL
        value: ${{ jobs.dispatch.outputs.executor_run_url }}
      executor_conclusion:
        description: Executor run conclusion after wait (empty if fire-and-forget)
        value: ${{ jobs.wait.outputs.executor_conclusion }}

jobs:
  dispatch:
    # When waiting, stay on runner-waiter (same pool as wait job). Fire-and-forget uses ubuntu-latest.
    runs-on: ${{ inputs.wait && fromJSON('["self-hosted", "runner-waiter"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15
    outputs:
      executor_run_id: ${{ steps.dispatch.outputs.executor_run_id }}
      executor_run_url: ${{ steps.dispatch.outputs.executor_run_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci/dispatch_remote_executor.py
          sparse-checkout-cone-mode: false

      - name: Dispatch remote executor
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_REF: ${{ inputs.executor_ref }}
          INPUTS_JSON: ${{ inputs.inputs_json }}
          WAIT_MODE: ${{ inputs.wait && 'wait+mirror' || 'fire-and-forget' }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py start

  wait:
    if: inputs.wait
    needs: dispatch
    runs-on: [self-hosted, runner-waiter]
    # Match run_tests.yml / long regression; must cover executor job wall time.
    timeout-minutes: 1200
    outputs:
      executor_conclusion: ${{ steps.wait.outputs.executor_conclusion }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci/dispatch_remote_executor.py
          sparse-checkout-cone-mode: false

      - name: Wait and mirror executor summary
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_RUN_ID: ${{ needs.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.dispatch.outputs.executor_run_url }}
          # Remote-repo public S3 (may differ from caller vars.AWS_*).
          AWS_ENDPOINT: ${{ inputs.summary_s3_endpoint != '' && inputs.summary_s3_endpoint || vars.AWS_ENDPOINT }}
          AWS_BUCKET: ${{ inputs.summary_s3_bucket != '' && inputs.summary_s3_bucket || vars.AWS_BUCKET }}
          FAIL_ON_REMOTE_FAILURE: ${{ inputs.fail_on_remote_failure }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py wait

      - name: Cancel executor on caller cancel
        if: cancelled() && needs.dispatch.outputs.executor_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          WORKFLOW_FILE: ${{ inputs.workflow_file }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          EXECUTOR_RUN_ID: ${{ needs.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.dispatch.outputs.executor_run_url }}
        run: python3 .github/scripts/ci/dispatch_remote_executor.py cancel

  # After wait: reupload remote artifacts to caller S3, regenerate summary, upload YDB QA.
  ingest:
    if: >-
      inputs.wait && always() && !cancelled() &&
      needs.dispatch.result == 'success' &&
      needs.dispatch.outputs.executor_run_id != '' &&
      needs.wait.result != 'cancelled'
    needs: [dispatch, wait]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/config
          sparse-checkout-cone-mode: false

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq s3cmd awscli
          python3 -m pip install --user ydb 'ydb[yc]' codeowners jinja2 pyyaml

      - name: Configure caller s3cmd
        uses: ./.github/actions/s3cmd
        with:
          s3_key_id: ${{ secrets.AWS_KEY_ID }}
          s3_key_secret: ${{ secrets.AWS_KEY_VALUE }}
          s3_bucket: ${{ vars.AWS_BUCKET }}
          s3_endpoint: ${{ vars.AWS_ENDPOINT }}
          build_preset: relwithdebinfo

      - name: Ingest remote artifacts
        env:
          REPO: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          REMOTE_WORKFLOW_NAME: ${{ inputs.workflow_name }}
          REMOTE_AWS_ENDPOINT: ${{ inputs.summary_s3_endpoint != '' && inputs.summary_s3_endpoint || vars.AWS_ENDPOINT }}
          REMOTE_AWS_BUCKET: ${{ inputs.summary_s3_bucket != '' && inputs.summary_s3_bucket || vars.AWS_BUCKET }}
          CALLER_AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          CALLER_AWS_BUCKET: ${{ vars.AWS_BUCKET }}
          EXECUTOR_RUN_ID: ${{ needs.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ needs.dispatch.outputs.executor_run_url }}
          # Fallback only — ingest prefers remote_artifacts.json (job_inputs).
          # workflow_call sets event_name=workflow_call; that must not win over meta.
          SOURCE_EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          PULL_NUMBER: ${{ github.event.pull_request.number || github.event.number || '' }}
          ANALYTICS_JOB_NAME: ${{ inputs.analytics_job_name }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow != '' && inputs.caller_workflow || github.workflow }}
          WORKSPACE: ${{ github.workspace }}
        run: python3 .github/scripts/ci/ingest_remote_executor_results.py
