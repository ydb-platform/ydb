name: Publish docker image

on:
  schedule:
    - cron: "0 3 * * *"  # At 03:00 every day
  workflow_dispatch:
    inputs:
      ydbd_git_ref:
        type: string
        required: true
        default: main
        description: "Git branch/tag revision to build ydbd"
      cli_git_ref:
        type: string
        required: true
        default: main
        description: "Git branch/tag revision to build CLI"
      local_ydb_git_ref:
        type: string
        required: true
        default: main
        description: "Git branch/tag revision to build local_ydb binary"
      dockerfile_branch:
        type: string
        required: true
        default: main
        description: "Git branch for getting Dockerfile"
      image_tag:
        type: string
        required: true
        default: trunk
        description: "docker image tag"

permissions:
  contents: read
  packages: write  # push to ghcr.io

jobs:
  build:
    runs-on: [self-hosted, auto-provisioned]
    steps:
      - name: Checkout .github
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.dockerfile_branch || 'main' }}
          path: main
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: Checkout repository for build ydbd
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ydbd_git_ref || 'main' }}
          path: ydbd
          persist-credentials: false

      - name: get revision for ydbd
        shell: bash
        id: get-sha
        working-directory: ydbd
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Checkout repository for build CLI
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cli_git_ref || 'main' }}
          path: cli
          persist-credentials: false

      - name: Checkout repository for build local_ydb binary
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.local_ydb_git_ref || 'main' }}
          path: local_ydb
          persist-credentials: false

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to the Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USER_NAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/local-ydb
            ${{ vars.DOCKER_HUB_REPOSITORY && vars.DOCKER_HUB_REPOSITORY || '' }}
          labels: |
            ydb.revision=${{ steps.get-sha.outputs.SHA }}
            org.opencontainers.image.revision=${{ steps.get-sha.outputs.SHA }}
          tags: |
            type=schedule,pattern=nightly
            type=raw,value=${{ inputs.image_tag || 'trunk' }}

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: main/.github/docker/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          cache-from: type=s3,name=local_ydb,region=ru-central1,bucket=${{ vars.AWS_BUCKET }},endpoint_url=${{ vars.AWS_ENDPOINT }},access_key_id=${{ secrets.AWS_KEY_ID }},secret_access_key=${{ secrets.AWS_KEY_VALUE }}
          cache-to: type=s3,name=local_ydb,region=ru-central1,bucket=${{ vars.AWS_BUCKET }},endpoint_url=${{ vars.AWS_ENDPOINT }},access_key_id=${{ secrets.AWS_KEY_ID }},secret_access_key=${{ secrets.AWS_KEY_VALUE }},mode=max

      - name: Run Docker acceptance tests
        env:
          ACCEPTANCE_ARTIFACTS: ${{ runner.temp }}/local-ydb-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          EXPECTED_REVISION: ${{ steps.get-sha.outputs.SHA }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/local-ydb:${{ inputs.image_tag || 'trunk' }}
        run: bash main/.github/docker/tests/run_acceptance_tests.sh

      - name: Upload Docker acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-ydb-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore

      - name: Push accepted docker image
        env:
          ACCEPTED_IMAGE: ghcr.io/${{ github.repository_owner }}/local-ydb:${{ inputs.image_tag || 'trunk' }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          accepted_image_id=$(docker image inspect --format '{{.Id}}' "$ACCEPTED_IMAGE")
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            tag_image_id=$(docker image inspect --format '{{.Id}}' "$tag")
            if [ "$tag_image_id" != "$accepted_image_id" ]; then
              echo "Tag $tag does not reference the accepted image $accepted_image_id"
              exit 1
            fi
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
