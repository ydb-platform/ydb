name: Build documentation

# Keep triggers in every supported branch; execute the build from main.
on:
  pull_request:
    paths:
      - 'ydb/docs/**'
      - '.github/workflows/docs_release_core.yaml'
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull Request number to build documentation'
        required: true
        type: string

jobs:
  build-docs:
    permissions:
      contents: read
    uses: ydb-platform/ydb/.github/workflows/docs_build_core.yaml@main
    with:
      pull_number: ${{ inputs.pull_number || '' }}
