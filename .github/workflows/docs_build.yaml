name: Build documentation

# Keep triggers in every supported branch; execute the build from main.
on:
  pull_request:
    paths:
      - 'ydb/docs/**'
      - 'ydb/**/*.proto'
      - 'yql/**/*.proto'
      - 'library/**/*.proto'
      - 'contrib/libs/protobuf/**/*.proto'
      - 'ydb/library/actors/core/executor_pool_basic_feature_flags.h'
      - '.github/workflows/docs_build.yaml'
      - '.github/workflows/docs_build_core.yaml'
      - '.github/workflows/docs_release.yaml'
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull Request number to build documentation'
        required: true
        type: string

jobs:
  build-docs:
    permissions:
      contents: read
    uses: ydb-platform/ydb/.github/workflows/docs_build_core.yaml@main
    with:
      pull_number: ${{ inputs.pull_number || '' }}
