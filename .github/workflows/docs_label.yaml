name: Label documentation PR

# SECURITY: this workflow runs in the privileged `pull_request_target` context
# but does NOT check out PR-controlled code. It only reads the PR file list and
# synchronizes the `documentation` label using the GITHUB_TOKEN. The actual
# documentation build is intentionally split out into `docs_build.yaml`, which
# runs in the fork-isolated `pull_request` context.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  sync-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Sync documentation label
        uses: actions/github-script@v8
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const hasDocs = files.some((file) => file.filename.startsWith('ydb/docs/'));

            if (hasDocs) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['documentation'],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: 'documentation',
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
