name: Release documentation

on:
  push:
    branches:
      - 'main'
      - 'stable-**'
    paths:
      - 'ydb/docs/**'
      - 'ydb/**/*.proto'
      - 'yql/**/*.proto'
      - 'library/**/*.proto'
      - 'contrib/libs/protobuf/**/*.proto'
      - 'ydb/library/actors/core/executor_pool_basic_feature_flags.h'
      - '.github/workflows/docs_release.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect feature flag generator
        id: feature_flags
        env:
          FEATURE_FLAG_DEFAULTS_ENABLED: ${{ vars.FEATURE_FLAG_DEFAULTS_ENABLED }}
        run: |
          if [[ -f ydb/docs/tools/feature_flags/requirements.txt && -f ydb/docs/tools/feature_flags/generate.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Feature flag generator is absent in this revision; skipping it for backward compatibility"
          fi
          if [[ "$FEATURE_FLAG_DEFAULTS_ENABLED" == "false" ]]; then
            echo "::notice::Feature flag defaults are disabled by the FEATURE_FLAG_DEFAULTS_ENABLED repository variable"
          fi

      - name: Set up Python for feature flag defaults
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate version-local feature flag defaults
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        run: |
          python -m pip install -r ydb/docs/tools/feature_flags/requirements.txt
          python -m unittest discover -s ydb/docs/tools/feature_flags -p 'test_*.py'
          python ydb/docs/tools/feature_flags/generate.py --catalog feature-flag-defaults.json

      - name: Upload feature flag inventory
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: feature-flag-defaults
          path: feature-flag-defaults.json

      - name: Build
        uses: diplodoc-platform/docs-build-action@v3
        with:
          revision: "${{ github.sha }}"
          src-root: ${{ vars.SRC_ROOT }}
          cli-version: "stable"
          use-ya-opensource: false

  upload:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    permissions: write-all
    steps:
      - name: Upload
        uses: diplodoc-platform/docs-upload-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-bucket: "common/${{ secrets.DOCS_PROJECT_NAME }}"
          storage-endpoint: ${{ vars.DOCS_AWS_ENDPOINT }}
          storage-access-key-id: ${{ secrets.DOCS_AWS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          storage-region: ${{ vars.DOCS_AWS_REGION }}

  release:
    needs: upload
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Extract version # turn branch name into version string
        id: extract_version
        shell: bash
        run: |
          echo "version=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" \
            | sed -e 's|stable-|v|g' -e 's|-|.|g' \
            >> $GITHUB_OUTPUT

      - name: Get default branch name
        id: get_default
        run: |
          default=$(curl -fsS \
            https://raw.githubusercontent.com/ydb-platform/ydb/refs/heads/main/ydb/docs/default-branch.txt)
          echo "DEFAULT_BRANCH=$default" >> $GITHUB_ENV

      - name: Set update-only-version # only skip default-branch commits
        id: set-update-only-version
        run: |
          current=${GITHUB_REF##*/}    # e.g. 'main' or 'stable-X'
          if [[ "$current" == "$DEFAULT_BRANCH" ]]; then
            echo "update_only_version=false" >> $GITHUB_ENV
          else
            echo "update_only_version=true"  >> $GITHUB_ENV
          fi

      - name: Release
        uses: diplodoc-platform/docs-release-action@v2
        with:
          revision: "${{ github.sha }}"
          version:  "${{ steps.extract_version.outputs.version }}"
          storage-bucket: ${{ secrets.DOCS_PROJECT_NAME }}
          storage-access-key-id: ${{ secrets.DOCS_AWS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          update-only-version: "${{ env.update_only_version }}"
