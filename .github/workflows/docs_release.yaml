name: Release documentation

# Keep push and manual triggers in each supported branch; execute from main.
on:
  push:
    branches:
      - 'main'
      - 'stable-**'
    paths:
      - 'ydb/docs/**'
      - 'ydb/**/*.proto'
      - 'yql/**/*.proto'
      - 'library/**/*.proto'
      - 'contrib/libs/protobuf/**/*.proto'
      - 'ydb/library/actors/core/executor_pool_basic_feature_flags.h'
      - '.github/workflows/docs_release.yaml'
      - '.github/workflows/docs_release_core.yaml'
  workflow_dispatch:

jobs:
  release-docs:
    permissions: write-all
    uses: ydb-platform/ydb/.github/workflows/docs_release_core.yaml@main
    secrets: inherit
