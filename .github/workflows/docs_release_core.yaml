name: Release documentation core

# Called from the branch being published; checkout and github.ref stay on
# that branch. The caller must pass release secrets and write permissions.
on:
  workflow_call:

jobs:
  check-docs-changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check whether documentation changed
        id: check
        shell: bash
        env:
          FEATURE_FLAG_DEFAULTS_ENABLED: ${{ vars.FEATURE_FLAG_DEFAULTS_ENABLED }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$FEATURE_FLAG_DEFAULTS_ENABLED" != "false" || "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          diff_dir="$RUNNER_TEMP/docs-source-diff"
          git -C "$RUNNER_TEMP" init -q "$diff_dir"
          git -C "$diff_dir" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if ! git -C "$diff_dir" fetch -q --no-tags --depth=1 --filter=blob:none origin "$BEFORE_SHA" "$GITHUB_SHA"; then
            echo "::warning::Could not fetch commits to inspect changed files; building documentation"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed_files=$(git -C "$diff_dir" diff --name-only --no-renames "$BEFORE_SHA" "$GITHUB_SHA"); then
            echo "::warning::Could not inspect changed files; building documentation"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(ydb/docs/|\.github/workflows/docs_)' <<< "$changed_files"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping documentation release for code-only changes while feature flag defaults are disabled"
          fi

  build:
    needs: check-docs-changes
    if: needs.check-docs-changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    permissions: write-all
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect feature flag generator
        id: feature_flags
        run: |
          if [[ -f ydb/docs/tools/feature_flags/requirements.txt && -f ydb/docs/tools/feature_flags/generate.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Feature flag generator is absent in this branch; skipping it"
          fi

      - name: Set up Python for feature flag defaults
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate version-local feature flag defaults
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        run: |
          python -m pip install -r ydb/docs/tools/feature_flags/requirements.txt
          python -m unittest discover -s ydb/docs/tools/feature_flags -p 'test_*.py'
          python ydb/docs/tools/feature_flags/generate.py --catalog feature-flag-defaults.json

      - name: Upload feature flag inventory
        if: >-
          steps.feature_flags.outputs.present == 'true' &&
          vars.FEATURE_FLAG_DEFAULTS_ENABLED != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: feature-flag-defaults
          path: feature-flag-defaults.json

      - name: Build
        uses: diplodoc-platform/docs-build-action@v3
        with:
          revision: "${{ github.sha }}"
          src-root: ${{ vars.SRC_ROOT }}
          cli-version: "stable"
          use-ya-opensource: false

  upload:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    permissions: write-all
    steps:
      - name: Upload
        uses: diplodoc-platform/docs-upload-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-bucket: "common/${{ secrets.DOCS_PROJECT_NAME }}"
          storage-endpoint: ${{ vars.DOCS_AWS_ENDPOINT }}
          storage-access-key-id: ${{ secrets.DOCS_AWS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          storage-region: ${{ vars.DOCS_AWS_REGION }}

  release:
    needs: upload
    runs-on: ubuntu-latest
    concurrency:
      group: release-documentation-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Extract version # turn branch name into version string
        id: extract_version
        shell: bash
        run: |
          echo "version=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" \
            | sed -e 's|stable-|v|g' -e 's|-|.|g' \
            >> $GITHUB_OUTPUT

      - name: Get default branch name
        id: get_default
        run: |
          default=$(curl -fsS \
            https://raw.githubusercontent.com/ydb-platform/ydb/refs/heads/main/ydb/docs/default-branch.txt)
          echo "DEFAULT_BRANCH=$default" >> $GITHUB_ENV

      - name: Set update-only-version # only skip default-branch commits
        id: set-update-only-version
        run: |
          current=${GITHUB_REF##*/}    # e.g. 'main' or 'stable-X'
          if [[ "$current" == "$DEFAULT_BRANCH" ]]; then
            echo "update_only_version=false" >> $GITHUB_ENV
          else
            echo "update_only_version=true"  >> $GITHUB_ENV
          fi

      - name: Release
        uses: diplodoc-platform/docs-release-action@v2
        with:
          revision: "${{ github.sha }}"
          version:  "${{ steps.extract_version.outputs.version }}"
          storage-bucket: ${{ secrets.DOCS_PROJECT_NAME }}
          storage-access-key-id: ${{ secrets.DOCS_AWS_KEY_ID }}
          storage-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          update-only-version: "${{ env.update_only_version }}"
