name: Enterprise stable sync

on:
  schedule:
    - cron: "0 23 * * *"   # At 23:00 UTC / 02:00 MSK
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branches:
          - base: stable-26-2-1-ent
            head: stable-26-2-1
          - base: stable-26-3-1-ent
            head: stable-26-3-1
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            ydb/ci/

      - uses: ./.github/actions/rightlib_sync
        with:
          base_branch: ${{ matrix.branches.base }}
          head_branch: ${{ matrix.branches.head }}
          label: sync-ent
          repository: ${{ github.repository }}
          gh_personal_access_token: ${{ env.GH_TOKEN }}
