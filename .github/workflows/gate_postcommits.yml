name: Postcommits gate
on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:


jobs:
  switch_gate:
    runs-on: ubuntu-latest
    name: SwitchGate
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
        sparse-checkout: |
          .github/scripts/ci/gate_postcommits.sh
          .github/scripts/ci/postcommit_gate_summary.sh
        sparse-checkout-cone-mode: false

    - name: Switch gate
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
        POSTCOMMIT_QUEUE_THRESHOLD: ${{ vars.POSTCOMMIT_QUEUE_THRESHOLD }}
        POSTCOMMIT_GATE_CONFIG: ${{ vars.POSTCOMMIT_GATE_CONFIG }}
      run: bash .github/scripts/ci/gate_postcommits.sh
