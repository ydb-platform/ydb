name: Postcommits gate
on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:


jobs:
  switch_gate:
    runs-on: ubuntu-latest
    name: SwitchGate
    steps:
    - name: main
      shell: bash
      run: |
        # Only recent PR-check waits should close the postcommit gate.
        # - Ignore non-PR-check pull_request_target workflows (rebase, labels, …).
        # - Ignore zombie queued runs older than ignore_pr_check_older_than_hours
        #   from vars.POSTCOMMIT_GATE_CONFIG (default 6h).
        gate_config='${{ vars.POSTCOMMIT_GATE_CONFIG }}'
        max_age_hours=$(jq -r '.ignore_pr_check_older_than_hours // 6' <<<"${gate_config:-{}}")
        max_age_seconds=$(jq -n --argjson h "$max_age_hours" '$h * 3600')
        echo "Ignore PR-check older than: ${max_age_hours}h"

        queued_json=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{github.repository}}/actions/runs?per_page=1000\&page=1\&status=queued\&event=pull_request_target)

        queue_size=$(jq --argjson max_age "$max_age_seconds" '
          [.workflow_runs[]
            | select(.name == "PR-check")
            | . + {
                waiting_seconds: (now - (.updated_at | fromdate)),
                age_seconds: (now - (.created_at | fromdate))
              }
            | select(.waiting_seconds > 60 and .age_seconds <= $max_age)
          ] | length
        ' <<<"$queued_json")
        ignored_zombies=$(jq --argjson max_age "$max_age_seconds" '
          [.workflow_runs[]
            | select(.name == "PR-check")
            | select((now - (.updated_at | fromdate)) > 60)
            | select((now - (.created_at | fromdate)) > $max_age)
          ] | length
        ' <<<"$queued_json")
        echo "Queue size (PR-check, age<=${max_age_hours}h): $queue_size"
        echo "Ignored stale PR-check zombies: $ignored_zombies"
        echo "Queue threshold: ${{ vars.POSTCOMMIT_QUEUE_THRESHOLD }}"
        
        if (( queue_size > ${{ vars.POSTCOMMIT_QUEUE_THRESHOLD }} ));then
          echo "Close gate for postcommits"
          query='.runners[] | select(any(.labels[].name; .=="build-preset-relwithdebinfo" or .=="build-preset-asan" or .=="build-preset-tsan" or .=="build-preset-msan")) | select(any(.labels[].name; .=="postcommit")) | select((any(.labels[].name; startswith("pool:") and endswith("-postcommit"))) | not) | .id'
        else
          echo "Open gate for postcommits"
          query='.runners[] | select(any(.labels[].name; .=="build-preset-relwithdebinfo" or .=="build-preset-asan" or .=="build-preset-tsan" or .=="build-preset-msan")) | select(all(.labels[].name; .!="postcommit")) | .id'
        fi
        
        echo "Requesting a list of runners to update labels..."
        j1=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
          -H "X-GitHub-Api-Version: 2022-11-28" -w "%{http_code}\n" \
          https://api.github.com/repos/${{github.repository}}/actions/runners?per_page=100\&page=1)
        http_code=$(echo "$j1" | tail -n 1)
        echo "Result code: $http_code"
        if [ "$http_code" != "200" ];then
          echo "HTTP result code is not 200, exiting"
          echo "$j1"
          exit 1
        fi
        # echo "$j1"
        
        echo "$j1" | sed '$d' | jq "$query" | while read x;do
          echo "Runner: $x"
          if (( queue_size > ${{ vars.POSTCOMMIT_QUEUE_THRESHOLD }} ));then
            curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{github.repository}}/actions/runners/$x/labels/postcommit
          else
            curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{github.repository}}/actions/runners/$x/labels \
              -d '{"labels":["postcommit"]}'
          fi
        done
        echo "Runner labels synchronized"
