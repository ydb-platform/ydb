name: Postcommits gate
on:
  schedule:
    - cron: "*/5 * * * *"  # Every 5 minutes
  workflow_dispatch:


jobs:
  switch_gate:
    runs-on: ubuntu-latest
    name: SwitchGate
    steps:
    - name: main
      shell: bash
      run: |
        gate_config='${{ vars.POSTCOMMIT_GATE_CONFIG }}'
        if [ -z "$gate_config" ]; then
          gate_config='{}'
        fi
        max_age_hours=$(jq -r '.ignore_pr_check_older_than_hours // 6' <<<"$gate_config")
        max_age_seconds=$(jq -n --argjson h "$max_age_hours" '$h * 3600')
        queue_threshold='${{ vars.POSTCOMMIT_QUEUE_THRESHOLD }}'
        runs_per_page=300

        queued_json=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{github.repository}}/actions/runs?per_page=${runs_per_page}&page=1&status=queued&event=pull_request_target")

        pr_check_items=$(jq --argjson max_age "$max_age_seconds" '
          def fmt_duration:
            if . < 60 then "\(.|floor)s"
            elif . < 3600 then "\((./60)|floor)m"
            elif . < 86400 then "\((./3600)|floor)h \(((./60)|floor % 60))m"
            else "\((./86400)|floor)d \(((./3600)|floor % 24))h"
            end;
          [.workflow_runs[]
            | select((.name // "") == "PR-check")
            | . + {
                waiting_seconds: (now - (.updated_at | fromdate))
              }
            | select(.waiting_seconds > 60)
            | {
                id,
                title: (.display_title // .head_branch // ("run #" + (.id|tostring))),
                html_url,
                branch: (.pull_requests[0].base.ref // null),
                head_branch,
                head_owner: (.head_repository.owner.login // null),
                waiting: (.waiting_seconds | fmt_duration),
                waiting_seconds,
                ignored: (.waiting_seconds > $max_age)
              }
          ]
          | sort_by(-.waiting_seconds)
        ' <<<"$queued_json")

        pr_check_queue_size=$(jq 'length' <<<"$pr_check_items")
        queue_size=$(jq '[.[] | select(.ignored | not)] | length' <<<"$pr_check_items")
        ignored_stale=$(jq '[.[] | select(.ignored)] | length' <<<"$pr_check_items")

        echo "Queue size: $queue_size"
        echo "Queue threshold: $queue_threshold"

        if (( queue_size > queue_threshold )); then
          gate_action="closed"
          echo "Close gate for postcommits"
          query='.runners[] | select(any(.labels[].name; .=="build-preset-relwithdebinfo" or .=="build-preset-asan" or .=="build-preset-tsan" or .=="build-preset-msan")) | select(any(.labels[].name; .=="postcommit")) | select((any(.labels[].name; startswith("pool:") and endswith("-postcommit"))) | not) | .id'
        else
          gate_action="open"
          echo "Open gate for postcommits"
          query='.runners[] | select(any(.labels[].name; .=="build-preset-relwithdebinfo" or .=="build-preset-asan" or .=="build-preset-tsan" or .=="build-preset-msan")) | select(all(.labels[].name; .!="postcommit")) | .id'
        fi

        echo "Requesting a list of runners to update labels..."
        runners_json='{"runners":[]}'
        page=1
        while true; do
          page_json=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
            -H "X-GitHub-Api-Version: 2022-11-28" -w "\n%{http_code}" \
            "https://api.github.com/repos/${{github.repository}}/actions/runners?per_page=100&page=${page}")
          http_code=$(printf '%s\n' "$page_json" | tail -n 1)
          body=$(printf '%s\n' "$page_json" | sed '$d')
          echo "Runners page ${page} result code: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "HTTP result code is not 200, exiting"
            echo "$body"
            exit 1
          fi
          runners_json=$(jq -s '{runners: (.[0].runners + .[1].runners)}' <<<"$runners_json"$'\n'"$body")
          page_count=$(jq '.runners | length' <<<"$body")
          if [ "$page_count" -lt 100 ]; then
            break
          fi
          page=$((page + 1))
        done

        label_failures=0
        while read -r x; do
          [ -z "$x" ] && continue
          echo "Runner: $x"
          if (( queue_size > queue_threshold )); then
            response=$(curl --retry 5 --retry-delay 2 --retry-connrefused -sS -w "\n%{http_code}" -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{github.repository}}/actions/runners/$x/labels/postcommit" || true)
          else
            response=$(curl --retry 5 --retry-delay 2 --retry-connrefused -sS -w "\n%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{secrets.GH_PERSONAL_ACCESS_TOKEN}}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{github.repository}}/actions/runners/$x/labels" \
              -d '{"labels":["postcommit"]}' || true)
          fi
          label_http=$(printf '%s\n' "$response" | tail -n 1)
          if [ "$label_http" = "404" ]; then
            echo "Runner $x gone (404), skipping"
            continue
          fi
          if [[ ! "$label_http" =~ ^2[0-9][0-9]$ ]]; then
            echo "Failed to update runner $x: HTTP $label_http"
            printf '%s\n' "$response" | sed '$d'
            label_failures=$((label_failures + 1))
          fi
        done < <(jq -r "$query" <<<"$runners_json")

        echo "Runner labels synchronized"

        # Summary-only: resolve target branch when pull_requests[] is empty.
        enriched='[]'
        while IFS= read -r item; do
          [ -z "$item" ] && continue
          branch=$(jq -r '.branch // empty' <<<"$item")
          if [ -z "$branch" ]; then
            owner=$(jq -r '.head_owner // empty' <<<"$item")
            head=$(jq -r '.head_branch // empty' <<<"$item")
            if [ -n "$owner" ] && [ -n "$head" ]; then
              pulls_json=$(curl --retry 2 --retry-delay 1 --max-time 10 -sS -G \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{github.token}}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-urlencode "head=${owner}:${head}" \
                --data-urlencode "state=all" \
                --data-urlencode "per_page=5" \
                "https://api.github.com/repos/${{github.repository}}/pulls" || true)
              branch=$(jq -r '
                [.[].base.ref] | unique
                | if length == 1 then .[0] else empty end
              ' <<<"${pulls_json:-[]}" || true)
            fi
          fi
          if [ -z "$branch" ]; then
            branch='?'
          fi
          item=$(jq --arg branch "$branch" '.branch = $branch | del(.head_branch, .head_owner)' <<<"$item")
          enriched=$(jq -c --argjson item "$item" '. + [$item]' <<<"$enriched")
        done < <(jq -c '.[]' <<<"$pr_check_items")
        pr_check_items="$enriched"

        postcommit_fetch_ok=1
        postcommit_queued_json=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -Ls -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{github.repository}}/actions/runs?per_page=${runs_per_page}&page=1&status=queued&event=push") || postcommit_fetch_ok=0
        if (( postcommit_fetch_ok == 0 )); then
          echo "Failed to fetch queued postcommit runs; continuing with empty postcommit table"
          postcommit_queued_json='{"workflow_runs":[]}'
        fi

        postcommit_parse_ok=1
        postcommit_items=$(jq '
          def fmt_duration:
            if . < 60 then "\(.|floor)s"
            elif . < 3600 then "\((./60)|floor)m"
            elif . < 86400 then "\((./3600)|floor)h \(((./60)|floor % 60))m"
            else "\((./86400)|floor)d \(((./3600)|floor % 24))h"
            end;
          [.workflow_runs[]
            | (.name // "") as $name
            | select($name == "PR-check" or ($name | startswith("Postcommit_")))
            | . + {
                waiting_seconds: (now - (.updated_at | fromdate))
              }
            | select(.waiting_seconds > 60)
            | {
                id,
                name: $name,
                title: (.display_title // .head_branch // ("run #" + (.id|tostring))),
                html_url,
                branch: (.head_branch // "?"),
                waiting: (.waiting_seconds | fmt_duration),
                waiting_seconds
              }
          ]
          | sort_by(-.waiting_seconds)
        ' <<<"$postcommit_queued_json") || postcommit_parse_ok=0
        if (( postcommit_parse_ok == 0 )); then
          echo "Failed to parse queued postcommit runs"
          postcommit_items='[]'
          postcommit_fetch_ok=0
        fi
        postcommit_queue_size=$(jq 'length' <<<"$postcommit_items")
        echo "Postcommit queue size: $postcommit_queue_size"

        {
          echo "## Postcommit gate: ${gate_action}"
          echo ""
          echo "| | |"
          echo "|---|---|"
          echo "| Decision | **${gate_action}** |"
          echo "| Queue size | ${queue_size} (vars.POSTCOMMIT_QUEUE_THRESHOLD=${queue_threshold}) |"
          echo "| Max age filter | ${max_age_hours}h (vars.POSTCOMMIT_GATE_CONFIG.ignore_pr_check_older_than_hours) |"
          echo "| Ignored stale PR-check | ${ignored_stale} |"
          echo ""
          echo "### Queued PR-check (>60s): ${pr_check_queue_size} total, ${queue_size} in queue, ${ignored_stale} ignored"
          echo ""
          if (( pr_check_queue_size > 0 )); then
            echo "| Gate | Waiting | Branch | Run |"
            echo "|------|---------|--------|-----|"
            jq -r '
              def esc_cell: tostring | gsub("\\|"; "\\\\|") | gsub("\n"; " ");
              def esc_link: tostring | gsub("\\]"; "\\\\]") | gsub("\\|"; "\\\\|") | gsub("\n"; " ");
              .[]
              | (if .ignored then "ignored" else "counted" end) as $gate
              | (.title | esc_link) as $title
              | (if .ignored then "~~[\($title)](\(.html_url))~~" else "[\($title)](\(.html_url))" end) as $run
              | "| \($gate) | \(.waiting) | `\(.branch | esc_cell)` | \($run) |"
            ' <<<"$pr_check_items"
          else
            echo "_No queued PR-check runs._"
          fi
          echo ""
          if (( postcommit_fetch_ok == 0 )); then
            echo "### Queued postcommit (>60s): unavailable"
            echo ""
            echo "_Failed to fetch queued push runs._"
          else
            echo "### Queued postcommit (>60s): ${postcommit_queue_size}"
            echo ""
            if (( postcommit_queue_size > 0 )); then
              echo "| Waiting | Workflow | Branch | Run |"
              echo "|---------|----------|--------|-----|"
              jq -r '
                def esc_cell: tostring | gsub("\\|"; "\\\\|") | gsub("\n"; " ");
                def esc_link: tostring | gsub("\\]"; "\\\\]") | gsub("\\|"; "\\\\|") | gsub("\n"; " ");
                .[]
                | (.title | esc_link) as $title
                | "| \(.waiting) | `\(.name | esc_cell)` | `\(.branch | esc_cell)` | [\($title)](\(.html_url)) |"
              ' <<<"$postcommit_items"
            else
              echo "_No queued postcommit runs._"
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"

        if (( label_failures > 0 )); then
          echo "Label update failures: $label_failures"
          exit 1
        fi
