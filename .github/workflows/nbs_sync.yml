name: NBS stable sync

on:
  schedule:
    - cron: "0 20 * * *"   # At 20:00 UTC / 23:00 MSK
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.YDBOT_TOKEN }}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branches:
          - base: nbs-26-2-1
            head: stable-26-2-1
          - base: nbs-26-3-1
            head: stable-26-3-1
    steps:
      - name: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            ydb/ci/

      - name: Read source tag override
        id: source
        env:
          BASE_BRANCH: ${{ matrix.branches.base }}
        run: |
          tag=$(jq -er --arg branch "$BASE_BRANCH" '.[$branch] // ""' .github/config/nbs_sync_tags.json)
          if [[ -n "$tag" ]]; then
            git check-ref-format "refs/tags/$tag"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/rightlib_sync
        with:
          base_branch: ${{ matrix.branches.base }}
          head_branch: ${{ matrix.branches.head }}
          head_tag: ${{ steps.source.outputs.tag }}
          label: sync-nbs
          repository: ${{ github.repository }}
          gh_personal_access_token: ${{ env.GH_TOKEN }}
