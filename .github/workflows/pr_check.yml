name: PR-check
# PR_CHECK_SHARD_COUNT=auto turns sharding on for pull_request jobs.
# Set it to 1 to keep today's single build_and_test job. Postcommit stays unsharded.
env:
  PR_CHECK_SHARD_COUNT: auto
on:
  pull_request_target:
    branches:
      - 'main'
      - 'stable-*'
      - 'nbs-*'
      - 'prestable-*'
      - 'stream-nb-*'
      - 'dev-*'
      - 'rc-*'
      - 'q-stable-*'
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'
      - 'labeled'
  push:
    branches:
      - 'main'
      - 'stable-*'
      - 'nbs-*'
      - 'stream-nb-*'
    paths-ignore:
      - 'ydb/docs/**'
# Only 'rebase-and-check' and 'ok-to-test' labels should re-trigger checks.
# Other labels must not cancel running checks or start new ones.
# To achieve this we assign irrelevant label events a unique concurrency group
# (by appending run_id) so they never cancel an in-progress run, and the job-level
# condition below skips them immediately.
# Push (postcommit) runs get a per-run group so they never cancel each other.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request_target'
      && format('pr-{0}{1}', github.event.pull_request.number,
          github.event.action == 'labeled' && github.event.label.name != 'rebase-and-check' && github.event.label.name != 'ok-to-test' && format('-ignore-{0}', github.run_id) || '')
      || format('push-{0}-{1}', github.ref, github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  check-running-allowed:
    # Skip runs triggered by irrelevant labels (anything other than rebase-and-check / ok-to-test)
    if: ${{ github.event_name == 'pull_request_target' && (github.event.action != 'labeled' || github.event.label.name == 'rebase-and-check' || github.event.label.name == 'ok-to-test') && github.event.pull_request.state == 'open' && vars.CHECKS_SWITCH != '' && fromJSON(vars.CHECKS_SWITCH).pr_check == true }}
    runs-on: [self-hosted, tiny-worker]
    timeout-minutes: 600
    outputs:
      result: ${{ steps.check-ownership-membership.outputs.result == 'true' && steps.check-is-mergeable.outputs.result == 'true' }}
      commit_sha: ${{ steps.check-is-mergeable.outputs.commit_sha }}
    steps:
      - name: Reset integrated status
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
            -d '{"state":"pending","description":"Waiting for relevant checks to complete","context":"checks_integrated","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

      - name: Check if running tests is allowed
        id: check-ownership-membership
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          script: |
            const labels = context.payload.pull_request.labels;
            const okToTestLabel = labels.find(
              label => label.name == 'ok-to-test'
            );
            
            console.log("okToTestLabel=%o", okToTestLabel !== undefined);
            
            if (okToTestLabel !== undefined) {
              return true;
            }
            
            // This is used primarily in forks. Repository owner
            // should be allowed to run anything.
            const userLogin = context.payload.pull_request.user.login;
            
            // How to interpret membership status code:
            // https://docs.github.com/rest/collaborators/collaborators#check-if-a-user-is-a-repository-collaborator
            const isRepoCollaborator = async function () {
              try {
                const response = await github.rest.repos.checkCollaborator({
                  owner: context.payload.repository.owner.login,
                  repo: context.payload.repository.name,
                  username: userLogin,
                });
                return response.status == 204;
              } catch (error) {
                if (error.status && error.status == 404) {
                  return false;
                }
                throw error;
              }
            }
            
            if (context.payload.repository.owner.login == userLogin) {
              console.log("You are the repository owner!");
              return true;
            }
            
            if (await isRepoCollaborator()) {
              console.log("You are a collaborator!");
              return true;
            }
            
            return false;
      - name: comment-if-waiting-on-ok
        if: steps.check-ownership-membership.outputs.result == 'false' &&
            github.event.action == 'opened'
        uses: actions/github-script@v8
        with:
          script: |
            let externalContributorLabel = 'external';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Hi! Thank you for contributing!\nThe tests on this PR will run after a maintainer adds an `ok-to-test` label to this PR manually. Thank you for your patience!'
            });

            github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.issue.number,
                labels: [externalContributorLabel]
            });

      - name: cleanup-test-label
        uses: actions/github-script@v8
        with:
          script: |
            let labelsToRemove = ['ok-to-test', 'rebase-and-check'];
            const prNumber = context.payload.pull_request.number;
            const prLabels = new Set(context.payload.pull_request.labels.map(l => l.name));
            for await (const label of labelsToRemove.filter(l => prLabels.has(l))) {
              core.info(`remove label=${label} for pr=${prNumber}`);
              try {
                const result = await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: prNumber,
                  name: label
                });
              } catch(error) {
                // ignore the 404 error that arises
                // when the label did not exist for the
                // organization member
                if (error.status && error.status != 404) {
                  throw error;
                }
              }
            }
      - name: check is mergeable
        id: check-is-mergeable
        if: steps.check-ownership-membership.outputs.result == 'true'
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: |
            let pr = context.payload.pull_request;
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            const header = `<!-- merge pr=${pr.number} -->\n`;
            
            const fail_msg = header + ':red_circle: Unable to merge your PR into the base branch. '
                + 'Please rebase or merge it with the base branch.'
            
            let i = 0;
            
            while (pr.mergeable == null && i < 60) {
                console.log("get pull-request status");
    
                let result = await github.rest.pulls.get({
                    ...context.repo,
                    pull_number: pr.number
                })
            
                pr = result.data;
              
                if (pr.mergeable == null) {
                  await delay(5000);
                }
            
                i += 1;
            }
            
            console.log("pr.mergeable=%o", pr.mergeable);
            
            if (pr.mergeable === null) {
                core.setFailed("Unable to check if the PR is mergeable, please re-run the check.");
                return false;
            }
            
            const { data: comments } = await github.rest.issues.listComments({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo
            });
            
            const commentToUpdate = comments.find(comment => comment.body.startsWith(header));
            
            if (!pr.mergeable) {
                let commentParams = {
                    ...context.repo,
                    issue_number: context.issue.number,
                    body: fail_msg
                };
            
                if (commentToUpdate) {
                    await github.rest.issues.updateComment({
                        ...commentParams,
                        comment_id: commentToUpdate.id,
                    });
                } else {
                    await github.rest.issues.createComment({...commentParams});
                }
                core.setFailed("Merge conflict detected");
                return false;
            } else if (commentToUpdate) {
                await github.rest.issues.deleteComment({
                    ...context.repo,
                    issue_number: context.issue.number,
                    comment_id: commentToUpdate.id,
                });
            }
            core.info(`commit_sha=${pr.commit_sha}`);
            core.setOutput('commit_sha', pr.merge_commit_sha);
            return true;
  build_and_test:
    needs:
      - check-running-allowed
    if: github.event_name == 'pull_request_target' && env.PR_CHECK_SHARD_COUNT == '1' && needs.check-running-allowed.outputs.result == 'true' && needs.check-running-allowed.outputs.commit_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_preset: relwithdebinfo
            threads_count: 52
            timeout: 240
            build_target: "ydb/"
            test_size: small,medium
          - build_preset: release-asan
            threads_count: 52
            timeout: 240
            build_target: "ydb/"
            test_size: small,medium
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', matrix.build_preset) }}" ]
    name: Build and test ${{ matrix.build_preset }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.check-running-allowed.outputs.commit_sha }}
        fetch-depth: 2
        # Fork code is checked out only after the check-running-allowed gate
        # (collaborator/owner or a maintainer-applied `ok-to-test` label)
        allow-unsafe-pr-checkout: true
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}
    - name: Build and test
      if: |
          (matrix.build_preset == 'release-asan') || 
          (matrix.build_preset == 'relwithdebinfo') || 
            
            (matrix.build_preset == 'release-tsan' && 
            contains(github.event.pull_request.labels.*.name, 'run-tsan-tests') || 
            contains(github.event.pull_request.labels.*.name, 'run-sanitizer-tests')) || 
            
            (matrix.build_preset == 'release-msan' && 
            contains(github.event.pull_request.labels.*.name, 'run-msan-tests') || 
            contains(github.event.pull_request.labels.*.name, 'run-sanitizer-tests'))
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ matrix.build_preset }}
        build_target: ${{ matrix.build_target }}
        increment: true
        run_tests: ${{ contains(fromJSON('["relwithdebinfo", "release-asan", "release-tsan", "release-msan"]'), matrix.build_preset) }}
        test_size: ${{ matrix.test_size }}
        test_threads: ${{ matrix.threads_count }}
        put_build_results_to_cache: true
        additional_ya_make_args: -DDEBUGINFO_LINES_ONLY # we don't need full symbols in CI checks
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
  postcommit_build_and_test:
    if: >-
      github.event_name == 'push'
      && vars.CHECKS_SWITCH != ''
      && (fromJSON(vars.CHECKS_SWITCH).postcommit_relwithdebinfo == true
          || fromJSON(vars.CHECKS_SWITCH).postcommit_asan == true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_preset: relwithdebinfo
            switch_key: postcommit_relwithdebinfo
          - build_preset: release-asan
            switch_key: postcommit_asan
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', matrix.build_preset) }}", postcommit ]
    name: Postcommit · Build and test ${{ matrix.build_preset }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 2
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}
    - name: Build and test
      if: fromJSON(vars.CHECKS_SWITCH)[matrix.switch_key] == true
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ matrix.build_preset }}
        build_target: "ydb/"
        increment: true
        run_tests: true
        test_size: small,medium
        test_threads: 52
        put_build_results_to_cache: true
        additional_ya_make_args: -DDEBUGINFO_LINES_ONLY # we don't need full symbols in CI checks
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
  prepare_shard_graph:
    needs: check-running-allowed
    if: github.event_name == 'pull_request_target' && env.PR_CHECK_SHARD_COUNT != '1' && needs.check-running-allowed.outputs.result == 'true' && needs.check-running-allowed.outputs.commit_sha != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_preset: relwithdebinfo
            threads_count: 52
            build_target: "ydb/"
            test_size: small,medium
          - build_preset: release-asan
            threads_count: 52
            build_target: "ydb/"
            test_size: small,medium
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', matrix.build_preset) }}" ]
    name: Prepare graph ${{ matrix.build_preset }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.check-running-allowed.outputs.commit_sha }}
        fetch-depth: 2
        allow-unsafe-pr-checkout: true
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}
    - name: Save increment graph
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ matrix.build_preset }}
        build_target: ${{ matrix.build_target }}
        increment: true
        run_tests: false
        save_test_graph: true
        publish_github_status: false
        test_size: ${{ matrix.test_size }}
        test_threads: ${{ matrix.threads_count }}
        put_build_results_to_cache: true
        additional_ya_make_args: -DDEBUGINFO_LINES_ONLY
        pull_number: ${{ github.event.pull_request.number }}
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
    - name: Choose host count and plan shards
      id: plan
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        requested='${{ env.PR_CHECK_SHARD_COUNT }}'
        plan_args=(
          --graph graph.json
          --context context.json
          --threads "${{ matrix.threads_count }}"
          -o shard_plan.json
          --summary shard_plan.md
        )
        if [ "$requested" = "auto" ]; then
          plan_args+=(--shard-count auto --preset-label "build-preset-${{ matrix.build_preset }}")
        else
          plan_args+=(--shard-count "$requested")
        fi
        python3 .github/scripts/tests/shard_graph.py plan "${plan_args[@]}"
        cat shard_plan.md >> "$GITHUB_STEP_SUMMARY"
        python3 - << 'PY'
        import json
        from pathlib import Path
        plan = json.loads(Path("shard_plan.json").read_text())
        count = int(plan["shard_count"])
        Path("active_count.txt").write_text(str(count))
        PY
        echo "active_shard_count=$(cat active_count.txt)" >> "$GITHUB_OUTPUT"
    - name: Run the single job
      if: steps.plan.outputs.active_shard_count == '1'
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ matrix.build_preset }}
        build_target: ${{ matrix.build_target }}
        increment: false
        run_tests: true
        skip_graph_compare: true
        prebuilt_graph_path: graph.json
        prebuilt_context_path: context.json
        test_size: ${{ matrix.test_size }}
        test_threads: ${{ matrix.threads_count }}
        put_build_results_to_cache: true
        additional_ya_make_args: -DDEBUGINFO_LINES_ONLY
        pull_number: ${{ github.event.pull_request.number }}
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
    - name: Upload graph and plan
      if: steps.plan.outputs.active_shard_count != ''
      uses: actions/upload-artifact@v4
      with:
        name: pr-check-graph-${{ matrix.build_preset }}-${{ github.run_id }}
        retention-days: 7
        path: |
          graph.json
          context.json
          shard_plan.json
          shard_plan.md

  expand_shards:
    needs: [check-running-allowed, prepare_shard_graph]
    if: always() && github.event_name == 'pull_request_target' && env.PR_CHECK_SHARD_COUNT != '1' && needs.prepare_shard_graph.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_shards: ${{ steps.matrix.outputs.has_shards }}
      include: ${{ steps.matrix.outputs.include }}
    steps:
    - name: Download plans
      uses: actions/download-artifact@v4
      with:
        pattern: pr-check-graph-*
        path: graphs
    - name: Build shard matrix
      id: matrix
      run: |
        python3 - << 'PY'
        import json
        from pathlib import Path
        rows = []
        for plan_path in Path("graphs").glob("*/shard_plan.json"):
            plan = json.loads(plan_path.read_text())
            if int(plan.get("shard_count") or 0) <= 1:
                continue
            preset = ""
            # Artifact directory is pr-check-graph-<preset>-<run_id>.
            name = plan_path.parent.name
            marker = "pr-check-graph-"
            if name.startswith(marker):
                rest = name[len(marker):]
                preset = rest.rsplit("-", 1)[0]
            for shard in plan.get("shards") or []:
                rows.append({
                    "build_preset": preset,
                    "shard_id": int(shard["id"]),
                    "threads_count": int(plan.get("threads") or 52),
                })
        Path("include.json").write_text(json.dumps(rows))
        print(json.dumps(rows))
        PY
        if [ "$(python3 -c 'import json; print(len(json.load(open("include.json"))))')" = "0" ]; then
          echo "has_shards=false" >> "$GITHUB_OUTPUT"
          echo 'include=[{"build_preset":"relwithdebinfo","shard_id":0,"threads_count":52}]' >> "$GITHUB_OUTPUT"
        else
          echo "has_shards=true" >> "$GITHUB_OUTPUT"
          echo "include=$(cat include.json)" >> "$GITHUB_OUTPUT"
        fi

  test_shard:
    needs: [check-running-allowed, prepare_shard_graph, expand_shards]
    if: needs.expand_shards.result == 'success' && needs.expand_shards.outputs.has_shards == 'true'
    name: Test ${{ matrix.build_preset }} shard ${{ matrix.shard_id }}
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', matrix.build_preset) }}" ]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.expand_shards.outputs.include) }}
    steps:
    - name: Record shard start
      run: echo "SHARD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ needs.check-running-allowed.outputs.commit_sha }}
        fetch-depth: 2
        allow-unsafe-pr-checkout: true
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
        ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}
    - name: Download graph and plan
      uses: actions/download-artifact@v4
      with:
        name: pr-check-graph-${{ matrix.build_preset }}-${{ github.run_id }}
        path: test-graph
    - name: Filter graph for shard ${{ matrix.shard_id }}
      run: |
        mkdir -p shard_graph
        python3 .github/scripts/tests/shard_graph.py filter \
          --graph test-graph/graph.json \
          --context test-graph/context.json \
          --plan test-graph/shard_plan.json \
          --shard-id "${{ matrix.shard_id }}" \
          -o shard_graph/graph.json \
          --context-output shard_graph/context.json
    - name: Run shard tests
      id: run_tests
      uses: ./.github/actions/build_and_test_ya
      with:
        build_preset: ${{ matrix.build_preset }}
        build_target: ydb/
        increment: false
        run_tests: true
        skip_graph_compare: true
        prebuilt_graph_path: shard_graph/graph.json
        prebuilt_context_path: shard_graph/context.json
        s3_subdir: shard_${{ matrix.shard_id }}
        publish_github_status: false
        test_size: small,medium
        test_threads: ${{ matrix.threads_count }}
        put_build_results_to_cache: true
        additional_ya_make_args: -DDEBUGINFO_LINES_ONLY
        pull_number: ${{ github.event.pull_request.number }}
        secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
          secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
        vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
          vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
    - name: Publish shard progress
      if: always()
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SHARD_ID: ${{ matrix.shard_id }}
        SHARD_RESULT: ${{ steps.run_tests.outcome }}
      run: |
        finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        job_url=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
          | jq -r --arg needle "shard ${SHARD_ID}" --arg preset "${{ matrix.build_preset }}" \
            '[.jobs[] | select(.name | contains($preset) and contains($needle)) | .html_url] | first // empty' || true)
        if [ -z "${job_url:-}" ]; then
          job_url="$run_url"
        fi
        count=$(python3 -c 'import json; print(json.load(open("test-graph/shard_plan.json"))["shard_count"])')
        python3 .github/scripts/tests/shard_progress.py publish \
          --pr "$PR_NUMBER" \
          --run-id "$GITHUB_RUN_ID" \
          --preset "${{ matrix.build_preset }}" \
          --target "ydb/" \
          --shard-id "$SHARD_ID" \
          --shard-count "$count" \
          --result "${SHARD_RESULT:-failure}" \
          --started-at "${SHARD_STARTED_AT}" \
          --finished-at "$finished_at" \
          --job-url "$job_url" \
          --run-url "$run_url" \
          --log-prefix "shard_${SHARD_ID}" \
          --report "${LAST_BUILD_RESULTS_REPORT:-}" \
          --summary-file "$GITHUB_STEP_SUMMARY"

  shard_result:
    needs: [check-running-allowed, prepare_shard_graph, test_shard]
    if: always() && github.event_name == 'pull_request_target' && env.PR_CHECK_SHARD_COUNT != '1' && needs.check-running-allowed.outputs.result == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout progress script
      if: always()
      uses: actions/checkout@v5
      with:
        sparse-checkout: .github/scripts/tests
    - name: Reconcile shard comments
      if: always() && needs.prepare_shard_graph.result == 'success'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        for preset in relwithdebinfo release-asan; do
          python3 .github/scripts/tests/shard_progress.py finalize \
            --pr "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --preset "$preset" \
            --summary-file "$GITHUB_STEP_SUMMARY" || true
        done
    - name: Post preset statuses
      if: always() && needs.prepare_shard_graph.result == 'success'
      env:
        GITHUB_TOKEN: ${{ github.token }}
        STATUS_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        jobs=$(curl --retry 5 --retry-all-errors --retry-delay 2 -sS \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")
        post() {
          curl --retry 5 --retry-all-errors --retry-delay 2 -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
            -d "$1"
        }
        for preset in relwithdebinfo release-asan; do
          shard_total=$(printf '%s' "$jobs" | jq --arg preset "$preset" '[.jobs[] | select(.name | startswith("Test " + $preset + " shard"))] | length')
          if [ "$shard_total" = "0" ]; then
            echo "$preset used the single job; statuses already posted"
            continue
          fi
          bad=$(printf '%s' "$jobs" | jq --arg preset "$preset" '[.jobs[] | select(.name | startswith("Test " + $preset + " shard")) | select(.conclusion != "success")] | length')
          if [ "$bad" = "0" ]; then
            state=success
            test_message="The check has been completed successfully"
          else
            state=failure
            test_message="The check has been failed"
          fi
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          post "{\"state\":\"success\",\"description\":\"Shard builds finished\",\"context\":\"build_${preset}\",\"target_url\":\"${target}\"}"
          post "{\"state\":\"${state}\",\"description\":\"${test_message}\",\"context\":\"test_${preset}\",\"target_url\":\"${target}\"}"
        done
    - name: Fail unless every shard succeeded
      if: always()
      run: |
        prepare="${{ needs.prepare_shard_graph.result }}"
        shards="${{ needs.test_shard.result }}"
        echo "prepare_shard_graph=$prepare test_shard=$shards"
        if [ "$prepare" != "success" ]; then
          echo "Graph prepare failed."
          exit 1
        fi
        if [ "$shards" != "success" ] && [ "$shards" != "skipped" ]; then
          echo "A shard failed. See the PR comment and jobs named 'Test <preset> shard N'."
          exit 1
        fi

  update_integrated_status:
    runs-on: [self-hosted, tiny-worker]
    needs: [build_and_test, prepare_shard_graph, shard_result]
    if: >-
      always() &&
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.state == 'open' &&
      (
        needs.build_and_test.result == 'success' ||
        needs.build_and_test.result == 'failure' ||
        needs.prepare_shard_graph.result == 'success' ||
        needs.prepare_shard_graph.result == 'failure' ||
        needs.shard_result.result == 'success' ||
        needs.shard_result.result == 'failure'
      )
    steps:
      - name: Gather required checks results
        shell: bash
        run: |
          integrated_status=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X GET -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/commits/${{github.event.pull_request.head.sha}}/status | \
            jq -cr '
              .statuses
              | group_by(.context)
              | map(.[0])
              | map(select(.context | (
                  startswith("build_relwithdebinfo")
                  or startswith("build_release-asan")
                  or startswith("test_relwithdebinfo")
                  or startswith("test_release-asan")
                )))
              | if length == 4 and all(.state == "success") then "success" else "failure" end
            ')
          curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{github.token}}" -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{github.repository}}/statuses/${{github.event.pull_request.head.sha}} \
            -d '{"state":"'$integrated_status'","description":"All checks completed","context":"checks_integrated","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
