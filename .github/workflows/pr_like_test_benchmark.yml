name: PR-check-benchmark-no-cache

on:
  schedule:
    # GitHub Actions cron uses UTC: 22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  # Keep runner and build/test settings in sync with the build_and_test job in pr_check.yml.
  # Experiment: 128-core runner, four linkers, and CPU requirements from #56768.
  # Run the full configured test selection with remote cache reads/writes disabled.
  benchmark:
    name: Build and test relwithdebinfo
    runs-on: [self-hosted, auto-provisioned, build-preset-relwithdebinfo-xxl]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build and test
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: relwithdebinfo
          build_target: ydb/
          increment: false
          run_tests: true
          test_size: small,medium
          test_threads: 128
          link_threads: 4
          put_build_results_to_cache: false
          additional_ya_make_args: --no-bazel-remote-store -DDEBUGINFO_LINES_ONLY # we don't need full symbols in CI checks
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"","GH_ALERTS_TG_LOGINS":"{2}","GH_ALERTS_TG_CHAT":"{3}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT) }}
