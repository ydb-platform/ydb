# Fat-runner executor bootstrap (nebius path). Branch-local rewrite of Run and debug tests
# so workflow_dispatch --ref works without a new WF file on main.
# Inputs mirror build_and_test_ya; code_ref selects which YDB SHA to test.
name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: 'YDB ref/SHA to build and test (empty = this workflow SHA)'
        required: false
        type: string
        default: ''
      build_target:
        description: 'limit build and test to specific target (build_and_test_ya.build_target)'
        required: false
        type: string
        default: 'ydb/'
      build_preset:
        description: 'Build preset (single value)'
        required: false
        type: string
        default: 'relwithdebinfo'
      run_tests:
        description: 'run tests'
        required: false
        type: boolean
        default: true
      increment:
        description: 'Compare build graphs with previous commit and run only affected tests'
        required: false
        type: boolean
        default: false
      test_size:
        description: 'Test size filter'
        required: false
        type: string
        default: 'small,medium'
      test_type:
        description: 'run only specific test types (empty = all)'
        required: false
        type: string
        default: ''
      test_threads:
        description: 'Test threads count'
        required: false
        type: string
        default: '64'
      link_threads:
        description: 'Link threads count'
        required: false
        type: string
        default: '2'
      test_retry_count:
        description: 'Max attempts including initial run (empty = action default)'
        required: false
        type: string
        default: ''
      additional_ya_make_args:
        description: 'Extra ya make args (DEBUGINFO_LINES_ONLY is always added)'
        required: false
        type: string
        default: ''
      put_build_results_to_cache:
        required: false
        type: boolean
        default: true
      collect_coredumps:
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-remote-executor-${{ inputs.code_ref || github.sha }}-${{ inputs.build_preset }}-${{ inputs.build_target }}
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Remote · ${{ inputs.build_preset }} · ${{ inputs.build_target }}
    runs-on: [self-hosted, build-preset-relwithdebinfo-fat]
    timeout-minutes: 360
    steps:
      - name: Resolve refs
        id: ref
        shell: bash
        run: |
          code_ref='${{ inputs.code_ref }}'
          if [ -z "$code_ref" ]; then
            code_ref='${{ github.sha }}'
          fi
          echo "code=$code_ref" >> "$GITHUB_OUTPUT"
          echo "ci=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          # Increment needs prior commits for graph compare.
          if [ '${{ inputs.increment }}' = 'true' ]; then
            echo "fetch_depth=0" >> "$GITHUB_OUTPUT"
          else
            echo "fetch_depth=2" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### CI remote executor"
            echo "- **code ref:** \`$code_ref\`"
            echo "- **ci ref:** \`${{ github.sha }}\`"
            echo "- **preset:** \`${{ inputs.build_preset }}\`"
            echo "- **target:** \`${{ inputs.build_target }}\`"
            echo "- **increment:** \`${{ inputs.increment }}\`"
            echo "- **run_tests:** \`${{ inputs.run_tests }}\`"
            echo "- **test_size:** \`${{ inputs.test_size }}\`"
            echo "- **runner:** \`build-preset-relwithdebinfo-fat\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout YDB code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.code }}
          fetch-depth: ${{ steps.ref.outputs.fetch_depth }}

      - name: Overlay CI from executor workflow ref
        if: steps.ref.outputs.code != steps.ref.outputs.ci
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ci }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/config
          sparse-checkout-cone-mode: false
          path: .executor-ci

      - name: Apply CI overlay
        if: steps.ref.outputs.code != steps.ref.outputs.ci
        shell: bash
        run: |
          set -euo pipefail
          rsync -a .executor-ci/.github/actions/ .github/actions/
          rsync -a .executor-ci/.github/scripts/ .github/scripts/
          rsync -a .executor-ci/.github/config/ .github/config/
          rm -rf .executor-ci

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build and test
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          build_target: ${{ inputs.build_target }}
          run_tests: ${{ inputs.run_tests }}
          increment: ${{ inputs.increment }}
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ inputs.test_threads }}
          link_threads: ${{ inputs.link_threads }}
          test_retry_count: ${{ inputs.test_retry_count }}
          put_build_results_to_cache: ${{ inputs.put_build_results_to_cache }}
          collect_coredumps: ${{ inputs.collect_coredumps }}
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ inputs.additional_ya_make_args }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
