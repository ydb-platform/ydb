name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = current runners via run_tests; remote = isolated fat runner (same-repo bootstrap of CI remote executor)'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      code_ref:
        description: 'Git ref/SHA to checkout for executor=remote (empty = this workflow SHA)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'Paths to tests (e.g., "ydb/library/actors/util/ut")'
        required: false
        type: string
        default: 'ydb/library/actors/util/ut'
      build_preset:
        description: 'Build preset types (comma-separated for ydb_yc; single for remote)'
        required: false
        type: string
        default: 'relwithdebinfo'
      branches:
        description: 'Branches to test (ydb_yc only; empty = current)'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'Use .github/config/stable_tests_branches.json (ydb_yc only)'
        required: false
        type: boolean
        default: false

jobs:
  # Same-repo bootstrap of generic remote executor (later: dispatch to nebius / ci_remote_executor.yml).
  remote_build_and_test:
    if: inputs.executor == 'remote'
    name: Remote · debug · ${{ inputs.build_preset }}
    runs-on: [self-hosted, build-preset-relwithdebinfo-fat]
    timeout-minutes: 360
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          code_ref='${{ inputs.code_ref }}'
          if [ -z "$code_ref" ]; then
            code_ref='${{ github.sha }}'
          fi
          # remote path: first preset if comma-separated
          preset='${{ inputs.build_preset }}'
          preset="${preset%%,*}"
          preset="$(echo "$preset" | xargs)"
          echo "value=$code_ref" >> "$GITHUB_OUTPUT"
          echo "preset=$preset" >> "$GITHUB_OUTPUT"
          {
            echo "### CI remote executor (same-repo bootstrap)"
            echo "- **code ref:** \`$code_ref\`"
            echo "- **preset:** \`$preset\`"
            echo "- **targets:** \`${{ inputs.test_targets }}\`"
            echo "- **runner:** \`build-preset-relwithdebinfo-fat\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 2

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build and test
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ steps.ref.outputs.preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_tests: true
          test_retry_count: 1
          test_size: small,medium
          test_threads: 64
          put_build_results_to_cache: true
          collect_coredumps: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
            echo "Converted '${{ inputs.branches }}' to $JSON_BRANCHES"
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi

          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
            echo "Converted '$BUILD_PRESET_INPUT' to $JSON_PRESETS"
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
