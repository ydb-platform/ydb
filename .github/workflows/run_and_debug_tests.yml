# Branch-local rewrite: this file on THIS branch acts as the remote CI executor.
# Dispatch from another branch via (workflow already exists on main, so --ref works):
#   gh workflow run "Run and debug tests" --ref <this-branch> -f test_targets=... -f code_ref=...
name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: 'Git ref or SHA to checkout and test (empty = this workflow SHA)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'ya make / test targets'
        required: false
        type: string
        default: 'ydb/library/actors/util/ut'
      build_preset:
        description: 'Build preset (single value; match main input name for API dispatch)'
        required: false
        type: string
        default: 'relwithdebinfo'
      test_size:
        description: 'Test size filter'
        required: false
        type: string
        default: 'small,medium'
      test_threads:
        description: 'Test threads'
        required: false
        type: string
        default: '64'
      kind:
        description: 'Run kind tag (debug|postcommit|…)'
        required: false
        type: string
        default: 'debug'

concurrency:
  group: ci-remote-executor-${{ inputs.code_ref || github.sha }}-${{ inputs.build_preset }}-${{ inputs.kind }}
  cancel-in-progress: false

jobs:
  build_and_test:
    name: Remote · ${{ inputs.kind }} · ${{ inputs.build_preset }}
    runs-on: [self-hosted, build-preset-relwithdebinfo-fat]
    timeout-minutes: 360
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          code_ref='${{ inputs.code_ref }}'
          if [ -z "$code_ref" ]; then
            code_ref='${{ github.sha }}'
          fi
          echo "value=$code_ref" >> "$GITHUB_OUTPUT"
          {
            echo "### CI remote executor"
            echo "- **code ref:** \`$code_ref\`"
            echo "- **preset:** \`${{ inputs.build_preset }}\`"
            echo "- **targets:** \`${{ inputs.test_targets }}\`"
            echo "- **kind:** \`${{ inputs.kind }}\`"
            echo "- **runner:** \`build-preset-relwithdebinfo-fat\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.value }}
          fetch-depth: 2

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build and test
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_tests: true
          test_retry_count: 1
          test_size: ${{ inputs.test_size }}
          test_threads: ${{ inputs.test_threads }}
          put_build_results_to_cache: true
          collect_coredumps: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

      # Caller (dispatch) can download this and paste into its own job summary.
      - name: Prepare step summary artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/executor-summary.md"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" "$out"
          else
            echo "_No GITHUB_STEP_SUMMARY produced._" > "$out"
          fi
          echo "summary_file=$out" >> "$GITHUB_OUTPUT"
        id: summary_art

      - name: Upload step summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executor-summary
          path: ${{ steps.summary_art.outputs.summary_file }}
          if-no-files-found: warn
          retention-days: 14
