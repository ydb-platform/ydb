# Same-repo smoke twin of ci_remote_executor.yml (filename already on main).
# Dispatch target for executor=remote until nebius hosts the dedicated file.
name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: 'Git ref/SHA to checkout as the code under test (empty = this workflow SHA)'
        required: false
        type: string
        default: ''
      job_inputs:
        description: 'JSON object of build_and_test_ya public params (no secrets)'
        required: false
        type: string
        default: '{}'
      runs_on:
        description: 'JSON array of GitHub runs-on labels'
        required: false
        type: string
        default: '["self-hosted","build-preset-relwithdebinfo-fat"]'

concurrency:
  # Keep under GitHub's 400-char limit (do not embed full job_inputs JSON).
  group: ci-remote-executor-${{ inputs.code_ref || github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    name: build_and_test_ya · ${{ inputs.code_ref || github.sha }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 1200
    steps:
      - name: Parse job_inputs
        id: ya
        env:
          JOB_INPUTS: ${{ inputs.job_inputs }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ.get("JOB_INPUTS") or "{}"
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"::error::job_inputs is not valid JSON: {e}")
              sys.exit(1)
          if not isinstance(data, dict):
              print("::error::job_inputs must be a JSON object")
              sys.exit(1)

          def as_str(key, default=""):
              if key not in data or data[key] is None:
                  return default
              v = data[key]
              if isinstance(v, bool):
                  return "true" if v else "false"
              return str(v)

          defaults = {
              "build_target": "ydb/",
              "build_preset": "relwithdebinfo",
              "run_tests": "true",
              "increment": "false",
              "fetch_depth": "2",
              "test_size": "small,medium",
              "test_type": "",
              "test_threads": "64",
              "link_threads": "2",
              "test_retry_count": "",
              "additional_ya_make_args": "",
              "put_build_results_to_cache": "true",
              "collect_coredumps": "false",
              # Test-history / ya GIT_BRANCH identity (must NOT be executor ref name).
              "custom_branch_name": "",
              # PR attribution for analytics (workflow_dispatch has no github.event.number).
              "pull_number": "",
              "add_vcs_info": "false",
          }
          out = {k: as_str(k, d) for k, d in defaults.items()}
          if out["increment"].lower() in ("1", "true", "yes"):
              out["fetch_depth"] = "0"
          if not out["custom_branch_name"]:
              print(
                  "::warning::job_inputs.custom_branch_name is empty; "
                  "analytics may attribute this run to the executor workflow ref"
              )

          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Resolve refs
        id: ref
        shell: bash
        run: |
          code_ref='${{ inputs.code_ref }}'
          if [ -z "$code_ref" ]; then
            code_ref='${{ github.sha }}'
          fi
          echo "code=$code_ref" >> "$GITHUB_OUTPUT"
          echo "ci=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo "### CI remote executor"
            echo "- **code ref:** \`$code_ref\`"
            echo "- **ci ref:** \`${{ github.sha }}\`"
            echo "- **analytics branch:** \`${{ steps.ya.outputs.custom_branch_name }}\`"
            echo "- **pull number:** \`${{ steps.ya.outputs.pull_number }}\`"
            echo "- **preset:** \`${{ steps.ya.outputs.build_preset }}\`"
            echo "- **target:** \`${{ steps.ya.outputs.build_target }}\`"
            echo "- **runs_on:** \`${{ inputs.runs_on }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.code }}
          fetch-depth: ${{ steps.ya.outputs.fetch_depth }}

      - name: Overlay CI from executor workflow ref
        if: steps.ref.outputs.code != steps.ref.outputs.ci
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ci }}
          sparse-checkout: |
            .github/actions
            .github/scripts
            .github/config
          sparse-checkout-cone-mode: false
          path: .executor-ci

      - name: Apply CI overlay
        if: steps.ref.outputs.code != steps.ref.outputs.ci
        shell: bash
        run: |
          set -euo pipefail
          rsync -a .executor-ci/.github/actions/ .github/actions/
          rsync -a .executor-ci/.github/scripts/ .github/scripts/
          rsync -a .executor-ci/.github/config/ .github/config/
          rm -rf .executor-ci

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Build and test
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ steps.ya.outputs.build_preset }}
          build_target: ${{ steps.ya.outputs.build_target }}
          run_tests: ${{ steps.ya.outputs.run_tests }}
          increment: ${{ steps.ya.outputs.increment }}
          test_size: ${{ steps.ya.outputs.test_size }}
          test_type: ${{ steps.ya.outputs.test_type }}
          test_threads: ${{ steps.ya.outputs.test_threads }}
          link_threads: ${{ steps.ya.outputs.link_threads }}
          test_retry_count: ${{ steps.ya.outputs.test_retry_count }}
          put_build_results_to_cache: ${{ steps.ya.outputs.put_build_results_to_cache }}
          collect_coredumps: ${{ steps.ya.outputs.collect_coredumps }}
          custom_branch_name: ${{ steps.ya.outputs.custom_branch_name }}
          pull_number: ${{ steps.ya.outputs.pull_number }}
          add_vcs_info: ${{ steps.ya.outputs.add_vcs_info }}
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ steps.ya.outputs.additional_ya_make_args }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}
