name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = local runners; remote = dispatch fat executor on remote_executor_ref'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      remote_executor_ref:
        description: 'Git ref whose Run and debug tests.yml is the fat executor (default: dev/ci-remote-executor)'
        required: false
        type: string
        default: 'dev/ci-remote-executor'
      code_ref:
        description: 'YDB ref/SHA for executor to checkout+test (empty = this run SHA)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'Build/test target (remote: build_target; ydb_yc: test paths)'
        required: false
        type: string
        default: 'ydb/tests/olap/'
      build_preset:
        description: 'Build preset (comma-separated for ydb_yc; single for remote)'
        required: false
        type: string
        default: 'relwithdebinfo, release-asan'
      increment:
        description: 'remote only: compare graphs with previous commit (affected tests)'
        required: false
        type: boolean
        default: false
      test_size:
        description: 'remote only: test size filter'
        required: false
        type: string
        default: 'small,medium'
      test_type:
        description: 'remote only: test type filter (empty = all)'
        required: false
        type: string
        default: ''
      test_threads:
        description: 'remote only: test threads'
        required: false
        type: string
        default: '64'
      link_threads:
        description: 'remote only: link threads'
        required: false
        type: string
        default: '2'
      additional_ya_make_args:
        description: 'remote only: extra ya make args'
        required: false
        type: string
        default: ''
      test_retry_count:
        description: 'remote only: max attempts (empty = action default)'
        required: false
        type: string
        default: ''
      put_build_results_to_cache:
        description: 'remote only: put build results to cache'
        required: false
        type: boolean
        default: true
      collect_coredumps:
        description: 'remote only: collect coredumps'
        required: false
        type: boolean
        default: false
      run_tests:
        description: 'remote only: run tests'
        required: false
        type: boolean
        default: true
      branches:
        description: 'Branches to test (ydb_yc only)'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'Use stable_tests_branches.json (ydb_yc only)'
        required: false
        type: boolean
        default: false
      wait_for_remote:
        description: 'remote only: true = wait+mirror on runner-waiter; false = fire-and-forget'
        required: false
        type: boolean
        default: true

jobs:
  dispatch_remote:
    if: inputs.executor == 'remote'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      executor_run_id: ${{ steps.dispatch.outputs.executor_run_id }}
      executor_run_url: ${{ steps.dispatch.outputs.executor_run_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/dispatch_remote_executor
          sparse-checkout-cone-mode: false

      - name: Build executor inputs JSON
        id: payload
        env:
          CODE_REF: ${{ inputs.code_ref || github.sha }}
          BUILD_TARGET: ${{ inputs.test_targets }}
          BUILD_PRESET: ${{ inputs.build_preset }}
          RUN_TESTS: ${{ inputs.run_tests }}
          INCREMENT: ${{ inputs.increment }}
          TEST_SIZE: ${{ inputs.test_size }}
          TEST_TYPE: ${{ inputs.test_type }}
          TEST_THREADS: ${{ inputs.test_threads }}
          LINK_THREADS: ${{ inputs.link_threads }}
          ADDITIONAL_YA_MAKE_ARGS: ${{ inputs.additional_ya_make_args }}
          TEST_RETRY_COUNT: ${{ inputs.test_retry_count }}
          PUT_BUILD_RESULTS_TO_CACHE: ${{ inputs.put_build_results_to_cache }}
          COLLECT_COREDUMPS: ${{ inputs.collect_coredumps }}
        run: |
          python3 - <<'PY'
          import json, os
          preset = os.environ["BUILD_PRESET"].split(",")[0].strip() or "relwithdebinfo"
          job_inputs = {
              "build_target": os.environ["BUILD_TARGET"],
              "build_preset": preset,
              "run_tests": os.environ["RUN_TESTS"],
              "increment": os.environ["INCREMENT"],
              "test_size": os.environ["TEST_SIZE"],
              "test_type": os.environ["TEST_TYPE"],
              "test_threads": os.environ["TEST_THREADS"],
              "link_threads": os.environ["LINK_THREADS"],
              "additional_ya_make_args": os.environ["ADDITIONAL_YA_MAKE_ARGS"],
              "test_retry_count": os.environ["TEST_RETRY_COUNT"],
              "put_build_results_to_cache": os.environ["PUT_BUILD_RESULTS_TO_CACHE"],
              "collect_coredumps": os.environ["COLLECT_COREDUMPS"],
          }
          payload = {
              "code_ref": os.environ["CODE_REF"],
              "job": "build_and_test_ya",
              "job_inputs": json.dumps(job_inputs, separators=(",", ":")),
          }
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("inputs_json<<EOF\n")
              f.write(json.dumps(payload, ensure_ascii=False))
              f.write("\nEOF\n")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Dispatch CI remote executor
        id: dispatch
        uses: ./.github/actions/dispatch_remote_executor
        with:
          command: start
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          workflow_file: run_and_debug_tests.yml
          workflow_name: Run and debug tests
          executor_ref: ${{ inputs.remote_executor_ref }}
          inputs_json: ${{ steps.payload.outputs.inputs_json }}
          wait_mode: ${{ inputs.wait_for_remote && 'wait+mirror' || 'fire-and-forget' }}

  wait_remote:
    if: inputs.executor == 'remote' && inputs.wait_for_remote
    needs: dispatch_remote
    runs-on: [self-hosted, runner-waiter]
    timeout-minutes: 400
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
            .github/actions/dispatch_remote_executor
          sparse-checkout-cone-mode: false

      - name: Wait and mirror executor summary
        uses: ./.github/actions/dispatch_remote_executor
        with:
          command: wait
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          workflow_file: run_and_debug_tests.yml
          workflow_name: Run and debug tests
          executor_run_id: ${{ needs.dispatch_remote.outputs.executor_run_id }}
          executor_run_url: ${{ needs.dispatch_remote.outputs.executor_run_url }}
          aws_endpoint: ${{ vars.AWS_ENDPOINT }}
          aws_bucket: ${{ vars.AWS_BUCKET }}

      - name: Cancel executor on caller cancel
        if: cancelled() && needs.dispatch_remote.outputs.executor_run_id != ''
        uses: ./.github/actions/dispatch_remote_executor
        with:
          command: cancel
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          repository: ${{ github.repository }}
          workflow_file: run_and_debug_tests.yml
          workflow_name: Run and debug tests
          executor_run_id: ${{ needs.dispatch_remote.outputs.executor_run_id }}
          executor_run_url: ${{ needs.dispatch_remote.outputs.executor_run_url }}

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi
          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
