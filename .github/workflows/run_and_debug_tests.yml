name: Run and debug tests
run-name: >-
  ${{ inputs.executor == 'remote' && (
    inputs.pr_title != '' && inputs.pr_number != '' && format('{0} (#{1})', inputs.pr_title, inputs.pr_number)
    || inputs.caller_workflow_label != '' && format('Remote · {0}', inputs.caller_workflow_label)
    || 'Remote · Run and debug tests'
  ) || 'Run and debug tests' }}

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = local runners; remote = dispatch via opaque remote JSON'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      remote:
        description: 'remote only: JSON override for host/dispatch/job (empty = defaults)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'ydb_yc: paths to tests; also default remote.job.build_target when remote JSON omits it'
        required: false
        type: string
        default: 'ydb/tests/olap/'
      build_preset:
        description: 'ydb_yc: presets (comma-separated). remote: one preset only (this input or remote.job.build_preset); commas are rejected'
        required: false
        type: string
        default: 'relwithdebinfo, release-asan'
      branches:
        description: 'Branches to test (comma-separated or JSON array); ydb_yc only'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'If true, use branches from .github/config/stable_tests_branches.json; ydb_yc only'
        required: false
        type: boolean
        default: false
      pr_number:
        description: 'remote only: optional PR number for host run title (e2e / PR-check-style display)'
        required: false
        type: string
        default: ''
      pr_title:
        description: 'remote only: optional PR title for host run title'
        required: false
        type: string
        default: ''
      caller_workflow_label:
        description: 'remote only: override caller workflow label on platform run (default Run and debug tests)'
        required: false
        type: string
        default: ''

jobs:
  resolve_remote:
    if: inputs.executor == 'remote'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      config: ${{ steps.resolve.outputs.config }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci/dispatcher
          sparse-checkout-cone-mode: false

      - name: Resolve remote execution config
        id: resolve
        env:
          REMOTE_JSON: ${{ inputs.remote }}
          CODE_REF: ${{ github.sha }}
          ANALYTICS_BRANCH: ${{ github.ref_name }}
          DEFAULT_BUILD_TARGET: ${{ inputs.test_targets }}
          DEFAULT_BUILD_PRESET: ${{ inputs.build_preset }}
          CALLER_PR_NUMBER: ${{ inputs.pr_number }}
          CALLER_PR_TITLE: ${{ inputs.pr_title }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow_label != '' && inputs.caller_workflow_label || 'Run and debug tests' }}
        run: python3 .github/scripts/ci/dispatcher/resolve_remote_execution.py

  remote:
    if: inputs.executor == 'remote'
    needs: resolve_remote
    uses: ./.github/workflows/dispatch_remote.yml
    secrets: inherit
    with:
      config: ${{ needs.resolve_remote.outputs.config }}

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            # Empty - will use branches_config_path or default
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            # Already JSON array
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            # Comma-separated format: "main, stable-25-3" -> ["main", "stable-25-3"]
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)  # trim whitespace
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
            echo "Converted '${{ inputs.branches }}' to $JSON_BRANCHES"
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi
          
          # Check if already JSON array
          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            # Comma-separated format: "relwithdebinfo, release-asan" -> ["relwithdebinfo", "release-asan"]
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)  # trim whitespace
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
            echo "Converted '$BUILD_PRESET_INPUT' to $JSON_PRESETS"
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
