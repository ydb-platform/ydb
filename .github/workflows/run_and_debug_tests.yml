name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = local runners; remote = dispatch Run and debug tests on executor branch (fat runner)'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      remote_executor_ref:
        description: 'Branch whose Run and debug tests.yml is the executor'
        required: false
        type: string
        default: 'dev/ci-remote-executor'
      code_ref:
        description: 'Git ref/SHA for the executor to checkout (empty = this run SHA)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'Paths to tests (e.g., "ydb/library/actors/util/ut")'
        required: false
        type: string
        default: 'ydb/library/actors/util/ut'
      build_preset:
        description: 'Build preset (comma-separated for ydb_yc; single for remote)'
        required: false
        type: string
        default: 'relwithdebinfo'
      branches:
        description: 'Branches to test (ydb_yc only)'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'Use stable_tests_branches.json (ydb_yc only)'
        required: false
        type: boolean
        default: false
      wait_for_remote:
        description: 'If true (with executor=remote), wait for executor and mirror its job summary here'
        required: false
        type: boolean
        default: true

jobs:
  dispatch_remote:
    if: inputs.executor == 'remote'
    runs-on: [self-hosted, tiny-worker]
    # Must outlive the fat-runner executor when wait_for_remote=true.
    timeout-minutes: 400
    steps:
      - name: Dispatch executor workflow on remote_executor_ref
        env:
          # GITHUB_TOKEN does not start new workflow runs; tiny-worker has no gh CLI.
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          EXECUTOR_REF: ${{ inputs.remote_executor_ref }}
          CODE_REF: ${{ inputs.code_ref || github.sha }}
          TEST_TARGETS: ${{ inputs.test_targets }}
          BUILD_PRESET: ${{ inputs.build_preset }}
          WAIT_FOR_REMOTE: ${{ inputs.wait_for_remote }}
          REPO: ${{ github.repository }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          preset="${BUILD_PRESET%%,*}"
          preset="$(echo "$preset" | xargs)"
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "Dispatching \"Run and debug tests\" --ref $EXECUTOR_REF"
          echo "code_ref=$CODE_REF preset=$preset targets=$TEST_TARGETS wait=$WAIT_FOR_REMOTE"

          workflow_path="run_and_debug_tests.yml"
          workflow_id="$(curl -fsS "${auth[@]}" \
            "${api}/actions/workflows/${workflow_path}" \
            | jq -r '.id // empty')"
          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then
            echo "::error::workflow ${workflow_path} not found"
            exit 1
          fi
          echo "workflow_id=$workflow_id"

          # API validates input keys against DEFAULT branch schema.
          payload="$(jq -n \
            --arg ref "$EXECUTOR_REF" \
            --arg test_targets "$TEST_TARGETS" \
            --arg build_preset "$preset" \
            '{
              ref: $ref,
              inputs: {
                test_targets: $test_targets,
                build_preset: $build_preset
              }
            }')"

          before_epoch="$(date -u +%s)"
          http_code="$(curl -sS "${auth[@]}" -o /tmp/dispatch_resp.txt -w '%{http_code}' -X POST \
            "${api}/actions/workflows/${workflow_id}/dispatches" \
            -d "$payload")"
          if [ "$http_code" != "204" ]; then
            echo "::error::dispatch failed HTTP $http_code"
            cat /tmp/dispatch_resp.txt || true
            exit 1
          fi

          # Resolve the new run (retry briefly — listing can lag).
          run_id=""
          run_url=""
          for _ in $(seq 1 30); do
            sleep 2
            run_json="$(curl -fsS "${auth[@]}" \
              "${api}/actions/workflows/${workflow_id}/runs?branch=${EXECUTOR_REF}&event=workflow_dispatch&per_page=5")"
            # Prefer a run created at/after dispatch.
            run_id="$(echo "$run_json" | jq -r --argjson before "$before_epoch" '
              [.workflow_runs[]
                | select((.created_at | fromdateiso8601) >= ($before - 5))
              ][0].id // empty')"
            if [ -z "$run_id" ]; then
              run_id="$(echo "$run_json" | jq -r '.workflow_runs[0].id // empty')"
            fi
            run_url="$(echo "$run_json" | jq -r --argjson id "${run_id:-0}" '
              (.workflow_runs[] | select(.id == ($id|tonumber)) | .html_url) // .workflow_runs[0].html_url // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
          done
          if [ -z "$run_id" ]; then
            echo "::error::could not resolve executor run id after dispatch"
            exit 1
          fi
          echo "executor_run_id=$run_id"
          echo "executor_run_url=$run_url"

          {
            echo "### Dispatched remote executor"
            echo "- **executor branch:** \`$EXECUTOR_REF\`"
            echo "- **code ref:** \`$CODE_REF\`"
            echo "- **preset:** \`$preset\`"
            echo "- **targets:** \`$TEST_TARGETS\`"
            echo "- **executor run:** [$run_id]($run_url)"
            echo "- **wait:** \`$WAIT_FOR_REMOTE\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$WAIT_FOR_REMOTE" != "true" ]; then
            echo "wait_for_remote=false — not waiting"
            exit 0
          fi

          echo "Waiting for executor run $run_id ..."
          conclusion=""
          status=""
          # ~6h max, 30s poll
          for _ in $(seq 1 720); do
            run_state="$(curl -fsS "${auth[@]}" "${api}/actions/runs/${run_id}")"
            status="$(echo "$run_state" | jq -r '.status')"
            conclusion="$(echo "$run_state" | jq -r '.conclusion // empty')"
            echo "$(date -u +%H:%M:%S) status=$status conclusion=${conclusion:-none}"
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 30
          done
          if [ "$status" != "completed" ]; then
            echo "::error::timed out waiting for executor run $run_id (last status=$status)"
            exit 1
          fi

          echo "## Executor summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Mirrored from executor run [$run_id]($run_url) (conclusion=\`$conclusion\`)._" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Prefer artifact with exact GITHUB_STEP_SUMMARY content.
          mirrored=0
          for _ in $(seq 1 20); do
            arts="$(curl -fsS "${auth[@]}" "${api}/actions/runs/${run_id}/artifacts")"
            art_id="$(echo "$arts" | jq -r '
              [.artifacts[] | select(.name=="executor-summary" and .expired==false)][0].id // empty')"
            if [ -n "$art_id" ]; then
              echo "Downloading artifact executor-summary id=$art_id"
              curl -fsS "${auth[@]}" -L \
                "${api}/actions/artifacts/${art_id}/zip" \
                -o /tmp/executor-summary.zip
              rm -rf /tmp/executor-summary && mkdir -p /tmp/executor-summary
              if command -v unzip >/dev/null 2>&1; then
                unzip -qo /tmp/executor-summary.zip -d /tmp/executor-summary
              else
                python3 - <<'PY'
import zipfile
zipfile.ZipFile("/tmp/executor-summary.zip").extractall("/tmp/executor-summary")
PY
              fi
              summary_file="$(find /tmp/executor-summary -type f | head -1 || true)"
              if [ -n "$summary_file" ]; then
                cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
                mirrored=1
              fi
              break
            fi
            sleep 3
          done

          if [ "$mirrored" != "1" ]; then
            echo "Artifact missing — falling back to S3 summary_links"
            # Path layout from s3cmd action: {endpoint}/{bucket}/{repo}/{workflow}/{run_id}/ya-x86-64/
            wf_name="Run and debug tests"
            base="${AWS_ENDPOINT}/${AWS_BUCKET}/${REPO}/${wf_name}/${run_id}/ya-x86-64"
            # URL-encode spaces for curl
            base_enc="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=":/"))' "$base")"
            if curl -fsS "$base_enc/summary_links.txt" -o /tmp/summary_links.txt; then
              python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
import pathlib
links = []
for line in pathlib.Path("/tmp/summary_links.txt").read_text().splitlines():
    line=line.strip()
    if not line: continue
    parts=line.split(" ", 1)
    if len(parts)==2:
        links.append(parts[1])
print(" | ".join(links))
PY
            else
              echo "_Could not mirror executor summary (no artifact / S3 links). See executor run._" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Open executor run]($run_url) · [Artifacts index](${base}/index.html)" >> "$GITHUB_STEP_SUMMARY"
          fi

          case "$conclusion" in
            success) echo "Executor succeeded" ;;
            *)
              echo "::error::executor finished with conclusion=$conclusion"
              exit 1
              ;;
          esac

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi
          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
