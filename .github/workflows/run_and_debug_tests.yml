name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = local runners; remote = dispatch Run and debug tests on executor branch (fat runner)'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      remote_executor_ref:
        description: 'Branch whose Run and debug tests.yml is the executor'
        required: false
        type: string
        default: 'dev/ci-remote-executor'
      code_ref:
        description: 'Git ref/SHA for the executor to checkout (empty = this run SHA)'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'Paths to tests (e.g., "ydb/library/actors/util/ut")'
        required: false
        type: string
        default: 'ydb/library/actors/util/ut'
      build_preset:
        description: 'Build preset (comma-separated for ydb_yc; single for remote)'
        required: false
        type: string
        default: 'relwithdebinfo'
      branches:
        description: 'Branches to test (ydb_yc only)'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'Use stable_tests_branches.json (ydb_yc only)'
        required: false
        type: boolean
        default: false

jobs:
  dispatch_remote:
    if: inputs.executor == 'remote'
    runs-on: [self-hosted, tiny-worker]
    steps:
      - name: Dispatch executor workflow on remote_executor_ref
        env:
          # GITHUB_TOKEN does not start new workflow runs; tiny-worker has no gh CLI.
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          EXECUTOR_REF: ${{ inputs.remote_executor_ref }}
          CODE_REF: ${{ inputs.code_ref || github.sha }}
          TEST_TARGETS: ${{ inputs.test_targets }}
          BUILD_PRESET: ${{ inputs.build_preset }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          preset="${BUILD_PRESET%%,*}"
          preset="$(echo "$preset" | xargs)"
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          echo "Dispatching \"Run and debug tests\" --ref $EXECUTOR_REF"
          echo "code_ref=$CODE_REF preset=$preset targets=$TEST_TARGETS"

          # Lookup by filename (list endpoint is paginated and may miss this workflow).
          workflow_path="run_and_debug_tests.yml"
          workflow_id="$(curl -fsS "${auth[@]}" \
            "${api}/actions/workflows/${workflow_path}" \
            | jq -r '.id // empty')"
          if [ -z "$workflow_id" ] || [ "$workflow_id" = "null" ]; then
            echo "::error::workflow ${workflow_path} not found"
            exit 1
          fi
          echo "workflow_id=$workflow_id"

          # API validates input *keys* against the workflow file on the DEFAULT branch.
          # Only send keys present on main (test_targets, build_preset, …).
          # Executor branch (--ref) still runs its own YAML; extra inputs there use defaults.
          payload="$(jq -n \
            --arg ref "$EXECUTOR_REF" \
            --arg test_targets "$TEST_TARGETS" \
            --arg build_preset "$preset" \
            '{
              ref: $ref,
              inputs: {
                test_targets: $test_targets,
                build_preset: $build_preset
              }
            }')"

          http_code="$(curl -sS "${auth[@]}" -o /tmp/dispatch_resp.txt -w '%{http_code}' -X POST \
            "${api}/actions/workflows/${workflow_id}/dispatches" \
            -d "$payload")"
          if [ "$http_code" != "204" ]; then
            echo "::error::dispatch failed HTTP $http_code"
            cat /tmp/dispatch_resp.txt || true
            exit 1
          fi

          sleep 5
          run_json="$(curl -fsS "${auth[@]}" \
            "${api}/actions/workflows/${workflow_id}/runs?branch=${EXECUTOR_REF}&event=workflow_dispatch&per_page=1")"
          run_url="$(echo "$run_json" | jq -r '.workflow_runs[0].html_url // empty')"
          run_id="$(echo "$run_json" | jq -r '.workflow_runs[0].id // empty')"
          {
            echo "### Dispatched remote executor"
            echo "- **executor branch:** \`$EXECUTOR_REF\`"
            echo "- **code ref:** \`$CODE_REF\`"
            echo "- **preset:** \`$preset\`"
            echo "- **targets:** \`$TEST_TARGETS\`"
            if [ -n "$run_url" ]; then
              echo "- **executor run:** [$run_id]($run_url)"
            else
              echo "- **runs:** https://github.com/${REPO}/actions/workflows/run_and_debug_tests.yml"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "executor_run=$run_url"

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi
          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
