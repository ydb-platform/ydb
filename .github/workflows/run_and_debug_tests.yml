name: Run and debug tests

on:
  workflow_dispatch:
    inputs:
      executor:
        description: 'ydb_yc = local runners; remote = dispatch Run and debug tests on executor branch (fat runner)'
        required: false
        type: choice
        options:
          - ydb_yc
          - remote
        default: ydb_yc
      remote_executor_ref:
        description: 'Branch whose Run and debug tests.yml is the executor'
        required: false
        type: string
        default: 'dev/ci-remote-executor'
      code_ref:
        description: 'YDB ref/SHA for executor to checkout+test (empty = this dispatch run SHA); not the executor YAML branch'
        required: false
        type: string
        default: ''
      test_targets:
        description: 'Paths to tests (e.g., "ydb/library/actors/util/ut")'
        required: false
        type: string
        default: 'ydb/library/actors/util/ut'
      build_preset:
        description: 'Build preset (comma-separated for ydb_yc; single for remote)'
        required: false
        type: string
        default: 'relwithdebinfo'
      branches:
        description: 'Branches to test (ydb_yc only)'
        required: false
        type: string
        default: ''
      use_branches_config:
        description: 'Use stable_tests_branches.json (ydb_yc only)'
        required: false
        type: boolean
        default: false
      wait_for_remote:
        description: 'remote only: true = wait+mirror summary (runner-waiter); false = fire-and-forget link only (ubuntu-latest)'
        required: false
        type: boolean
        default: true

jobs:
  dispatch_remote:
    if: inputs.executor == 'remote'
    # wait+mirror can outlive a fat build; fire-and-forget is seconds on hosted.
    runs-on: ${{ inputs.wait_for_remote && fromJSON('["self-hosted","runner-waiter"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.wait_for_remote && 400 || 15 }}
    steps:
      - name: Checkout dispatch helpers
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/ci
          sparse-checkout-cone-mode: false

      # Own step so "what launched" lands in Job summary before the long wait.
      - name: Dispatch executor workflow on remote_executor_ref
        id: dispatch
        env:
          # GITHUB_TOKEN does not start new workflow runs; use PAT + curl (no gh required).
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          EXECUTOR_REF: ${{ inputs.remote_executor_ref }}
          CODE_REF: ${{ inputs.code_ref || github.sha }}
          TEST_TARGETS: ${{ inputs.test_targets }}
          BUILD_PRESET: ${{ inputs.build_preset }}
          WAIT_MODE: ${{ inputs.wait_for_remote && 'wait+mirror' || 'fire-and-forget' }}
          REPO: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/ci/dispatch_remote_executor.sh start

      - name: Wait and mirror executor summary
        if: inputs.wait_for_remote
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          EXECUTOR_RUN_ID: ${{ steps.dispatch.outputs.executor_run_id }}
          EXECUTOR_RUN_URL: ${{ steps.dispatch.outputs.executor_run_url }}
          REPO: ${{ github.repository }}
          AWS_ENDPOINT: ${{ vars.AWS_ENDPOINT }}
          AWS_BUCKET: ${{ vars.AWS_BUCKET }}
        shell: bash
        run: bash .github/scripts/ci/dispatch_remote_executor.sh wait

  prepare:
    if: inputs.executor == 'ydb_yc'
    runs-on: ubuntu-latest
    outputs:
      branches_json: ${{ steps.format-branches.outputs.branches_json }}
      build_preset_array: ${{ steps.format-build-preset.outputs.build_preset_array }}
    steps:
      - name: Format branches
        id: format-branches
        run: |
          if [ -z "${{ inputs.branches }}" ]; then
            echo "branches_json=" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.branches }}" == \[* ]]; then
            echo "branches_json=${{ inputs.branches }}" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra BRANCHES <<< "${{ inputs.branches }}"
            JSON_BRANCHES="["
            FIRST=true
            for branch in "${BRANCHES[@]}"; do
              branch=$(echo "$branch" | xargs)
              if [ -n "$branch" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_BRANCHES+=", "
                fi
                JSON_BRANCHES+="\"$branch\""
              fi
            done
            JSON_BRANCHES+="]"
            echo "branches_json=$JSON_BRANCHES" >> $GITHUB_OUTPUT
          fi

      - name: Format build presets
        id: format-build-preset
        run: |
          BUILD_PRESET_INPUT="${{ inputs.build_preset }}"
          if [ -z "$BUILD_PRESET_INPUT" ]; then
            BUILD_PRESET_INPUT="relwithdebinfo"
          fi
          if [[ "$BUILD_PRESET_INPUT" == \[* ]]; then
            echo "build_preset_array=$BUILD_PRESET_INPUT" >> $GITHUB_OUTPUT
          else
            IFS=',' read -ra PRESETS <<< "$BUILD_PRESET_INPUT"
            JSON_PRESETS="["
            FIRST=true
            for preset in "${PRESETS[@]}"; do
              preset=$(echo "$preset" | xargs)
              if [ -n "$preset" ]; then
                if [ "$FIRST" = true ]; then
                  FIRST=false
                else
                  JSON_PRESETS+=", "
                fi
                JSON_PRESETS+="\"$preset\""
              fi
            done
            JSON_PRESETS+="]"
            echo "build_preset_array=$JSON_PRESETS" >> $GITHUB_OUTPUT
          fi

  main:
    name: Run and debug tests
    if: inputs.executor == 'ydb_yc'
    needs: prepare
    uses: ./.github/workflows/run_tests.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        build_preset: ${{ fromJson(needs.prepare.outputs.build_preset_array) }}
    with:
      test_targets: ${{ inputs.test_targets }}
      test_size: small,medium
      build_preset: ${{ matrix.build_preset }}
      branches: ${{ needs.prepare.outputs.branches_json || '' }}
      branches_config_path: ${{ inputs.use_branches_config && '.github/config/stable_tests_branches.json' || '' }}

  collect_combined_summary:
    needs: main
    if: always() && inputs.executor == 'ydb_yc'
    uses: ./.github/workflows/collect_combined_summary.yml
