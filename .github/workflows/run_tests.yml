name: Run-tests

on:
  workflow_call:
    inputs:
      test_targets:
        description: 'Paths to tests for run ,example : ydb/ ydb/tests/func/suite'
        required: true
        type: string
        default: ydb/
      test_type:
        description: 'Test type (empty = all types: unittest,py3test,py2test,pytest,gtest)'
        required: false
        type: string
        default: ''
      test_size:
        description: 'Test size: small, medium, large (default: small,medium,large)'
        required: false
        type: string
        default: small,medium,large
      additional_ya_make_args:
        description: 'additional args for ya make'
        required: false
        type: string
        default: ''
      build_preset:
        description: 'Build preset type'
        required: true
        type: string
      branches:
        description: 'Branches to test (JSON array or single branch)'
        required: false
        type: string
        default: '["main"]'
      branches_config_path:
        description: 'Path to JSON file with branches to test'
        required: false
        type: string
        default: ''
      blacklist_paths:
        description: 'Newline-separated list of paths or patterns to blacklist; provide all required paths/patterns explicitly'
        required: false
        type: string
        default: ''
      test_threads:
        description: 'Test threads count (default: 64; build presets use a fraction of this value)'
        required: false
        type: string
        default: '64'
      collect_coredumps:
        description: "Collect coredumps to a 100G loop volume at /coredumps (for ya test recovery)"
        required: false
        type: boolean
        default: true
      shard_count:
        description: '1 (default) is one job. auto picks hosts from graph weight and free runners. 2-16 is explicit and wins over auto. One branch only.'
        required: false
        type: string
        default: '1'
      remote_cache:
        description: 'Use bazel remote cache (false = cold: empty REMOTE_CACHE_URL, no put, --no-bazel-remote-store)'
        required: false
        type: boolean
        default: true
      separate_build:
        description: 'When shard_count>1: build once on the graph host into remote cache before test shards start'
        required: false
        type: boolean
        default: false

  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Pull request number, ex: 12345'
        required: false
        default: ''
      test_targets:
        description: 'Paths to tests for run ,example : ydb/ ydb/tests/func/suite'
        required: true
        default: ydb/
      test_type:
        description: 'Test type (empty = all types: unittest,py3test,py2test,pytest,gtest)'
        required: false
        default: ''
      test_size:
        description: 'Test size: small, medium, large (default: small,medium)'
        required: false
        type: choice
        default: small,medium
        options:
          - small
          - medium
          - large
          - small,medium
          - small,medium,large
      additional_ya_make_args:
        description: 'additional args for ya make'
        required: false
        default: ''
      build_preset:
        description: 'Build preset type (relwithdebinfo, release-asan, release-msan, release-tsan)'
        required: true
        type: choice
        options:
          - relwithdebinfo
          - release-asan
          - release-msan
          - release-tsan
        default: relwithdebinfo
      collect_coredumps:
        type: boolean
        default: true
        description: "Collect coredumps to a 100G loop volume at /coredumps (for ya test recovery)"
      test_threads:
        description: 'Test threads count (default: 64; build presets use a fraction of this value)'
        required: false
        default: '64'
      shard_count:
        description: '1 (default) is one job. auto picks hosts from graph weight and free runners. 2-16 is explicit and wins over auto. One branch only.'
        required: false
        default: '1'
      remote_cache:
        description: 'Use bazel remote cache (false = cold: empty REMOTE_CACHE_URL, no put, --no-bazel-remote-store)'
        type: boolean
        default: true
      separate_build:
        description: 'When shard_count>1: build once on the graph host into remote cache before test shards start'
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branch_array: ${{ steps.set-branches.outputs.branch_array }}
      branch_name_map: ${{ steps.set-branches.outputs.branch_name_map }}
      pr_number_map: ${{ steps.set-branches.outputs.pr_number_map }}
      shard_count: ${{ steps.shard-count.outputs.shard_count }}
      checkout_ref: ${{ steps.shard-count.outputs.checkout_ref }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/config
            .github/scripts/tests

      - name: Set branches
        id: set-branches
        env:
          CALLED_BRANCHES: '${{ inputs.branches }}'
          BRANCHES_CONFIG_PATH: '${{ inputs.branches_config_path }}'
          PULL_REQUEST_NUMBER: '${{ inputs.pull_number }}'
          GITHUB_TOKEN: '${{ github.token }}'
        run: |
          # Check if branches parameter was passed from calling workflow
          if [[ -n "$CALLED_BRANCHES" ]]; then
            echo "Branches parameter provided from calling workflow: $CALLED_BRANCHES"
            
            # Check if input is already a JSON array
            if [[ $CALLED_BRANCHES == \[* ]]; then
              # This is a JSON array - parse it
              branches=($(echo "$CALLED_BRANCHES" | jq -r '.[]'))
            else
              # If it's a single branch, create array with one element
              branches=("$CALLED_BRANCHES")
            fi

            processed_branches=()
            branch_name_map="{}"
            pr_number_map="{}"
            for branch in "${branches[@]}"; do
              # Check if branch starts with pull/ and contains numbers
              if [[ $branch =~ ^pull/([0-9]+)$ ]]; then
                PULL_REQUEST_NUMBER=${BASH_REMATCH[1]}
                echo "Processing pull request: $PULL_REQUEST_NUMBER"
                
                # Get PR data from GitHub API
                PR_DATA=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/ydb-platform/ydb/pulls/$PULL_REQUEST_NUMBER")
                MERGE_SHA=$(echo "$PR_DATA" | jq -r '.merge_commit_sha')
                BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.base.ref')
                
                if [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ]; then
                  echo "Replaced pull/$PULL_REQUEST_NUMBER with merge commit: $MERGE_SHA (base: $BASE_BRANCH)"
                  processed_branches+=("\"$MERGE_SHA\"")
                  # Add to mapping: checkout_branch (SHA) -> test_history_branch (base branch for PR, or same for regular branches)
                  branch_name_map=$(echo "$branch_name_map" | jq -c --arg sha "$MERGE_SHA" --arg base "$BASE_BRANCH" '. + {($sha): $base}')
                  # Add to mapping: checkout_branch (SHA) -> PR number
                  pr_number_map=$(echo "$pr_number_map" | jq -c --arg sha "$MERGE_SHA" --arg pr "$PULL_REQUEST_NUMBER" '. + {($sha): $pr}')
                  # Save merge commit SHA, base branch, and PR number for comment step (use first PR)
                  if [ -z "$COMMIT_SHA" ]; then
                    echo "COMMIT_SHA=$MERGE_SHA" >> $GITHUB_ENV
                    echo "PR_BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
                    echo "PR_NUMBER=$PULL_REQUEST_NUMBER" >> $GITHUB_ENV
                  fi
                else
                  echo "Failed to get merge commit for PR $PULL_REQUEST_NUMBER, discarding"
                fi
              else
                # Just add the branch as-is
                processed_branches+=("\"$branch\"")
              fi
            done

            # Reassemble into JSON array
            branch_array=$(IFS=, ; echo "[${processed_branches[*]}]")
            echo "branch_array=$branch_array" >> $GITHUB_OUTPUT
            # Output mapping of checkout_branch -> test_history_branch (for PR: SHA -> base_branch, for regular branches: empty {})
            # Use compact JSON format (no newlines) for GitHub Actions output
            branch_name_map_compact=$(echo "$branch_name_map" | jq -c .)
            echo "branch_name_map=$branch_name_map_compact" >> $GITHUB_OUTPUT
            echo "Created branch_name_map: $branch_name_map_compact"
            # Output mapping of checkout_branch -> PR number (for PR: SHA -> PR number, for regular branches: empty {})
            pr_number_map_compact=$(echo "$pr_number_map" | jq -c .)
            echo "pr_number_map=$pr_number_map_compact" >> $GITHUB_OUTPUT
            echo "Created pr_number_map: $pr_number_map_compact"
          elif [[ -n "$BRANCHES_CONFIG_PATH" ]]; then
            echo "branch_array=$(jq -c "." "$BRANCHES_CONFIG_PATH")" >> $GITHUB_OUTPUT
            # No mapping for branches from config file - use branches as-is for test history
            echo "branch_name_map={}" >> $GITHUB_OUTPUT
            echo "pr_number_map={}" >> $GITHUB_OUTPUT
          elif [[ -n "$PULL_REQUEST_NUMBER" ]] && [[ $PULL_REQUEST_NUMBER =~ ^[0-9]+$ ]]; then
            PR_DATA=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -s -H "Authorization: token $GITHUB_TOKEN" \
                  "https://api.github.com/repos/ydb-platform/ydb/pulls/$PULL_REQUEST_NUMBER")
            MERGE_SHA=$(echo "$PR_DATA" | jq -r '.merge_commit_sha')
            BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.base.ref')
            if [ -n "$MERGE_SHA" ] && [ "$MERGE_SHA" != "null" ]; then
              # Use merge commit SHA for checkout, but base branch for test history and results
              echo "branch_array=[\"$MERGE_SHA\"]" >> $GITHUB_OUTPUT
              # Save merge commit SHA, base branch, and PR number for comment step
              echo "COMMIT_SHA=$MERGE_SHA" >> $GITHUB_ENV
              echo "PR_BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV
              echo "PR_NUMBER=$PULL_REQUEST_NUMBER" >> $GITHUB_ENV
              # Output mapping of checkout_branch -> test_history_branch (SHA -> base_branch for PR)
              # Use compact JSON format (no newlines) for GitHub Actions output
              branch_name_map=$(jq -c -n --arg sha "$MERGE_SHA" --arg base "$BASE_BRANCH" '{($sha): $base}')
              echo "branch_name_map=$branch_name_map" >> $GITHUB_OUTPUT
              # Output mapping of checkout_branch -> PR number (SHA -> PR number for PR)
              pr_number_map=$(jq -c -n --arg sha "$MERGE_SHA" --arg pr "$PULL_REQUEST_NUMBER" '{($sha): $pr}')
              echo "pr_number_map=$pr_number_map" >> $GITHUB_OUTPUT
            else
              echo "Failed to get merge commit for PR $PULL_REQUEST_NUMBER"
              exit 1
            fi
          else
            # If no branches specified, this is a direct workflow_dispatch run
            echo "No branches specified, using current branch: ${{ github.ref_name }}"
            echo "branch_array=[\"${{ github.ref_name }}\"]" >> $GITHUB_OUTPUT
            # Packing/history use the repo target (default) branch; checkout stays on ref_name.
            branch_name_map=$(jq -c -n --arg src "${{ github.ref_name }}" --arg dst "${{ github.event.repository.default_branch }}" '{($src): $dst}')
            echo "branch_name_map=$branch_name_map" >> $GITHUB_OUTPUT
            echo "pr_number_map={}" >> $GITHUB_OUTPUT
          fi
          
          echo "Final branches to use: $(cat $GITHUB_OUTPUT | grep branch_array | cut -d= -f2)"

      - name: Resolve shard count
        id: shard-count
        run: |
          raw='${{ inputs.shard_count }}'
          if [ -z "$raw" ]; then
            raw=1
          fi
          branch_array='${{ steps.set-branches.outputs.branch_array }}'
          nbranches=$(printf '%s' "$branch_array" | jq 'length')
          if [ "$raw" = "auto" ]; then
            if [ "$nbranches" -ne 1 ]; then
              echo "shard_count=auto supports exactly one branch (got $nbranches: $branch_array)"
              exit 1
            fi
            echo "shard_count=auto" >> "$GITHUB_OUTPUT"
            checkout_ref=$(printf '%s' "$branch_array" | jq -r '.[0]')
            echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
            echo "Using shard_count=auto"
            exit 0
          fi
          if ! [[ "$raw" =~ ^[0-9]+$ ]]; then
            echo "shard_count must be 1, auto, or an integer 2-16, got: $raw"
            exit 1
          fi
          count=$((10#$raw))
          if [ "$count" -lt 1 ] || [ "$count" -gt 16 ]; then
            echo "shard_count must be between 1 and 16, got: $count"
            exit 1
          fi
          if [ "$count" -gt 1 ] && [ "$nbranches" -ne 1 ]; then
            echo "shard_count>1 supports exactly one branch (got $nbranches: $branch_array)"
            exit 1
          fi
          echo "shard_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 1 ]; then
            checkout_ref=$(printf '%s' "$branch_array" | jq -r '.[0]')
            echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
            echo "Sharded checkout ref: $checkout_ref"
          fi
          echo "Using shard_count=$count"

      - name: Install dependencies
        if: always()
        run: |
          # Check if COMMIT_SHA is set (means we have a PR to comment on)
          if [ -n "$COMMIT_SHA" ]; then
            pip install PyGithub
          else
            echo "No PR detected, skipping dependency installation"
          fi

      - name: Post run tests start comment
        if: always() && steps.shard-count.outputs.shard_count == '1'
        shell: bash
        env:
          BUILD_PRESET: ${{ inputs.build_preset }}
          GITHUB_TOKEN: ${{ github.token }}
          TEST_SIZE: ${{ inputs.test_size }}
          BUILD_TARGET: ${{ inputs.test_targets }}
          COLLECT_COREDUMPS: ${{ inputs.collect_coredumps != false }}
        run: |
          # Check if COMMIT_SHA is set (means we have a PR to comment on)
          if [ -z "$COMMIT_SHA" ]; then
            echo "No PR detected (COMMIT_SHA is not set), skipping comment"
            exit 0
          fi
          commit_sha="$COMMIT_SHA"
          
          commit_short=$(echo "$commit_sha" | cut -c1-7)
          commit_url="https://github.com/${GITHUB_REPOSITORY}/commit/${commit_sha}"
          check_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          
          workflow_name="${{ github.workflow }}"
          
          {
            echo "### $workflow_name started"
            echo ""
            echo "- **Build Preset:** \`$BUILD_PRESET\`"
            echo "- **Test Size:** \`$TEST_SIZE\`"
            echo "- **Test Targets:** \`$BUILD_TARGET\`"
            if [ "$COLLECT_COREDUMPS" = "true" ]; then
              echo "- **Collect Coredumps:** \`true\`"
            fi
            echo "- **Commit:** [${commit_short}](${commit_url})"
            echo "- **Workflow run:** [link](${check_url})"
            echo ""
          } | .github/scripts/tests/comment-pr.py --rewrite --no-timestamp

  run_tests:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.shard_count == '1'
    name: ${{ matrix.branch }}:${{ inputs.build_preset }}
    timeout-minutes: 1200
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', inputs.build_preset) }}" ]
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branch_array) }}
    steps:
      - name: Set variables based on build_preset
        id: set-vars
        run: |
          TEST_THREADS="${{ inputs.test_threads }}"
          if [[ "${{ inputs.build_preset }}" == "relwithdebinfo" ]]; then
            echo "threads_count=$TEST_THREADS" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-asan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.38; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-msan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-tsan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          else
            echo "Unknown build_preset value."
            exit 1
          fi

      - name: Probe GitHub speed
        if: vars.GH_PROXY_URL != ''
        env:
          GH_PROXY_URL: ${{ vars.GH_PROXY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          proxy_url="${GH_PROXY_URL:-}"
          proxy_url="${proxy_url%/}"
          if [ -z "$proxy_url" ]; then
            echo "GH_PROXY_URL is empty, checkout stays direct"
            exit 0
          fi

          repo_url=https://github.com/ydb-platform/ydb.git

          # Depth-1 clone, same transfer as checkout. Speed is bytes added over the 15s after tmp_pack passes 1 MB, ignoring a flat tail.
          pack_size() {
            local f
            f=$(ls "$1"/.git/objects/pack/tmp_pack_* 2>/dev/null | head -1 || true)
            if [ -z "$f" ]; then echo 0; return; fi
            stat -c %s "$f" 2>/dev/null || stat -f %z "$f"
          }
          measure() {
            local git_config=$1 dest log pid i sz s1 s2
            dest=$(mktemp -d /tmp/gh-probe.XXXXXX)
            log=$(mktemp)
            if [ -n "$git_config" ]; then
              git -c "$git_config" clone --depth 1 --single-branch --no-tags --progress "$repo_url" "$dest" >"$log" 2>&1 &
            else
              git clone --depth 1 --single-branch --no-tags --progress "$repo_url" "$dest" >"$log" 2>&1 &
            fi
            pid=$!
            s1=0
            for i in $(seq 1 45); do
              sleep 1
              sz=$(pack_size "$dest")
              if [ "$sz" -gt 1000000 ]; then s1=$sz; break; fi
            done
            s2=$s1
            elapsed=0
            if [ "$s1" -gt 0 ]; then
              grown=$s1
              for j in $(seq 1 15); do
                sleep 1
                sz=$(pack_size "$dest")
                if [ "$sz" -lt "$grown" ]; then sz=$grown; fi
                if [ "$sz" -gt "$grown" ]; then
                  grown=$sz
                  elapsed=$j
                fi
              done
              s2=$grown
            fi
            if [ "$elapsed" -lt 1 ]; then elapsed=1; fi
            kill "$pid" 2>/dev/null || true
            pkill -P "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if [ "$s1" -eq 0 ]; then
              echo "git clone never started receiving objects:" >&2
              tr '\r' '\n' < "$log" | grep -E 'Receiving objects|Compressing objects|fatal:' | tail -5 >&2 || true
            fi
            rm -rf "$dest"
            rm -f "$log"
            echo "$s2 $(( (s2 - s1) / elapsed ))"
          }

          megabytes() {
            awk -v bytes="${1:-0}" 'BEGIN { printf "%.2f", (bytes + 0) / 1000000 }'
          }

          direct_out=$(mktemp)
          proxy_out=$(mktemp)
          measure "" >"$direct_out" &
          direct_pid=$!
          measure "url.${proxy_url}/https://github.com/.insteadOf=https://github.com/" >"$proxy_out" &
          proxy_pid=$!
          wait "$direct_pid" || true
          wait "$proxy_pid" || true
          read -r direct_bytes direct_tail <"$direct_out" || true
          read -r proxy_bytes proxy_tail <"$proxy_out" || true
          rm -f "$direct_out" "$proxy_out"

          faster=$(awk -v direct="${direct_tail:-0}" -v proxy="${proxy_tail:-0}" 'BEGIN {
            print (proxy + 0 > direct + 0) ? "proxy" : "github"
          }')
          use_proxy=false
          if [ "$faster" = proxy ]; then
            use_proxy=true
          fi

          echo "git pack GitHub $(megabytes "${direct_bytes:-0}") MB, 15s $(megabytes "${direct_tail:-0}") MB/s; ${proxy_url} $(megabytes "${proxy_bytes:-0}") MB, 15s $(megabytes "${proxy_tail:-0}") MB/s; use_proxy=${use_proxy}"
          {
            echo "GH_PROXY_MEASURED=1"
            echo "GH_PROXY_USED=$use_proxy"
            echo "GH_PROXY_DIRECT_MBPS=$(megabytes "${direct_tail:-0}")"
            echo "GH_PROXY_PROXY_MBPS=$(megabytes "${proxy_tail:-0}")"
          } >> "$GITHUB_ENV"

          if [ "$use_proxy" = true ]; then
            {
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.${proxy_url}/https://github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
            } >> "$GITHUB_ENV"
          fi
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v5
        env:
          GIT_TRACE: "1"
        with:
          ref: ${{ matrix.branch }}
      - name: Drop GitHub proxy
        if: vars.GH_PROXY_URL != ''
        shell: bash
        run: |
          {
            echo "GIT_CONFIG_COUNT=0"
            echo "GIT_CONFIG_KEY_0="
            echo "GIT_CONFIG_VALUE_0="
          } >> "$GITHUB_ENV"

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Determine branch name and PR number for test history
        id: determine-branch
        run: |
          # Get the mapping of checkout_branch -> test_history_branch
          # For PR: checkout_branch is merge commit SHA, test_history_branch is base branch (e.g., stable-25-3)
          # For regular branches: mapping is empty {}, so use checkout_branch as-is for test history
          branch_name_map='${{ needs.prepare.outputs.branch_name_map }}'
          pr_number_map='${{ needs.prepare.outputs.pr_number_map }}'
          current_branch="${{ matrix.branch }}"
          
          # Check if current branch is in the mapping
          # If mapping is empty {} or branch not found, use branch as-is (regular branch, not a PR)
          if [ "$branch_name_map" != "{}" ] && [ -n "$branch_name_map" ]; then
            test_history_branch=$(echo "$branch_name_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$test_history_branch" ] && [ "$test_history_branch" != "null" ]; then
              echo "branch_name=$test_history_branch" >> $GITHUB_OUTPUT
              echo "Using test history branch from mapping: $test_history_branch (checkout branch: $current_branch)"
            else
              echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
              echo "Branch not in mapping, using as-is: $current_branch"
            fi
          else
            # No mapping (empty {} or not set) - this is a regular branch, use checkout branch for test history
            echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
            echo "No mapping (regular branch), using checkout branch for test history: $current_branch"
          fi
          
          # Get PR number from mapping if available
          if [ "$pr_number_map" != "{}" ] && [ -n "$pr_number_map" ]; then
            pr_number=$(echo "$pr_number_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
              echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
              echo "Using PR number from mapping: $pr_number (checkout branch: $current_branch)"
            else
              echo "pr_number=" >> $GITHUB_OUTPUT
              echo "Branch not in PR mapping"
            fi
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
            echo "No PR mapping (regular branch)"
          fi

      - name: Create blacklist file
        id: create-blacklist
        if: inputs.blacklist_paths != ''
        shell: bash
        env:
          BLACKLIST_PATHS: ${{ inputs.blacklist_paths }}
        run: |
          BLACKLIST_FILE="${{ runner.temp }}/test_blacklist.yaml"
          > "$BLACKLIST_FILE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "- path: $path" >> "$BLACKLIST_FILE"
          done <<< "$BLACKLIST_PATHS"
          echo "blacklist_file=$BLACKLIST_FILE" >> $GITHUB_OUTPUT
          echo "Blacklist file created at $BLACKLIST_FILE with content:"
          cat "$BLACKLIST_FILE"

      - name: Run YDB Tests
        id: run_tests
        timeout-minutes: ${{ fromJson(env.timeout) }}
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_tests: true
          test_retry_count: 3
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ env.threads_count }}
          custom_branch_name: ${{ steps.determine-branch.outputs.branch_name }}
          put_build_results_to_cache: ${{ inputs.remote_cache }}
          collect_coredumps: ${{ inputs.collect_coredumps != false }}
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ inputs.remote_cache && '' || '--no-bazel-remote-store' }} ${{ inputs.additional_ya_make_args }} ${{ steps.create-blacklist.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.create-blacklist.outputs.blacklist_file) || '' }}
          pull_number: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, inputs.remote_cache && vars.REMOTE_CACHE_URL_YA || '', vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

  # shard_count>1: one graph, then one job per shard. shard_count=1 keeps run_tests above.
  prepare_graph:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.shard_count != '1'
    name: ${{ needs.prepare.outputs.checkout_ref }}:${{ inputs.build_preset }} graph
    timeout-minutes: 1200
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', inputs.build_preset) }}" ]
    outputs:
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
      checkout_sha: ${{ steps.pin.outputs.sha }}
      active_shard_count: ${{ steps.plan.outputs.active_shard_count }}
    steps:
      - name: Set variables based on build_preset
        id: set-vars
        run: |
          TEST_THREADS="${{ inputs.test_threads }}"
          if [[ "${{ inputs.build_preset }}" == "relwithdebinfo" ]]; then
            echo "threads_count=$TEST_THREADS" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-asan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.38; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-msan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-tsan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          else
            echo "Unknown build_preset value."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Pin the graph commit
        id: pin
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Determine branch name and PR number for test history
        id: determine-branch
        run: |
          branch_name_map='${{ needs.prepare.outputs.branch_name_map }}'
          pr_number_map='${{ needs.prepare.outputs.pr_number_map }}'
          current_branch="${{ needs.prepare.outputs.checkout_ref }}"
          if [ "$branch_name_map" != "{}" ] && [ -n "$branch_name_map" ]; then
            test_history_branch=$(echo "$branch_name_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$test_history_branch" ] && [ "$test_history_branch" != "null" ]; then
              echo "branch_name=$test_history_branch" >> $GITHUB_OUTPUT
            else
              echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
            fi
          else
            echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
          fi
          if [ "$pr_number_map" != "{}" ] && [ -n "$pr_number_map" ]; then
            pr_number=$(echo "$pr_number_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
              echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
            else
              echo "pr_number=" >> $GITHUB_OUTPUT
            fi
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Create blacklist file
        id: create-blacklist
        if: inputs.blacklist_paths != ''
        shell: bash
        env:
          BLACKLIST_PATHS: ${{ inputs.blacklist_paths }}
        run: |
          BLACKLIST_FILE="${{ runner.temp }}/test_blacklist.yaml"
          > "$BLACKLIST_FILE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "- path: $path" >> "$BLACKLIST_FILE"
          done <<< "$BLACKLIST_PATHS"
          echo "blacklist_file=$BLACKLIST_FILE" >> $GITHUB_OUTPUT

      # Serial ya make (no -A) before save_test_graph so shards mostly hit remote cache.
      # Must run before Save test graph: a plain build would overwrite graph.json.
      - name: Prebuild into remote cache
        if: inputs.separate_build
        id: prebuild
        timeout-minutes: ${{ fromJson(env.timeout) }}
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_build: true
          run_tests: false
          s3_subdir: prebuild
          publish_github_status: false
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ env.threads_count }}
          custom_branch_name: ${{ steps.determine-branch.outputs.branch_name }}
          put_build_results_to_cache: true
          collect_coredumps: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ inputs.additional_ya_make_args }} ${{ steps.create-blacklist.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.create-blacklist.outputs.blacklist_file) || '' }}
          pull_number: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, vars.REMOTE_CACHE_URL_YA, vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

      - name: Save test graph
        id: save_graph
        timeout-minutes: ${{ fromJson(env.timeout) }}
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_build: true
          run_tests: false
          save_test_graph: true
          publish_github_status: false
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ env.threads_count }}
          custom_branch_name: ${{ steps.determine-branch.outputs.branch_name }}
          put_build_results_to_cache: ${{ inputs.remote_cache || inputs.separate_build }}
          collect_coredumps: false
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ (inputs.remote_cache || inputs.separate_build) && '' || '--no-bazel-remote-store' }} ${{ inputs.additional_ya_make_args }} ${{ steps.create-blacklist.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.create-blacklist.outputs.blacklist_file) || '' }}
          pull_number: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, (inputs.remote_cache || inputs.separate_build) && vars.REMOTE_CACHE_URL_YA || '', vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

      - name: Plan shards
        id: plan
        run: |
          requested='${{ needs.prepare.outputs.shard_count }}'
          plan_args=(
            --graph graph.json
            --context context.json
            --threads "${{ env.threads_count }}"
            --build-preset "${{ inputs.build_preset }}"
            --branch "${{ steps.determine-branch.outputs.branch_name }}"
            -o shard_plan.json
            --summary shard_plan.md
          )
          if [ "$requested" = "auto" ]; then
            plan_args+=(--shard-count auto --preset-label "build-preset-${{ inputs.build_preset }}")
          else
            plan_args+=(--shard-count "$requested")
          fi
          if [ -n "${{ steps.create-blacklist.outputs.blacklist_file }}" ]; then
            plan_args+=(--blacklist "${{ steps.create-blacklist.outputs.blacklist_file }}")
          fi
          python3 .github/scripts/tests/shard_graph.py plan "${plan_args[@]}"
          python3 - << 'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("shard_plan.json").read_text())
          count = int(plan["shard_count"])
          ids = [] if count <= 1 else [shard["id"] for shard in plan["shards"]]
          Path("shard_ids.txt").write_text(json.dumps(ids))
          Path("active_count.txt").write_text(str(count))
          PY
          plan_progress_args=(
            --run-id "$GITHUB_RUN_ID"
            --preset "${{ inputs.build_preset }}"
            --plan-json shard_plan.json
            --plan-md shard_plan.md
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            --summary-file "$GITHUB_STEP_SUMMARY"
          )
          if [ "$(cat active_count.txt)" -gt 1 ] && [ -n "${{ steps.determine-branch.outputs.pr_number }}" ]; then
            plan_progress_args=(--pr "${{ steps.determine-branch.outputs.pr_number }}" "${plan_progress_args[@]}")
          fi
          python3 .github/scripts/tests/shard_progress.py plan "${plan_progress_args[@]}" || true
          echo "shard_ids=$(cat shard_ids.txt)" >> "$GITHUB_OUTPUT"
          echo "active_shard_count=$(cat active_count.txt)" >> "$GITHUB_OUTPUT"
          echo "Planned shard ids: $(cat shard_ids.txt)"

      - name: Run the single job
        if: steps.plan.outputs.active_shard_count == '1'
        timeout-minutes: ${{ fromJson(env.timeout) }}
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_build: true
          run_tests: true
          skip_graph_compare: true
          prebuilt_graph_path: graph.json
          prebuilt_context_path: context.json
          test_retry_count: 3
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ env.threads_count }}
          custom_branch_name: ${{ steps.determine-branch.outputs.branch_name }}
          put_build_results_to_cache: ${{ inputs.remote_cache }}
          collect_coredumps: ${{ inputs.collect_coredumps != false }}
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ inputs.remote_cache && '' || '--no-bazel-remote-store' }} ${{ inputs.additional_ya_make_args }} ${{ steps.create-blacklist.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.create-blacklist.outputs.blacklist_file) || '' }}
          pull_number: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, inputs.remote_cache && vars.REMOTE_CACHE_URL_YA || '', vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

      - name: Upload graph and plan
        if: steps.plan.outputs.active_shard_count != '' && steps.plan.outputs.active_shard_count != '1'
        uses: actions/upload-artifact@v4
        with:
          name: test-graph-${{ inputs.build_preset }}-${{ github.run_id }}
          retention-days: 7
          path: |
            graph.json
            context.json
            shard_plan.json
            shard_plan.md

  test_shard:
    needs: [prepare, prepare_graph]
    if: needs.prepare.result == 'success' && needs.prepare_graph.result == 'success' && needs.prepare.outputs.shard_count != '1' && needs.prepare_graph.outputs.shard_ids != '[]' && needs.prepare_graph.outputs.shard_ids != ''
    name: ${{ needs.prepare.outputs.checkout_ref }}:${{ inputs.build_preset }} shard ${{ matrix.shard_id }}
    timeout-minutes: 1200
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', inputs.build_preset) }}" ]
    strategy:
      fail-fast: false
      matrix:
        shard_id: ${{ fromJson(needs.prepare_graph.outputs.shard_ids) }}
    steps:
      - name: Record shard start
        run: echo "SHARD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Set variables based on build_preset
        id: set-vars
        run: |
          TEST_THREADS="${{ inputs.test_threads }}"
          if [[ "${{ inputs.build_preset }}" == "relwithdebinfo" ]]; then
            echo "threads_count=$TEST_THREADS" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-asan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.38; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-msan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          elif [[ "${{ inputs.build_preset }}" == "release-tsan" ]]; then
            echo "threads_count=$(awk "BEGIN {x=$TEST_THREADS * 0.35; printf \"%.0f\", (x < 1 ? 1 : x)}")" >> $GITHUB_ENV
            echo "timeout=1200" >> $GITHUB_ENV
          else
            echo "Unknown build_preset value."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare_graph.outputs.checkout_sha }}

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Determine branch name and PR number for test history
        id: determine-branch
        run: |
          branch_name_map='${{ needs.prepare.outputs.branch_name_map }}'
          pr_number_map='${{ needs.prepare.outputs.pr_number_map }}'
          current_branch="${{ needs.prepare.outputs.checkout_ref }}"
          if [ "$branch_name_map" != "{}" ] && [ -n "$branch_name_map" ]; then
            test_history_branch=$(echo "$branch_name_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$test_history_branch" ] && [ "$test_history_branch" != "null" ]; then
              echo "branch_name=$test_history_branch" >> $GITHUB_OUTPUT
            else
              echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
            fi
          else
            echo "branch_name=$current_branch" >> $GITHUB_OUTPUT
          fi
          if [ "$pr_number_map" != "{}" ] && [ -n "$pr_number_map" ]; then
            pr_number=$(echo "$pr_number_map" | jq -r --arg branch "$current_branch" '.[$branch] // empty')
            if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
              echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
            else
              echo "pr_number=" >> $GITHUB_OUTPUT
            fi
          else
            echo "pr_number=" >> $GITHUB_OUTPUT
          fi

      - name: Create blacklist file
        id: create-blacklist
        if: inputs.blacklist_paths != ''
        shell: bash
        env:
          BLACKLIST_PATHS: ${{ inputs.blacklist_paths }}
        run: |
          BLACKLIST_FILE="${{ runner.temp }}/test_blacklist.yaml"
          > "$BLACKLIST_FILE"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            echo "- path: $path" >> "$BLACKLIST_FILE"
          done <<< "$BLACKLIST_PATHS"
          echo "blacklist_file=$BLACKLIST_FILE" >> $GITHUB_OUTPUT

      - name: Download graph and plan
        uses: actions/download-artifact@v4
        with:
          name: test-graph-${{ inputs.build_preset }}-${{ github.run_id }}
          path: test-graph

      - name: Filter graph for shard ${{ matrix.shard_id }}
        run: |
          mkdir -p shard_graph
          python3 .github/scripts/tests/shard_graph.py filter \
            --graph test-graph/graph.json \
            --context test-graph/context.json \
            --plan test-graph/shard_plan.json \
            --shard-id "${{ matrix.shard_id }}" \
            -o shard_graph/graph.json \
            --context-output shard_graph/context.json

      - name: Run shard tests
        id: run_tests
        timeout-minutes: ${{ fromJson(env.timeout) }}
        uses: ./.github/actions/build_and_test_ya
        with:
          build_preset: ${{ inputs.build_preset }}
          increment: false
          build_target: ${{ inputs.test_targets }}
          run_build: true
          run_tests: true
          skip_graph_compare: true
          prebuilt_graph_path: shard_graph/graph.json
          prebuilt_context_path: shard_graph/context.json
          s3_subdir: shard_${{ matrix.shard_id }}
          publish_github_status: false
          test_retry_count: 3
          test_size: ${{ inputs.test_size }}
          test_type: ${{ inputs.test_type }}
          test_threads: ${{ env.threads_count }}
          custom_branch_name: ${{ steps.determine-branch.outputs.branch_name }}
          put_build_results_to_cache: ${{ inputs.remote_cache || inputs.separate_build }}
          collect_coredumps: ${{ inputs.collect_coredumps != false }}
          additional_ya_make_args: -DDEBUGINFO_LINES_ONLY ${{ (inputs.remote_cache || inputs.separate_build) && '' || '--no-bazel-remote-store' }} ${{ inputs.additional_ya_make_args }} ${{ steps.create-blacklist.outputs.blacklist_file && format('--test-blacklist-path {0}', steps.create-blacklist.outputs.blacklist_file) || '' }}
          pull_number: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          secs: ${{ format('{{"AWS_KEY_ID":"{0}","AWS_KEY_VALUE":"{1}","REMOTE_CACHE_USERNAME":"{2}","REMOTE_CACHE_PASSWORD":"{3}","YDBOT_TELEGRAM_BOT_TOKEN":"{4}"}}',
            secrets.AWS_KEY_ID, secrets.AWS_KEY_VALUE, secrets.REMOTE_CACHE_USERNAME, secrets.REMOTE_CACHE_PASSWORD, secrets.YDBOT_TELEGRAM_BOT_TOKEN ) }}
          vars: ${{ format('{{"AWS_BUCKET":"{0}","AWS_ENDPOINT":"{1}","REMOTE_CACHE_URL":"{2}","GH_ALERTS_TG_LOGINS":"{3}","GH_ALERTS_TG_CHAT":"{4}"}}',
            vars.AWS_BUCKET, vars.AWS_ENDPOINT, (inputs.remote_cache || inputs.separate_build) && vars.REMOTE_CACHE_URL_YA || '', vars.GH_ALERTS_TG_LOGINS, vars.GH_ALERTS_TG_CHAT ) }}

      - name: Publish shard progress
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.determine-branch.outputs.pr_number || inputs.pull_number || '' }}
          SHARD_ID: ${{ matrix.shard_id }}
          SHARD_RESULT: ${{ steps.run_tests.outcome }}
        run: |
          set -u
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          job_url=$(python3 .github/scripts/tests/shard_progress.py job-url \
            --run-id "$GITHUB_RUN_ID" \
            --preset "${{ inputs.build_preset }}" \
            --shard-id "$SHARD_ID" || true)
          if [ -z "$job_url" ]; then
            job_url="$run_url"
          fi
          report="${LAST_BUILD_RESULTS_REPORT:-}"
          count=$(python3 -c 'import json; print(json.load(open("test-graph/shard_plan.json"))["shard_count"])')
          report_url=""
          report_json_url=""
          combined_html=""
          combined_url=""
          # PUBLIC_DIR may be reports-only after build_and_test_ya cleanup; S3 still has HTML.
          if [ -n "${PUBLIC_DIR_URL:-}" ]; then
            first_try=$(ls -1d "${PUBLIC_DIR:-}"/try_* 2>/dev/null | sort -V | head -n 1 || true)
            last_try=$(ls -1d "${PUBLIC_DIR:-}"/try_* 2>/dev/null | sort -V | tail -n 1 || true)
            first_base=$(basename "${first_try:-try_1}")
            last_base=$(basename "${last_try:-try_1}")
            report_url="${PUBLIC_DIR_URL}/${first_base}/ya-test.html"
            report_json_url="${PUBLIC_DIR_URL}/${last_base}/report.json"
            case "$PUBLIC_DIR_URL" in
              */shard_${SHARD_ID})
                combined_url="${PUBLIC_DIR_URL%/shard_${SHARD_ID}}/combined"
                combined_html="${RUNNER_TEMP:-/tmp}/combined-ya-test-${SHARD_ID}"
                ;;
            esac
          fi
          python3 .github/scripts/tests/shard_progress.py publish \
            --pr "$PR_NUMBER" \
            --run-id "$GITHUB_RUN_ID" \
            --preset "${{ inputs.build_preset }}" \
            --target "${{ inputs.test_targets }}" \
            --shard-id "$SHARD_ID" \
            --shard-count "$count" \
            --result "${SHARD_RESULT:-failure}" \
            --build-result "${{ steps.run_tests.outputs.build_result }}" \
            --test-result "${{ steps.run_tests.outputs.test_result }}" \
            --started-at "$SHARD_STARTED_AT" \
            --finished-at "$finished_at" \
            --job-url "$job_url" \
            --run-url "$run_url" \
            --log-prefix "shard_${SHARD_ID}" \
            --report "$report" \
            --reports-dir "${PUBLIC_DIR:-}" \
            --report-url "$report_url" \
            --report-json-url "$report_json_url" \
            --combined-html "$combined_html" \
            --combined-url "$combined_url" \
            --state-output shard_event.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
          if [ -n "$combined_html" ] && [ -d "$combined_html" ] && [ -n "${S3_BUCKET_PATH:-}" ]; then
            case "$S3_BUCKET_PATH" in
              */shard_${SHARD_ID})
                for html in "$combined_html"/try_*/ya-test.html; do
                  [ -f "$html" ] || continue
                  try=$(basename "$(dirname "$html")")
                  s3cmd put --acl-public --no-progress --no-mime-magic --guess-mime-type \
                    "$html" "${S3_BUCKET_PATH%/shard_${SHARD_ID}}/combined/${try}/ya-test.html" || true
                done
                ;;
            esac
          fi
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-event-${{ github.run_id }}-${{ inputs.build_preset }}-${{ matrix.shard_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: shard_event.json

  shard_result:
    needs: [prepare, prepare_graph, test_shard]
    if: always() && needs.prepare.outputs.shard_count != '' && needs.prepare.outputs.shard_count != '1' && needs.prepare_graph.outputs.active_shard_count != '' && needs.prepare_graph.outputs.active_shard_count != '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout progress script
        if: always()
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts/tests

      - name: Download shard results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: shard-event-${{ github.run_id }}-*
          path: shard-events

      - name: Reconcile shard comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pull_number }}
          PR_MAP: ${{ needs.prepare.outputs.pr_number_map }}
          CHECKOUT_REF: ${{ needs.prepare.outputs.checkout_ref }}
        run: |
          pr="$PR_INPUT"
          if [ -z "$pr" ] && [ -n "$PR_MAP" ] && [ "$PR_MAP" != "{}" ]; then
            pr=$(printf '%s' "$PR_MAP" | jq -r --arg ref "$CHECKOUT_REF" '.[$ref] // empty')
          fi
          python3 .github/scripts/tests/shard_progress.py finalize \
            --pr "$pr" \
            --run-id "$GITHUB_RUN_ID" \
            --preset "${{ inputs.build_preset }}" \
            --state-dir shard-events \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            || echo "warning: could not reconcile the shard comment"

      - name: Fail unless every shard succeeded
        if: always()
        run: |
          prepare_graph="${{ needs.prepare_graph.result }}"
          test_shard="${{ needs.test_shard.result }}"
          echo "prepare_graph=$prepare_graph"
          echo "test_shard=$test_shard"
          if [ "$prepare_graph" != "success" ]; then
            echo "Graph prepare failed."
            exit 1
          fi
          # A plan that resolved to one host runs tests inside prepare_graph and skips test_shard.
          if [ "$test_shard" != "success" ] && [ "$test_shard" != "skipped" ]; then
            echo "Sharded run failed. The job name ends with 'shard N' and logs are under S3 prefix shard_N."
            exit 1
          fi
