name: Runner fleet check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-fleet-check
  cancel-in-progress: true

jobs:
  check:
    name: Poll runner fleet
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
    - name: Install yc
      run: |
        curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
        echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
    - name: Configure yc
      run: |
        yc config set service-account-key "$CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS"
        yc config set cloud-id b1ggceeul2pkher8vhb6
        yc config set folder-id b1grf3mpoatgflnlavjd
    - name: Install SSH key
      env:
        RECONCILE_SSH_KEY: ${{ secrets.GH_RUNNER_RECONCILE_SSH_KEY }}
        RECONCILE_SSH_PUB: ${{ secrets.GH_RUNNER_RECONCILE_SSH_PUB }}
      run: |
        test -n "$RECONCILE_SSH_KEY"
        test -n "$RECONCILE_SSH_PUB"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$RECONCILE_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$RECONCILE_SSH_PUB" > ~/.ssh/id_ed25519.pub
        chmod 644 ~/.ssh/id_ed25519.pub
        pub_blob=$(awk '{print $2}' ~/.ssh/id_ed25519.pub)
        key_blob=$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $2}')
        test -n "$pub_blob" && test "$pub_blob" = "$key_blob"
        cat > ~/.ssh/config << 'EOF'
        Host gh-runners-gw
          HostName 158.160.148.210
          User kirrysin
          IdentityFile ~/.ssh/id_ed25519
          IdentitiesOnly yes
          StrictHostKeyChecking accept-new
        EOF
        chmod 600 ~/.ssh/config
    - name: Check fleet
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 ydb/ci/gh-runner-provision/provision.py reconcile
        python3 ydb/ci/gh-runner-provision/provision.py poll
