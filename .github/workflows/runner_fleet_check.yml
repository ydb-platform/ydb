name: Runner fleet check
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reconcile plan
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runner-fleet-${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'apply' || 'check' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || !inputs.apply }}

jobs:
  check:
    name: Poll runner fleet
    runs-on: ubuntu-latest
    env:
      YC_CLOUD_ID: ${{ vars.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Self-test
      run: python3 ydb/ci/gh-runner-provision/provision.py self-test
    - name: Setup ydb access
      uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
      with:
        ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
    - name: Install yc
      run: |
        curl -fsSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yandex-cloud" -n
        echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
    - name: Configure yc
      run: |
        test -n "$YC_CLOUD_ID"
        test -n "$YC_FOLDER_ID"
        yc config set service-account-key "$CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS"
        yc config set cloud-id "$YC_CLOUD_ID"
        yc config set folder-id "$YC_FOLDER_ID"
    - name: Install SSH key
      env:
        RECONCILE_SSH_KEY: ${{ secrets.GH_RUNNER_RECONCILE_SSH_KEY }}
        RECONCILE_SSH_PUB: ${{ secrets.GH_RUNNER_RECONCILE_SSH_PUB }}
      run: |
        test -n "$RECONCILE_SSH_KEY"
        test -n "$RECONCILE_SSH_PUB"
        install -d -m 700 ~/.ssh
        printf '%s\n' "$RECONCILE_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        printf '%s\n' "$RECONCILE_SSH_PUB" > ~/.ssh/id_ed25519.pub
        chmod 644 ~/.ssh/id_ed25519.pub
        pub_blob=$(awk '{print $2}' ~/.ssh/id_ed25519.pub)
        key_blob=$(ssh-keygen -y -f ~/.ssh/id_ed25519 | awk '{print $2}')
        test -n "$pub_blob" && test "$pub_blob" = "$key_blob"
        printf '%s\n' '158.160.148.210 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPKWQDKU6SvH+3eP/V0fz30nHeI2nMWoZlMjkIDVP8bk' > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts
        cat > ~/.ssh/config << 'EOF'
        Host gh-runners-gw
          HostName 158.160.148.210
          User kirrysin
          IdentityFile ~/.ssh/id_ed25519
          IdentitiesOnly yes
          StrictHostKeyChecking yes
          UserKnownHostsFile ~/.ssh/known_hosts
        EOF
        chmod 600 ~/.ssh/config
    - name: Check fleet
      env:
        GH_TOKEN: ${{ secrets.GH_YDB_RUNNERS_PAT }}
        GH_RUNNER_RECONCILE_SSH_PUB: ${{ secrets.GH_RUNNER_RECONCILE_SSH_PUB }}
        RECONCILE_APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
      run: |
        if [ "$RECONCILE_APPLY" = "true" ]; then
          python3 ydb/ci/gh-runner-provision/provision.py reconcile --apply
        else
          python3 ydb/ci/gh-runner-provision/provision.py reconcile
        fi
        python3 ydb/ci/gh-runner-provision/provision.py poll
