name: SDK snippet preparation

on:
  pull_request:
    paths:
      - 'ydb/docs/**'
      - '.github/actions/prepare-sdk-snippets/**'
      - '.github/workflows/sdk-snippets.yaml'
  push:
    branches: [main, docs/topic-snippets]
    paths:
      - 'ydb/docs/**'
      - '.github/actions/prepare-sdk-snippets/**'
      - '.github/workflows/sdk-snippets.yaml'

concurrency:
  group: sdk-snippets-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snippets:
    name: Prepare and validate SDK snippets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-sdk-snippets
      - name: Test source selection and strict validation
        working-directory: ydb/docs/tools
        run: python -m unittest sdk_snippets.test_cli
      - name: Verify offline preparation
        env:
          SDK_SNIPPETS_CACHE: ${{ runner.temp }}/sdk-snippets-cache
        run: python ydb/docs/tools/sdk-snippets prepare --offline
      - name: Render code inclusion fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/diplodoc" @diplodoc/cli@5.63.0
          python ydb/docs/tools/sdk_snippets/render_smoke.py "$RUNNER_TEMP/diplodoc/node_modules/.bin/yfm"
      - name: Compare snippet contents
        env:
          SDK_SNIPPETS_CACHE: ${{ runner.temp }}/sdk-snippets-cache
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || 'main' }}"
          if git show FETCH_HEAD:ydb/docs/sdk-snippets.lock.yaml > "$RUNNER_TEMP/sdk-snippets-before.yaml"; then
            python ydb/docs/tools/sdk-snippets diff --before "$RUNNER_TEMP/sdk-snippets-before.yaml" > sdk-snippets.diff
          else
            printf 'SDK snippet sources added in this change.\n' > sdk-snippets.diff
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-snippet-diff
          path: sdk-snippets.diff
