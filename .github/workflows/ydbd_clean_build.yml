name: ydbd-clean-build

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC, off the PR-check peak
  workflow_dispatch:
    inputs:
      build_preset:
        description: "Build preset"
        required: false
        type: choice
        default: relwithdebinfo
        options:
          - relwithdebinfo
          - release
          - debug
          - release-asan
          - release-tsan
          - release-msan
      build_target:
        description: "ya make target"
        required: false
        type: string
        default: "ydb/apps/ydbd"
      link_threads:
        description: "ya make --link-threads"
        required: false
        type: string
        default: "12"
      build_threads:
        description: "ya make --threads (empty = nproc)"
        required: false
        type: string
        default: ""
      commit_sha:
        description: "Commit to build (empty = default branch of this workflow)"
        required: false
        type: string
        default: ""

jobs:
  clean_build:
    name: Clean ydbd build (${{ inputs.build_preset || 'relwithdebinfo' }})
    # Scheduled runs only on the canonical repo; dispatch still works on forks.
    if: github.event_name != 'schedule' || github.repository == 'ydb-platform/ydb'
    runs-on: [ self-hosted, auto-provisioned, "${{ format('build-preset-{0}', inputs.build_preset || 'relwithdebinfo') }}" ]
    timeout-minutes: 600
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Setup ydb access
        uses: ./.github/actions/setup_ci_ydb_service_account_key_file_credentials
        with:
          ci_ydb_service_account_key_file_credentials: ${{ secrets.CI_YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS }}
          ydb_qa_config: ${{ vars.YDB_QA_CONFIG }}

      - name: Init metrics file
        shell: bash
        run: |
          echo "CI_METRICS_FILE=${{ github.workspace }}/ci_metrics.jsonl" >> "$GITHUB_ENV"
          echo "CI_CACHE_MODE=none" >> "$GITHUB_ENV"
          echo "BUILD_PRESET=${{ inputs.build_preset || 'relwithdebinfo' }}" >> "$GITHUB_ENV"
          echo "BRANCH_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          echo "ORIGINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ANALYTICS_JOB_NAME=ydbd-clean-build" >> "$GITHUB_ENV"
          python3 -m pip install ydb ydb[yc]

      - name: Resolve GitHub job id
        continue-on-error: true
        shell: bash
        run: |
          jobs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs"
          job_id=$(curl --retry 5 --retry-all-errors --retry-delay 10 --fail --show-error -s \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$jobs_url" | jq -r '.jobs[]? | select(.name | startswith("Clean ydbd")) | .id' | head -1)
          echo "GITHUB_NUMERIC_JOB_ID=${job_id:-0}" >> "$GITHUB_ENV"

      - name: Clean local caches
        shell: bash
        run: |
          set -x
          rm -rf ~/.ya
          rm -rf .ya
          if command -v ccache >/dev/null 2>&1; then
            ccache -C || true
            ccache -z || true
          fi

      - name: Capture host info
        id: host
        shell: bash
        run: |
          set -x
          NPROC="$(nproc)"
          LOADAVG="$(cut -d' ' -f1-3 /proc/loadavg)"
          MEM_TOTAL_KB="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          MEM_AVAIL_KB="$(awk '/MemAvailable/ {print $2}' /proc/meminfo)"
          MEM_TOTAL_GB="$(python3 -c "print(round(int('${MEM_TOTAL_KB}')/1024/1024, 1))")"
          MEM_AVAIL_GB="$(python3 -c "print(round(int('${MEM_AVAIL_KB}')/1024/1024, 1))")"
          CPU_MODEL="$(awk -F: '/model name/ {gsub(/^[ \t]+/, "", $2); print $2; exit}' /proc/cpuinfo)"
          {
            echo "nproc=$NPROC"
            echo "loadavg_before=$LOADAVG"
            echo "mem_total_gb=$MEM_TOTAL_GB"
            echo "mem_avail_gb=$MEM_AVAIL_GB"
            echo "cpu_model=$CPU_MODEL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "nproc=$NPROC"
            echo "loadavg_before=$LOADAVG"
            echo "mem_total_gb=$MEM_TOTAL_GB"
            echo "mem_avail_gb=$MEM_AVAIL_GB"
            echo "cpu_model=$CPU_MODEL"
            echo "uname=$(uname -a)"
            lscpu || true
          } > host_info.txt

      - name: Run clean build (no caches)
        id: build
        shell: bash
        env:
          BUILD_PRESET: ${{ inputs.build_preset || 'relwithdebinfo' }}
          BUILD_TARGET: ${{ inputs.build_target || 'ydb/apps/ydbd' }}
          LINK_THREADS: ${{ inputs.link_threads || '12' }}
          BUILD_THREADS_INPUT: ${{ inputs.build_threads }}
          HOST_NPROC: ${{ steps.host.outputs.nproc }}
          HOST_CPU_MODEL: ${{ steps.host.outputs.cpu_model }}
        run: |
          set -o pipefail
          case "$BUILD_PRESET" in
            debug|release|relwithdebinfo|release-asan|release-tsan|release-msan) ;;
            *)
              echo "Unknown build preset: $BUILD_PRESET"
              exit 1
              ;;
          esac
          if [[ ! "$BUILD_TARGET" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            echo "Invalid build_target: $BUILD_TARGET"
            exit 1
          fi
          if [[ ! "$LINK_THREADS" =~ ^[0-9]+$ ]]; then
            echo "Invalid link_threads: $LINK_THREADS"
            exit 1
          fi
          if [ -n "$BUILD_THREADS_INPUT" ]; then
            if [[ ! "$BUILD_THREADS_INPUT" =~ ^[0-9]+$ ]]; then
              echo "Invalid build_threads: $BUILD_THREADS_INPUT"
              exit 1
            fi
            BUILD_THREADS="$BUILD_THREADS_INPUT"
          else
            BUILD_THREADS="$HOST_NPROC"
          fi

          YA_MAKE_OUT_DIR="${RUNNER_TEMP:-$PWD}/ya_clean_out"
          mkdir -p "$YA_MAKE_OUT_DIR"

          params=(
            --stat
            --threads "$BUILD_THREADS"
            --link-threads "$LINK_THREADS"
            --no-bazel-remote-store
            -DCONSISTENT_DEBUG
            --no-dir-outputs
            --output "$YA_MAKE_OUT_DIR"
            --build-all
            --force-build-depends
            -DDEBUGINFO_LINES_ONLY
            --evlog-file ya_evlog.jsonl
          )

          case "$BUILD_PRESET" in
            debug) params+=(--build debug) ;;
            release) params+=(--build release) ;;
            relwithdebinfo) params+=(--build relwithdebinfo) ;;
            release-asan) params+=(--build release --sanitize=address) ;;
            release-tsan) params+=(--build release --sanitize=thread) ;;
            release-msan) params+=(--build release --sanitize=memory) ;;
            *)
              echo "Unknown build preset: $BUILD_PRESET"
              exit 1
              ;;
          esac

          echo "Build command: ./ya make ${params[*]} $BUILD_TARGET"
          START_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          START_SEC=$(date +%s)
          python3 .github/scripts/utils/analytics/ci_metrics.py start ydbd_clean_build \
            --source clean_build \
            --attr cache_mode=none \
            --attr "build_target=$BUILD_TARGET" \
            --runner || true

          set +e
          /usr/bin/time -f 'REAL_SECONDS=%e' -o time_result.txt \
            ./ya make "${params[@]}" "$BUILD_TARGET" 2>&1 | tee ya_make_clean_build.log
          RC=${PIPESTATUS[0]}
          set -e

          END_SEC=$(date +%s)
          END_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DURATION=$((END_SEC - START_SEC))
          REAL_SECONDS=$(grep '^REAL_SECONDS=' time_result.txt | cut -d= -f2 || echo "n/a")
          LOADAVG_AFTER="$(cut -d' ' -f1-3 /proc/loadavg)"

          BINARY_LINK=""
          BINARY_BASENAME="$(basename "$BUILD_TARGET")"
          for candidate in \
            "${YA_MAKE_OUT_DIR}/${BUILD_TARGET}/${BINARY_BASENAME}" \
            "${YA_MAKE_OUT_DIR}/${BUILD_TARGET}" \
            "${BUILD_TARGET}/${BINARY_BASENAME}" \
            "${BUILD_TARGET}"
          do
            if [ -n "$candidate" ] && { [ -f "$candidate" ] || [ -L "$candidate" ]; } && [ -x "$candidate" ]; then
              BINARY_LINK="$candidate"
              break
            fi
          done
          if [ -z "$BINARY_LINK" ]; then
            BINARY_LINK="$(find "$YA_MAKE_OUT_DIR" "${BUILD_TARGET}" -maxdepth 4 \( -type f -o -type l \) -executable -name "${BINARY_BASENAME}" 2>/dev/null | head -1 || true)"
          fi

          BINARY_PATH="n/a"
          BINARY_SIZE_BYTES="n/a"
          BINARY_SIZE_HUMAN="n/a"
          BINARY_SIZE_MIB="n/a"
          if [ -n "$BINARY_LINK" ] && [ -e "$BINARY_LINK" ]; then
            BINARY_PATH="$(readlink -f "$BINARY_LINK" 2>/dev/null || realpath "$BINARY_LINK" 2>/dev/null || echo "$BINARY_LINK")"
            BINARY_SIZE_BYTES="$(stat -L -c%s "$BINARY_LINK")"
            BINARY_SIZE_HUMAN="$(ls -Llh "$BINARY_LINK" | awk '{print $5}')"
            BINARY_SIZE_MIB="$(python3 -c "print(round(int('${BINARY_SIZE_BYTES}')/1024/1024, 2))")"
          else
            BINARY_LINK="not found"
            BINARY_PATH="not found"
          fi

          EXTRA=$(LINK_THREADS="$LINK_THREADS" BUILD_THREADS="$BUILD_THREADS" NPROC="$HOST_NPROC" CPU_MODEL="$HOST_CPU_MODEL" BINARY_SIZE_BYTES="$BINARY_SIZE_BYTES" REAL_SECONDS="$REAL_SECONDS" BUILD_TARGET="$BUILD_TARGET" python3 -c 'import json,os; print(json.dumps({"link_threads": int(os.environ["LINK_THREADS"]), "build_threads": int(os.environ["BUILD_THREADS"]), "nproc": int(os.environ["NPROC"]), "cpu_model": os.environ.get("CPU_MODEL") or "", "binary_size_bytes": os.environ.get("BINARY_SIZE_BYTES") or "", "real_seconds": os.environ.get("REAL_SECONDS") or "", "build_target": os.environ.get("BUILD_TARGET") or ""}))')
          CONCLUSION=success
          if [ "$RC" -ne 0 ]; then
            CONCLUSION=failure
          fi
          python3 .github/scripts/utils/analytics/ci_metrics.py end ydbd_clean_build \
            --conclusion "$CONCLUSION" \
            --json "$EXTRA" \
            --usage || true
          if [[ "$BINARY_SIZE_BYTES" =~ ^[0-9]+$ ]]; then
            python3 .github/scripts/utils/analytics/ci_metrics.py track ydbd_size \
              --kind gauge \
              --unit bytes \
              --source clean_build \
              --value "$BINARY_SIZE_BYTES" \
              --label cache_mode=none \
              --label "build_target=$BUILD_TARGET" || true
          fi
          if [ -f ya_evlog.jsonl ]; then
            python3 .github/scripts/utils/analytics/export_ya_nodes.py \
              --evlog ya_evlog.jsonl \
              --source clean_build \
              --label cache_mode=none || true
          fi

          {
            echo "duration_sec=$DURATION"
            echo "real_seconds=$REAL_SECONDS"
            echo "start_ts=$START_TS"
            echo "end_ts=$END_TS"
            echo "build_rc=$RC"
            echo "build_threads=$BUILD_THREADS"
            echo "link_threads=$LINK_THREADS"
            echo "loadavg_after=$LOADAVG_AFTER"
            echo "binary_link=$BINARY_LINK"
            echo "binary_path=$BINARY_PATH"
            echo "binary_size_bytes=$BINARY_SIZE_BYTES"
            echo "binary_size_human=$BINARY_SIZE_HUMAN"
            echo "binary_size_mib=$BINARY_SIZE_MIB"
          } >> "$GITHUB_OUTPUT"

          tail -40 ya_make_clean_build.log > ya_stat_tail.txt || true
          exit "$RC"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          DURATION_SEC="${{ steps.build.outputs.duration_sec }}"
          DURATION_SEC="${DURATION_SEC:-0}"
          DURATION_HUMAN=$(python3 -c "sec=int('${DURATION_SEC}' or 0); h, rem = divmod(sec, 3600); m, s = divmod(rem, 60); print(f'{h}h {m}m {s}s' if h else f'{m}m {s}s')")
          {
            echo "## Clean ydbd build (cache-free)"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Commit | [\`${{ env.ORIGINAL_HEAD }}\`](https://github.com/${{ github.repository }}/commit/${{ env.ORIGINAL_HEAD }}) |"
            echo "| Runner | \`${{ runner.name }}\` |"
            echo "| CPU model | ${{ steps.host.outputs.cpu_model }} |"
            echo "| \`nproc\` | **${{ steps.host.outputs.nproc }}** |"
            echo "| Memory | ${{ steps.host.outputs.mem_avail_gb }} / ${{ steps.host.outputs.mem_total_gb }} GiB available/total |"
            echo "| Build preset | \`${{ inputs.build_preset || 'relwithdebinfo' }}\` |"
            echo "| Build target | \`${{ inputs.build_target || 'ydb/apps/ydbd' }}\` |"
            echo "| Build threads (\`-j\`) | **${{ steps.build.outputs.build_threads }}** |"
            echo "| Link threads | \`${{ steps.build.outputs.link_threads }}\` |"
            echo "| Binary size | **${{ steps.build.outputs.binary_size_human }}** (${{ steps.build.outputs.binary_size_mib }} MiB) |"
            echo "| Wall time | **${{ steps.build.outputs.duration_sec }} sec** ($DURATION_HUMAN) |"
            echo "| \`/usr/bin/time\` real | **${{ steps.build.outputs.real_seconds }} sec** |"
            echo "| Exit code | ${{ steps.build.outputs.build_rc }} |"
            echo ""
            echo "### Cache policy"
            echo "- Removed \`~/.ya\` and repo \`.ya\` before build"
            echo "- Cleared ccache if present"
            echo "- Passed \`--no-bazel-remote-store\`"
            echo "- Kept \`-DDEBUGINFO_LINES_ONLY\`"
            echo ""
            echo "### ya make stat (tail)"
            echo '```text'
            cat ya_stat_tail.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI metrics to ydb-qa
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .github/scripts/utils/analytics/ci_metrics.py send

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydbd-clean-build-logs
          path: |
            ya_make_clean_build.log
            ya_stat_tail.txt
            time_result.txt
            host_info.txt
            ci_metrics.jsonl
            ya_evlog.jsonl
          retention-days: 14
          if-no-files-found: warn
