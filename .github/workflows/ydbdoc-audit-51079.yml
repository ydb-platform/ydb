name: Read ydbdoc job audit for PR 51079

on:
  push:
    branches: [ydbdoc-v1.1-audit-51079-20260922]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ydb-platform/ydbdoc-review-ng
          ref: bafe06ba3ced327f86bb628f58b5c49d6c8df72e
          path: tool
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install './tool[runtime]'
      - name: Print sanitized job and attempt status only
        env:
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}
        run: |
          python - <<'PY'
          import os
          from ydbdoc_review_ng.runtime_ydb import (
              DEFAULT_YDB_DATABASE,
              DEFAULT_YDB_ENDPOINT,
              SDKExecutor,
          )

          executor = SDKExecutor(
              os.environ.get("YDB_ENDPOINT", DEFAULT_YDB_ENDPOINT),
              os.environ.get("YDB_DATABASE", DEFAULT_YDB_DATABASE),
              "",
              os.environ["YDB_SA_KEY"],
          )
          try:
              jobs = executor.execute(
                  """SELECT job_id, mode, pr_number, source_sha, target_sha,
                            started_at, finished_at, status, error
                     FROM `ydbdoc_review/jobs`
                     WHERE pr_number = $pr_number
                     ORDER BY started_at DESC
                     LIMIT 5;""",
                  {"pr_number": 51079},
              )
              for job in jobs:
                  safe_job = {key: job.get(key) for key in (
                      "job_id", "mode", "pr_number", "source_sha", "target_sha",
                      "started_at", "finished_at", "status", "error",
                  )}
                  print("JOB", safe_job, flush=True)
                  attempts = executor.execute(
                      """SELECT role, status, error, model, started_at,
                                finished_at, cost_rub
                         FROM `ydbdoc_review/attempts`
                         WHERE job_id = $job_id
                         ORDER BY started_at ASC;""",
                      {"job_id": job["job_id"]},
                  )
                  for attempt in attempts:
                      print("ATTEMPT", dict(attempt), flush=True)
          finally:
              driver = getattr(executor, "_driver", None)
              if driver is not None:
                  driver.stop()
          PY
