name: One-time documentation storage cutover
on:
  push:
    branches: [migrate-ydbdoc-storage-20260918]
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ydb-platform/ydbdoc-review
          ref: 3241d560e933cb0f527de759e97d40937df70827
          path: tool
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r tool/requirements.txt ./tool
      - name: Back up, rehearse on copies, preserve financial history and archive originals
        env:
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'tool')
          import ydb
          from scripts.provision_ydb import migrate,totals,financial_row
          from ydbdoc_review.ops.ydb_driver import make_ydb_driver
          db='/ru-central1/b1g7gqj2vnq67gjseuva/etns0641qf73btm7j21k'
          backup=db+'/ci_backup_20260918'
          suffix='deploy_20260918'
          driver=make_ydb_driver()
          try:
              driver.scheme_client.make_directory(backup)
              with ydb.SessionPool(driver) as pool:
                  with pool.checkout() as session:
                      def rows(path):
                          return [dict(row) for part in session.read_table(path,ordered=True) for row in part.rows]
                      before=totals([financial_row(row) for row in rows(db+'/runs')])
                      print('Original financial totals',json.dumps(before,default=str))
                      for name in ['runs','run_objects']:
                          session.copy_table(db+'/'+name,backup+'/'+name)
                      assert totals([financial_row(row) for row in rows(backup+'/runs')])==before
                      print('Backup verified. Rehearsing on copied tables.')
                      migrate(session,backup,'rehearsal')
                      assert totals(rows(backup+'/runs'))==before
                      print('Rehearsal verified. Cutting over live tables, preserving originals.')
                      migrate(session,db,suffix)
                      assert totals(rows(db+'/runs'))==before
                      for name in ['runs','run_objects']:
                          desc=session.describe_table(db+'/'+name)
                          print(name,'primary_key=',list(desc.primary_key))
                      print('MIGRATION VERIFIED; originals retained with _preT15_'+suffix)
          finally:
              driver.stop()
          PY
