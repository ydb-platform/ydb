# Запуск только когда на PR вешают лейбл doc_translate.

name: ydbdoc-review (doc_translate label)

on:
  workflow_dispatch:
  pull_request_target:
    types: [labeled]
    paths:
      - "ydb/docs/**"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  diagnose-failed-field:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current translator
        uses: actions/checkout@v4
        with:
          repository: ydb-platform/ydbdoc-review-ng
          ref: main
          path: ydbdoc-review-ng

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ydbdoc-review-ng/pyproject.toml

      - name: Install diagnostic dependencies
        run: python -m pip install -e './ydbdoc-review-ng[runtime,dev]'

      - name: Locate document assembly failure from saved attempts
        working-directory: ydbdoc-review-ng
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          from ydbdoc_review_ng.domain import GitSha, ModelRole, RepoPath, RepositoryId, SnapshotRef
          from ydbdoc_review_ng.models import ModelRequest
          from ydbdoc_review_ng.parser.markdown import build_markdown_plan
          from ydbdoc_review_ng.runtime_content import (
              _assemble_segment_translation,
              _has_only_missing_placeholders,
              _segment_translation_request,
          )
          from ydbdoc_review_ng.runtime_ydb import DEFAULT_YDB_DATABASE, DEFAULT_YDB_ENDPOINT, SDKExecutor
          from ydbdoc_review_ng.translation import (
              AssemblyError,
              TranslationRequest,
              assemble_candidate,
              build_translation_request,
              parse_translation_response,
              validate_translation_values,
          )

          source_path = "ydb/docs/ru/core/changelog-enterprise.md"
          target_path = "ydb/docs/en/core/changelog-enterprise.md"
          executor = SDKExecutor(
              os.environ.get("YDB_ENDPOINT", DEFAULT_YDB_ENDPOINT),
              os.environ.get("YDB_DATABASE", DEFAULT_YDB_DATABASE),
              "",
              os.environ["YDB_SA_KEY"],
          )
          try:
              jobs = executor.execute(
                  "SELECT job_id, source_sha, started_at FROM `ydbdoc_review/jobs` "
                  "WHERE pr_number = $pr_number "
                  "ORDER BY started_at DESC LIMIT 1;",
                  {"pr_number": 50858},
              )
              if len(jobs) != 1:
                  raise RuntimeError(f"expected one latest job, got {len(jobs)}")
              source_sha = str(jobs[0]["source_sha"])
              rows = executor.execute(
                  "SELECT response, started_at FROM `ydbdoc_review/attempts` "
                  "WHERE job_id = $job_id AND target_path = $target_path;",
                  {"job_id": jobs[0]["job_id"], "target_path": target_path},
              )
              response_maps = []
              for row in sorted(rows, key=lambda row: row["started_at"]):
                  if row["response"] is None:
                      continue
                  outer = json.loads(bytes(row["response"]).decode())
                  text = outer["result"]["alternatives"][0]["message"]["text"]
                  try:
                      value = json.loads(text)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, dict):
                      response_maps.append((text, value))

              url = (
                  "https://raw.githubusercontent.com/ydb-platform/ydb/"
                  + source_sha
                  + "/"
                  + source_path
              )
              with urllib.request.urlopen(url, timeout=30) as response:
                  source = response.read()
              snapshot = SnapshotRef(RepositoryId("ydb-platform/ydb"), GitSha(source_sha))
              plan = build_markdown_plan(snapshot, RepoPath(source_path), source)
              request = build_translation_request(source, plan)
              values = {}
              cursor = 0
              for field_index, field in enumerate(request.fields, 1):
                  field_request = TranslationRequest((field.field_id,), (field,))
                  rejected = None
                  while cursor < len(response_maps):
                      raw, decoded = response_maps[cursor]
                      cursor += 1
                      if set(decoded) == {field.field_id}:
                          try:
                              candidate = parse_translation_response(raw, field_request)
                              validate_translation_values(field_request, candidate)
                          except AssemblyError:
                              value = decoded.get(field.field_id)
                              rejected = value if isinstance(value, str) else None
                              continue
                          values.update(candidate)
                          break
                      if rejected is not None and _has_only_missing_placeholders(field, rejected):
                          base = ModelRequest(
                              ModelRole.TRANSLATE,
                              "diagnostic",
                              "diagnostic",
                              {},
                              1,
                              RepoPath(target_path),
                          )
                          _, fallback, segments = _segment_translation_request(
                              base, field, "ru", "en"
                          )
                          values[field.field_id] = _assemble_segment_translation(
                              field, fallback, segments, raw
                          )
                          break
                  else:
                      raise RuntimeError(f"missing response for field {field_index}")

              if len(values) != len(request.fields):
                  raise RuntimeError(
                      f"reconstructed {len(values)} of {len(request.fields)} fields"
                  )
              try:
                  assemble_candidate(source, plan, request, values)
              except AssemblyError as error:
                  print(json.dumps({
                      "all_fields_reason": error.reason.value,
                      "fields": len(request.fields),
                      "responses_consumed": cursor,
                      "responses_total": len(response_maps),
                  }, sort_keys=True))

              incremental = {field.field_id: field.text for field in request.fields}
              assemble_candidate(source, plan, request, incremental)
              for field_index, field in enumerate(request.fields, 1):
                  incremental[field.field_id] = values[field.field_id]
                  try:
                      assemble_candidate(source, plan, request, incremental)
                  except AssemblyError as error:
                      print(json.dumps({
                          "first_failing_field": field_index,
                          "field_id": field.field_id,
                          "reason": error.reason.value,
                          "placeholders": [item.token for item in field.placeholders],
                      }, sort_keys=True))
                      break
          finally:
              executor.close()
          PY
        env:
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}

  ydbdoc-review:
    if: github.event.label.name == 'doc_translate'
    runs-on: ubuntu-latest
    concurrency:
      group: ydbdoc-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve immutable authoritative source
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.merged) {
              core.setOutput('sha', pr.head.sha);
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.base.ref}`,
            });
            core.setOutput('sha', ref.object.sha);

      - name: Documentation translation review
        uses: ydb-platform/ydbdoc-review-ng/.github/actions/doc-review@v1.0.1
        with:
          mode: translate
          pr: ${{ github.event.pull_request.number }}
          source-sha: ${{ steps.source.outputs.sha }}
          budget-rub: ${{ vars.YDBDOC_DAILY_BUDGET_RUB }}
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_DOC_REVIEW }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY_DOC_REVIEW }}
          YDB_GH_TOKEN: ${{ secrets.YDBDOC_PUSH_PAT }}
          GITHUB_ACTOR: ${{ github.event.sender.login }}
          YDBDOC_ALLOWED_ACTORS: ${{ vars.YDBDOC_ALLOWED_ACTORS }}
          YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE: ${{ vars.YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE }}
          YDBDOC_MAX_SOURCE_CHARACTERS: ${{ vars.YDBDOC_MAX_SOURCE_CHARACTERS }}
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}

  trigger-translation-ci:
    needs: ydbdoc-review
    if: ${{ !cancelled() && needs.ydbdoc-review.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PR-check (ok-to-test) on translation PR
        uses: actions/github-script@v8
        with:
          # This separate automation PAT cascades into PR-check/docs rebuild without
          # exposing YDBOT_TOKEN next to untrusted fork PR code.
          github-token: ${{ secrets.YDBOT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourcePr = context.payload.pull_request.number;
            const head = `${owner}:translation/pr-${sourcePr}`;
            let translationPr = null;

            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head,
                per_page: 1,
              });

              if (pulls[0]) {
                translationPr = pulls[0];
                break;
              }

              if (attempt < 6) {
                core.info(`Translation PR not found yet (${attempt}/6), retrying...`);
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            if (!translationPr) {
              core.warning(
                `Open translation PR not found for head ${head}. Labels were not added; CI can be triggered manually.`
              );
              return;
            }

            // ok-to-test only. Do NOT add rebuild_docs here: pull_request already
            // starts Build documentation on the translation PR, and rebuild's
            // workflow_dispatch cancels that run (shared concurrency) while
            // attaching its own success check to main — PR stays red (#48409).
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: translationPr.number,
              labels: ['ok-to-test'],
            });

            core.info(
              `Added ok-to-test to translation PR #${translationPr.number}`
            );
