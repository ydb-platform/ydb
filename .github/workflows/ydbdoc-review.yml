# Запуск только когда на PR вешают лейбл doc_translate.

name: ydbdoc-review (doc_translate label)

on:
  pull_request_target:
    types: [labeled]
    paths:
      - "ydb/docs/**"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  ydbdoc-review:
    if: github.event.label.name == 'doc_translate'
    runs-on: ubuntu-latest
    concurrency:
      group: ydbdoc-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve immutable authoritative source
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.merged) {
              core.setOutput('sha', pr.head.sha);
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.base.ref}`,
            });
            core.setOutput('sha', ref.object.sha);

      - name: Documentation translation review
        uses: ydb-platform/ydbdoc-review-ng/.github/actions/doc-review@v1.0.1
        with:
          mode: translate
          pr: ${{ github.event.pull_request.number }}
          source-sha: ${{ steps.source.outputs.sha }}
          budget-rub: ${{ vars.YDBDOC_DAILY_BUDGET_RUB }}
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_DOC_REVIEW }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY_DOC_REVIEW }}
          YDB_GH_TOKEN: ${{ secrets.YDBDOC_PUSH_PAT }}
          GITHUB_ACTOR: ${{ github.event.sender.login }}
          YDBDOC_ALLOWED_ACTORS: ${{ vars.YDBDOC_ALLOWED_ACTORS }}
          YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE: ${{ vars.YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE }}
          YDBDOC_MAX_SOURCE_CHARACTERS: ${{ vars.YDBDOC_MAX_SOURCE_CHARACTERS }}
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}

  trigger-translation-ci:
    needs: ydbdoc-review
    if: ${{ !cancelled() && needs.ydbdoc-review.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PR-check (ok-to-test) on translation PR
        uses: actions/github-script@v8
        with:
          # This separate automation PAT cascades into PR-check/docs rebuild without
          # exposing YDBOT_TOKEN next to untrusted fork PR code.
          github-token: ${{ secrets.YDBOT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourcePr = context.payload.pull_request.number;
            const head = `${owner}:translation/pr-${sourcePr}`;
            let translationPr = null;

            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head,
                per_page: 1,
              });

              if (pulls[0]) {
                translationPr = pulls[0];
                break;
              }

              if (attempt < 6) {
                core.info(`Translation PR not found yet (${attempt}/6), retrying...`);
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            if (!translationPr) {
              core.warning(
                `Open translation PR not found for head ${head}. Labels were not added; CI can be triggered manually.`
              );
              return;
            }

            // ok-to-test only. Do NOT add rebuild_docs here: pull_request already
            // starts Build documentation on the translation PR, and rebuild's
            // workflow_dispatch cancels that run (shared concurrency) while
            // attaching its own success check to main — PR stays red (#48409).
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: translationPr.number,
              labels: ['ok-to-test'],
            });

            core.info(
              `Added ok-to-test to translation PR #${translationPr.number}`
            );
