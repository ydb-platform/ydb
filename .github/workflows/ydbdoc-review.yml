# Запуск только когда на PR вешают лейбл doc_translate.

name: ydbdoc-review (doc_translate label)

on:
  workflow_dispatch:
  pull_request_target:
    types: [labeled]
    paths:
      - "ydb/docs/**"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read

jobs:
  diagnose-failed-field:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current translator
        uses: actions/checkout@v4
        with:
          repository: ydb-platform/ydbdoc-review-ng
          ref: main
          path: ydbdoc-review-ng

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ydbdoc-review-ng/pyproject.toml

      - name: Install diagnostic dependencies
        run: python -m pip install -e './ydbdoc-review-ng[runtime,dev]'

      - name: Report protected-token mismatch from saved attempts
        working-directory: ydbdoc-review-ng
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from ydbdoc_review_ng.runtime_ydb import DEFAULT_YDB_DATABASE, DEFAULT_YDB_ENDPOINT, SDKExecutor

          target_path = "ydb/docs/en/core/changelog-enterprise.md"
          field_id = "f1-000260-074267b067b0dbb67971a198ee4a83c5ab894fb13b0b92e3b3bf008dc84d1fc8"
          required = [
              "[[LINK_OPEN_0001]]", "[[LINK_CLOSE_0002]]",
              "[[LINK_OPEN_0003]]", "[[LINK_CLOSE_0004]]",
              "[[INLINE_CODE_0005]]", "[[INLINE_CODE_0006]]",
              "[[LINK_OPEN_0007]]", "[[LINK_CLOSE_0008]]",
          ]
          executor = SDKExecutor(
              os.environ.get("YDB_ENDPOINT", DEFAULT_YDB_ENDPOINT),
              os.environ.get("YDB_DATABASE", DEFAULT_YDB_DATABASE),
              "",
              os.environ["YDB_SA_KEY"],
          )
          try:
              jobs = executor.execute(
                  "SELECT job_id, started_at FROM `ydbdoc_review/jobs` "
                  "WHERE pr_number = $pr_number AND source_sha = $source_sha "
                  "ORDER BY started_at DESC LIMIT 1;",
                  {
                      "pr_number": 50858,
                      "source_sha": "b3cd5e6f975a489a3e4edcf6f2939b5f2068a692",
                  },
              )
              if len(jobs) != 1:
                  raise RuntimeError(f"expected one latest job, got {len(jobs)}")
              rows = executor.execute(
                  "SELECT response, started_at FROM `ydbdoc_review/attempts` "
                  "WHERE job_id = $job_id AND target_path = $target_path;",
                  {"job_id": jobs[0]["job_id"], "target_path": target_path},
              )
              rows = sorted(rows, key=lambda row: row["started_at"])[-2:]
              for number, row in enumerate(rows, 1):
                  outer = json.loads(bytes(row["response"]).decode())
                  text = outer["result"]["alternatives"][0]["message"]["text"]
                  value = json.loads(text).get(field_id)
                  returned = re.findall(r"\[\[[A-Z_]+_[0-9]+\]\]", value or "")
                  expected_counts = Counter(required)
                  returned_counts = Counter(returned)
                  print(json.dumps({
                      "attempt": number,
                      "field_id": field_id,
                      "value_is_string": isinstance(value, str),
                      "required": required,
                      "returned": returned,
                      "missing": list((expected_counts - returned_counts).elements()),
                      "unexpected": list((returned_counts - expected_counts).elements()),
                  }, sort_keys=True))
          finally:
              executor.close()
          PY
        env:
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}

  ydbdoc-review:
    if: github.event.label.name == 'doc_translate'
    runs-on: ubuntu-latest
    concurrency:
      group: ydbdoc-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Resolve immutable authoritative source
        id: source
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.merged) {
              core.setOutput('sha', pr.head.sha);
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${pr.base.ref}`,
            });
            core.setOutput('sha', ref.object.sha);

      - name: Documentation translation review
        uses: ydb-platform/ydbdoc-review-ng/.github/actions/doc-review@v1.0.1
        with:
          mode: translate
          pr: ${{ github.event.pull_request.number }}
          source-sha: ${{ steps.source.outputs.sha }}
          budget-rub: ${{ vars.YDBDOC_DAILY_BUDGET_RUB }}
        env:
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_CLOUD_FOLDER_DOC_REVIEW }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_CLOUD_API_KEY_DOC_REVIEW }}
          YDB_GH_TOKEN: ${{ secrets.YDBDOC_PUSH_PAT }}
          GITHUB_ACTOR: ${{ github.event.sender.login }}
          YDBDOC_ALLOWED_ACTORS: ${{ vars.YDBDOC_ALLOWED_ACTORS }}
          YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE: ${{ vars.YDBDOC_MAX_DEPENDENCY_FILES_PER_ARTICLE }}
          YDBDOC_MAX_SOURCE_CHARACTERS: ${{ vars.YDBDOC_MAX_SOURCE_CHARACTERS }}
          YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}

  trigger-translation-ci:
    needs: ydbdoc-review
    if: ${{ !cancelled() && needs.ydbdoc-review.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PR-check (ok-to-test) on translation PR
        uses: actions/github-script@v8
        with:
          # This separate automation PAT cascades into PR-check/docs rebuild without
          # exposing YDBOT_TOKEN next to untrusted fork PR code.
          github-token: ${{ secrets.YDBOT_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sourcePr = context.payload.pull_request.number;
            const head = `${owner}:translation/pr-${sourcePr}`;
            let translationPr = null;

            for (let attempt = 1; attempt <= 6; attempt++) {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head,
                per_page: 1,
              });

              if (pulls[0]) {
                translationPr = pulls[0];
                break;
              }

              if (attempt < 6) {
                core.info(`Translation PR not found yet (${attempt}/6), retrying...`);
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }

            if (!translationPr) {
              core.warning(
                `Open translation PR not found for head ${head}. Labels were not added; CI can be triggered manually.`
              );
              return;
            }

            // ok-to-test only. Do NOT add rebuild_docs here: pull_request already
            // starts Build documentation on the translation PR, and rebuild's
            // workflow_dispatch cancels that run (shared concurrency) while
            // attaching its own success check to main — PR stays red (#48409).
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: translationPr.number,
              labels: ['ok-to-test'],
            });

            core.info(
              `Added ok-to-test to translation PR #${translationPr.number}`
            );
