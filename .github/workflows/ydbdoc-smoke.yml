name: Documentation storage progress (read only)
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Inspect existing YDB table schema (read only)
      env:
        YDB_SA_KEY: ${{ secrets.YDB_SA_KEY }}
      run: "python -m pip install --quiet 'ydb[yc]==3.32.0'\npython - <<'PY'\nimport\
        \ os, ydb\ndb='/ru-central1/b1g7gqj2vnq67gjseuva/etns0641qf73btm7j21k'\ncredentials=ydb.iam.ServiceAccountCredentials.from_content(os.environ['YDB_SA_KEY'])\n\
        driver=ydb.Driver(endpoint='grpcs://ydb.serverless.yandexcloud.net:2135',\
        \ database=db, credentials=credentials)\ntry:\n    driver.wait(timeout=15,\
        \ fail_fast=True)\n    with ydb.SessionPool(driver) as pool:\n        for\
        \ name in ['runs','run_objects','ci_backup_20260918/runs','ci_backup_20260918/run_objects']:\n\
        \            desc=pool.retry_operation_sync(lambda session: session.describe_table(db+'/'+name))\n\
        \            print(name, 'primary_key=', list(desc.primary_key))\n       \
        \     if name.endswith('runs'):\n                result=pool.retry_operation_sync(lambda\
        \ session: session.transaction().execute('SELECT COUNT(*) AS n FROM `'+db+'/'+name+'`;',\
        \ commit_tx=True))\n                print('row_count',name,result[0].rows[0].n)\n\
        finally:\n    driver.stop()\nPY\n"
'on':
  push:
    branches:
    - test-ydbdoc-action-20260918
