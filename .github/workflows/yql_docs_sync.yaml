name: Sync untouched YQL documentation

on:
  schedule:
    - cron: '0 2 * * *' # 05:00 Europe/Moscow (UTC+3); GitHub may delay scheduled runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report changes without creating or updating a PR'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'ydb/docs/tools/yql_sync/**'
      - 'yql/essentials/docs/scripts/doc_upgrade_git.sh'
      - '.github/workflows/yql_docs_sync.yaml'

concurrency:
  group: yql-docs-sync-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            ydb/docs/tools/yql_sync
            yql/essentials/docs/scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s ydb/docs/tools/yql_sync -v

  sync:
    needs: test
    if: github.repository == 'ydb-platform/ydb' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          sparse-checkout: |
            yql/essentials/docs
            ydb/docs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Preserve reviewer commits on the existing sync branch
        run: |
          branch=refs/remotes/origin/automation/yql-docs-sync
          if git show-ref --verify --quiet "$branch"; then
            while IFS= read -r committer; do
              if [[ "$committer" != '41898282+github-actions[bot]@users.noreply.github.com' ]]; then
                echo '::error::The sync branch contains reviewer commits. Merge or close its PR, then delete the branch before resuming sync.'
                exit 1
              fi
            done < <(git log --format='%ce' "HEAD..$branch")
          fi
      - name: Fetch historical source revisions when needed
        run: |
          python3 - <<'PYTHON' > "$RUNNER_TEMP/yql-sync-revisions"
          import json
          import re
          state = json.load(open('ydb/docs/tools/yql_sync/ownership.json'))
          revisions = {state['checkpoint']}
          revisions.update(entry['revision'] for entry in state['files'].values() if entry['owner'] == 'yql')
          for revision in sorted(revisions):
              if not re.fullmatch('[0-9a-f]{40}', revision):
                  raise SystemExit('Invalid revision in ownership config')
              print(revision)
          PYTHON
          while IFS= read -r revision; do
            if ! git cat-file -e "$revision^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$revision"
            fi
          done < "$RUNNER_TEMP/yql-sync-revisions"
      - name: Compare and synchronize unmodified files
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=(--report "$RUNNER_TEMP/yql-docs-sync.json")
          if [[ "$DRY_RUN" != true ]]; then
            args+=(--apply)
          fi
          bash yql/essentials/docs/scripts/doc_upgrade_git.sh --selective "${args[@]}"
          {
            echo '### YQL documentation synchronization'
            echo '```json'
            cat "$RUNNER_TEMP/yql-docs-sync.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: yql-docs-sync-report
          path: ${{ runner.temp }}/yql-docs-sync.json
      - name: Create or update the review PR
        if: inputs.dry_run != true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.YDBOT_TOKEN }}
          base: main
          branch: automation/yql-docs-sync
          delete-branch: true
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          add-paths: |
            ydb/docs/ru/core/yql/reference
            ydb/docs/en/core/yql/reference
            ydb/docs/tools/yql_sync/ownership.json
          commit-message: 'docs: sync untouched YQL reference files'
          title: 'docs: sync untouched YQL reference files'
          body: |
            ### Changelog entry

            Update unmodified YQL reference pages from `yql/essentials/docs`.

            ### Description for reviewers

            Files changed locally in YDB are permanently excluded in
            `ydb/docs/tools/yql_sync/ownership.json`. Newly added upstream files
            are not automatically imported. Upstream deletions and renames
            preserve the current YDB page and exclude it from future syncs.

            Review the documentation build and the `yql-docs-sync-report`
            artifact from this workflow run. This PR is never auto-merged.
