HTTP_RESOURCES_FAKEID=${FAKEID}.7600000

macro FROM_HTTP(URI, OUT, CWD="${BINDIR}") {
  .CMD=${hide:HTTP_RESOURCES_FAKEID} ${cwd:CWD} ${resource:URI} $YMAKE_PYTHON3 ${input:"build/scripts/process_from_http.py"} --resource-root $(RESOURCE_ROOT) --uri ${URI} --out ${output:OUT} ${hide;kv:"p HTTP"} ${hide;kv:"pc red"} ${hide;kv:"show_out"}
}
