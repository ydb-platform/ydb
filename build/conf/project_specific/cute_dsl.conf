_CUTE_DSL_ROOT=dict/mt/libs/nn/ynmt_backend/gpu/cute_dsl_kernels

_CUTE_DSL_TOOLCHAIN_ENV=$TOOLCHAIN_ENV
_CUTE_DSL_RUN_CMD=${tool:_GPU_CODEGEN_TOOL} generate $_GPU_CODEGEN_ENV_ROOT ${ARCADIA_ROOT}/${MODDIR} ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator $_CUTE_DSL_DRIVER $_CUTE_DSL_PRIVATE_DIR $_CUTE_DSL_CLASS
_CUTE_DSL_INPUT_ARGS=--import-guard ${input:_GPU_CODEGEN_GUARD} --source-inputs ${input:_GPU_CODEGEN_SOURCES}
_CUTE_DSL_TAIL=--host-compiler $CXX_COMPILER $C_FLAGS_PLATFORM $CXXFLAGS
_CUTE_DSL_PUBLISH_CMD=${tool:_GPU_CODEGEN_TOOL} publish $_CUTE_DSL_PRIVATE_DIR $_CUTE_DSL_OUTPUT_DIR $_CUTE_DSL_CLASS --source-root ${ARCADIA_ROOT} $_CUTE_DSL_CANONICAL_ARGS

### @usage: CUTE_DSL_KERNEL(Driver ClassName EnvironmentPath [SHARDS N] [PY_DIRS <Directories>])
### @usage: CUTE_DSL_KERNEL_STUB(ClassName)
###
### Generate and compile a CuTe DSL kernel. Driver is a target-local *2cpp.py,
### ClassName sets the generated C++ class name via the build environment.
### EnvironmentPath is an Arcadia-relative resource library using GPU_CODEGEN_ENVIRONMENT(ResourceUri).
### CUTE_DSL_KERNEL_STUB skips codegen and compiles the committed stub.
### PY_DIRS adds Python source inputs directly from each directory.
### SHARDS N creates N compilation nodes and one finalizer; SHARDS 1 skips sharding.
### The default is 32 shards; CUTE_DSL_NO_SHARDING disables sharding.
macro CUTE_DSL_KERNEL(ARGS...) {
    _CUTE_DSL_KERNEL_IMPL($ARGS)
}

macro _CUTE_DSL_SETUP(DRIVER, CLASS_NAME, ENVIRONMENT, PY_DIRS[]) {
    ASSERT(CLANG CuTe DSL codegen requires a Clang toolchain)
    SET(_GPU_CODEGEN_TOOL dict/mt/libs/nn/ynmt_backend/gpu/cute_dsl_kernels/build_tools)
    SET(_GPU_CODEGEN_GUARD dict/mt/libs/nn/ynmt_backend/gpu/codegen_tools/import_guard.py)
    SET(_GPU_CODEGEN_TOOLCHAIN_ENV \$_CUTE_DSL_TOOLCHAIN_ENV)
    SET(_GPU_CODEGEN_RUN_CMD \$_CUTE_DSL_RUN_CMD)
    SET(_GPU_CODEGEN_INPUT_ARGS \$_CUTE_DSL_INPUT_ARGS)
    SET(_GPU_CODEGEN_TAIL \$_CUTE_DSL_TAIL)
    SET(_GPU_CODEGEN_PUBLISH_CMD \$_CUTE_DSL_PUBLISH_CMD)
    SET(_CUTE_DSL_DRIVER $DRIVER)
    SET(_CUTE_DSL_CLASS $CLASS_NAME)
    SET(_GPU_CODEGEN_CWD ${ARCADIA_ROOT}/${MODDIR})
    SET(_GPU_CODEGEN_ENV LD=${LLD_ROOT_RESOURCE_GLOBAL}/bin/ld.lld)

    SET(_CUTE_DSL_PRIVATE_DIR ${BINDIR}/generated_cpp/_codegen)
    SET(_CUTE_DSL_OUTPUT_DIR ${BINDIR}/generated_cpp)

    SET(_GPU_CODEGEN_RENDER_INPUTS ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator/templates/cute_dsl.cpp.j2 ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator/templates/cute_dsl.hpp.j2 ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator/templates/cute_dsl_stub.cpp.j2 ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator/templates/cute_dsl_bindings.cpp.j2)

    SET(_GPU_CODEGEN_AUTO_OUTPUTS generated_cpp/${CLASS_NAME}.cpp generated_cpp/${CLASS_NAME}_kernels.o generated_cpp/cute_dsl_runtime_static.a)
    SET(_GPU_CODEGEN_NOAUTO_OUTPUTS generated_cpp/${CLASS_NAME}.hpp generated_cpp/bindings/${CLASS_NAME}.cpp generated_cpp/${CLASS_NAME}_generated_sources.tar)
    SET(_GPU_CODEGEN_PRIVATE_OUTPUTS ${_CUTE_DSL_PRIVATE_DIR}/${CLASS_NAME}.hpp ${_CUTE_DSL_PRIVATE_DIR}/${CLASS_NAME}.cpp ${_CUTE_DSL_PRIVATE_DIR}/${CLASS_NAME}_kernels.o ${_CUTE_DSL_PRIVATE_DIR}/cute_dsl_runtime_static.a ${_CUTE_DSL_PRIVATE_DIR}/${CLASS_NAME}_stub.cpp ${_CUTE_DSL_PRIVATE_DIR}/bindings/${CLASS_NAME}.cpp ${_CUTE_DSL_PRIVATE_DIR}/${CLASS_NAME}_generated_sources.tar)

    SET(_CUTE_DSL_CANONICAL_ARGS)
    SET(_GPU_CODEGEN_CANONICAL_INPUTS)
    when ($AUTOCHECK == "yes") {
        _CUTE_DSL_CANONICAL_DIR=${ARCADIA_ROOT}/${MODDIR}/generated_cpp
        _CUTE_DSL_CANONICAL_ARGS=--canonical-dir ${_CUTE_DSL_CANONICAL_DIR}
        _GPU_CODEGEN_CANONICAL_INPUTS= \
            ${_CUTE_DSL_CANONICAL_DIR}/${_CUTE_DSL_CLASS}.hpp \
            ${_CUTE_DSL_CANONICAL_DIR}/${_CUTE_DSL_CLASS}_stub.cpp
    }

    _LATE_GLOB(_GPU_CODEGEN_SOURCES ${ARCADIA_ROOT}/${MODDIR}/**/*.py ${ARCADIA_ROOT}/${_CUTE_DSL_ROOT}/build_tools/cpp_generator/**/*.py ${pre=${ARCADIA_ROOT}/;suf=/*.py:PY_DIRS} RESTRICTIONS MAX_MATCHES 10000 MAX_WATCH_DIRS 5000 SKIPPED_MIN_MATCHES 2000 SKIPPED_ERROR_PERCENT 90)

    PEERDIR(build/platform/lld)
    PEERDIR(build/internal/platform/cuda contrib/libs/nvidia/cutlass)
}

macro CUTE_DSL_KERNEL_STUB(CLASS_NAME) {
    SRCS(generated_cpp/${CLASS_NAME}_stub.cpp)
    PEERDIR(build/internal/platform/cuda contrib/libs/nvidia/cutlass)
}
