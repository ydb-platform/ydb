# Backend setup supplies commands, inputs, outputs and environment. Only the
# full and finalize actions consume render inputs; canons belong to publish.
_GPU_CODEGEN_GENERATE_CMD=$_GPU_CODEGEN_RUN_CMD $_GPU_CODEGEN_INPUT_ARGS ${input:_GPU_CODEGEN_RENDER_INPUTS} $_GPU_CODEGEN_TAIL
_GPU_CODEGEN_COMPILE_CMD=$_GPU_CODEGEN_RUN_CMD --shard-index $INDEX --shard-count $COUNT --shard-archive ${noauto;output:ARCHIVE} $_GPU_CODEGEN_INPUT_ARGS $_GPU_CODEGEN_TAIL
_GPU_CODEGEN_FINALIZE_CMD=$_GPU_CODEGEN_RUN_CMD --shard-count $COUNT --shards ${input:ARCHIVES} $_GPU_CODEGEN_INPUT_ARGS ${input:_GPU_CODEGEN_RENDER_INPUTS} $_GPU_CODEGEN_TAIL

macro _GPU_CODEGEN_GENERATE() {
    .CMD=${cwd:_GPU_CODEGEN_CWD} ${env:_GPU_CODEGEN_ENV} $_GPU_CODEGEN_GENERATE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV ${hide;noauto;output:_GPU_CODEGEN_PRIVATE_OUTPUTS} ${hide;kv:"p PR"} ${hide;kv:"pc yellow"} ${hide;kv:"show_out"}
    .SEM=custom_runs-ITEM && custom_runs-depends ${input:_GPU_CODEGEN_SOURCES} ${input:_GPU_CODEGEN_RENDER_INPUTS} ${input:_GPU_CODEGEN_GUARD} ${tool:_GPU_CODEGEN_TOOL} && custom_runs-env $_GPU_CODEGEN_ENV && custom_runs-command $_GPU_CODEGEN_GENERATE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV && custom_runs-outputs ${noauto;output:_GPU_CODEGEN_PRIVATE_OUTPUTS} && custom_runs-cwd $_GPU_CODEGEN_CWD
}

macro _GPU_CODEGEN_COMPILE_SHARD(INDEX, COUNT, ARCHIVE) {
    .CMD=${cwd:_GPU_CODEGEN_CWD} ${env:_GPU_CODEGEN_ENV} $_GPU_CODEGEN_COMPILE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV ${hide;kv:"p PR"} ${hide;kv:"pc yellow"} ${hide;kv:"show_out"}
    .SEM=custom_runs-ITEM && custom_runs-depends ${input:_GPU_CODEGEN_SOURCES} ${input:_GPU_CODEGEN_GUARD} ${tool:_GPU_CODEGEN_TOOL} && custom_runs-env $_GPU_CODEGEN_ENV && custom_runs-command $_GPU_CODEGEN_COMPILE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV && custom_runs-outputs ${noauto;output:ARCHIVE} && custom_runs-cwd $_GPU_CODEGEN_CWD
}

macro _GPU_CODEGEN_FINALIZE(COUNT, ARCHIVES...) {
    .CMD=${cwd:_GPU_CODEGEN_CWD} ${env:_GPU_CODEGEN_ENV} $_GPU_CODEGEN_FINALIZE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV ${hide;noauto;output:_GPU_CODEGEN_PRIVATE_OUTPUTS} ${hide;kv:"p PR"} ${hide;kv:"pc yellow"} ${hide;kv:"show_out"}
    .SEM=custom_runs-ITEM && custom_runs-depends ${input:_GPU_CODEGEN_SOURCES} ${input:_GPU_CODEGEN_RENDER_INPUTS} ${input:_GPU_CODEGEN_GUARD} ${tool:_GPU_CODEGEN_TOOL} ${input:ARCHIVES} && custom_runs-env $_GPU_CODEGEN_ENV && custom_runs-command $_GPU_CODEGEN_FINALIZE_CMD $_GPU_CODEGEN_TOOLCHAIN_ENV && custom_runs-outputs ${noauto;output:_GPU_CODEGEN_PRIVATE_OUTPUTS} && custom_runs-cwd $_GPU_CODEGEN_CWD
}

macro _GPU_CODEGEN_PUBLISH() {
    .CMD=$_GPU_CODEGEN_PUBLISH_CMD ${hide;input:_GPU_CODEGEN_PRIVATE_OUTPUTS} ${hide;input:_GPU_CODEGEN_CANONICAL_INPUTS} ${hide;output:_GPU_CODEGEN_AUTO_OUTPUTS} ${hide;noauto;output:_GPU_CODEGEN_NOAUTO_OUTPUTS} ${hide;kv:"p PR"} ${hide;kv:"pc yellow"} ${hide;kv:"show_out"}
    .SEM=custom_runs-ITEM && custom_runs-depends ${input:_GPU_CODEGEN_PRIVATE_OUTPUTS} ${input:_GPU_CODEGEN_CANONICAL_INPUTS} ${tool:_GPU_CODEGEN_TOOL} && custom_runs-command $_GPU_CODEGEN_PUBLISH_CMD && custom_runs-outputs ${output:_GPU_CODEGEN_AUTO_OUTPUTS} ${noauto;output:_GPU_CODEGEN_NOAUTO_OUTPUTS}
}
