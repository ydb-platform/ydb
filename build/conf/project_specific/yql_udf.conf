# A module that states no ABI takes the stable one -- the version every deployed host provides.
YQL_ABI_PEERDIR_TAG=YQL_ABI_STABLE
YQL_UDF_STATIC_PEERDIR_TAG=YQL_UDF_STATIC

### @usage: YQL_LIBRARY()
###
### A multimodule for a LIBRARY whose code depends on the UDF ABI version: YQL_LIBRARY_STABLE is
### built at the stable ABI, YQL_LIBRARY_CURRENT at the ABI of this revision. A consumer takes the
### variant its own YQL_ABI_PEERDIR_TAG names.
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION), [YQL_CURRENT_ABI_VERSION()](#macro_YQL_CURRENT_ABI_VERSION)
multimodule YQL_LIBRARY {
    module YQL_LIBRARY_STABLE: LIBRARY {
        .SEM=$_CPP_LIBRARY_SEM
        .GLOBAL_SEM=$_CPP_OBJ_LIBRARY_SEM
        .FINAL_TARGET=yes
        SET(MODULE_TAG YQL_ABI_STABLE)
        MODULE_PREFIX=yql-abi-stable-
        OBJ_SUF=.abi_stable
        YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
        SET_APPEND(CXXFLAGS $YQL_ABI_FLAGS)
        SET_APPEND(_SEM_EXTRA_CXX_FLAGS $YQL_ABI_FLAGS)
        SET_APPEND(FEATURE_VERSIONS YqlAbi=stable)
    }
    module YQL_LIBRARY_CURRENT: LIBRARY {
        .SEM=$_CPP_LIBRARY_SEM
        .GLOBAL_SEM=$_CPP_OBJ_LIBRARY_SEM
        CMAKE_TARGET_NAME=${REALPRJNAME}.abi-current
        SET(MODULE_TAG YQL_ABI_CURRENT)
        DISABLE(START_TARGET)
        SET(YQL_ABI_PEERDIR_TAG YQL_ABI_CURRENT)
        SET(YQL_UDF_STATIC_PEERDIR_TAG YQL_UDF_STATIC_CURRENT)
        MODULE_PREFIX=yql-abi-current-
        OBJ_SUF=.abi_current
        YQL_ABI_FLAGS=-DUSE_CURRENT_UDF_ABI_VERSION
        SET_APPEND(CXXFLAGS $YQL_ABI_FLAGS)
        SET_APPEND(_SEM_EXTRA_CXX_FLAGS $YQL_ABI_FLAGS)
        SET_APPEND(FEATURE_VERSIONS YqlAbi=current)
    }
}

### @usage: YQL_ABI_VERSION(major minor release))
###
### Specifying the minimal required ABI for YQL_UDF.
###
### @see: [YQL_UDF()](#multimodule_YQL_UDF)
macro YQL_ABI_VERSION(Major, Minor, Patch) {
    SET(_YQL_ABI_STATED_STABLE yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(USER_CXXFLAGS -DMIN_UDF_ABI_VERSION_MAJOR=$Major -DMIN_UDF_ABI_VERSION_MINOR=$Minor -DMIN_UDF_ABI_VERSION_PATCH=$Patch)
    when ($YQL_ABI_PEERDIR_TAG == "YQL_ABI_CURRENT") {
        FEATURE_VERSIONS+=YqlAbi=current
    }
    otherwise {
        FEATURE_VERSIONS+=YqlAbi=stable
    }
}

### @usage: YQL_STABLE_ABI_VERSION()
###
### Build the module against the stable UDF ABI -- the version every deployed host provides.
###
### @see: [YQL_CURRENT_ABI_VERSION()](#macro_YQL_CURRENT_ABI_VERSION)
macro YQL_STABLE_ABI_VERSION() {
    SET(_YQL_ABI_STATED_STABLE yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(FEATURE_VERSIONS YqlAbi=stable)
}

### @usage: YQL_LAST_ABI_VERSION()
###
### A synonym of YQL_STABLE_ABI_VERSION().
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION)
macro YQL_LAST_ABI_VERSION() {
    YQL_STABLE_ABI_VERSION()
}

### @usage: YQL_CURRENT_ABI_VERSION()
###
### Build the module against the UDF ABI of this revision, and take the current build of every
### YQL_LIBRARY below it. A UDF built this way loads into a host of this revision alone.
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION)
macro YQL_CURRENT_ABI_VERSION() {
    SET(_YQL_ABI_STATED_CURRENT yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_CURRENT_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(FEATURE_VERSIONS YqlAbi=current)
    SET(YQL_ABI_PEERDIR_TAG YQL_ABI_CURRENT)
    SET(YQL_UDF_STATIC_PEERDIR_TAG YQL_UDF_STATIC_CURRENT)
    SET_APPEND(CHECK_FEATURE_VERSION_CONFLICTS YES)
}

