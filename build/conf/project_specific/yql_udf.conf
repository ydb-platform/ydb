### @usage: YQL_UDF_CONTRIB(name)
###
### Uses <UPPERCASE_NAME>_RESOURCE_{DEFAULT,ASAN,MSAN,TSAN,UBSAN} from
### yql/resources.inc for the shared library when included by the caller.
### PEERDIR uses the corresponding resource with a _STATIC suffix.
### Missing/None resources, OPENSOURCE and BUILD_YQL_FROM_SOURCES use sources.
multimodule YQL_UDF_CONTRIB {
    module YQL_UDF_SHARED: YQL_UDF_MODULE_CONTRIB {
        .ALIASES=SRCS=_YQL_PREBUILT_SRCS PEERDIR=_YQL_PREBUILT_PEERDIR SUPPRESSIONS=_YQL_PREBUILT_SUPPRESSIONS
        .IGNORED=PEERDIR
        .EPILOGUE=_YQL_PREBUILT_EPILOGUE
        .SEM=$_UDF_SHARED_SEM
        NO_CLANG_TIDY()
        SET(_YQL_PREBUILT_KIND UDF)
    }
    module YQL_UDF_STATIC: _DLL_COMPATIBLE_LIBRARY {
        DISABLE(START_TARGET)
        .ALIASES=SRCS=_YQL_PREBUILT_SRCS PEERDIR=_YQL_PREBUILT_PEERDIR
        .IGNORED=PEERDIR
        .EPILOGUE=_YQL_STATIC_PREBUILT_EPILOGUE
        .CMD=$_YQL_STATIC_LINK_CMD
        .SEM=$_CPP_LIBRARY_SEM
        .GLOBAL_SEM=$_CPP_OBJ_LIBRARY_SEM
        OBJ_SUF=.udfs
        # disable credits generation for static library
        SET(CREDITS_FLAGS)
        when ($OS_WINDOWS == "yes") {
            MODULE_SUFFIX=.static.lib
        }
    }
    module YQL_UDF_STATIC_CURRENT: _DLL_COMPATIBLE_LIBRARY {
        DISABLE(START_TARGET)
        .ALIASES=SRCS=_YQL_PREBUILT_SRCS PEERDIR=_YQL_PREBUILT_PEERDIR
        .IGNORED=PEERDIR
        .EPILOGUE=_YQL_STATIC_PREBUILT_EPILOGUE
        .CMD=$_YQL_STATIC_LINK_CMD
        .SEM=$_SEM_IGNORED
        .GLOBAL_SEM=$_SEM_IGNORED
        OBJ_SUF=.udfs.abi_current
        MODULE_PREFIX=yql-abi-current-
        YQL_ABI_FLAGS=-DUSE_CURRENT_UDF_ABI_VERSION
        SET_APPEND(CXXFLAGS $YQL_ABI_FLAGS)
        SET_APPEND(_SEM_EXTRA_CXX_FLAGS $YQL_ABI_FLAGS)
        SET(YQL_ABI_PEERDIR_TAG YQL_ABI_CURRENT)
        SET(YQL_UDF_STATIC_PEERDIR_TAG YQL_UDF_STATIC_CURRENT)
        # disable credits generation for static library
        SET(CREDITS_FLAGS)
        when ($OS_WINDOWS == "yes") {
            MODULE_SUFFIX=.static.lib
        }
    }
}

# A module that states no ABI takes the stable one -- the version every deployed host provides.
YQL_ABI_PEERDIR_TAG=YQL_ABI_STABLE
YQL_UDF_STATIC_PEERDIR_TAG=YQL_UDF_STATIC

### @usage: YQL_PREBUILT_PROGRAM(name)
###
### Uses <UPPERCASE_NAME>_RESOURCE_{DEFAULT,ASAN,MSAN,TSAN,UBSAN} from
### yql/resources.inc, included by the caller. Missing/None resources,
### OPENSOURCE and BUILD_YQL_FROM_SOURCES use the declared sources.
module YQL_PREBUILT_PROGRAM: PROGRAM {
    .CMD=$_YQL_PROGRAM_LINK_CMD
    .ALIASES=SRCS=_YQL_PREBUILT_SRCS PEERDIR=_YQL_PREBUILT_PEERDIR SUPPRESSIONS=_YQL_PREBUILT_SUPPRESSIONS
    .EPILOGUE=_YQL_PREBUILT_EPILOGUE
    _YQL_PROGRAM_LINK_CMD=$LINK_EXE
    SET(_YQL_PREBUILT_KIND PROGRAM)
}

macro _YQL_PREBUILT_SRCS(Args...) {
    SET_APPEND(_YQL_SOURCE_SRCS $Args)
}

macro _YQL_PREBUILT_PEERDIR(Args...) {
    SET_APPEND(_YQL_SOURCE_PEERS $Args)
}

macro _YQL_PREBUILT_SUPPRESSIONS(Args...) {
    SET_APPEND(_YQL_SOURCE_SUPPRESSIONS $Args)
}

# These conditions must be active while the epilogue parses the resource values.
# Conditions inside a helper macro are activated too late for module setup.
_YQL_HAVE_RESOURCE=no
_YQL_SELECTED_RESOURCE=None

when ($OPENSOURCE != "yes" && $BUILD_YQL_FROM_SOURCES != "yes" && $SANITIZER_TYPE == "" && $_YQL_RESOURCE_DEFAULT != "None" && $_YQL_RESOURCE_DEFAULT != "") {
    _YQL_HAVE_RESOURCE=yes
    _YQL_SELECTED_RESOURCE=$_YQL_RESOURCE_DEFAULT
}

when ($OPENSOURCE != "yes" && $BUILD_YQL_FROM_SOURCES != "yes" && $SANITIZER_TYPE == "address" && $_YQL_RESOURCE_ASAN != "None" && $_YQL_RESOURCE_ASAN != "") {
    _YQL_HAVE_RESOURCE=yes
    _YQL_SELECTED_RESOURCE=$_YQL_RESOURCE_ASAN
}

when ($OPENSOURCE != "yes" && $BUILD_YQL_FROM_SOURCES != "yes" && $SANITIZER_TYPE == "memory" && $_YQL_RESOURCE_MSAN != "None" && $_YQL_RESOURCE_MSAN != "") {
    _YQL_HAVE_RESOURCE=yes
    _YQL_SELECTED_RESOURCE=$_YQL_RESOURCE_MSAN
}

when ($OPENSOURCE != "yes" && $BUILD_YQL_FROM_SOURCES != "yes" && $SANITIZER_TYPE == "thread" && $_YQL_RESOURCE_TSAN != "None" && $_YQL_RESOURCE_TSAN != "") {
    _YQL_HAVE_RESOURCE=yes
    _YQL_SELECTED_RESOURCE=$_YQL_RESOURCE_TSAN
}

when ($OPENSOURCE != "yes" && $BUILD_YQL_FROM_SOURCES != "yes" && $SANITIZER_TYPE == "undefined" && $_YQL_RESOURCE_UBSAN != "None" && $_YQL_RESOURCE_UBSAN != "") {
    _YQL_HAVE_RESOURCE=yes
    _YQL_SELECTED_RESOURCE=$_YQL_RESOURCE_UBSAN
}

# Published YQL resources target Linux x86-64.
_YQL_HAVE_PLATFORM_RESOURCE=no
when ($OS_LINUX == "yes" && $ARCH_X86_64 == "yes") {
    _YQL_HAVE_PLATFORM_RESOURCE=$_YQL_HAVE_RESOURCE
}

macro _YQL_PREBUILT_EPILOGUE() {
    _YQL_PREBUILT_RESOURCES(${toupper:REALPRJNAME}_RESOURCE)
    _YQL_PREBUILT_SELECT($_YQL_HAVE_PLATFORM_RESOURCE $_YQL_SELECTED_RESOURCE)
    _YQL_PREBUILT_FINALIZE()
}

macro _YQL_STATIC_PREBUILT_EPILOGUE() {
    _YQL_STATIC_PREBUILT_RESOURCES(${toupper:REALPRJNAME}_RESOURCE)
    ASSERT(_YQL_STATIC_UBSAN_RESOURCE_SUPPORTED UBSan is incompatible with internalized UDF archives. Set the UDF UBSAN_STATIC resource to None to build from sources.)
    _YQL_STATIC_PREBUILT_SELECT($_YQL_HAVE_PLATFORM_RESOURCE $_YQL_SELECTED_RESOURCE)
}

macro _YQL_STATIC_PREBUILT_RESOURCES(Prefix) {
    SET(_YQL_RESOURCE_DEFAULT ${${Prefix}_DEFAULT_STATIC})
    SET(_YQL_RESOURCE_ASAN ${${Prefix}_ASAN_STATIC})
    SET(_YQL_RESOURCE_MSAN ${${Prefix}_MSAN_STATIC})
    SET(_YQL_RESOURCE_TSAN ${${Prefix}_TSAN_STATIC})
    SET(_YQL_RESOURCE_UBSAN ${${Prefix}_UBSAN_STATIC})
}

macro _YQL_PREBUILT_RESOURCES(Prefix) {
    SET(_YQL_RESOURCE_DEFAULT ${${Prefix}_DEFAULT})
    SET(_YQL_RESOURCE_ASAN ${${Prefix}_ASAN})
    SET(_YQL_RESOURCE_MSAN ${${Prefix}_MSAN})
    SET(_YQL_RESOURCE_TSAN ${${Prefix}_TSAN})
    SET(_YQL_RESOURCE_UBSAN ${${Prefix}_UBSAN})
}

macro _YQL_PREBUILT_SELECT(UseCache, Resource) {
}

macro _YQL_PREBUILT_SELECT("yes", Resource) {
    SET(_YQL_PREBUILT_RESOURCE_ID $Resource)
    _BARE_LINK_MODULE()
    DISABLE(SANITIZER_TYPE)
}

macro _YQL_PREBUILT_SELECT("no", Resource) {
    SET(_YQL_PREBUILT_RESOURCE_ID)
}

macro _YQL_STATIC_PREBUILT_SELECT(UseCache, Resource) {
}

_YQL_STATIC_PREBUILT_CMD=$GENERATE_MF && $COPY_CMD $_YQL_STATIC_PREBUILT_PATH ${hide;input:_YQL_STATIC_PREBUILT_PATH} ${TARGET} ${hide;kv:"p ld"} ${hide;kv:"pc light-blue"} ${hide;kv:"show_out"}

_YQL_STATIC_LINK_CMD=$LINK_LIB
when ($_YQL_USE_STATIC_PREBUILT == "yes") {
    _YQL_STATIC_LINK_CMD=$_YQL_STATIC_PREBUILT_CMD
}

macro _YQL_STATIC_PREBUILT_SELECT("yes", Resource) {
    FROM_SANDBOX(FILE $Resource RENAME RESOURCE OUT_NOAUTO ${REALPRJNAME}.prebuilt.a)
    SET(_YQL_STATIC_PREBUILT_PATH ${BINDIR}/${REALPRJNAME}.prebuilt.a)
    ENABLE(_YQL_USE_STATIC_PREBUILT)
    SET_APPEND(PEERDIR yql/essentials/public/udf)
    CFLAGS(-DYQL_UDF_STATIC_ENTRY_POINT=GetStaticUdfLibrary_$REALPRJNAME)
    GLOBAL_SRCS(yql/essentials/public/udf/udf_cached_registrator.cpp)
}

macro _YQL_STATIC_PREBUILT_SELECT("no", Resource) {
    DEFAULT(_YQL_SOURCE_PEERS)
    GLOBAL_SRCS($_YQL_SOURCE_SRCS)
    SET_APPEND(PEERDIR yql/essentials/public/udf yql/essentials/public/udf/support $_YQL_SOURCE_PEERS)
}

### @usage: YQL_UDF_INTERNALIZE()
### Pack a FAT_OBJECT UDF and produce <name>_internalized.a with unique ABI exports.
_YQL_UDF_INTERNALIZE_CMD=$YMAKE_PYTHON3 ${input:"yql/essentials/build/scripts/internalize_udf.py"} --archiver ${quo:AR_TOOL} --input $TARGET --globals ${BINDIR}/${MODULE_PREFIX}${REALPRJNAME}.globals.a --output ${output;suf=_internalized.a:REALPRJNAME} --module-name $REALPRJNAME --work-dir tmp

macro YQL_UDF_INTERNALIZE() {
    CFLAGS(-DYQL_UDF_STATIC_ENTRY_POINT=GetStaticUdfLibrary_$REALPRJNAME)
    SRCS(yql/essentials/public/udf/udf_static_library.cpp)
    ENABLE(_YQL_INTERNALIZE_FAT_OBJECT)
    ASSERT(_YQL_FAT_SANITIZER_SUPPORTED YQL_UDF_FAT is incompatible with the undefined sanitizer: UBSan vptr checks require shared C++ RTTI identities.)
}

when ($_YQL_INTERNALIZE_FAT_OBJECT == "yes") {
    LINK_FAT_OBJECT+= && $_YQL_UDF_INTERNALIZE_CMD
}

_YQL_STATIC_UBSAN_RESOURCE_SUPPORTED=yes
when ($SANITIZER_TYPE == "undefined" && $_YQL_RESOURCE_UBSAN != "None" && $_YQL_RESOURCE_UBSAN != "") {
    _YQL_STATIC_UBSAN_RESOURCE_SUPPORTED=no
}

_YQL_FAT_SANITIZER_SUPPORTED=yes
when ($SANITIZER_TYPE == "undefined") {
    _YQL_FAT_SANITIZER_SUPPORTED=no
}

module YQL_UDF_FAT: FAT_OBJECT {
    .FINAL_TARGET=yes
    .TRANSITION=pic
    # Ya uses this policy to select the PIC graph for library targets.
    .SYMLINK_POLICY=SO
    YQL_UDF_INTERNALIZE()
    CFLAGS(-DBUILD_UDF)
    _ADD_YQL_UDF_DEPS_CONTRIB()
}

### @usage: YQL_LIBRARY()
###
### A multimodule for a LIBRARY whose code depends on the UDF ABI version: YQL_LIBRARY_STABLE is
### built at the stable ABI, YQL_LIBRARY_CURRENT at the ABI of this revision. A consumer takes the
### variant its own YQL_ABI_PEERDIR_TAG names.
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION), [YQL_CURRENT_ABI_VERSION()](#macro_YQL_CURRENT_ABI_VERSION)
multimodule YQL_LIBRARY {
    module YQL_LIBRARY_STABLE: LIBRARY {
        .SEM=$_CPP_LIBRARY_SEM
        .GLOBAL_SEM=$_CPP_OBJ_LIBRARY_SEM
        .FINAL_TARGET=yes
        SET(MODULE_TAG YQL_ABI_STABLE)
        MODULE_PREFIX=yql-abi-stable-
        OBJ_SUF=.abi_stable
        YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
        SET_APPEND(CXXFLAGS $YQL_ABI_FLAGS)
        SET_APPEND(_SEM_EXTRA_CXX_FLAGS $YQL_ABI_FLAGS)
        SET_APPEND(FEATURE_VERSIONS YqlAbi=stable)
    }
    module YQL_LIBRARY_CURRENT: LIBRARY {
        .SEM=$_CPP_LIBRARY_SEM
        .GLOBAL_SEM=$_CPP_OBJ_LIBRARY_SEM
        CMAKE_TARGET_NAME=${REALPRJNAME}.abi-current
        SET(MODULE_TAG YQL_ABI_CURRENT)
        DISABLE(START_TARGET)
        SET(YQL_ABI_PEERDIR_TAG YQL_ABI_CURRENT)
        SET(YQL_UDF_STATIC_PEERDIR_TAG YQL_UDF_STATIC_CURRENT)
        MODULE_PREFIX=yql-abi-current-
        OBJ_SUF=.abi_current
        YQL_ABI_FLAGS=-DUSE_CURRENT_UDF_ABI_VERSION
        SET_APPEND(CXXFLAGS $YQL_ABI_FLAGS)
        SET_APPEND(_SEM_EXTRA_CXX_FLAGS $YQL_ABI_FLAGS)
        SET_APPEND(FEATURE_VERSIONS YqlAbi=current)
    }
}

### @usage: YQL_ABI_VERSION(major minor release))
###
### Specifying the minimal required ABI for YQL_UDF.
###
### @see: [YQL_UDF()](#multimodule_YQL_UDF)
macro YQL_ABI_VERSION(Major, Minor, Patch) {
    SET(_YQL_ABI_STATED_STABLE yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(USER_CXXFLAGS -DMIN_UDF_ABI_VERSION_MAJOR=$Major -DMIN_UDF_ABI_VERSION_MINOR=$Minor -DMIN_UDF_ABI_VERSION_PATCH=$Patch)
    when ($YQL_ABI_PEERDIR_TAG == "YQL_ABI_CURRENT") {
        FEATURE_VERSIONS+=YqlAbi=current
    }
    otherwise {
        FEATURE_VERSIONS+=YqlAbi=stable
    }
}

### @usage: YQL_STABLE_ABI_VERSION()
###
### Build the module against the stable UDF ABI -- the version every deployed host provides.
###
### @see: [YQL_CURRENT_ABI_VERSION()](#macro_YQL_CURRENT_ABI_VERSION)
macro YQL_STABLE_ABI_VERSION() {
    SET(_YQL_ABI_STATED_STABLE yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_STABLE_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(FEATURE_VERSIONS YqlAbi=stable)
}

### @usage: YQL_LAST_ABI_VERSION()
###
### A synonym of YQL_STABLE_ABI_VERSION().
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION)
macro YQL_LAST_ABI_VERSION() {
    YQL_STABLE_ABI_VERSION()
}

### @usage: YQL_CURRENT_ABI_VERSION()
###
### Build the module against the UDF ABI of this revision, and take the current build of every
### YQL_LIBRARY below it. A UDF built this way loads into a host of this revision alone.
###
### @see: [YQL_STABLE_ABI_VERSION()](#macro_YQL_STABLE_ABI_VERSION)
macro YQL_CURRENT_ABI_VERSION() {
    SET(_YQL_ABI_STATED_CURRENT yes)
    when ($_YQL_ABI_STATED_STABLE == "yes" && $_YQL_ABI_STATED_CURRENT == "yes") {
        PEERDIR+=yql/essentials/public/udf/abi_conflict
    }
    YQL_ABI_FLAGS=-DUSE_CURRENT_UDF_ABI_VERSION
    SET_APPEND(USER_CXXFLAGS $YQL_ABI_FLAGS)
    SET_APPEND(FEATURE_VERSIONS YqlAbi=current)
    SET(YQL_ABI_PEERDIR_TAG YQL_ABI_CURRENT)
    SET(YQL_UDF_STATIC_PEERDIR_TAG YQL_UDF_STATIC_CURRENT)
    SET_APPEND(CHECK_FEATURE_VERSION_CONFLICTS YES)
}

### @usage: YQL_PYTHON_UDF(name)
###
### Definition of the extension module for YQL with Python 2.x UDF (User Defined Function for YQL).
### Unlike YQL_UDF this is plain DLL module, so PEERDIRs to it are not allowed.
###
### https://yql.yandex-team.ru/docs/yt/udf/python/
module YQL_PYTHON_UDF: YQL_UDF_MODULE {
    .IGNORED=USE_PYTHON2
    .RESTRICTED=PYTHON3_ADDINCL USE_PYTHON3 PYTHON2_ADDINCL

    USE_PYTHON2()
    _ARCADIA_PYTHON_ADDINCL()
    _PY_PROGRAM()

    PEERDIR(build/platform/python/ldflags)
    PEERDIR(library/python/type_info)

    DEFAULT(YQL_PYTHON_UDF_EXPORT ${ARCADIA_ROOT}/yql/essentials/udfs/common/python/python_udf/python_udfs_exports.exports)

    when ($WINDOWS == "yes") {
        YQL_PYTHON_UDF_EXPORT=
    }

    ### FIXME: XXX the statement below uncoditionally set EXPORTS_FILE (due to incorrect behaviour of old ConfReader
    ###when ($USE_ARCADIA_PYTHON == "yes") SET(EXPORTS_FILE $YQL_PYTHON_UDF_EXPORT)
    SET(EXPORTS_FILE $YQL_PYTHON_UDF_EXPORT)
    SET(MODULE_LANG PY2)

    SET_APPEND(FEATURE_VERSIONS YqlAbi=stable)
}

