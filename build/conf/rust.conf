# Rust libraries are compiled as whole crates. Each crate exports Rust
# metadata and a separate native archive.

_RUST_ROOT=src/lib.rs
_RUST_SOURCES=
_RUST_INPUTS=
_RUST_BUILD_SCRIPT=
_RUST_BUILD_OUTPUT=
_RUST_BUILD_OUTPUT_FLAG=
_RUST_PROC_MACROS=
_RUST_PROC_TOOLS=
_RUST_METADATA_OUTPUT=
_RUST_METADATA_OUTPUT_FLAG=
_RUST_FEATURES=
_RUST_FLAGS=
_RUST_ENV=
_RUST_ALIASES=
_RUST_VERSION=0.0.0
_RUST_EDITION=2021
_RUST_MANIFEST=
_RUST_MANIFEST_FLAG=
_RUST_MANIFEST_DIR=$CURDIR
_RUST_KIND=rlib
_RUST_MODE=target

_RUST_TARGET=unsupported
when ($OS_LINUX && $ARCH_X86_64) {
    _RUST_TARGET=x86_64-unknown-linux-gnu
    when ($MUSL == "yes") {
        _RUST_TARGET=x86_64-unknown-linux-musl
    }
}
elsewhen ($OS_LINUX && $ARCH_AARCH64) {
    _RUST_TARGET=aarch64-unknown-linux-gnu
    when ($MUSL == "yes") {
        _RUST_TARGET=aarch64-unknown-linux-musl
    }
}
elsewhen ($OS_DARWIN && $ARCH_ARM64) {
    _RUST_TARGET=aarch64-apple-darwin
}
elsewhen ($OS_DARWIN && $ARCH_X86_64) {
    _RUST_TARGET=x86_64-apple-darwin
}
elsewhen ($OS_WINDOWS && $ARCH_X86_64) {
    _RUST_TARGET=x86_64-pc-windows-msvc
}

_RUST_OPT_LEVEL=0
_RUST_DEBUGINFO=2
when ($BUILD_TYPE == "RELEASE" || $BUILD_TYPE == "MINSIZEREL") {
    _RUST_OPT_LEVEL=3
    _RUST_DEBUGINFO=0
}
elsewhen ($BUILD_TYPE == "RELWITHDEBINFO") {
    _RUST_OPT_LEVEL=3
}

_RUST_COMMAND=$YMAKE_PYTHON3 ${input:"build/scripts/rust.py"} compile \
    --rust-root $RUST_RESOURCE_GLOBAL --clang-root $CLANG20_RESOURCE_GLOBAL \
    --source-root $ARCADIA_ROOT --build-root $ARCADIA_BUILD_ROOT \
    --manifest-dir $_RUST_MANIFEST_DIR --kind $_RUST_KIND --mode $_RUST_MODE \
    --target $_RUST_TARGET --name $REALPRJNAME --version $_RUST_VERSION \
    --edition $_RUST_EDITION --opt-level $_RUST_OPT_LEVEL --debuginfo $_RUST_DEBUGINFO \
    --crate-root ${input=TEXT:_RUST_ROOT} --output $TARGET \
    $_RUST_METADATA_OUTPUT_FLAG ${noauto;output:_RUST_METADATA_OUTPUT} \
    $_RUST_MANIFEST_FLAG ${input=TEXT:_RUST_MANIFEST} \
    $_RUST_BUILD_OUTPUT_FLAG ${input=TEXT:_RUST_BUILD_OUTPUT} \
    --features $_RUST_FEATURES ${pre=--flag=;quo:_RUST_FLAGS} --env $_RUST_ENV \
    --aliases $_RUST_ALIASES --proc-macros $_RUST_PROC_TOOLS \
    --direct ${tags_in=local,RUST|local,RUST_HOST:PEERS} \
    --dependencies ${tags_in=RUST|RUST_HOST:PEERS} $_RUST_PROC_TOOLS \
    --native ${tags_out=RUST|RUST_HOST|RUST_RUNTIME|RUST_PROC_MACRO|RESOURCE_LIB:PEERS} \
    ${hide;input=TEXT:_RUST_SOURCES} ${hide;input=TEXT:_RUST_INPUTS} \
    ${hide;kv:"p RS"} ${hide;kv:"pc light-red"} ${hide;kv:"show_out"}

macro CRATE_ROOT(Path) {
    SET(_RUST_ROOT $Path)
}

macro CRATE_SOURCES(Files...) {
    SET_APPEND(_RUST_SOURCES $Files)
}

macro CRATE_INPUTS(Files...) {
    SET_APPEND(_RUST_INPUTS $Files)
}

macro CRATE_VERSION(Version) {
    SET(_RUST_VERSION $Version)
}

macro CRATE_EDITION(Edition) {
    SET(_RUST_EDITION $Edition)
}

macro CRATE_MANIFEST(Path) {
    SET(_RUST_MANIFEST $Path)
    SET(_RUST_MANIFEST_FLAG --manifest)
}

macro CRATE_MANIFEST_DIR(Dir) {
    SET(_RUST_MANIFEST_DIR ${CURDIR}/$Dir)
}

macro CRATE_FEATURES(Features...) {
    SET_APPEND(_RUST_FEATURES $Features)
}

macro CRATE_FLAGS(Flags...) {
    SET_APPEND(_RUST_FLAGS $Flags)
}

macro CRATE_ENV(Values...) {
    SET_APPEND(_RUST_ENV $Values)
}

### Map the Rust dependency name used in source code to its PEERDIR.
macro CRATE_DEPENDENCY_ALIAS(Name, Dir) {
    SET_APPEND(_RUST_ALIASES $Name=$Dir)
}

### List all procedural macros needed by this crate's dependency closure.
macro CRATE_PROC_MACROS(Dirs...) {
    SET_APPEND(_RUST_PROC_MACROS $Dirs)
}

macro CRATE_BUILD_SCRIPT(Dir) {
    SET(_RUST_BUILD_SCRIPT $Dir)
}

macro CRATE_BUILD_DEPS(Dirs...) {
    PEERDIR($Dirs)
}

macro _RUST_RUN_BUILD_SCRIPT(Dir, Mode, Output, Inputs...) {
    .CMD=$YMAKE_PYTHON3 ${input:"build/scripts/rust.py"} build-script \
        --program ${tool:Dir} --mode $Mode --target $_RUST_TARGET \
        --rust-root $RUST_RESOURCE_GLOBAL --clang-root $CLANG20_RESOURCE_GLOBAL \
        --source-root $ARCADIA_ROOT --build-root $ARCADIA_BUILD_ROOT \
        --manifest-dir $_RUST_MANIFEST_DIR --name $REALPRJNAME --version $_RUST_VERSION \
        --opt-level $_RUST_OPT_LEVEL --debuginfo $_RUST_DEBUGINFO \
        $_RUST_MANIFEST_FLAG ${input=TEXT:_RUST_MANIFEST} \
        --features $_RUST_FEATURES --env $_RUST_ENV \
        --output ${noauto;output:Output} ${hide;input=TEXT:Inputs} \
        ${hide;kv:"p RB"} ${hide;kv:"pc light-blue"} ${hide;kv:"show_out"}
}

macro _RUST_EPILOGUE() {
    _RUST_CONFIGURE()
}

module _RUST_BASE: _BARE_UNIT {
    .CMD=$_RUST_COMMAND
    .EXTS=.a .lib .rlib .sbom
    .NODE_TYPE=Bundle
    .PEERDIR_POLICY=as_build_from
    .PROXY=yes
    .DEFAULT_NAME_GENERATOR=DirName
    .ALIASES=SRCS=CRATE_SOURCES

    MODULE_PREFIX=lib
    MODULE_SUFFIX=.a
    when ($OS_WINDOWS) {
        MODULE_SUFFIX=.lib
    }
    SET(MODULE_TYPE LIBRARY)
    SET(MODULE_LANG RUST)
    SET(MODULE_TAG RUST)
    SET(PEERDIR_TAGS RUST RUST_RUNTIME RUST_PROC_MACRO __EMPTY__ RESOURCE_LIB)
    SET(NEED_PLATFORM_PEERDIRS no)
    PEERDIR(build/platform/rust build/platform/clang)
}

module _RUST_LIBRARY: _RUST_BASE {
    PEERDIR(build/rust/staticlib)
}

module _RUST_HOST_LIBRARY: _RUST_BASE {
    SET(MODULE_TAG RUST_HOST)
    SET(PEERDIR_TAGS RUST_HOST RUST_PROC_MACRO __EMPTY__ RESOURCE_LIB)
    SET(_RUST_MODE host)
    SET(START_TARGET no)
    MODULE_SUFFIX=-host.a
    when ($HOST_OS_WINDOWS) {
        MODULE_SUFFIX=-host.lib
    }
}

### A build script is a host program in its own directory. PEERDIR selects
### host Rust libraries, even when ya's host C++ toolchain targets musl.
module RUST_BUILD_SCRIPT: _RUST_BASE {
    .EPILOGUE=_RUST_EPILOGUE
    .NODE_TYPE=Program
    .FINAL_TARGET=yes
    SET(MODULE_TAG RUST_BUILD_SCRIPT)
    SET(MODULE_TYPE PROGRAM)
    SET(PEERDIR_TAGS RUST_HOST RUST_PROC_MACRO __EMPTY__ RESOURCE_LIB)
    SET(_RUST_KIND bin)
    SET(_RUST_MODE host)
    MODULE_PREFIX=
    MODULE_SUFFIX=
    when ($HOST_OS_WINDOWS) {
        MODULE_SUFFIX=.exe
    }
}

### Compile a crate for the target. Host variants are selected internally by
### proc-macro and build-script dependencies; they share the same source files.
multimodule CRATE {
    module RUST: _RUST_LIBRARY {
        .EPILOGUE=_RUST_EPILOGUE
    }
    module RUST_HOST: _RUST_HOST_LIBRARY {
        .EPILOGUE=_RUST_EPILOGUE
    }
}

### A procedural macro is a tool loaded into the host Rust compiler.
module CRATE_PROC_MACRO: _RUST_BASE {
    .EPILOGUE=_RUST_EPILOGUE
    .NODE_TYPE=Program
    .FINAL_TARGET=yes
    SET(MODULE_TAG RUST_PROC_MACRO)
    SET(MODULE_TYPE PROGRAM)
    SET(PEERDIR_TAGS RUST_HOST __EMPTY__ RESOURCE_LIB)
    SET(_RUST_KIND proc-macro)
    SET(_RUST_MODE host)
    MODULE_SUFFIX=.so
    when ($HOST_OS_DARWIN) {
        MODULE_SUFFIX=.dylib
    }
    elsewhen ($HOST_OS_WINDOWS) {
        MODULE_SUFFIX=.dll
    }
}

### The shared target runtime has no dependencies on application crates.
module RUST_RUNTIME: _RUST_BASE {
    .EPILOGUE=_RUST_EPILOGUE
    .NODE_TYPE=Library
    .FINAL_TARGET=yes
    SET(MODULE_TAG RUST_RUNTIME)
    SET(PASS_PEERS no)
    SET(_RUST_KIND runtime)
}
