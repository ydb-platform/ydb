# Stage the JS bundle with a host runtime independent of the target toolchain.
_NOTS_RUNNER_INPUT=
# Resource bundle variables keep the same names across host platforms. Include the
# execution platform in the UID because the staged files contain native binaries.
_NOTS_RUNNER_CMD=${BUN_RESOURCE_GLOBAL}/bun --no-env-file --config=/dev/null --no-install -- \
    ${input:"devtools/frontend_build_platform/nots/builder/stage-runner.mjs"} \
    --bun ${BUN_RESOURCE_GLOBAL}/bun $_NOTS_RUNNER_INPUT \
    --bsdtar ${BSDTAR_RESOURCE_GLOBAL}/bsdtar \
    --archiver ${output:"nots-bsdtar"} \
    --rsync ${NOTS_RSYNC_RESOURCE_GLOBAL}/bin/rsync \
    --synchronizer ${output:"nots-rsync"} \
    --builder ${TARGET} \
    --recipe ${output:"nots-recipe"} \
    --runtime ${output:"nots-bun"} \
    --module ${output:"nots.mjs"} \
    ${hide:CANONIZED_HOST_PLATFORM} ${hide:PEERS} ${hide;kv:"p NOTS"}

module NOTS_BUNDLE_RUNNER: PREBUILT_PROGRAM {
    .CMD=$_NOTS_RUNNER_CMD
    .NODE_TYPE=Bundle
    .PEERDIR_POLICY=as_build_from
    .USE_PEERS_LATE_OUTS=yes
    SET(PEERDIR_TAGS TS RESOURCE_LIB)
    PEERDIR(build/platform/bun build/external_resources/rsync devtools/frontend_build_platform/nots/bsdtar)
    # Released trace collectors recognize the builder executable by basename.
    SET(REALPRJNAME builder)
    # Use the same primary output on host and target. Otherwise graph merging
    # inserts a rename node that exposes only builder.exe, without the runtime
    # and bundle outputs the shell launcher needs next to it.
    SET(MODULE_SUFFIX)
}
