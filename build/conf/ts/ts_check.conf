_TS_CHECK_SEPARATOR=~~~
_TS_CHECK_LIST=

macro TS_LINT(SCRIPT_NAME, TIMEOUT_MEDIUM?"yes":"no", COMMAND...) {
    SET_APPEND(_TS_CHECK_LIST ${_TS_CHECK_SEPARATOR} ${SCRIPT_NAME} lint ${TIMEOUT_MEDIUM} ${join= :COMMAND})
}

macro TS_TEST(SCRIPT_NAME, TIMEOUT_MEDIUM?"yes":"no", COMMAND...) {
    SET_APPEND(_TS_CHECK_LIST ${_TS_CHECK_SEPARATOR} ${SCRIPT_NAME} test ${TIMEOUT_MEDIUM} ${join= :COMMAND})
}

multimodule TS_TEST_FOR {
    module TS_TEST_FOR: _BARE_UNIT {
        .CMD=$TOUCH_UNIT ${hide;kv:"p TS_TST"} ${hide;kv:"pc magenta"}
        # ignore SRCS macro
        .ALIASES=SRCS=_NOOP_MACRO
        # use this parser to get module args in $MODULE_ARGS_RAW
        .ARGS_PARSER=Raw
        # Propagates peers to related modules
        .NODE_TYPE=Bundle
        .PEERDIR_POLICY=as_build_from
        .EPILOGUE=_TS_TEST_FOR_EPILOGUE
        .PEERDIRSELF=TS_PREPARE_DEPS

        SET(MODULE_TAG TS_TEST_FOR)
        SET(MODULE_LANG TS)
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)

        # for multimodule peers we should choose TS
        SET(PEERDIR_TAGS TS TS_PROTO TS_PROTO_FROM_SCHEMA)
        # We read tool resources and Tier 0 settings during configuration; track them in the cache key.
        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${ARCADIA_ROOT}/$ERM_PACKAGES_PATH)
        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${ARCADIA_ROOT}/$T0_SETTINGS_PATH)

        # parse module args
        DISABLE(_ALLOW_REL_FOR_PATH)
        _TS_TEST_FOR_ARGS($MODULE_ARGS_RAW)

        # Select Node.js from engines.node and use default package manager resources
        _PEERDIR_TS_RESOURCE(nodejs $PM_TYPE)

        # we don't want to have TS outputs for tests
        DISABLE(TS_CONFIG_DEDUCE_OUT)

        _TS_ADD_NODE_MODULES_FOR_BUILDER()
    }

    module TS_PREPARE_DEPS: _BARE_UNIT {
        # ignore SRCS macro
        .IGNORED=SRCS
        # use this parser to get module args in $MODULE_ARGS_RAW
        .ARGS_PARSER=Raw
        # Propagates peers to related modules
        .NODE_TYPE=Bundle
        .PEERDIR_POLICY=as_build_from

        # .fake tells builder to not materialize it in results
        SET(MODULE_SUFFIX .test_for.prepare_deps.fake)
        # lang makrup for statistics
        SET(MODULE_LANG TS)
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
        # what modules it can PEERDIR to
        SET(PEERDIR_TAGS TS_PREPARE_DEPS)
        # do not include it into "results" of graph
        DISABLE(START_TARGET)
        # parse module args
        DISABLE(_ALLOW_REL_FOR_PATH)
        _TS_TEST_FOR_ARGS($MODULE_ARGS_RAW)
        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${ARCADIA_ROOT}/$T0_SETTINGS_PATH)
        _TS_CHECK_PREPARE_DEPS_CONFIGURE()
    }
}

macro _TS_TEST_FOR_EPILOGUE() {
    _SET_TS_TEST_FOR_INPUTS()
    _DEPENDS_ON_MOD()
    _TS_CHECK_CONFIGURE(TS_TEST_FOR)
}

# tag:internal
macro _SET_TS_TEST_FOR_INPUTS() {
    _SET_PREFIX(_SET_TS_INPUTS_BASE_EXCLUDES_FOR_TEST ${_FOR_MOD_PATH}/ $_SET_TS_INPUTS_BASE_EXCLUDES)
    _GLOB(_TS_GLOB_FILES ${_FOR_MOD_PATH}/**/* EXCLUDE ${_SET_TS_INPUTS_BASE_EXCLUDES_FOR_TEST} RESTRICTIONS MAX_MATCHES 10000 MAX_WATCH_DIRS 5000 SKIPPED_MIN_MATCHES 2000 SKIPPED_ERROR_PERCENT 90)
    _ESCAPE_SPACES(_TS_GLOB_FILES)
}

# tag:internal
macro _SET_PREFIX(VAR_NAME, PREFIX, ITEMS...) {
    SET($VAR_NAME ${pre=$PREFIX:ITEMS})
}

macro _TS_TEST_FOR_ARGS(FOR_MOD, RELATIVE?"${CURDIR}":"${ARCADIA_ROOT}") {
    # we read testing modules' package.json during configuration,
    # so we have to include it to configuration cache key
    SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS $RELATIVE/$FOR_MOD/package.json)
    SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS $RELATIVE/$FOR_MOD/pnpm-lock.yaml)
    SET(_FOR_MOD_PATH $RELATIVE/$FOR_MOD)
    _VALIDATE_TS_TEST_FOR_ARGS($FOR_MOD $RELATIVE)
    _SET_TS_FOR_VARS($FOR_MOD)
}

macro _SETUP_EXTRACT_NODE_MODULES_LAYER_RECIPE(FOR_PATH) {
    USE_RECIPE(devtools/frontend_build_platform/nots/builder/builder extract-node-modules $FOR_PATH node_modules.layer $_SQUASHFS_TOOLS_RECIPE_ARG)
    DEPENDS(devtools/frontend_build_platform/nots/builder)
}

macro _SETUP_EXTRACT_OUTPUT_TARS_RECIPE(FOR_PATH) {
    USE_RECIPE(devtools/frontend_build_platform/nots/builder/builder extract-output-tars $FOR_PATH)
    DEPENDS(devtools/frontend_build_platform/nots/builder)
}

macro _SETUP_INSTALL_NODE_MODULES_RECIPE(FOR_PATH) {
    DATA(arcadia/$T0_SETTINGS_PATH)
    USE_RECIPE(devtools/frontend_build_platform/nots/builder/builder install-node-modules $NOTS_TOOL_BASE_ARGS --nm-bundle no --for-path $FOR_PATH)
    DEPENDS(devtools/frontend_build_platform/nots/builder)
}

_TS_TEST_DEPENDS_ON_BUILD=

### @usage: TS_TEST_DEPENDS_ON_BUILD()
###
### Build the tested target before running its tests.
macro TS_TEST_DEPENDS_ON_BUILD() {
    ENABLE(_TS_TEST_DEPENDS_ON_BUILD)
}
