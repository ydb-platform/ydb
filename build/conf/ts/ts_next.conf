TS_NEXT_CONFIG_PATH=next.config.js
TS_NEXT_COMMAND=build

### @usage: TS_NEXT_CONFIG(ConfigPath)
###
### Macro sets the config path for TS_NEXT module.
###
### - ConfigPath - config path. Default value: next.config.js
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_NEXT#ts-next-config
macro _TS_NEXT_CONFIG(ConfigPath) {
    SET(TS_NEXT_CONFIG_PATH $ConfigPath)
}

### @usage: TS_NEXT_BUILD_OPTIONS(Options...)
###
### Macro sets the build options for TS_NEXT module.
###
### - Options - next build options.
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_NEXT#ts-next-build-options
macro _TS_NEXT_BUILD_OPTIONS(Options...) {
    _TS_NEXT_SET_BUILD_COMMAND($Options)
}

macro _TS_NEXT_SET_BUILD_COMMAND(Options...) {
    SET(_TS_BUILD_COMMAND next ${join= :TS_NEXT_COMMAND} ${join= :Options})
    SET(_TS_BUILD_COMMAND_ARG --build-command ${quo:_TS_BUILD_COMMAND})
}

TS_NEXT_OUTPUT_DIR=.next

### @usage: TS_NEXT_OUTPUT(DirName)
###
### Macro sets the output directory name for TS_NEXT module.
###
### - DirName - output directory name. Default value: .next.
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_NEXT#ts-next-output
### @usage: TS_NEXT_EXPERIMENTAL_BUILD_MODE()
###
### Macro tune the build command to use experimental build feature.
### The method depends on the next.js version.
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_NEXT#ts-next-experimental-build-mode
macro TS_NEXT_EXPERIMENTAL_BUILD_MODE() {
    _TS_NEXT_EXPERIMENTAL_BUILD_MODE()
    _TS_NEXT_SET_BUILD_COMMAND()
}

### @usage: TS_NEXT([name])
###
### NextJS app, built with `next build`. Requires sources to be under /src folder.
### /pages and /app on the root level are not supported.
### Build results are output.tar.
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_NEXT
###
### @example
###
###     TS_NEXT()
###     END()
###
# tag:deprecated
multimodule TS_NEXT {
    module BUILD: _TS_BASE_UNIT {
        _TS_LEGACY_MODULE_WARNING(TS_NEXT)

        .CMD=$TS_LIBRARY_CMD
        .SEM=$_SEM_IGNORED
        .EPILOGUE=_TS_LEGACY_LIBRARY_EPILOGUE
        .PEERDIRSELF=TS_PREPARE_DEPS
        .ALIASES=TS_NEXT_CONFIG=_TS_NEXT_CONFIG TS_NEXT_BUILD_OPTIONS=_TS_NEXT_BUILD_OPTIONS TS_NEXT_OUTPUT=TS_BUILD_OUTPUTS RUN_JAVASCRIPT_AFTER_BUILD=_TS_LEGACY_RUN_JAVASCRIPT_AFTER_BUILD

        # by default multimodule overrides inherited MODULE_TAG to submodule name (BUILD in this case)
        # but we have to set it to TS for include processor to work
        SET(MODULE_TAG TS)
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)

        SET(_TS_MOD_NAME TS_NEXT)
        SET(_TS_BUILD_SCRIPT nots:build)
        _TS_NEXT_SET_BUILD_COMMAND()
        TS_BUILD_OUTPUTS($TS_NEXT_OUTPUT_DIR)

        DISABLE(TS_CONFIG_DEDUCE_OUT)

        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${CURDIR}/package.json)
        _TS_ADD_NODE_MODULES_FOR_BUILDER()
    }

    module TS_PREPARE_DEPS: _PREPARE_DEPS_BASE {
        .ALIASES=TS_NEXT_CONFIG=_NOOP_MACRO TS_NEXT_BUILD_OPTIONS=_NOOP_MACRO TS_NEXT_OUTPUT=_NOOP_MACRO RUN_JAVASCRIPT_AFTER_BUILD=_NOOP_MACRO

        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
    }
}
