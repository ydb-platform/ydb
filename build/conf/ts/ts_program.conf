### @usage: TS_PROGRAM([Name])
### Build a standalone executable using TS_BUILD_SCRIPT and TS_BUILD_OUTPUTS.
### The executable defaults to the module directory name, like PROGRAM().
### The build script writes the executable to TS_PROGRAM_OUTPUT.
### TS_PROGRAM_BUN_TARGET and TS_PROGRAM_BUN_TARGET_BIN select the Bun target and runtime.
### Dependencies are resolved from package.json and the pnpm lockfile.
multimodule TS_PROGRAM {
    module BUILD: _TS_BASE_UNIT {
        .ARGS_PARSER=Base
        .CMD=$TS_LIBRARY_CMD
        .SEM=$_SEM_IGNORED
        .EPILOGUE=_TS_LIBRARY_EPILOGUE
        .PEERDIRSELF=TS_PREPARE_DEPS

        .DEFAULT_NAME_GENERATOR=DirName
        SET(MODULE_TYPE PROGRAM)
        SET(MODULE_TAG TS_PROGRAM)
        SET(_TS_MOD_NAME TS_PROGRAM)
        SET(_TS_LIBRARY_OUTPUT_ARGS --executable yes)
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${CURDIR}/package.json)

        _TS_ADD_NODE_MODULES_FOR_BUILDER()
    }

    module TS_PREPARE_DEPS: _PREPARE_DEPS_BASE {
        .ARGS_PARSER=Base
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
    }
}
