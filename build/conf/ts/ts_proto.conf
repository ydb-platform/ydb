_TS_PROTO_OPT=
_TS_PROTO_IMPL_INOUTS=
_TS_PROTO_PEERS=
_TS_PROTO_NON_RECURSIVE=no
_TS_PROTO_PEERS_ARGS=

when ($_TS_PROTO_NON_RECURSIVE == "yes") {
    _TS_PROTO_PEERS_ARGS=--proto-peers $_TS_PROTO_PEERS
}
_TS_PROTO_EXTRA_PROTO_PATHS=
_TS_PROTO_AUTO_PACKAGE_NAME=@yandex-proto/*
_TS_PROTO_AUTO_DEPS=library/typescript/ts-proto-deps
_TS_PROTO_AUTO_ARGS=--auto-package-name $_TS_PROTO_AUTO_PACKAGE_NAME --auto-deps-path $_TS_PROTO_AUTO_DEPS

_TS_PROTO_IMPL_CMD=$_TS_PROJECT_SETUP_CMD \
    && $NOTS_TOOL $NOTS_TOOL_BASE_ARGS build-ts-proto $NOTS_TOOL_COMMON_BUILDER_ARGS \
        ${_TS_PROTO_AUTO_ARGS} \
        ${_TS_PROTO_OPT} \
        --protoc-bin $PROTOC \
        --proto-srcs $_TS_PROTO_SRCS_FILES \
        $_TS_PROTO_PEERS_ARGS \
        --proto-paths ./$PROTO_NAMESPACE $ARCADIA_ROOT/$PROTO_NAMESPACE $_PROTO__INCLUDE $_TS_PROTO_EXTRA_PROTO_PATHS $ARCADIA_BUILD_ROOT $PROTOBUF_INCLUDE_PATH \
        ${hide:PEERS} ${hide:PEERS_LATE_OUTS} \
        $_NODE_MODULES_INOUTS $_TS_FILES_INOUTS \
        ${hide;input=TEXT:_TS_GLOB_FILES} \
        $_TS_PROTO_IMPL_INOUTS \
        ${hide:PROTO_FAKEID} \
        ${hide;kv:"pc magenta"} ${hide;kv:"p TS_PRO"}

macro _TS_PROTO_PEERDIR(PEERS...) {
    SET_APPEND(_TS_PROTO_PEERS $PEERS)
    PEERDIR($PEERS)
}

# Prepare-deps needs only explicitly enabled package edges. Add them during
# configuration, after all user macros (including the opt-in) have been read.
macro _TS_PROTO_PREPARE_PEERDIR(PEERS...) {
    SET_APPEND(_TS_PROTO_PEERS $PEERS)
}

### @usage: TS_PROTO_NON_RECURSIVE()
###
### Consume built TS_PROTO peers as packages instead of generating local copies.
### Applies only to this module; raw proto peers still generate locally.
macro TS_PROTO_NON_RECURSIVE() {
    ENABLE(_TS_PROTO_NON_RECURSIVE)
}

### # internal
module _TS_PROTO_IMPL: _TS_BASE_UNIT {
    .CMD=$_TS_PROTO_IMPL_CMD
    .SEM=$_SEM_IGNORED
    .USE_PEERS_LATE_OUTS=yes
    .ALLOWED=GRPC
    .IGNORED=GENERATE_ENUM_SERIALIZATION GENERATE_ENUM_SERIALIZATION_WITH_HEADER USE_SKIFF CPP_PROTO_PLUGIN2 PY_PROTO_PLUGIN YMAPS_SPROTO RESOURCE PY_SRCS
    # Collect sources and remember user PEERDIR for workspace peer mapping.
    .ALIASES=SRCS=_TS_PROTO_SRCS PEERDIR=_TS_PROTO_PEERDIR

    # see r14294210
    DISABLE(_NEED_SBOM_INFO)

    # support for macro USE_COMMON_GOOGLE_APIS()
    when ($_COMMON_GOOGLE_APIS != "None") {
        PEERDIR += contrib/libs/googleapis-common-protos
        _TS_PROTO_EXTRA_PROTO_PATHS += $ARCADIA_ROOT/contrib/libs/googleapis-common-protos
    }

    # Raw proto peers supply source imports and include paths.
    # Built TS_PROTO peers are brought in by TS_PREPARE_DEPS.
    SET(PEERDIR_TAGS DESC_PROTO TS)
    # For users to add some conditional config for TS_PROTO, like
    #   IF (TS_PROTO)
    #       MESSAGE(Building TS_PROTO!!!)
    ENABLE(TS_PROTO)
    ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
    # Disable linting
    NO_LINT()

    SET(MODULE_LANG TS)
    DISABLE(TS_CONFIG_DEDUCE_OUT)
    SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${CURDIR}/${TS_CONFIG_PATH})
}

### # internal
module _TS_PROTO_PREPARE_DEPS_IMPL: _PREPARE_DEPS_BASE {
    .IGNORED=SRCS GENERATE_ENUM_SERIALIZATION GENERATE_ENUM_SERIALIZATION_WITH_HEADER USE_SKIFF CPP_PROTO_PLUGIN2 PY_PROTO_PLUGIN YMAPS_SPROTO RESOURCE PY_SRCS
    .USE_PEERS_LATE_OUTS=yes
    .ALIASES=SRCS=_TS_PROTO_SRCS PEERDIR=_TS_PROTO_PREPARE_PEERDIR

    # see r14294210
    DISABLE(_NEED_SBOM_INFO)

    # Inherited tags resolve generated-package deps and built TS_PROTO peers,
    # while raw proto dependencies remain ignored.
    ENABLE(TS_PROTO_PREPARE_DEPS)
    ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
}

macro _TS_PROTO_EPILOGUE() {
    _TS_CONFIG_EPILOGUE()
    _TS_PROTO_CONFIGURE()
    _SET_TS_INPUTS()
}

### @usage: _TS_PROTO_SRCS(path1 path2) # internal
macro _TS_PROTO_SRCS(FILES...) {
    _SET_APPEND_WITH_DIRECTIVE(_TS_PROTO_SRCS_FILES input $FILES)
}

### @usage: TS_PROTO_OPT(key1=value1 key2=value2)
###
### Overrides default options for `--ts_proto_opt`
### ([supported options](https://github.com/stephenh/ts-proto?tab=readme-ov-file#supported-options)).
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_PROTO#ts_proto_opt
###
### @example
###
###     TS_PROTO_OPT(env=browser)
###     TS_PROTO_OPT(
###         useJsonName=true
###         useJsonWireFormat=true
###     )
###
macro TS_PROTO_OPT(OPTS...) {
    SET_APPEND(_TS_PROTO_OPT ${pre=--ts-proto-opt :OPTS})
}

### @usage: TS_PROTO_PACKAGE_NAME(@scope/pkg)
###
### Sets package name for `TS_PROTO`.
### Use `@scope/*` to set package scope with autogenerated name.
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_PROTO#ts_proto_package_name
###
### @example
###
###     TS_PROTO_PACKAGE_NAME(@yandex-proto/ci-tasklet-sidecar)
###     TS_PROTO_PACKAGE_NAME(@yandex-proto/*)
macro TS_PROTO_PACKAGE_NAME(NAME) {
    SET(_TS_PROTO_AUTO_PACKAGE_NAME $NAME)
}
