macro _TS_TSC_CONFIG(FirstConfigPath, ConfigPath...) {
    SET(TS_CONFIG_PATH $FirstConfigPath $ConfigPath)
    _TS_TSC_BUILD_COMMAND()
}

### @usage: TS_TSC([name])
###
### The TypeScript/JavaScript library module, compiles TypeScript sources to JavaScript using tsc.
### Build results are JavaScript files, typings and source mappings (depending on local tsconfig.json settings).
###
### Documentation: https://docs.yandex-team.ru/frontend-in-arcadia/references/TS_TSC
###
### @example
###
###     TS_TSC()
###
###     END()
###
# tag:deprecated
multimodule TS_TSC {
    module BUILD: _TS_BASE_UNIT {
        _TS_LEGACY_MODULE_WARNING(TS_TSC)

        .CMD=$TS_LIBRARY_CMD
        .SEM=$_SEM_IGNORED
        .EPILOGUE=_TS_LEGACY_LIBRARY_EPILOGUE
        .PEERDIRSELF=TS_PREPARE_DEPS
        .ALIASES=TS_CONFIG=_TS_TSC_CONFIG RUN_JAVASCRIPT_AFTER_BUILD=_TS_LEGACY_RUN_JAVASCRIPT_AFTER_BUILD

        # by default multimodule overrides inherited MODULE_TAG to submodule name (BUILD in this case)
        # but we have to set it to TS for include processor to work
        SET(MODULE_TAG TS)
        SET(MODULE_LANG TS)
        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)

        SET(_TS_MOD_NAME TS_TSC)
        SET(_TS_BUILD_SCRIPT nots:build)
        _TS_TSC_BUILD_COMMAND()

        DISABLE(TS_CONFIG_DEDUCE_OUT)

        SET_APPEND(_MAKEFILE_INCLUDE_LIKE_DEPS ${CURDIR}/package.json)
        _TS_ADD_NODE_MODULES_FOR_BUILDER()
    }

    module TS_PREPARE_DEPS: _PREPARE_DEPS_BASE {
        .ALIASES=TS_BUILD_OUTPUTS=_NOOP_MACRO TS_CONFIG=_NOOP_MACRO RUN_JAVASCRIPT_AFTER_BUILD=_NOOP_MACRO

        ENABLE(_SUPPORTS_HERMETIC_NODE_MODULES)
    }
}
