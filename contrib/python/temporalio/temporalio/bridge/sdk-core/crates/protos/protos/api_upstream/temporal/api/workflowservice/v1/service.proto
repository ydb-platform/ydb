            additional_bindings {
                post: "/api/v1/namespaces/{namespace}/activities/{activity_id}/update-options"
                body: "*"
            }
            // Workflow activity
            additional_bindings {
                post: "/namespaces/{namespace}/workflows/{workflow_id}/activities/{activity_id}/update-options"
                body: "*"
            }
            additional_bindings {
                post: "/api/v1/namespaces/{namespace}/workflows/{workflow_id}/activities/{activity_id}/update-options"
                body: "*"
            }
        };
        option (temporal.api.protometa.v1.request_header) = {
            header: "temporal-resource-id"
            value: "{resource_id}"
        };
    }

    // TerminateNexusOperationExecution terminates an existing Nexus operation immediately.
    //
    // Termination happens immediately and the operation handler cannot react to it. A terminated operation will have
    // its outcome set to a failure with a termination reason.
    rpc TerminateNexusOperationExecution (TerminateNexusOperationExecutionRequest) returns (TerminateNexusOperationExecutionResponse) {
        option (google.api.http) = {
            post: "/namespaces/{namespace}/nexus-operations/{operation_id}/terminate"
            body: "*"
            additional_bindings {
                post: "/api/v1/namespaces/{namespace}/nexus-operations/{operation_id}/terminate"
                body: "*"
            }
        };
    }

    // DeleteNexusOperationExecution asynchronously deletes a specific Nexus operation run (when
    // run_id is provided) or the latest run (when run_id is not provided). If the operation
    // is running, it will be terminated before deletion.
    //
    // (-- api-linter: core::0127::http-annotation=disabled
    //     aip.dev/not-precedent: Nexus operation deletion not exposed to HTTP, users should use cancel or terminate. --)
    rpc DeleteNexusOperationExecution (DeleteNexusOperationExecutionRequest) returns (DeleteNexusOperationExecutionResponse) {}

    rpc PollWorkflowExecutionTimeSkipping (PollWorkflowExecutionTimeSkippingRequest) returns (PollWorkflowExecutionTimeSkippingResponse) {
        option (google.api.http) = {
