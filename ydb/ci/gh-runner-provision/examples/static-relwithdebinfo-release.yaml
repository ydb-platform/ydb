# 64 vCPU / 256 GB. One file is one label set. names are the hosts that have it.
# register reapplies these labels. create is only for a host that does not exist yet.
# No ghrun label: the autoscaler deletes idle runners that carry it.
names:
  - static-relwithdebinfo-d
  - static-relwithdebinfo-d-01
  - static-relwithdebinfo-d-02
  - static-relwithdebinfo-d-03
  - static-relwithdebinfo-d-04
  - static-relwithdebinfo-d-05
  - static-relwithdebinfo-d-06
  - static-relwithdebinfo-d-07
  - static-relwithdebinfo-d-08
  - static-relwithdebinfo-d-09
  - static-relwithdebinfo-d-10
  - static-relwithdebinfo-d-11
  - static-relwithdebinfo-d-12
  - static-relwithdebinfo-d-13
  - static-relwithdebinfo-d-14
platform: standard-v4a
cores: 64
memory_gb: 256
disk_gb: 2418
preset: relwithdebinfo
labels:
  - auto-provisioned
  - build-preset-relwithdebinfo
  - build-preset-release
