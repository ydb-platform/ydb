syntax = "proto3";
option cc_enable_arenas = true;

package NFq.NConfig;

// Experimental, operator-owned WASM service modules and limits. Disabled by default.
message TWasmServicesConfig {
    bool Enabled = 1;
    // Single-module shorthand; requires adjacent <ModulePath>.manifest.json.
    string ModulePath = 2;
    reserved 3;
    reserved "Bindings";
    uint32 MaxBufferedRows = 4;
    uint32 CallTimeoutMs = 5;
    // Zero/one retains the single-row service protocol; 2..64 enables batching.
    uint32 MaxBatchRows = 6;
    // Application request/response and guest result byte cap (default 32768).
    uint32 MaxBatchBytes = 7;
    repeated TModule Modules = 8;
    // Conservative serialized input/output reservation, default 64 MiB.
    uint64 MaxBufferedBytes = 9;

    message TModule {
        string ModulePath = 1;
        string ManifestPath = 2;
    }

}
