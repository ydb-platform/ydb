syntax = "proto3";

package NYdb.NBS.PartitionDirect.NProto;

message TBlockField {
    oneof Encoding {
        bytes RunLengthEncoding = 1;
        bytes BitMask = 2;
    }
}

message TDDiskState {
    TBlockField Ahead = 1;
    TBlockField Behind = 2;
}

message TDirtyMapState {
    // DDiskTouched shows whether any writes occurred on the DDisk.
    // If they did, it means that VChunk allocated space on the DDisk.
    bool DDiskTouched = 1;

    // The map of ahead and behind blocks.
    repeated TDDiskState DDiskStates = 2;
}
