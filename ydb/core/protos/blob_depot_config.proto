import "ydb/core/protos/hive.proto";
import "ydb/core/protos/s3_settings.proto";

package NKikimrBlobDepot;

message TChannelKind {
    enum E {
        System = 0;
        Data = 1;
        Log = 2;
    }
}

message TChannelProfile {
    optional string StoragePoolName = 1; // used when creating tablet through BSC -> Hive
    optional string StoragePoolKind = 2; // used when creating tablet through Schemeshard
    optional uint32 Count = 3 [default = 1];
    optional TChannelKind.E ChannelKind = 4;
}

message TS3BackendSettings {
    optional NKikimrSchemeOp.TS3Settings Settings = 1; // how to connect to S3 (mandatory field)

    message TAsyncMode {
        // Acknowledged data starts on Data channels. The tablet then packs eligible data into S3 objects.
        // Maximum referenced hot bytes plus outstanding write credits for this depot.
        optional uint64 MaxPendingBytes = 2;

        // Start throttling at this many charged bytes. Requires MaxPendingBytes.
        optional uint64 ThrottleStartBytes = 3;

        // Foreground write admission rate at ThrottleStartBytes. It drops linearly to zero at MaxPendingBytes.
        optional uint64 ThrottleMaxBytesPerSecond = 4;

        // Number of concurrent background uploads and repacks.
        optional uint32 UploadPutsInFlight = 5 [default = 1];
        // Retain up to this many bytes of recent committed data on Data channels.
        optional uint64 HotTargetBytes = 6 [default = 0];
        optional uint32 TargetObjectBytes = 7 [default = 16777216];
        // Sparse objects become eligible below this percentage of live bytes. Zero disables repacking.
        optional uint32 RepackBelowLivePercent = 8 [default = 50];
    }

    message TSyncMode {
        // data is written synchronously by agent
    }

    oneof Mode {
        TAsyncMode AsyncMode = 2;
        TSyncMode SyncMode = 3;
    }

    // When set, the actual S3 endpoint is fetched periodically from this URL
    // (HTTP GET to http://<BalancerHost>/, body is plain-text hostname).
    // Existing Settings.Endpoint is used only as a fallback before the first
    // balancer reply. S3 requests get re-routed through a per-node, per-tablet
    // router actor managed by Node Warden.
    optional string BalancerHost = 4;
    optional uint32 BalancerRefreshSecMin = 5 [default = 10];
    optional uint32 BalancerRefreshSecMax = 6 [default = 15];
    // ProxyPort when balancer returns a hostname without an explicit port.
    optional uint32 BalancerProxyPort = 7 [default = 4080];
    // ProxyScheme for connections via the balancer-provided host.
    optional NKikimrSchemeOp.TS3Settings.EScheme BalancerProxyScheme = 8 [default = HTTP];
    // How often the per-node S3 router sweeps retiring wrappers.
    optional uint32 MetricsPushIntervalMs = 9 [default = 2500];
    optional uint32 MaxRetiringWrappers = 10 [default = 8];
    optional uint32 MinRetireGracePeriodSec = 11 [default = 60];
}

message TBlobDepotConfig {
    repeated TChannelProfile ChannelProfiles = 1;
    optional uint32 VirtualGroupId = 2;
    optional bool IsDecommittingGroup = 3;
    optional uint64 TabletId = 4;
    optional bool HiveContacted = 5;
    optional NKikimrHive.TEvCreateTablet HiveParams = 6; // extra hive parameters
    optional uint64 TenantHiveId = 7;
    optional TS3BackendSettings S3BackendSettings = 8;
    // S3 path suffix shared by the tablet and its agents. New BSC depots include a per-depot UUID.
    optional string Name = 9;
    // Async packs can survive later mode changes. Their locators use the configured bucket and key prefix.
    optional bool S3NamespacePinned = 10;
    // BSC checked that no other group owns this physical S3 namespace.
    optional bool S3NamespaceValidated = 11;
    // Once BSC has authorized async cooling, shared objects can survive subsequent mode changes.
    optional bool EverAuthorizedDataCooling = 12;
}
