import "ydb/core/protos/blobstorage_base3.proto";
import "ydb/core/protos/blobstorage_disk_color.proto";
import "ydb/core/protos/bridge.proto";
import "ydb/library/actors/protos/interconnect.proto";

package NKikimrBlobStorage;

// VDisk handle and store LogoBlobs in different ways, below we define several classes of these blobs
enum EPutHandleClass {
    TabletLog = 1;      // usually small size, requires low latency, rarely read sequentially (RT/TMP)
    AsyncBlob = 2;      // async blobs, usually sstables and their parts (NoneRT/NoneTMP)
    UserData = 3;       // user data that we write as separate blobs (RT/NoneTMP)

    // NOTE: currently NoneRT/TMP blobs must be treated as AsyncBlob
}

// Kind of the data being written. Space management rejects writes of different kinds at
// different space colors: system data survives worse colors than user data, so that a tenant
// which has run out of space can still boot its system tablets and delete user data.
message TDataKind {
    enum E {
        USER = 0;   // data of user tablets: DataShard, ColumnShard, PersQueue, KeyValue, ...
        SYSTEM = 1; // data of system tablets: SchemeShard, Hive, Coordinator, Mediator, ...
    }
}

// VDisk handle read of LogoBlobs in different ways, below we define several classes of these requests
enum EGetHandleClass {
    AsyncRead = 1;      // read of tablet's compacted data
    FastRead = 2;       // reads initiated by the user (fast)
    Discover = 3;       // reads from Discover query (OOB)
    LowRead = 4;        // background reads initiabed by the user (should not affect TabletLog and FastRead)
}

enum EVDiskQueueId {
    option allow_alias = true;

    Unknown = 0;
    // EPutHandleClass
    PutTabletLog = 1;
    PutAsyncBlob = 2;
    PutUserData = 3;
    // EGetHandleClass
    GetAsyncRead = 4;
    GetFastRead = 5;
    GetDiscover = 6;
    GetLowRead = 7;

    // Declare Begin and End last in order to get real names from EVDiskQueueId_Name()
    Begin = 1;
    End = 8;
};

enum EVDiskInternalQueueId {
    option allow_alias = true;

    IntUnknown = 0;
    IntBegin = 1;
    IntGetAsync = 1;
    IntGetFast = 2;
    IntPutLog = 3;
    IntPutHugeForeground = 4;
    IntPutHugeBackground = 5;
    IntGetDiscover = 6;
    IntLowRead = 7;
    IntEnd = 8;
};

// status flags we provide in responses
enum EStatusFlags {  // Never use this type for storage, use ui32 bitset
    StatusIsValid = 1;                          // 0000 0000 0001, if not set, status flags could not be obtained
    StatusDiskSpaceCyan = 128;                  // 0000 1000 0000
    StatusDiskSpaceLightYellowMove = 2;         // 0000 0000 0010
    StatusDiskSpaceYellowStop = 512;            // 0010 0000 0000
    StatusDiskSpaceLightOrange = 256;           // 0001 0000 0000
    StatusDiskSpacePreOrange = 1024;            // 0100 0000 0000
    StatusDiskSpaceOrange = 4;                  // 0000 0000 0100
    StatusDiskSpaceRed = 8;                     // 0000 0000 1000
    StatusDiskSpaceBlack = 64;                  // 0000 0100 0000
    StatusMaskDiskSpace = 1998;                 // 0111 1100 1110
    StatusNewOwner = 16;                        // 0000 0001 0000
    StatusNotEnoughDiskSpaceForOperation = 32;  // 0000 0010 0000
}

enum EEntityStatus {
    INITIAL = 1; // entity was generated from the current state by the configuration request
    CREATE  = 2; // entity was just created and notification is being pushed to the warden
    DESTROY = 3; // entity was just destroyed and the notification is being pushed to the warden
    RESTART = 4; // entity has changed config or changed environment and should be restarted by warden
}

message TVDiskLocation {
    optional uint32 NodeID = 1;
    optional uint32 PDiskID = 2;
    optional uint32 VDiskSlotID = 3;
    optional uint64 PDiskGuid = 4;
}

// Participation of a whole logical failrealm, independent of physical placement.
message TFailRealmStates {
    enum EState {
        Included = 0; // Reads and acknowledged writes.
        Excluded = 1; // No client operations or quorum participation.
        Joining = 2; // WriteOk may use this realm only together with all Included realms; no reliable absence.
        Leaving = 3; // Read/replication source only; no client or replication writes; excluded from CW.
    }
    message TFailRealm {
        optional uint32 FailRealmIdx = 1;
        optional EState State = 2 [default = Included];
    }
    // Omitted failrealms are Included.
    repeated TFailRealm FailRealm = 1;
}

// Administrative mirror-3-dc state machine (RFC 179/180).
// Each transition asserts the target state's old-blob guarantee; BSC does not verify replicas.
message TMirror3dcGroupState {
    // Realm order below is A/B/C, not numeric indices: C is FailedFailRealmIdx;
    // in SOLO modes A is SurvivingFailRealmIdx and B is the other non-failed realm.
    // These columns describe roles, not fixed physical IDs. IIJ -> SOLO recovery keeps J:
    // with physical roles I/I/J and A surviving, the new roles are I/E/J. FailedFailRealmIdx
    // changes from the old J to the newly excluded I; subsequent SOLO transitions retain it.
    // Similarly, IIL -> SOLO pending keeps L and excludes one I, updating FailedFailRealmIdx.
    // I = Included, E = Excluded, J = Joining, L = Leaving. Layouts use interchangeable realms.
    // WriteOk alternatives are OR-ed; WriteDurability is the background replication target.
    // CW describes old-blob guarantees; stronger WriteOk alone affects only new blobs.
    // CW 0 permits missing recoverable copies: recovery may never complete. A transition
    // to positive CW still requires the administrator to confirm that target guarantee.
    // If a Joining realm is present and a CW layout fits entirely in Included realms,
    // that layout is guaranteed within Included realms alone, without relying on Joining.
    // Additional copies may exist in Joining realms. For example, with I/I/J, CW 1+1
    // guarantees a copy in each Included realm; with I/J/E, CW 2 guarantees two copies in I.
    // Leaving copies never count toward CW. E -> L preserves physical data; J -> L preserves
    // surviving data. E -> J and L -> J may lose old data and must not establish new guarantees.
    // A WriteOk layout using Joining must also use every Included realm. In I/I/J, 2+2 uses
    // the two Included realms; 1+1+1 uses all three. CW and new-write ACK rules are distinct.
    // Ordinary S -> T transitions recover using WriteDurability(S) while still in S, then
    // assert CW(T) with T's realm roles. BSC accepts the administrator's confirmation;
    // it does not perform replication or verify completion.
    // DISASTER -> RESURECTION_PENDING returns the last direct I -> E realm as L with CW 0.
    // In DISASTER this is the realm other than FailedFailRealmIdx and SurvivingFailRealmIdx.
    // Recover from I/L into I using durability 2 before asserting CW 1 in RESURECTION.
    // A readable source is required.
    // Mode transitions; realm-index checks in CanTransitionTo still apply.
    // Matching parenthesized labels connect distant arrows; they are not additional states.
    // RECOVERY INV2 is one-way into DC_RECOVERY; RECOVERY and RECOVERY INV1 are bidirectional.
    // SOLO 0/1/2 connect failure-pending shortcuts while preserving the physical Leaving realm.
    // Identical-state requests are idempotent; self-loops are omitted.
    // Arrowheads (>, <, v, ^) sit just before destinations; + marks turns and junctions.
    //
    // +---------------------------+     +---------------------------+                           +---------------------------+
    // | NORMAL                    |<----| DC_RECOVERY               |<----(RECOVERY INV2)       | DC_RECOVERY_PENDING_INV_1 |<--->(RECOVERY INV1)
    // | I/I/I    CW: 1+1+1 OR 2+2 |     | I/I/J    CW: 1+1+1 OR 2+2 |<--------+-----------------| I/I/J             CW: 1+1 |---->(DISASTER JOIN)
    // +-------------+-------------+     +-----+----------------+----+         |                 +---------------------------+
    //               |                         |                |              |
    //               |                         v                v              |                 +---------------------------+
    //               |                  (RECOVERY INV1)  (DISASTER JOIN)       +-----------------| DC_RECOVERY_PENDING       |<--->(RECOVERY)
    //               |                                                                           | I/I/J        CW: 1+1 OR 2 |---->(DISASTER)
    //               |                                                                           +---------------------------+
    //               v
    // +---------------------------+     +---------------------------+     +---------------------------+
    // | DC_FAILURE_PENDING        |---->| DC_FAILURE_PENDING_INV_1  |---->| DC_FAILURE_PENDING_INV_2  |
    // | I/I/L        CW: 1+1 OR 2 |     | I/I/L             CW: 1+1 |     | I/I/L             CW: 2+2 |
    // +---+----+------------------+     +---+----+------------------+     +---+----+------------------+
    //     |    |           ^                |    |           ^                |    |           |
    //     v    |           |                v    |           |                v    |           |
    // (SOLO 0) |           v            (SOLO 1) |           v            (SOLO 2) |           v
    //          |      (RECOVERY)                 |    (RECOVERY INV1)              |    (RECOVERY INV2)
    //          |           ^                     |           ^                     |           ^
    //          |           |                     |           |                     |           |
    //          v           v                     v           v                     v           |
    // +---------------------------+     +---------------------------+     +---------------------------+
    // | DC_FAILURE                |---->| DC_FAILURE_INV_1          |---->| DC_FAILURE_INV_2          |
    // | I/I/E        CW: 1+1 OR 2 |     | I/I/E             CW: 1+1 |     | I/I/E             CW: 2+2 |
    // +--------+------------------+     +-------------+----------+--+     +-------------+---------+---+
    //          |                              ^       |          |                      |         |
    //          |                              |       |          v                      |         v
    //          |    (DISASTER)                |       |   (DISASTER INV1)               |  (DISASTER INV2)
    //          |         |                    |       |    (SOLO 1)                     |(SOLO 2)
    //          v         v                    |       +--------+--------+    (RES L)    +--------+--------+
    // +---------------------------+           |                v        v       v                v        v
    // | SOLO_DC_DISASTER          |           |           +---------------------------+     +---------------------------+
    // | I/E/E               CW: 0 |           |  +------->| SOLO_DC_INV_1_PENDING     |---->| SOLO_DC_INV_2_PENDING     |<--------+
    // +--------+------------------+           |  |    +---| I/L/E               CW: 1 |     | I/L/E               CW: 2 |---+     |
    //          |          (SOLO 0)            |  |    |   +-------------+-------------+     +-------------+-------------+   |     |
    //          v              v               |  |    |                 |                                 |                 |     |
    // +---------------------------------+     |  |    |                 |                                 |                 |     |
    // | SOLO_DC_RESURECTION_PENDING     |     |  |    | (DISASTER INV1) |                 (DISASTER INV2) |                 |     |
    // | I/L/E                     CW: 0 |     |  |    |        v        v                        v        v                 |     |
    // +----------------+----------------+     |  |    |   +---------------------------+     +---------------------------+   |     |
    //                  |                      |  |    |   | SOLO_DC_INV_1             |---->| SOLO_DC_INV_2             |   |     |
    //                  v                      |  |    |   | I/E/E               CW: 1 |     | I/E/E               CW: 2 |   |     |
    // +---------------------------------+     |  |    |   +---------------------------+     +---------------------------+   |     |
    // | SOLO_DC_RESURECTION             |     |  |    |                   ^                               ^                 |     |
    // | I/L/E                     CW: 1 |     |  |    |                   |                               |                 |     |
    // +----------------+----------------+     |  |    | (DISASTER JOIN)   |  (RES J)                      |                 |     |
    //                  |                      |  |    v        v          v     v                         v                 v     |
    //                  +--> (RES L)           |  |  +---------------------------------+     +---------------------------------+   |
    //                  +--> (RES J)           |  +--| SOLO_DC_RECOVERY_PENDING_INV_1  |     | SOLO_DC_RECOVERY_PENDING_INV_2  |---+
    //                                         |     | I/J/E                     CW: 1 |     | I/J/E                     CW: 2 |
    //                                         |     +----------------+----------------+     +----------------+----------------+
    //                                         |                      |                                       |
    //                                         |                      +---------------------------------------+
    //                                         |                      |
    //                                         |                      v
    //                                         |     +---------------------------------+
    //                                         +-----| SOLO_DC_RECOVERY_INV_1          |
    //                                               | I/J/E                   CW: 1+1 |
    //                                               +---------------------------------+
    //
    enum EMode {
        // Realms I/I/I; WriteOk = 1+1+1 OR 2+2; WriteDurability = 1+1+1; CW = 1+1+1 OR 2+2.
        NORMAL = 0;
        // Realms I/I/L; WriteOk = 2+2; WriteDurability = 1+1; CW = 1+1 OR 2.
        DC_FAILURE_PENDING = 1;
        // Realms I/I/L; WriteOk = WriteDurability = 2+2; CW = 1+1 (invariant I).
        DC_FAILURE_PENDING_INV_1 = 2;
        // Realms I/I/L; WriteOk = WriteDurability = CW = 2+2 (invariant II).
        DC_FAILURE_PENDING_INV_2 = 3;
        // Realms I/I/E; WriteOk = WriteDurability = 2+2; CW = 1+1 OR 2.
        DC_FAILURE = 4;
        // Realms I/I/E; WriteOk = WriteDurability = 2+2; CW = 1+1 (invariant I).
        DC_FAILURE_INV_1 = 5;
        // Realms I/I/E; WriteOk = WriteDurability = CW = 2+2 (invariant II).
        DC_FAILURE_INV_2 = 6;
        // Realms I/I/J; WriteOk = 2+2; WriteDurability = 1+1+1; CW = 1+1 OR 2.
        DC_RECOVERY_PENDING = 7;
        // Realms I/I/J; WriteOk = 1+1+1 OR 2+2; WriteDurability = 1+1+1; CW = 1+1.
        DC_RECOVERY_PENDING_INV_1 = 8;
        // Realms I/I/J; WriteOk = 1+1+1 OR 2+2; WriteDurability = 1+1+1; CW = 1+1+1 OR 2+2.
        DC_RECOVERY = 9;
        // Realms I/L/E; WriteOk = WriteDurability = 2; CW = 1.
        SOLO_DC_INV_1_PENDING = 10;
        // Realms I/L/E; WriteOk = WriteDurability = 2; CW = 2; prepare to exclude B.
        SOLO_DC_INV_2_PENDING = 11;
        // Realms I/E/E; WriteOk = WriteDurability = 2; CW = 1 (invariant I).
        SOLO_DC_INV_1 = 12;
        // Realms I/E/E; WriteOk = WriteDurability = 2; CW = 2 (invariant II).
        SOLO_DC_INV_2 = 13;
        // Realms I/J/E; WriteOk = 2+2; WriteDurability = 1+1; CW = 1.
        SOLO_DC_RECOVERY_PENDING_INV_1 = 14;
        // Realms I/J/E; WriteOk = 2+2; WriteDurability = 1+1; CW = 2.
        SOLO_DC_RECOVERY_PENDING_INV_2 = 15;
        // Realms I/J/E; WriteOk = 2+2; WriteDurability = 1+1; CW = 1+1.
        SOLO_DC_RECOVERY_INV_1 = 16;
        // Realms I/E/E; WriteOk = WriteDurability = 2; CW = 0: no surviving copy is guaranteed.
        SOLO_DC_DISASTER = 17;
        // Realms I/L/E; WriteOk = WriteDurability = 2; CW = 1.
        // The administrator confirms that a surviving copy has been recovered.
        SOLO_DC_RESURECTION = 18;
        // Realms I/L/E; WriteOk = WriteDurability = 2; CW = 0: no surviving-copy guarantee yet.
        SOLO_DC_RESURECTION_PENDING = 19;
    }
    optional EMode Mode = 1;
    // Excluded/returning realm. On IIJ/IIL -> SOLO it changes to the newly excluded I,
    // preserving the old J/L. Other non-NORMAL transitions preserve it.
    optional uint32 FailedFailRealmIdx = 2;
    // Required in SOLO states; the other non-failed realm is the recovery target.
    optional uint32 SurvivingFailRealmIdx = 3;
}

// Each entry is a minimum number of written parts in a distinct failrealm.
// Realm identities are interchangeable: [1, 2] means one realm with >=1 part
// and another realm with >=2 parts.
message TGroupWriteLayout {
    repeated uint32 PartsPerFailRealm = 1;
}

// Minimal guaranteed layouts for all confirmed blobs, including old data.
// One empty Layout represents CW 0 (no surviving-copy guarantee); an absent Layout list is invalid.
message TConfirmedWrites {
    repeated TGroupWriteLayout Layout = 1;
}

message TGroupWritePolicy {
    // Alternatives are OR-ed; requirements inside a layout are AND-ed.
    repeated TGroupWriteLayout WriteOk = 1;
    repeated TGroupWriteLayout WriteDurability = 2;
}

message TGroupInfo {
    message TFailRealm {
        message TFailDomain {
            repeated TVDiskLocation VDiskLocations = 1;
        }
        repeated TFailDomain FailDomains = 1;
    }

    optional uint32 GroupID = 1;
    optional uint32 GroupGeneration = 2;
    optional uint32 ErasureSpecies = 3;
    repeated TFailRealm Rings = 4; // name "Rings" for textual compatibility
    optional EEntityStatus EntityStatus = 5;
    optional uint32 EncryptionMode = 6 [default = 0];
    optional uint32 LifeCyclePhase = 7 [default = 0];
    optional bytes MainKeyId = 8 [default = ""];
    optional bytes EncryptedGroupKey = 9 [default = ""];
    optional uint64 GroupKeyNonce = 10 [default = 0];
    optional uint64 MainKeyVersion = 11 [default = 0];
    optional NActorsInterconnect.TScopeId AcceptedScope = 12; // some kind of ACL for scopes; empty = no restrictions
    optional string StoragePoolName = 13;
    optional EPDiskType DeviceType = 14;
    optional uint64 BlobDepotId = 15; // if filled, then this is virtual group
    optional NKikimrBlobStorage.TGroupDecommitStatus.E DecommitStatus = 16;
    optional NKikimrBridge.TGroupState BridgeGroupState = 17; // filled for brigde proxy groups only
    optional uint32 GroupSizeInUnits = 18;
    optional uint32 BridgeProxyGroupId = 19; // proxy group when running in Bridge mode
    optional uint32 BridgePileId = 20;
    optional bool DDisk = 21; // is this a Direct Block Group?
    optional TFailRealmStates FailRealmStates = 26;
    optional TGroupWritePolicy WritePolicy = 25;
    optional TMirror3dcGroupState Mirror3dcState = 27;
    optional TConfirmedWrites ConfirmedWrites = 28;
}

// VDiskStatus ordering is assumed to be lower for bad statuses and higher for good ones
enum EVDiskStatus {
    ERROR = 0; // the disk is not operational at all
    INIT_PENDING = 1; // initialization in process
    REPLICATING = 2; // the disk accepts queries, but not all the data was replicated
    READY = 3; // the disk is fully operational and does not affect group fault tolerance
}

message TGroupMetrics {
    message TGroupParameters {
        optional uint32 ErasureSpecies = 1;
        optional uint32 GroupID = 2;
        optional string StoragePoolName = 3; // if it was selected from the storage pool
        optional bool PhysicalGroup = 12; // related to TChannelBind.PhysicalGroupsOnly
        optional bool Decommitted = 13;

        reserved 4;

        // group resourcs (as seen by user, that is, including erasure encoding and so on)
        message TResources {
            optional uint64 Space = 1; // bytes
            optional double IOPS = 2; // operations per second
            optional uint64 ReadThroughput = 3; // bytes per second
            optional uint64 WriteThroughput = 4; // bytes per second
            optional double Occupancy = 5; // the worst occupancy among all VDisks in group
        }

        // assured part of group metrics -- when the underlying PDisks have all possible VSlots created; these metrics
        // are expected not to degrade over time, including vdisk movement; however, everything is possible :)
        optional TResources AssuredResources = 7;

        // instant part of group metrics -- with current VSlot count over PDisks
        optional TResources CurrentResources = 8;

        // VDisk metrics for this group
        optional uint64 AvailableSize = 9; // bytes as reported by VDisk metrics (pessimistic case)
        optional uint64 AllocatedSize = 10; // the same basis
        optional NKikimrBlobStorage.TPDiskSpaceColor.E SpaceColor = 11;
        optional uint32 GroupSizeInUnits = 14;
    }

    optional fixed64 GroupId = 1;
    optional TGroupParameters GroupParameters = 2;
}

message TDriveData {
    optional string Path = 1;
    optional string SerialNumber = 2;
    optional string FirmwareRevision = 3;
    optional string ModelNumber = 4;
    optional uint64 Size = 6;
    optional bool IsMock = 7 [default = false];
    optional EPDiskType DeviceType = 5;
}
