syntax = "proto3";

package NKikimrBlobStorage;

// Enum defining PDisk underlying drive type (rotational or solid state)
enum EPDiskType {
    ROT = 0; // rotational drives (HDD)
    SSD = 1; // solid state drives (SSD)
    NVME = 2; // PCIe-connected solid state drives (NVMe SSD)
    UNKNOWN_TYPE = 3; // used if device type is unknown or if group consists of different PDisk device types
}

// Virtual group life cycle state
enum EVirtualGroupState {
    NEW = 0; // just created
    CREATE_FAILED = 1; // error while creating VirtualGroup
    WORKING = 2; // operational
    DELETING = 3; // going to delete from Hive
}

message TGroupDecommitStatus {
    enum E {
        NONE = 0; // no decomission
        PENDING = 1; // decommission machinery is starting
        IN_PROGRESS = 2; // decomission underway
        DONE = 3; // group decomission complete
        RECOMMISSIONING = 4; // group is being recommissioned
    }
}

enum EDriveStatus {
    UNKNOWN = 0; // value of status is unknown (default)
    ACTIVE = 1; // working as expected
    INACTIVE = 2; // new groups are not created over this drive, but existing ones continue to work as expected
    BROKEN = 3; // drive is not working, groups are automatically moved out of this drive upon reception of this status
    reserved 4;
    FAULTY = 5; // drive is expected to become BROKEN soon, new groups are not created, old groups are asynchronously moved out from this drive
    TO_BE_REMOVED = 6; // same as INACTIVE, but drive is counted in fault model as not working
}

enum EDecommitStatus {
    DECOMMIT_UNSET = 0; // unset status -- missing optional field
    DECOMMIT_NONE = 1; // no decomission
    DECOMMIT_PENDING = 2; // drive is going to be removed soon, but SelfHeal logic would not remove it automatically
    DECOMMIT_IMMINENT = 3; // drive is going to be settled automatically
    DECOMMIT_REJECTED = 4; // drive is working as usual, but decommitted slots are not placed here
}

// set by CMS
message TMaintenanceStatus {
    enum E {
        NOT_SET = 0;                        // unset status, default value
        NO_REQUEST = 1;                     // no active maintenance request
        LONG_TERM_MAINTENANCE_PLANNED = 2;  // maintenance requested, VDisks should be moved asynchronously from PDisk
        NO_NEW_VDISKS = 3;                  // no new VDisks should be allocated on this PDisk, but existing ones are not moved
    }
}

message TGroupStatus {
    enum E {
        UNKNOWN = 0; // group status is unknown (default value)
        FULL = 1; // all VDisks of the group are READY for specific period of time
        PARTIAL = 2; // some of VDisks are operational, but group is not yet DEGRADED
        DEGRADED = 3; // group is DEGRADED -- one random failure may lead to group loss (but may not lead too)
        DISINTEGRATED = 4; // group is not available for operation
    }
}

message TDriveLifeStage {
    enum E {
        FREE = 0; // disk drive has been seen on a node, but is not added to BSC yet
        ADDED_BY_DSTOOL = 1; // disk drive has been added to BSC
        REMOVED_BY_DSTOOL = 2; // disk drive has been removed from BSC
    }
}

message TSerialManagementStage {
    enum E {
        DISCOVER_SERIAL = 0;
        CHECK_SERIAL = 1;
        ONLY_SERIAL = 2;
    }
}

// Mirror-3-dc group state diagram. The group state is authoritative.
// Realm roles: I = Included, X = Excluded, R = Recovering.
// Copy guarantees and pending progress are represented by the group state and D/W/E.
// E = Layout Ensurance: guaranteed layouts for confirmed blobs.
// D = Layout Durability: background replication target.
// W = Write Layout: layouts sufficient to acknowledge a new write.
// OR separates alternative layouts; + combines copy counts in distinct failrealms.
// Each box contains realm roles and D, W and E.
// Columns describe logical roles; transitions retain physical failrealm identities.
//
//     +---------------------------------+
// +-->|              NORMAL             |
// |   | I/I/I                           |------------------------------+
// |   | D: 1+1+1                        |                              |
// |   | W: 1+1+1 OR 2+2                 |                              |
// |   | E: 1+1+1 OR 2+2                 |                              |
// |   +---------------------------------+                              |
// |                                                                    |
// |                                                                    |
// |                                                                    |
// |                                                                    v
// |   +---------------------------------+             +----------------+----------------+                     +---------------------------------+             +---------------------------------+
// +<--|           DC_RECOVERY           |<----------->|            DC_FAILURE           |-------------------->|         DC_SOLO_DISASTER        |<----------->|         DC_SOLO_RECOVERY        |
// |   | I/I/R                           |             | I/I/X                           |                     | I/X/X                           |             | I/R/X                           |
// |   | D: 1+1+1                        |             | D: 0                            |                     | D: 0                            |             | D: 1                            |
// |   | W: 1+1+1 OR 2+2                 |             | W: 2+2                          |                     | W: 2                            |             | W: 2                            |
// |   | E: 1+1 OR 2                     |<---+        | E: 1+1 OR 2                     |    +--------------->| E: 0                            |             | E: 0                            |
// |   +---------------------------------+    |        +----------------+----------------+    |                +---------------------------------+             +----------------+----------------+
// |                                          |                         |                     |                                                                                 |
// |                                          |                         |                     |                                                                                 |
// |                                          |                         v                     |                                                                                 v
// |                                          |        +----------------+----------------+    |                                                                +----------------+----------------+
// |                                          |        |     DC_FAILURE_INV1_PENDING     |    |                                                                |  DC_SOLO_RECOVERY_INV1_PENDING  |
// |                                          |        | I/I/X                           |    |                                                                | I/R/X                           |
// |                                          +--------| D: 1+1                          |----+                                                         +----->| D: 1                            |
// |                                                   | W: 2+2                          |                                                              |      | W: 2                            |
// |                                                   | E: 1+1 OR 2                     |                                                              |      | E: 1                            |
// |                                                   +----------------+----------------+                                                              |      +----------------+----------------+
// |                                                                    |                                                                               |                       |
// |                                                                    |                                                                               |                       |
// |                                                                    |                                                                               |                       |
// |                                                                    v                                                                               |                       v
// |   +---------------------------------+             +----------------+----------------+                     +---------------------------------+      |      +----------------+----------------+
// +<--|         DC_RECOVERY_INV1        |<----------->|         DC_FAILURE_INV1         |-------------------->|           DC_SOLO_INV1          |      |      |      DC_SOLO_RECOVERY_INV1      |
//     | I/I/R                           |             | I/I/X                           |                     | I/X/X                           |<-----+      | I/R/X                           |
//     | D: 1+1+1                        |<-----+      | D: 1+1                          |                     | D: 1                            |      |      | D: 1+1                          |
//     | W: 1+1+1 OR 2+2                 |      |      | W: 2+2                          |                +--->| W: 2                            |<-----=------| W: 2+2                          |
//     | E: 1+1                          |      |      | E: 1+1                          |<------+        |    | E: 1                            |      |      | E: 1                            |---------+
//     +---------------------------------+      |      +----------------+-------+--------+       |        |    +----------------+----------------+      |      +---------------------------------+         |
//                                              |                       ^                        |        |                     ^                       |                                                  |
//                                              |                       |                        |        |                     |                       |                                                  |
//                                              |                       |                        +--------=---------------------=-----------------------=--------------------------------------------------+
//                                              |                       |                                 |                     |                       |                                                  |
//                                              |                       v                                 |                     v                       |                                                  |
//                                              |      +----------------+----------------+                |    +----------------+----------------+      |      +---------------------------------+         |
//                                              |      |     DC_FAILURE_INV2_PENDING     |                |    |       DC_SOLO_INV2_PENDING      |      |      |  DC_SOLO_RECOVERY_INV2_PENDING  |         |
//                                              |      | I/I/X                           |                |    | I/X/X                           |      |      | I/R/X                           |         |
//                                              +------| D: 2+2                          |----------------+    | D: 2                            |------+      | D: 1+1                          |         |
//                                              |      | W: 2+2                          |                     | W: 2                            |             | W: 2                            |         |
//                                              |      | E: 1+1                          |                     | E: 1                            |         +-->| E: 2                            |         |
//                                              |      +----------------+----------------+                     +----------------+----------------+         |   +----------------+----------------+         |
//                                              |                       |                                                       |                          |                    |                          |
//                                              |                       |                                                       |                          |                    |                          |
//                                              |                       |                                                       |                          |                    |                          |
//                                              |                       v                                                       v                          |                    v                          |
//                                              |      +----------------+----------------+                     +----------------+----------------+         |   +----------------+----------------+         |
//                                              +------|         DC_FAILURE_INV2         |-------------------->|           DC_SOLO_INV2          |         |   |      DC_SOLO_RECOVERY_INV2      |         |
//                                                     | I/I/X                           |                     | I/X/X                           |<--------+   | I/R/X                           |         |
//                                                     | D: 2+2                          |                     | D: 2                            |<------------| D: 1+1                          |         |
//                                                     | W: 2+2                          |                     | W: 2                            |             | W: 2+2                          |         |
//                                                     | E: 2+2                          |                     | E: 2                            |             | E: 2                            |---------+
//                                                     +---------------------------------+                     +---------------------------------+             +---------------------------------+
//
//
// + marks turns/junctions; = is a crossing WITHOUT a connection.
// Internal progress may change I/X/R, D and E without an administrator action.
// A transition arrow does not itself replicate data; target guarantees must be established.
//
// Persisted and published with the group generation. Numeric values are wire-stable.
message TGroupState {
    enum EState {
        NORMAL = 0;                                 // I/I/I.

        DC_FAILURE = 1;                             // I/I/X.
        DC_FAILURE_INV1_PENDING = 12;               // I/I/X.
        DC_FAILURE_INV1 = 2;                        // I/I/X.
        DC_FAILURE_INV2_PENDING = 13;               // I/I/X.
        DC_FAILURE_INV2 = 3;                        // I/I/X.

        DC_RECOVERY = 4;                            // I/I/R.
        DC_RECOVERY_INV1 = 5;                       // I/I/R.

        DC_SOLO_DISASTER = 6;                       // I/X/X.
        DC_SOLO_INV1 = 7;                           // I/X/X.
        DC_SOLO_INV2_PENDING = 14;                  // I/X/X.
        DC_SOLO_INV2 = 8;                           // I/X/X.

        DC_SOLO_RECOVERY = 9;                       // I/R/X.
        DC_SOLO_RECOVERY_INV1_PENDING = 15;         // I/R/X.
        DC_SOLO_RECOVERY_INV1 = 10;                 // I/R/X.
        DC_SOLO_RECOVERY_INV2_PENDING = 16;         // I/R/X.
        DC_SOLO_RECOVERY_INV2 = 11;                 // I/R/X.
    }
}

// Physical datacenter role; copy guarantees belong to TGroupState.
message TDataCenterState {
    enum EState {
        INCLUDED = 0;
        RECOVERING = 1;
        EXCLUDED = 2;
    }
}
