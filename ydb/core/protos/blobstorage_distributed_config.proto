syntax = "proto3";

import "ydb/core/protos/config.proto";
import "ydb/core/protos/blobstorage_base.proto";
import "ydb/core/protos/blobstorage_disk.proto";
import "ydb/core/protos/bridge.proto";
import "ydb/library/actors/protos/actors.proto";
import "ydb/library/actors/protos/interconnect.proto";
import "ydb/public/api/protos/annotations/sensitive.proto";

package NKikimrBlobStorage;

message TNodeIdentifier {
    string Host = 1;
    uint32 Port = 2;
    uint32 NodeId = 3;
    NActorsInterconnect.TNodeLocation Location = 4;
}

message TStorageConfigMeta {
    uint64 Generation = 1;
    bytes Fingerprint = 2;
}

message TStorageConfig { // contents of storage metadata
    uint64 Generation = 1; // stored generation
    bytes Fingerprint = 2; // hash for config validation (must be the same for all nodes with the same Generation)
    NKikimrConfig.TBlobStorageConfig BlobStorageConfig = 3; // NodeWardenServiceSet for static group is inside
    NKikimrConfig.TStateStorageConfig StateStorageConfig = 9;
    NKikimrConfig.TStateStorageConfig StateStorageBoardConfig = 10;
    NKikimrConfig.TStateStorageConfig SchemeBoardConfig = 11;
    repeated TNodeIdentifier AllNodes = 5; // set of all known nodes
    string ClusterUUID = 6; // cluster GUID as provided in nameservice config
    string SelfAssemblyUUID = 7; // self-assembly UUID generated when config is first created
    optional bytes ConfigComposite = 12; // compressed stored storage config YAML (if stored)
    NKikimrConfig.TSelfManagementConfig SelfManagementConfig = 13;
    TStorageConfig PrevConfig = 100; // previous version of StorageConfig (if any)
    optional bytes CompressedStorageYaml = 14; // compressed storage YAML config (if dual-config is enabled)
    optional uint64 ExpectedStorageYamlVersion = 15;
    NKikimrBridge.TClusterState ClusterState = 16; // for bridged clusters; not set for ordinary ones
    NKikimrBridge.TClusterStateDetails ClusterStateDetails = 17; // history of unsynced state changes
}

message TPDiskMetadataRecord {
    TStorageConfig CommittedStorageConfig = 1; // currently active storage config
    TStorageConfig ProposedStorageConfig = 2; // proposed storage config
}

message TCacheUpdate {
    message TKeyValuePair {
        string Key = 1; // unique cache item key
        uint32 Generation = 2; // generation of the key: Value may only change with increasing generation
        optional bytes Value = 3; // updated value; when not set, this item is considered to be deleted
    }

    repeated TKeyValuePair KeyValuePairs = 1;
    repeated string RequestedKeys = 2;
}

// Attach sender node to the recipient one; if already bound, then just update configuration.
message TEvNodeConfigPush {
    message TBoundNode {
        TNodeIdentifier NodeId = 1;
        TStorageConfigMeta Meta = 2;
    }
    bool Initial = 1; // set to true if this push is initial connection establishment
    repeated TBoundNode BoundNodes = 2; // a list of bound node updates (including itself)
    repeated TNodeIdentifier DeletedBoundNodeIds = 3; // a list of detached nodes
    TCacheUpdate CacheUpdate = 4;
    reserved 5;
    optional uint32 SubtreeHeight = 6;
    optional uint64 RequestedCommittedConfigGeneration = 7;
    optional bool SupportsMetadataOnlyCollect = 8;
}

// Used to reverse-propagate configuration and to confirm/reject initial TEvNodePushBinding query.
message TEvNodeConfigReversePush {
    uint32 RootNodeId = 1; // current tree root as known by the sender, always nonzero
    bool Rejected = 2; // is the request rejected due to cyclic graph?
    TStorageConfig CommittedStorageConfig = 3; // last known committed storage configuration
    reserved 4;
    TCacheUpdate CacheUpdate = 5;
    reserved 6;
    optional bool SupportsDirectRootQueries = 7; // QueryWorkingRoot bypasses the root operation queue
}

// Remove node from bound list.
message TEvNodeConfigUnbind {
}

// Propagate query to the tree bottom and collect replies.
message TEvNodeConfigScatter {
    message TCollectConfigs {
        bool MetadataOnly = 1;
    }

    message TProposeStorageConfig {
        TStorageConfig Config = 1;
    }

    message TDemandRetroTrace {
        repeated NActorsProto.TTraceId TraceId = 1;
    }

    message TCollectBridgeCapability {
    }

    optional uint64 Cookie = 1;
    optional fixed64 TaskId = 4; // random (and not necessarily unique) identifier
    optional bool Targeted = 5; // set when issuing updates to newly added nodes
    optional uint64 TimeoutUs = 8;

    oneof Request {
        TCollectConfigs CollectConfigs = 2;
        TProposeStorageConfig ProposeStorageConfig = 3;
        TDemandRetroTrace DemandRetroTrace = 6;
        TCollectBridgeCapability CollectBridgeCapability = 7;
    }
}

// Collected replies from the bottom.
message TEvNodeConfigGather {
    message TCollectConfigs {
        message TNode {
            repeated TNodeIdentifier NodeIds = 1; // nodes with the same config
            TStorageConfig BaseConfig = 2; // config from config.yaml
        }
        message TDiskIdentifier {
            TNodeIdentifier NodeId = 1;
            string Path = 2;
            optional fixed64 Guid = 3;
        }
        message TPersistentConfig {
            repeated TDiskIdentifier Disks = 1; // disks with the same config
            TStorageConfig Config = 2;
        }
        repeated TNode Nodes = 1;
        repeated TPersistentConfig CommittedConfigs = 2;
        repeated TPersistentConfig ProposedConfigs = 3;
        repeated TDiskIdentifier NoMetadata = 4;
        repeated TDiskIdentifier Errors = 5;
        bool MetadataOnly = 6;
    }

    message TProposeStorageConfig {
        enum EStatus {
            UNKNOWN = 0;
            ACCEPTED = 1;
            HAVE_NEWER_GENERATION = 2;
            RACE = 3;
            ERROR = 4;
            NO_STORAGE = 5; // nowhere to store configuration to
        }
        message TStatus {
            TNodeIdentifier NodeId = 1;
            EStatus Status = 2;
            string Reason = 3;

            message TDrive {
                string Path = 1;
                optional fixed64 Guid = 2;
            }
            reserved 4;
            repeated TDrive SuccessfulDrives = 5;
        }
        repeated TStatus Status = 1;
    }

    message TDemandRetroTrace {
    }

    message TCollectBridgeCapability {
        repeated uint32 CapableNodeIds = 1; // nodes running with BridgeConfig (static ones and their dynamic subscribers)
        repeated uint32 NotCapableNodeIds = 2; // nodes running without BridgeConfig
        repeated uint32 PileListChangeCapableNodeIds = 3; // nodes supporting changes of the list of piles
        message TFeatureLevel {
            uint32 NodeId = 1;
            uint32 Level = 2;
        }
        repeated TFeatureLevel FeatureLevels = 4; // bridge feature levels reported by nodes (absent for older versions)
    }

    optional uint64 Cookie = 1;
    optional bool Aborted = 4;

    oneof Response {
        TCollectConfigs CollectConfigs = 2;
        TProposeStorageConfig ProposeStorageConfig = 3;
        TDemandRetroTrace DemandRetroTrace = 5;
        TCollectBridgeCapability CollectBridgeCapability = 6;
    }
}

message TStateStorageConfig {
    message TNodeState {
        optional uint32 NodeId = 1;
        optional uint32 State = 2;
        optional string Location = 3;
    }
    optional NKikimrConfig.TStateStorageConfig StateStorageConfig = 1;
    optional NKikimrConfig.TStateStorageConfig StateStorageBoardConfig = 2;
    optional NKikimrConfig.TStateStorageConfig SchemeBoardConfig = 3;
    repeated TNodeState NodesState = 4;
}

// Some kind of RPC -- this event can be sent to any NW, it will forward the request to root node.
message TEvNodeConfigInvokeOnRoot {
    message TUpdateConfig {
        TStorageConfig Config = 1;
    }

    message TQueryConfig {
        // Recollect persistent configs before replying; ignored by older roots.
        bool RequireFresh = 1;
        uint32 RefillNodeId = 2;
    }

    // Return a scepter only for a local root with a configured static group.
    // Do not forward or wait for root operations.
    message TQueryWorkingRoot
    {}

    message TValidateTargetedProposition {
        TStorageConfigMeta Config = 1;
        uint64 ScatterCookie = 2;
        fixed64 TaskId = 3;
    }

    message TReassignGroupDisk {
        NKikimrBlobStorage.TVDiskID VDiskId = 1; // which one to reassign
        optional NKikimrBlobStorage.TPDiskId PDiskId = 2; // where to put it (optional)
        bool ConvertToDonor = 3; // convert the current disk to donor?
        bool IgnoreGroupFailModelChecks = 4;
        bool IgnoreDegradedGroupsChecks = 5;
        bool IgnoreVSlotQuotaCheck = 6;
        bool IsSelfHealReasonDecommit = 7;
        bool FromSelfHeal = 8;
        bool AllowUnusableDisks = 9;
        bool SettleOnlyOnOperationalDisks = 10;
        // Placement policies forwarded to the static-group allocator.
        bool PreferLessOccupiedRack = 11;
        bool WithAttentionToReplication = 12;
        bool UseSelfHealLocalPolicy = 13;
        bool TryToRelocateBrokenDisksLocallyFirst = 14;
        // Allow reassignment to leave the group with an incorrect physical layout.
        bool IgnoreGroupLayoutChecks = 15;
    }

    // Regenerate configuration so the slain VDisk is no more reported as DESTROY one in the list.
    message TStaticVDiskSlain {
        NKikimrBlobStorage.TVDiskID VDiskId = 1;
        NKikimrBlobStorage.TVSlotId VSlotId = 2;
    }

    message TDropDonor {
        NKikimrBlobStorage.TVDiskID VDiskId = 1;
        NKikimrBlobStorage.TVSlotId VSlotId = 2;
    }

    message TReassignStateStorageNode {
        uint32 From = 1;
        uint32 To = 2; // or zero to pick up automatically
        bool StateStorage = 3;
        bool StateStorageBoard = 4;
        bool SchemeBoard = 5;
        optional bool DisableRing = 6;
    }

    message TGetStateStorageConfig {
        optional bool Recommended = 1;
        optional bool PileupReplicas = 2;
        optional bool NodesState = 3;
        optional uint32 OverrideReplicasInRingCount = 4;
        optional uint32 OverrideRingsCount = 5;
        optional uint32 ReplicasSpecificVolume = 6;
    }

    message TSelfHealStateStorage {
        optional uint32 WaitForConfigStep = 1;
        optional bool ForceHeal = 2;
        optional bool PileupReplicas = 3;
        optional uint32 OverrideReplicasInRingCount = 4;
        optional uint32 OverrideRingsCount = 5;
        optional uint32 ReplicasSpecificVolume = 6;
    }

    message TSelfHealNodesStateUpdate {
        message TNodeState {
            optional uint32 NodeId = 1;
            optional uint32 State = 2;
        }
        optional bool EnableSelfHealStateStorage = 1;
        optional uint32 WaitForConfigStep = 2;
        repeated TNodeState NodesState = 3;
        optional bool PileupReplicas = 4;
        optional uint32 OverrideReplicasInRingCount = 5;
        optional uint32 OverrideRingsCount = 6;
        optional uint32 ReplicasSpecificVolume = 7;
    }

    message TAdvanceGeneration
    {}

    message TFetchStorageConfig {
        reserved 1;
        bool MainConfig = 2;
        bool StorageConfig = 3;
        bool AddSectionsForMigrationToV1 = 5; // add sections so this config becomes suitable for migration to v1
        bool AddExplicitConfigs = 4; // add explicit settings for all managed entities
        repeated string RequestorHost = 6;
        uint32 RequestorPort = 7;
    }

    message TReplaceStorageConfig {
        optional string YAML = 1;
        optional string StorageYAML = 3;
        optional bool SwitchDedicatedStorageSection = 4;
        bool DedicatedStorageSectionConfigMode = 5;
        bool SkipConsoleValidation = 2;
        optional bytes UserToken = 6 [(Ydb.sensitive) = true];
        optional string PeerName = 7;
        bool DryRun = 8;
        bool AllowUnknownFields = 9;
    }

    message TBootstrapCluster {
        string SelfAssemblyUUID = 1;
        bool AllowUnknownFields = 2;
    }

    message TSwitchBridgeClusterState {
        NKikimrBridge.TClusterState NewClusterState = 1;
        repeated uint32 SpecificBridgePileIds = 2; // obtain quorum only for specific pile set
    }

    message TNotifyBridgeSyncFinished {
        uint64 Generation = 1; // generation matching ClusterState's one
        uint32 BridgePileId = 2; // which bridge pile is marked synchronized
        oneof Entity {
            bool BSC = 3;
        }
    }

    message TUpdateBridgeGroupInfo {
        uint32 GroupId = 1;
        uint32 GroupGeneration = 2;
        NKikimrBlobStorage.TGroupInfo BridgeGroupInfo = 3;
    }

    message TNotifyBridgeSuspended {
        uint64 Generation = 1; // generation matching ClusterState's one
        uint32 PileId = 2; // pile to convert from SUSPENDED to DISCONNECTED
    }

    message TDescendCommittedStorageConfig {
        TStorageConfig CommittedStorageConfig = 1;
    }

    message TDemandRetroTrace {
        repeated NActorsProto.TTraceId TraceId = 1;
    }

    // Convert ordinary (not bridged) cluster into the single-pile bridged one: set up ClusterState and turn static
    // groups into inline piles; groups managed by BSC are converted by BSC itself afterwards.
    message TConvertToBridge {
        // existing pools and groups managed by BSC are left non-bridged (they may be converted one by one later), and
        // non-uniform storage gets activated along with the conversion; BridgeConfig must enable it then
        bool SkipStoragePoolConversion = 1;
    }

    // Sent by BSC when it has converted all of its groups into bridged ones (and no groups remain that can't be
    // converted yet); clears ClusterStateDetails.BscConversionPending flag.
    message TNotifyBscConversionFinished {
    }

    // Add INACTIVE pile to the cluster: allocate its parts of static groups and state storage, make it DISCONNECTED,
    // then BSC adds its parts to the groups it manages; the pile may be rejoined when the operation is finished.
    message TAddBridgePile {
        string PileName = 1;
    }

    // Remove the DISCONNECTED pile from the cluster, deleting its parts of every storage group with the data; the pile
    // becomes INACTIVE then.
    message TRemoveBridgePile {
        string PileName = 1;
    }

    // Sent by BSC when it has performed its part of pending pile operation, or has failed to do so (then it retries).
    message TNotifyBridgePileOperation {
        uint32 BridgePileId = 1;
        optional string ErrorReason = 2; // set on failure
        NKikimrBridge.TClusterStateDetails.TPendingPileOperation.EKind Kind = 3;
        uint64 OperationId = 4; // the one of the pending operation BSC has performed its part of
    }

    oneof Request {
        TUpdateConfig UpdateConfig = 1;
        TQueryConfig QueryConfig = 2;
        TReassignGroupDisk ReassignGroupDisk = 3;
        TStaticVDiskSlain StaticVDiskSlain = 4;
        TDropDonor DropDonor = 5;
        TReassignStateStorageNode ReassignStateStorageNode = 6;
        TAdvanceGeneration AdvanceGeneration = 7;
        TFetchStorageConfig FetchStorageConfig = 8;
        TReplaceStorageConfig ReplaceStorageConfig = 9;
        TBootstrapCluster BootstrapCluster = 10;
        TSwitchBridgeClusterState SwitchBridgeClusterState = 11;
        TStateStorageConfig ReconfigStateStorage = 12;
        TGetStateStorageConfig GetStateStorageConfig = 13;
        TNotifyBridgeSyncFinished NotifyBridgeSyncFinished = 14;
        TSelfHealStateStorage SelfHealStateStorage = 15;
        TSelfHealNodesStateUpdate SelfHealNodesStateUpdate = 19;
        TUpdateBridgeGroupInfo UpdateBridgeGroupInfo = 20;
        TNotifyBridgeSuspended NotifyBridgeSuspended = 21;
        TDescendCommittedStorageConfig DescendCommittedStorageConfig = 22;
        TDemandRetroTrace DemandRetroTrace = 23;
        TQueryWorkingRoot QueryWorkingRoot = 24;
        TConvertToBridge ConvertToBridge = 25;
        TNotifyBscConversionFinished NotifyBscConversionFinished = 26;
        TValidateTargetedProposition ValidateTargetedProposition = 27;
        TAddBridgePile AddBridgePile = 28;
        TNotifyBridgePileOperation NotifyBridgePileOperation = 29;
        TRemoveBridgePile RemoveBridgePile = 30;
    }
}

// Result of RPC invocation.
message TEvNodeConfigInvokeOnRootResult {
    enum EStatus {
        OK = 0; // request fulfilled successfully
        NO_QUORUM = 1; // root node did not have quorum of following nodes
        ERROR = 2; // failure during request execution
        RACE = 3; // race in requests with other entities
        CONTINUE_BSC = 4; // process this request with BSC
    }

    message TScepter {
        uint64 Id = 1;
        uint32 NodeId = 2;
    }

    message TQueryConfig {
        TStorageConfig Config = 1;
        // Confirms that this root honored RequireFresh.
        bool Fresh = 2;
    }

    message TFetchStorageConfig {
        optional string YAML = 1;
        optional string StorageYAML = 2;
        bool Transient = 3;
    }

    message TReplaceStorageConfig {
        optional bool AllowEnablingDistconf = 1;
    }

    message TReassignGroupDisk {
        NKikimrBlobStorage.TVSlotId SourceSlotId = 1;
        NKikimrBlobStorage.TVSlotId TargetSlotId = 2;
    }

    message TValidateTargetedProposition {
        bool Confirmed = 1;
    }

    EStatus Status = 1;
    optional string ErrorReason = 2;
    TScepter Scepter = 3;

    reserved 4, 6, 7, 8, 9;

    oneof Response {
        TQueryConfig QueryConfig = 5;
        TFetchStorageConfig FetchStorageConfig = 10;
        TReplaceStorageConfig ReplaceStorageConfig = 11;
        TStateStorageConfig StateStorageConfig = 12;
        TReassignGroupDisk ReassignGroupDisk = 13;
        TValidateTargetedProposition ValidateTargetedProposition = 14;
    }
}

message TEvNodeWardenDynamicConfigSubscribe {
    bool BridgeCapable = 1; // dynamic node runs with BridgeConfig
    bool PileListChangeCapable = 2; // dynamic node supports changes of the list of piles
    uint32 BridgeFeatureLevel = 3; // bridge features supported by the dynamic node (absent for older versions)
}

message TEvNodeWardenDynamicConfigPush {
    TStorageConfig Config = 1;
    bool NoQuorum = 2;
    TCacheUpdate CacheUpdate = 3;
}

message TConnectivityPayload {
    TStorageConfig StorageConfig = 1; // storage config of a sender
    optional uint32 BridgePileId = 2; // bridge pile id of a sender
    TStorageConfig CommittedStorageConfig = 3; // committed version of storage config
    optional string BridgePileName = 4; // bridge pile name of a sender (if its location has one)
    bool PileListChangeCapable = 5; // sender takes pile ids from pile registry, not from positions in BridgeConfig
    uint32 BridgeFeatureLevel = 6; // bridge features supported by the sender (absent for older versions)
}

// Ask CMS/Sentinel for a fresh SelfHealNodesStateUpdate. Sentinel replies only
// after collecting enough observations to classify every configured node.
message TEvNodeConfigGetSelfHealState {
}
