syntax = "proto3";

package NKikimrBridge;

import "ydb/public/api/protos/draft/ydb_bridge.proto";
import "ydb/public/api/protos/ydb_status_codes.proto";

// A read-only controller request. All observations are derived from existing bridge state.
message TStorageQuery {
    enum EView {
        VIEW_UNSPECIFIED = 0;
        PILES = 1;
        DATABASES = 2;
        GROUPS = 3;
    }
    EView View = 1;
    optional string StoragePool = 2;
    optional string PileName = 3;
    bool NotSynced = 4; // incomplete database summaries only
    repeated string PoolNames = 7;
    bool FilterPools = 8;
    Ydb.Bridge.StoragePoolId StoragePoolId = 9;
    repeated Ydb.Bridge.SynchronizationStatus Statuses = 10;
    optional Ydb.Bridge.StorageMode StorageMode = 11;
}

message TStorageState {
    message TOwner {
        uint32 RowIndex = 1;
        uint64 OwnerSchemeShardId = 2;
        uint64 OwnerPathId = 3;
    }
    Ydb.StatusIds.StatusCode Status = 1;
    string ErrorMessage = 2;
    oneof Result {
        Ydb.Bridge.ListPileSynchronizationResult Piles = 3;
        Ydb.Bridge.ListDatabaseSynchronizationResult Databases = 4;
        Ydb.Bridge.ListGroupSynchronizationResult Groups = 5;
    }
    repeated TOwner Owners = 6;
}
