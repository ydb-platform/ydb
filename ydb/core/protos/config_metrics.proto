package NKikimrConfig;
option java_package = "ru.yandex.kikimr.proto";

message TCommonLatencyHistBounds {
    repeated double Rot = 1;
    repeated double Ssd = 2;
    repeated double Nvme = 3;
}

message TMetricsConfig {
    optional TCommonLatencyHistBounds CommonLatencyHistBounds = 1;
    // Tablet executor/app counters publication period; values below 1 are clamped to 1.
    optional uint32 TabletCountersUpdateIntervalSeconds = 2 [default = 15];
}
