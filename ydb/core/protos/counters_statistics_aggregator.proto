import "ydb/core/protos/counters.proto";

package NKikimr.NStat;

option java_package = "ru.yandex.kikimr.proto";

option (TabletTypeName) = "StatisticsAggregator";

enum ETxTypes {
    TXTYPE_INIT_SCHEMA = 0         [(TxTypeOpts) = {Name: "TxInitSchema"}];
    TXTYPE_INIT = 1                [(TxTypeOpts) = {Name: "TxInit"}];
    TXTYPE_CONFIGURE = 2           [(TxTypeOpts) = {Name: "TxConfigure"}];
    TXTYPE_SCHEMESHARD_STATS = 3   [(TxTypeOpts) = {Name: "TxSchemeShardStats"}];
    TXTYPE_ANALYZE_TABLE = 4       [(TxTypeOpts) = {Name: "TxAnalyzeTable"}];
    TXTYPE_NAVIGATE_DEPRECATED = 5 [deprecated = true];
    TXTYPE_RESOLVE_DEPRECATED = 6  [deprecated = true];
    TXTYPE_SCAN_RESPONSE_DEPRECATED = 7       [deprecated = true];
    TXTYPE_FINISH_TRAVERSAL = 8 [(TxTypeOpts) = {Name: "TxFinishTraversak"}];
    TXTYPE_SCHEDULE_TRAVERSAL = 9  [(TxTypeOpts) = {Name: "TxScheduleTraversal"}];
    TXTYPE_AGGR_STAT_RESPONSE_DEPRECATED = 10 [deprecated = true];
    TXTYPE_RESPONSE_TABLET_DISTRIBUTION_DEPRECATED = 11 [deprecated = true];
    TXTYPE_ACK_TIMEOUT_DEPRECATED = 12        [deprecated = true];
    TXTYPE_ANALYZE_SHARD_REQUEST_DEPRECATED = 13 [deprecated = true];
    TXTYPE_ANALYZE_SHARD_RESPONSE_DEPRECATED = 14 [deprecated = true];
    TXTYPE_ANALYZE_SHARD_DELIVERY_PROBLEM_DEPRECATED = 15 [deprecated = true];
    TXTYPE_ANALYZE_DEADLINE = 16 [(TxTypeOpts) = {Name: "TTxAnalyzeDeadline"}];
    TXTYPE_ANALYZE_OP_LIST = 17  [(TxTypeOpts) = {Name: "TTxAnalyzeOpList"}];
    TXTYPE_ANALYZE_OP_GET = 18   [(TxTypeOpts) = {Name: "TTxAnalyzeOpGet"}];
    TXTYPE_ANALYZE_OP_CANCEL = 19 [(TxTypeOpts) = {Name: "TTxAnalyzeOpCancel"}];
    TXTYPE_ANALYZE_OP_FORGET = 20 [(TxTypeOpts) = {Name: "TTxAnalyzeOpForget"}];
}

enum ESimpleCounters {
    COUNTER_FORCE_TRAVERSALS_INFLIGHT_SIZE = 0      [(CounterOpts) = {Name: "ForceTraversalsInflightSize"}];
    COUNTER_AGGREGATION_TIME_DEPRECATED = 1         [deprecated = true];
    COUNTER_FORCE_TRAVERSAL_INFLIGHT_MAX_TIME = 2   [(CounterOpts) = {Name: "ForceTraversalsInflightMaxTime"}];
    COUNTER_BASE_STATISTICS_TOTAL_ROW_COUNT = 3   [(CounterOpts) = {Name: "BaseStatisticsTotalRowCount"}];
    COUNTER_BASE_STATISTICS_TOTAL_BYTES_SIZE = 4   [(CounterOpts) = {Name: "BaseStatisticsTotalBytesSize"}];
}

enum ECumulativeCounters {
    COUNTER_CUMULATIVE_IGNORE = 0;
}

enum EPercentileCounters {
    option (GlobalCounterOpts) = {
        Ranges { Value: 0 Name: "0 ms" }
        Ranges { Value: 1 Name: "1 ms" }
    };

    COUNTER_PERCENTILE_IGNORE = 0;
}
