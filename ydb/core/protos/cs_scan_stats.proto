syntax = "proto3";

package NColumnShard;

message TStepColumn {
    uint32 Id = 1;
    string Name = 2;
}

message TReserveMemoryStepDetails {
    message TStage {
        uint32 Stage = 1;
        repeated string MemoryTypes = 2;
    }

    repeated TStage Stages = 1;
    optional uint64 RequestedBytes = 2;
}

message TFetchColumnsStepDetails {
    repeated TStepColumn Columns = 1;
}

message TAssembleStepDetails {
    repeated TStepColumn Columns = 1;
}

message TPKFilterDetails {
    repeated TStepColumn Columns = 1;
    repeated string Predicates = 2;
}

message TShardingFilterStepDetails {
    repeated TStepColumn Columns = 1;
}

message TDeletionFilterStepDetails {
    repeated TStepColumn Columns = 1;
}

message TSnapshotFilterStepDetails {
    message TSnapshot {
        uint64 PlanStep = 1;
        uint64 TxId = 2;
    }

    repeated TSnapshot Snapshots = 1;
}

message TLimitStepDetails {
    message TLimit {
        uint64 Limit = 1;
        bool Reverse = 2;
    }

    repeated TLimit Limits = 1;
}

message TPrepareResultStepDetails {
    repeated bool StartResultBuildingInplace = 1;
}

message TBuildResultStepDetails {
    message TPageBounds {
        uint64 MinStartIndex = 1;
        uint64 MaxStartIndex = 2;
        uint64 MinRecordsCount = 3;
        uint64 MaxRecordsCount = 4;
    }

    TPageBounds PageBounds = 1;
}

message TStepMeasurementCounters {
    uint64 Sum = 1;
    // Count is zero when there were no measurements.
    uint64 Count = 2;
}

message TStepStatisticsCounters {
    uint64 Calls = 1;
    uint64 ActiveTimeUs = 2;
    uint64 WaitTimeUs = 3;
    TStepMeasurementCounters InputRows = 4;
    TStepMeasurementCounters OutputRows = 5;
    TStepMeasurementCounters InputBytes = 6;
    TStepMeasurementCounters OutputBytes = 7;
    TStepMeasurementCounters ReadBytes = 8;
}

message TStepCounters {
    string Name = 1;
    TStepStatisticsCounters Statistics = 2;

    oneof Details {
        TReserveMemoryStepDetails ReserveMemory = 3;
        TFetchColumnsStepDetails FetchColumns = 4;
        TAssembleStepDetails Assemble = 5;
        TPKFilterDetails PKFilter = 6;
        TShardingFilterStepDetails ShardingFilter = 7;
        TDeletionFilterStepDetails DeletionFilter = 8;
        TSnapshotFilterStepDetails SnapshotFilter = 9;
        TLimitStepDetails Limit = 10;
        TPrepareResultStepDetails PrepareResult = 11;
        TBuildResultStepDetails BuildResult = 12;
    }
}

message TScanStats {
    uint64 TabletId = 1;
    uint64 ScanId = 2;
    uint32 Generation = 3;
    // Entries retain their positions in the fetching script.
    repeated TStepCounters Steps = 4;
}
