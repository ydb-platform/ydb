syntax = "proto2";

package NKikimrHnsw;

import "ydb/public/api/protos/ydb_table.proto";

// All transfers are scoped to a tablet incarnation and an immutable generation.
message TChunkRequest {
    optional string Key = 1;
    optional uint64 Offset = 2;
}

message TChunkResponse {
    optional string Key = 1;
    optional uint64 Offset = 2;
    optional uint64 TotalBytes = 3;
    optional bytes Data = 4;
    optional string Error = 5;
}

message TSnapshotRequest {
    optional uint64 TableOwnerId = 1;
    optional uint64 TablePathId = 2;
    optional uint64 SchemaVersion = 3;
    optional uint64 RequestId = 4;
    optional uint32 FormatVersion = 5;
}

message TSnapshotResponse {
    optional uint64 RequestId = 1;
    optional uint64 TablePathId = 2;
    optional uint64 SchemaVersion = 3;
    optional uint32 VectorColumnTag = 4;
    optional string GraphKey = 5;
    optional string JournalKey = 6;
    optional uint32 SourceNodeId = 7;
    optional Ydb.Table.VectorIndexSettings Settings = 8;
    optional uint64 BaseStep = 9;
    optional uint64 BaseTxId = 10;
    optional uint32 LeaderGeneration = 11;
    optional uint32 CheckpointStep = 12;
    optional uint64 RowCount = 13;
    optional uint64 GraphMemoryBytes = 14;
    optional uint64 JournalMemoryBytes = 15;
    optional bool NotRequired = 16;
    optional string Error = 17;
    optional uint32 FormatVersion = 18;
}

message TStatusRequest {
    optional uint64 TableOwnerId = 1;
    optional uint64 TablePathId = 2;
    optional uint64 SchemaVersion = 3;
    optional uint64 TargetStep = 4;
    optional uint64 TargetTxId = 5;
}

message TGraphAnnouncement {
    optional uint64 TableOwnerId = 1;
    optional uint64 TablePathId = 2;
    optional uint64 SchemaVersion = 3;
    optional uint32 LeaderGeneration = 4;
    optional uint64 BaseStep = 5;
    optional uint64 BaseTxId = 6;
}

message TStatusResponse {
    optional uint64 TabletId = 1;
    optional uint32 FollowerId = 2;
    optional uint32 LeaderGeneration = 3;
    optional uint64 SchemaVersion = 4;
    optional uint64 ReadStep = 5;
    optional uint64 ReadTxId = 6;
    optional bool Ready = 7;
    optional bool Repeatable = 8;
    optional bool NotRequired = 9;
    optional string GraphKey = 10;
}

message TReplicaProbeResult {
    message TCheckpoint {
        optional uint64 TabletId = 1;
        optional uint32 LeaderGeneration = 2;
        optional uint64 Step = 3;
        optional uint64 TxId = 4;
    }
    optional uint64 OperationTxId = 1;
    optional uint32 OperationPartId = 2;
    optional uint64 Round = 3;
    optional bool Ready = 4;
    repeated uint64 Tablets = 5;
    repeated TCheckpoint Checkpoints = 6;
}
