syntax = "proto3";
option cc_enable_arenas = true;

package NKqpProto;
option java_package = "ru.yandex.kikimr.proto";

import "ydb/public/api/protos/annotations/sensitive.proto";

message TDqSourceKikimrLookupSource {
    string Path = 1;
    string Token = 2 [(Ydb.sensitive) = true];
    string Database = 3;
}
