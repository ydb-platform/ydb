package NKikimrConfig;
option java_package = "ru.yandex.kikimr.proto";

message TMemoryControllerConfig {
    optional uint64 HardLimitBytes = 1;

    optional float SoftLimitPercent = 2 [default = 75];
    optional uint64 SoftLimitBytes = 3;

    optional float TargetUtilizationPercent = 4 [default = 50];
    optional uint64 TargetUtilizationBytes = 5;

    optional float ActivitiesLimitPercent = 6 [default = 30];
    optional uint64 ActivitiesLimitBytes = 7;

    optional float SharedCacheMinPercent = 100 [default = 20];
    optional uint64 SharedCacheMinBytes = 101;
    optional float SharedCacheMaxPercent = 102 [default = 50];
    optional uint64 SharedCacheMaxBytes = 103;

    optional float MemTableMinPercent = 110 [default = 1];
    optional uint64 MemTableMinBytes = 111;
    optional float MemTableMaxPercent = 112 [default = 3];
    optional uint64 MemTableMaxBytes = 113;

    optional float QueryExecutionLimitPercent = 120 [default = 20];
    optional uint64 QueryExecutionLimitBytes = 121;

    optional float CompactionLimitPercent = 130 [default = 10];
    optional uint64 CompactionLimitBytes = 131;

    // Budget against AnonRss (minus slack for allocator caches) when it exceeds AllocatedMemory,
    // so caches do not grow into memory the allocator still holds.
    optional bool RssAwareBudget = 140 [default = false];
    optional uint64 RssBudgetSlackBytes = 141 [default = 536870912];
    // Release allocator caches to the OS in the same tick when AnonRss exceeds the soft limit.
    optional bool ReleaseAllocatorCachesOnPressure = 142 [default = false];
    // Smallest release request: a smaller one is served by the allocator's huge page cache alone.
    optional uint64 MinAllocatorCachesReleaseBytes = 143 [default = 67108864];
    // Largest release request of a single tick: the allocator releases synchronously.
    optional uint64 MaxAllocatorCachesReleaseBytes = 144 [default = 268435456];
}
