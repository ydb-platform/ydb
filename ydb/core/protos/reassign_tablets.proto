import "ydb/public/api/protos/ydb_issue_message.proto";
import "ydb/public/api/protos/ydb_status_codes.proto";

package NKikimrReassignTablets;
option java_package = "ru.yandex.kikimr.proto";

message TEvCreateRequest {
    optional string StoragePool = 1;
    optional uint32 MaxInFlight = 2 [default = 1];
    optional uint32 Percent = 3 [default = 100];
    optional bool Async = 4 [default = false];
    optional string UserSID = 5;
    optional uint32 GroupId = 6 [default = 0];
}

message TEvCreateResponse {
    optional Ydb.StatusIds.StatusCode Status = 1;
    repeated Ydb.Issue.IssueMessage Issues = 2;
    optional uint64 SelectedTablets = 3;
    optional uint64 ReassignId = 4;
    optional uint64 HiveGeneration = 5;
}

message TEvGetRequest {
    optional uint64 ReassignId = 1;
    optional uint64 HiveGeneration = 2;
}

message TEvGetResponse {
    optional Ydb.StatusIds.StatusCode Status = 1;
    repeated Ydb.Issue.IssueMessage Issues = 2;
    optional bool Ready = 3;
    optional bool Cancelled = 4;
    optional uint64 SelectedTablets = 5;
    optional uint64 CompletedTablets = 6;
}

message TEvCancelRequest {
    optional uint64 ReassignId = 1;
    optional uint64 HiveGeneration = 2;
    optional string UserSID = 3;
}

message TEvCancelResponse {
    optional Ydb.StatusIds.StatusCode Status = 1;
    repeated Ydb.Issue.IssueMessage Issues = 2;
}
