import "ydb/core/protos/counters_schemeshard.proto";

package NKikimrConfig;
option java_package = "ru.yandex.kikimr.proto";

message TSchemeShardConfig {
    message TInFlightCounterConfig {
        optional NKikimr.NSchemeShard.ESimpleCounters Type = 1;
        // after this amount scheme shard begin to abort the operations
        // to disable set to 0
        optional uint32 InFlightLimit = 2 [default = 10000];
    }
    // after this amount of time we forcibly write full stats to local DB
    // to disable set to 0
    optional uint32 StatsBatchTimeoutMs = 1 [default = 100];

    // number of shards stats to batch together
    // to disable set to 0
    optional uint32 StatsMaxBatchSize = 2 [default = 100];

    optional uint32 StatsMaxExecuteMs = 3 [default = 10];

    repeated TInFlightCounterConfig InFlightCounterConfig = 4;

    // number of shards per table
    optional uint32 MaxCdcInitialScanShardsInFlight = 5 [default = 32];

    // number of shards per table
    // 0 means default - NKikimrIndexBuilder.TIndexBuildSettings.max_shards_in_flight
    optional uint32 MaxRestoreBuildIndexShardsInFlight = 6 [default = 1000];

    // number of shards per table
    // database level default for TTL mechanics
    // 0 means no limit
    optional uint32 MaxTTLShardsInFlight = 7 [default = 0];

    // number of conditional erase responses to batch together
    // 0 disables batching (processes each response immediately via non-batch path)
    // 1 processes each response immediately via batch path (not recommended)
    optional uint32 CondEraseResponseBatchSize = 8 [default = 100];

    // maximum time to hold an incomplete conditional erase response batch before processing
    optional uint32 CondEraseResponseBatchMaxTimeMs = 9 [default = 100];

    // maximum allowed parallelism (PARALLEL=) for non-restore index build operations
    optional uint32 MaxBuildIndexShardsInFlight = 10 [default = 1000];

    // maximum recent index build operations to maintain (older ones are removed)
    optional uint32 MaxStoredIndexBuilds = 11 [default = 1000];

    // Maximum CPU time share for automatic split/merge operations (0.01 to 1.0).
    // Limits the fraction of SchemeShard main thread time that can be spent
    // on split/merge decisions during stats processing.
    // Default 0.7 = split/merge can use up to 70% of CPU time.
    // Set to 1.0 to disable throttling (allow unlimited CPU usage).
    // Note: This controls CPU budgeting only. To disable split-by-load, use
    // SplitByLoadEnabled. Forced split-by-size cannot be disabled (safety mechanism).
    // Example: with 0.7, if idle for 10 seconds, can burst up to 0.7 seconds of work,
    // but sustained load is limited to 70% average.
    optional double SplitMergeMaxCpuUsageShare = 12 [default = 0.7];

    // Time window for split/merge CPU budget accumulation in milliseconds.
    // Smaller values = more responsive to bursts but less smooth.
    // Larger values = smoother averaging but slower response.
    // Default 1000ms = budget accumulates over 1 second window.
    // With default 0.7 share and 1000ms window: can accumulate up to 700ms of CPU budget.
    // Advanced tuning only - most users should keep default.
    optional uint64 SplitMergeCpuBudgetWindowMs = 13 [default = 1000];
}
