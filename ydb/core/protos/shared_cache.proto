package NKikimrSharedCache;
option java_package = "ru.yandex.kikimr.proto";

enum TReplacementPolicy {
    ThreeLeveledLRU = 0;
    S3FIFO = 1;
    ClockPro = 2;
}

message TSharedCacheConfig {
    optional uint64 MemoryLimit = 1;
    optional uint64 ScanQueueInFlyLimit = 2 [default = 536870912];
    optional uint64 AsyncQueueInFlyLimit = 3 [default = 536870912];
    optional uint32 ActivePagesReservationPercent = 4 [default = 50];
    reserved 5;
    optional TReplacementPolicy ReplacementPolicy = 6 [default = S3FIFO]; // deprecated, always S3FIFO
    reserved 7;
    optional uint64 InMemoryInFlyLimit = 8 [default = 536870912];
    optional uint64 MaxLimitDecreaseStepBytes = 9 [default = 10485760];
    // Maximum fraction of the SharedCache limit available to TryKeepInMemory pages.
    // Must be finite and in [0, 1]: 0 disables this tier, 1 allows the whole cache.
    // Reductions are applied incrementally using MaxLimitDecreaseStepBytes.
    optional double TryKeepInMemoryMaxRatio = 10 [default = 1.0];
}
