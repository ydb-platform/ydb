syntax = "proto2";

package NKikimrIamDelegation;

// Incarnation is an opaque, immutable, globally unique database incarnation ID.
// The provisioning service must never reuse it, including after path reuse.
message TDatabaseIdentity {
    optional string Incarnation = 1;
    optional string Path = 2;
    optional string DatabaseId = 3;
}

message TDatabaseRecord {
    optional TDatabaseIdentity Identity = 1;
    optional uint64 InventoryRevision = 2;
}

message TRegisterDatabaseRequest {
    optional TDatabaseIdentity Identity = 1;
}

message TServiceKey {
    optional string Endpoint = 1;
    optional string ServiceId = 2;
    optional string MicroserviceId = 3;
    optional string SystemTokenName = 4;
    optional string ResourceType = 5;
}

message TServiceBackoffState {
    optional uint64 Version = 1;
    optional uint32 Iteration = 2;
    optional uint64 NextAllowedAtUs = 3;
}

enum EServiceHealth {
    SERVICE_HEALTH_UNSPECIFIED = 0;
    SERVICE_HEALTHY = 1;
    SERVICE_UNAVAILABLE = 2;
    SERVICE_CREDENTIALS_REJECTED = 3;
}

enum EServiceGateDisposition {
    SERVICE_GATE_UNSPECIFIED = 0;
    SERVICE_OBSERVED = 1;
    SERVICE_ADMITTED = 2;
    SERVICE_WAIT = 3;
    SERVICE_UPDATED = 4;
    SERVICE_STALE = 5;
}

message TCheckServiceRequest {
    optional TServiceKey Key = 1;
    optional uint64 ExpectedVersion = 2;
    optional uint64 RequestTimeoutUs = 3;
}

message TReportServiceRequest {
    optional TServiceKey Key = 1;
    optional uint64 Version = 2;
    optional EServiceHealth Health = 3;
}

message TServiceGateResult {
    optional TServiceBackoffState State = 1;
    optional EServiceGateDisposition Disposition = 2;
    // Allows clients to translate the remaining wait without comparing node clocks.
    optional uint64 ServerNowUs = 3;
}

message TRequest {
    oneof Command {
        TRegisterDatabaseRequest RegisterDatabase = 1;
        TCheckServiceRequest CheckService = 32;
        TReportServiceRequest ReportService = 33;
    }
}

enum EStatus {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    INVALID_ARGUMENT = 2;
    NOT_FOUND = 3;
    CONFLICT = 4;
    PRECONDITION_FAILED = 5;
}

message TResponse {
    optional EStatus Status = 1;
    optional string Error = 2;
    optional TDatabaseRecord Database = 3;
    optional TServiceGateResult ServiceGate = 32;
}
