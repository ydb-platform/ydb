# Соответствует по смыслу `processors.ydb_supplier` из:
#   arcadia/kikimr/ci/stability/resources/ydb_olap_perf/collector.yaml
#
# Запуск: otel_logs_to_ydb --config /path/to/this/file
#
# Отличия от Go-коллектора (v1 C++):
# - OTLP только gRPC (HTTP :8090 из collector здесь не поднимается).
# - `additional_dbs` у dedicated_service не поддерживается — для `processing`
#   ниже только основной YDB из ydb_endpoint/ydb_database.
# - `max_inflight_requests` / `max_memory_usage` приёмника → ориентир `ingest_queue_max`.
# - `buffer_size` коллектора → `ingest_queue_max`; запись в YDB — отдельные `ydb_flush_workers`
#   + `flush_queue_max` (ingest workers только parse/route, без BulkUpsert RPC).

otel_logs_to_ydb:
  # Было: receivers.otlpwithyandexvalidation.protocols.grpc.endpoint :8080
  grpc_listen: "0.0.0.0:8080"
  grpc_max_pollers: 1024

  # Было: receivers... max_inflight_requests / buffer_size (см. комментарий выше)
  ingest_queue_max: 1000
  ingest_workers: 64
  # Optional stall watchdog (0 = off). See METRICS_PARITY.md.
  # ingest_stall_watchdog_sec: 120
  # ingest_stall_watchdog_poll_sec: 15
  # Shard flush chunks → YDB writers (0 = same as ydb_max_concurrent_bulk).
  flush_queue_max: 2000
  # When flush queue is full: drop chunk (true) vs return rows to shard buffer (false, grows RAM).
  flush_queue_drop_on_full: true
  ydb_flush_workers: 0
  export_routable_wire_precheck: false
  # Stage A experiment: wire → TOwnedLogRow (no protobuf tree). Compare CPU / pipeline_in vs Arena parse.
  ingest_wire_to_owned: true
  # false: AnyValue → NJson::TJsonValue → string (legacy). true: nested map/array → NJsonWriter → string.
  ingest_streaming_json_serializer: true
  # Shadow: LabelsKv/MetaKv → Arrow struct in labels/meta columns; encode+IPC to sink (prod BulkUpsert unchanged).
  wide_arrow_kv_benchmark: false
  wide_arrow_kv_benchmark_sink: "/dev/null"

  # Было: extensions.logging_bootstrap.user_metrics_listen_address :8890
  # и service.telemetry.metrics.address 0.0.0.0:9999 — для Prometheus оставлен один порт;
  # при необходимости поменяйте на :8890 как в logging_bootstrap.
  metrics_listen: "0.0.0.0:9999"

  # Было: extensions.health_check
  health_listen: "0.0.0.0:8081"
  health_path: /ping

  # ydb_endpoint: "vla5-7716.search.yandex.net:2135"
  # ydb_database: "/Root/db1"
  # ydb_tables_prefix: "/Root/db1"

  ydb_endpoint: "localhost:2135"
  ydb_database: "/olap-perf/deploy_logs"
  ydb_tables_prefix: "/olap-perf/deploy_logs"
  ydb_token: "${env:YDB_TOKEN}"

  ydb_write_timeout_sec: 120
  ydb_max_concurrent_bulk: 256
  supplier_pool_size: 256

  table_layout: per_service
  write_only_dedicated: false

  allowed_projects:
    - techplatform

  ydb_common_logs_dir: "logs_store"
  ydb_dedicated_logs_dir: "logs"

  batch_by_shard_hash: true
  # XOR: только одно из min_flush_records / min_flush_bytes (не оба).
  # Батч уходит в YDB при накоплении порога ИЛИ если не было успешной записи по шарду `flush_interval` секунд.
  # shard_buffer_min_flush_records: 5000
  # Flush when ApproxBytes >= threshold; each flush chunk is capped at threshold * (1 + overshoot%/100).
  shard_buffer_min_flush_bytes: 50331648 # 83886080 # 52428800 # 16777216
  shard_buffer_flush_max_overshoot_percent: 10
  shard_buffer_flush_interval_sec: 600
  # Размазать time-flush по шардам: у каждого bucket свой интервал в [interval-jitter, interval+jitter] (хеш bucket).
  shard_buffer_flush_interval_jitter_sec: 300

  auto_create_missing_tables: true
  auto_create_partition_count_common: 24
  auto_create_partition_count_dedicated: 48

  ttl:
    delete_interval: "360h"
    external:
      path: /olap-perf/deploy_logs/s3/tier
      interval: "25h"

  logs_column_compression:
    timestamp:
      algorithm: zstd
      level: 1
    record_id:
      algorithm: zstd
      level: 1
    batch_id:
      algorithm: zstd
      level: 1
    message:
      algorithm: zstd
      level: 4
    labels:
      algorithm: zstd
      level: 4
    meta:
      algorithm: zstd
      level: 4

  compaction:
    features_json: '{"levels":[{"class_name":"Zero","expected_blobs_size":2097152,"portions_count_limit":15000000,"portions_live_duration":"3600s","concurrency":1,"compaction_task_memory_limit":67108864},{"class_name":"Zero","expected_blobs_size":4194304,"portions_count_limit":15000000,"concurrency":1,"compaction_task_memory_limit":67108864}],"node_portions_count_limit":15000000}'

  project_routing:
    techplatform:
      base_table_name: common
      dedicated_service:
      - cluster: production
        service: billing-fin-payouts
      - cluster: production
        service: candidates
      - cluster: production
        service: processing
      - cluster: production
        service: stq-agent
      - cluster: production
        service: api-proxy-critical
      - cluster: production
        service: billing-docs-x
      - cluster: production
        service: billing-platform-functions
      - cluster: production
        service: billing-wallet
      - cluster: production
        service: cardstorage
      - cluster: production
        service: client-notify
      - cluster: production
        service: exp3-matcher
      - cluster: production
        service: transactions-stq
      - cluster: testing
        service: stq-agent


  max_retries: 3
  retry_backoff_ms: 200
  validation_enabled: false

  # Debug: save first N raw ExportLogsServiceRequest bodies (one file per gRPC Export).
  # Files: {dir}/export_0000000.pb — parse with protobuf ExportLogsServiceRequest.
  # capture_export_requests_max: 1000
  # capture_export_requests_dir: /tmp/otel_logs_export_capture

  ydb_common_logs_dir_batch_id: "logs2_store"
  ydb_dedicated_logs_dir_batch_id: "logs2"

  batch_id_services:
    - processing