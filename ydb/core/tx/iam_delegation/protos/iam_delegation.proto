syntax = "proto2";

package NKikimrIamDelegation;

// Incarnation is an opaque, immutable, globally unique database incarnation ID.
// The provisioning service must never reuse it, including after path reuse.
message TDatabaseIdentity {
    optional string Incarnation = 1;
    optional string Path = 2;
    optional string DatabaseId = 3;
}

message TSecretIdentity {
    optional string DatabaseIncarnation = 1;
    optional uint64 PathOwnerId = 2;
    optional uint64 PathLocalId = 3;
}

enum EReferencePolicy {
    REFERENCE_POLICY_UNSPECIFIED = 0;
    WITHOUT_REFERENCES = 1;
    WITH_REFERENCES = 2;
}

message TIamBinding {
    optional string ServiceAccountId = 1;
    optional string CloudId = 2;
    optional string ResourceType = 3;
    optional string ReferrerId = 4;
    optional string ReferrerType = 5;
    optional string ServiceId = 6;
    optional string MicroserviceId = 7;
    optional EReferencePolicy ReferencePolicy = 8;
}

enum ESetupState {
    SETUP_STATE_UNSPECIFIED = 0;
    SETUP_NOT_STARTED = 1;
    SETUP_STARTED = 2;
    SETUP_UNKNOWN = 3;
    SETUP_SUCCEEDED = 4;
    SETUP_FAILED = 5;
}

enum EDelegationState {
    DELEGATION_STATE_UNSPECIFIED = 0;
    PENDING = 1;
    ACTIVE = 2;
    WAITING_SETUP = 3;
    REVOCATION_PENDING = 4;
    REVOKING = 5;
    REVOKED = 6;
    CANCELLED = 7;
}

message TClaim {
    optional uint64 Generation = 1;
    optional uint64 Attempt = 2;
    optional string WorkerId = 3;
    optional uint64 DeadlineUs = 4;
}

message TDelegation {
    optional string OperationId = 1;
    optional string DatabaseIncarnation = 2;
    optional string SecretPath = 3;
    optional uint64 CreateTxId = 4;
    optional TSecretIdentity Secret = 5;
    optional TIamBinding Binding = 6;
    optional uint64 Revision = 7;
    optional ESetupState SetupState = 8;
    optional EDelegationState State = 9;
    optional string SetupOperationId = 10;
    optional string RevokeOperationId = 11;
    optional uint64 ActivatedRevision = 12;
    optional TClaim Claim = 13;
    optional uint64 DueAtUs = 14;
}

enum ESecretState {
    SECRET_STATE_UNSPECIFIED = 0;
    SECRET_LIVE = 1;
    SECRET_DROPPED = 2;
}

message TSecretRecord {
    optional TSecretIdentity Identity = 1;
    optional string SecretPath = 2;
    optional uint64 CreateTxId = 3;
    optional uint64 Revision = 4;
    optional string CurrentOperationId = 5;
    optional string PendingOperationId = 6;
    optional ESecretState State = 7;
    optional string CreateOperationId = 8;
}

message TDatabaseRecord {
    optional TDatabaseIdentity Identity = 1;
    optional uint64 InventoryRevision = 2;
}

message TRegisterDatabaseRequest {
    optional TDatabaseIdentity Identity = 1;
}

enum EStageMode {
    STAGE_MODE_UNSPECIFIED = 0;
    CREATE = 1;
    ALTER = 2;
}

message TStageRequest {
    optional EStageMode Mode = 1;
    // Globally unique idempotency key; retained permanently in this first slice.
    optional string OperationId = 2;
    optional string DatabaseIncarnation = 3;
    optional string SecretPath = 4;
    optional uint64 CreateTxId = 5;
    optional TSecretIdentity Secret = 6;
    optional uint64 ExpectedSecretRevision = 7;
    optional TIamBinding Binding = 8;
}

message TBindSecretRequest {
    optional string OperationId = 1;
    optional uint64 ExpectedRevision = 2;
    optional TSecretIdentity Secret = 3;
}

message TStartSetupRequest {
    optional string OperationId = 1;
    optional uint64 ExpectedRevision = 2;
}

message TSetSetupResultRequest {
    optional string OperationId = 1;
    optional uint64 ExpectedRevision = 2;
    // Only UNKNOWN, SUCCEEDED and FAILED are accepted as outcomes.
    optional ESetupState Outcome = 3;
    optional string SetupOperationId = 4;
}

message TPromoteRequest {
    optional string OperationId = 1;
    optional uint64 ExpectedRevision = 2;
    optional uint64 ExpectedSecretRevision = 3;
}

message TDropSecretRequest {
    // OperationId is exclusively for an unbound CREATE; once bound, use Secret.
    oneof Target {
        TSecretIdentity Secret = 1;
        string OperationId = 2;
    }
    // Secret revision for Secret, delegation revision for OperationId.
    optional uint64 ExpectedRevision = 3;
}

message TGetSecretRequest {
    optional TSecretIdentity Secret = 1;
}

message TGetDelegationRequest {
    optional string OperationId = 1;
}

message TClaimRevocationsRequest {
    optional string WorkerId = 1;
    optional uint32 Limit = 2;
    optional uint64 LeaseUs = 3;
}

enum ERevokeOutcome {
    REVOKE_OUTCOME_UNSPECIFIED = 0;
    REVOKE_SUCCEEDED = 1;
    REVOKE_RETRY = 2;
}

message TFinishRevocationRequest {
    optional string OperationId = 1;
    optional TClaim Claim = 2;
    optional ERevokeOutcome Outcome = 3;
    optional string RevokeOperationId = 4;
    optional uint64 RetryAfterUs = 5;
}

message TRequest {
    oneof Command {
        TRegisterDatabaseRequest RegisterDatabase = 1;
        TStageRequest Stage = 2;
        TBindSecretRequest BindSecret = 3;
        TStartSetupRequest StartSetup = 4;
        TSetSetupResultRequest SetSetupResult = 5;
        TPromoteRequest Promote = 6;
        TDropSecretRequest DropSecret = 7;
        TGetSecretRequest GetSecret = 8;
        TGetDelegationRequest GetDelegation = 9;
        TClaimRevocationsRequest ClaimRevocations = 11;
        TFinishRevocationRequest FinishRevocation = 12;
    }
}

enum EStatus {
    STATUS_UNSPECIFIED = 0;
    SUCCESS = 1;
    INVALID_ARGUMENT = 2;
    NOT_FOUND = 3;
    CONFLICT = 4;
    PRECONDITION_FAILED = 5;
    STALE_CLAIM = 6;
}

message TResponse {
    optional EStatus Status = 1;
    optional string Error = 2;
    optional TDatabaseRecord Database = 3;
    optional TSecretRecord Secret = 4;
    optional TDelegation Delegation = 5;
    repeated TDelegation Delegations = 6;
}
