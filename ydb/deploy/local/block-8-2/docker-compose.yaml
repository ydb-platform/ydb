      "image": "${BLOCK82_IMAGE:?Run build-image.sh first}",
      "restart": "unless-stopped",
      "stop_grace_period": "60s",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "20m",
          "max-file": "3"
        }
      },
      "ulimits": {
        "nofile": {
          "soft": 65536,
          "hard": 65536
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "/fixture/control.py",
          "ping"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 60,
        "start_period": "60s"
      },
      "hostname": "storage-1",
      "command": [
        "storage",
        "1"
      ],
      "volumes": [
        "pdisk-1:/data"
      ],
      "mem_limit": "6g",
      "ports": [
        "127.0.0.1:8765:8765"
      ]
