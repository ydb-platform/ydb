# New clusters only: all YDB processes must run a version supporting block-8-2.
# 8 data + 2 parity + 2 handoff VDisks in 12 independent failure domains.
# StateStorage membership is independent of BlobStorage geometry.
erasure: block-8-2
host_configs:
- host_config_id: 1
  drive:
  - path: /dev/disk/by-partlabel/ydb_disk_ssd_01
  - path: /dev/disk/by-partlabel/ydb_disk_ssd_02
hosts:
- host: ydb-node-zone-a-1.local
  host_config_id: 1
- host: ydb-node-zone-a-2.local
  host_config_id: 1
- host: ydb-node-zone-a-3.local
  host_config_id: 1
- host: ydb-node-zone-a-4.local
  host_config_id: 1
- host: ydb-node-zone-a-5.local
  host_config_id: 1
- host: ydb-node-zone-a-6.local
  host_config_id: 1
- host: ydb-node-zone-a-7.local
  host_config_id: 1
- host: ydb-node-zone-a-8.local
  host_config_id: 1
- host: ydb-node-zone-a-9.local
  host_config_id: 1
- host: ydb-node-zone-a-10.local
  host_config_id: 1
- host: ydb-node-zone-a-11.local
  host_config_id: 1
- host: ydb-node-zone-a-12.local
  host_config_id: 1
domains_config:
  domain:
  - name: Root
    storage_pool_types:
    - kind: ssd
      pool_config:
        kind: ssd
        box_id: 1
        pdisk_filter:
        - property:
          - type: SSD
  state_storage:
  - ring:
      node:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      nto_select: 5
    ssid: 1
security_config:
  default_users:
  - name: root
    password: '1234'
blob_storage_config:
  service_set:
    groups:
    - rings:
      - fail_domains:
        - vdisk_locations:
          - node_id: ydb-node-zone-a-1.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-2.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-3.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-4.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-5.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-6.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-7.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-8.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-9.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-10.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-11.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
        - vdisk_locations:
          - node_id: ydb-node-zone-a-12.local
            pdisk_category: SSD
            path: /dev/disk/by-partlabel/ydb_disk_ssd_01
channel_profile_config:
  profile:
  - channel:
    - erasure_species: block-8-2
      pdisk_category: 1
      storage_pool_kind: ssd
    - erasure_species: block-8-2
      pdisk_category: 1
      storage_pool_kind: ssd
    - erasure_species: block-8-2
      pdisk_category: 1
      storage_pool_kind: ssd
    profile_id: 0
tls:
  cert: /opt/ydb/certs/node.crt
  key: /opt/ydb/certs/node.key
  ca: /opt/ydb/certs/ca.crt
grpc_config:
  services_enabled:
  - legacy
