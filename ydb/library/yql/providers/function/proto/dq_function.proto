syntax = "proto3";
option cc_enable_arenas = true;

package NYql.NProto;

message TFunctionTransform {
  string InvokeUrl = 1;
  // Absent in legacy plans: use the executor's configured default.
  optional uint32 BatchSize = 2;
  // Preserve an opaque host-only row payload alongside each service result.
  bool EnrichRows = 3;
}
