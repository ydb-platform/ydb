syntax = "proto2";
option cc_enable_arenas = true;

package NYql.NYdbRemote;

import "ydb/public/api/protos/ydb_value.proto";

message TColumn {
    optional string Name = 1;
    optional Ydb.Type Type = 2;
}

// This payload contains only the secure parameter name, never credentials.
message TSource {
    optional uint32 Version = 1;
    optional string Endpoint = 2;
    optional string Database = 3;
    optional string Table = 4;
    optional string Token = 5;
    optional bool UseTls = 6;
    repeated TColumn Columns = 7;
    optional uint32 ReadTimeoutMs = 8 [default = 60000];
    optional uint32 MaxBatchBytes = 9 [default = 1048576];
    optional uint32 MaxRetries = 10 [default = 2];
}
