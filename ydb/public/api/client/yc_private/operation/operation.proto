syntax = "proto3";

package ydb.yc.priv.operation;

// Wire-compatible copy of yandex.cloud.priv.operation.Operation. The package
// is intentionally YDB-local because another vendored API already owns the
// canonical package name; protobuf wire compatibility depends on field
// numbers and types, which are preserved below.
// Canonical source:
// https://bb.yandexcloud.net/projects/CLOUD/repos/cloud-go/browse/private-api/yandex/cloud/priv/operation/operation.proto

import "google/protobuf/any.proto";
import "google/rpc/status.proto";
import "google/protobuf/timestamp.proto";

message Operation {
  string id = 1;
  string description = 2; // ex: Create VM, Stop VM, Delete Disk, Snapshot Disk, etc
  google.protobuf.Timestamp created_at = 3;
  string created_by = 4;
  google.protobuf.Timestamp modified_at = 5;

  bool done = 6;

  google.protobuf.Any metadata = 7;

  oneof result {
    google.rpc.Status error = 8; // for error and cancellation
    google.protobuf.Any response = 9; // for 'Create/Update' should contain entity
  }
}
