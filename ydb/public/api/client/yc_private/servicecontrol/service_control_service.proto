syntax = "proto3";

package yandex.cloud.priv.servicecontrol.v1;

import "ydb/public/api/client/yc_private/operation/operation.proto";
import "ydb/public/api/client/yc_private/servicecontrol/resource.proto";

// Private Service Control API used by services that manage resource-access
// delegation. This copy intentionally contains only the lifecycle surface YDB
// consumes.
service ServiceControlService {
  rpc EnsureEnabled(EnsureEnabledRequest) returns (.ydb.yc.priv.operation.Operation);
  rpc SetupDelegation(SetupDelegationRequest) returns (.ydb.yc.priv.operation.Operation);
  rpc RevokeDelegation(RevokeDelegationRequest) returns (.ydb.yc.priv.operation.Operation);
}

message EnsureEnabledRequest {
  repeated string service_ids = 1;
  Resource resource = 2;
}

message SetupDelegationRequest {
  string service_id = 1;
  string microservice_id = 2;
  Resource resource = 3;
  string target_service_account_id = 4;
  Resource referrer = 5;
  string on_behalf_of_subject_id = 6;
  bool with_references = 7;
}

message RevokeDelegationRequest {
  string service_id = 1;
  string microservice_id = 2;
  Resource resource = 3;
  string target_service_account_id = 4;
  Resource referrer = 5;
  bool with_references = 6;
}
