syntax = "proto3";

package envoy.service.endpoint.v3;

// Avoid registering a second descriptor for this service in applications that
// also link the complete Envoy API.
option optimize_for = LITE_RUNTIME;

import "ydb/public/api/grpc/draft/xds/wire/discovery.proto";

// The canonical xDS v3 gRPC method lets an existing YDB listener serve a
// state-of-the-world endpoint subscription for one database.
service EndpointDiscoveryService {
    rpc StreamEndpoints(stream Ydb.Xds.DiscoveryRequest) returns (stream Ydb.Xds.DiscoveryResponse);
}
