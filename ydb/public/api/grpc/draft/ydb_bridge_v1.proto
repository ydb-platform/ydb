syntax = "proto3";

package Ydb.Bridge.V1;

option java_package = "com.yandex.ydb.bridge.v1";
option java_outer_classname = "BridgeGrpc";
option java_multiple_files = true;

import "ydb/public/api/protos/draft/ydb_bridge.proto";

// Service for managing cluster in bridge mode
service BridgeService {

    // Change bridge mode of the specified database.
    rpc SetDatabaseBridgeMode(Ydb.Bridge.SetDatabaseBridgeModeRequest) returns (Ydb.Bridge.SetDatabaseBridgeModeResponse);

    // Get current cluster state
    // Useful for monitoring and decision-making before state changes
    rpc GetClusterState(Ydb.Bridge.GetClusterStateRequest) returns (Ydb.Bridge.GetClusterStateResponse);

    // List per-pile database synchronization counters.
    rpc ListPileSynchronization(Ydb.Bridge.ListPileSynchronizationRequest) returns (Ydb.Bridge.ListPileSynchronizationResponse);

    // List synchronization summaries by storage-owning database and pile.
    rpc ListDatabaseSynchronization(Ydb.Bridge.ListDatabaseSynchronizationRequest) returns (Ydb.Bridge.ListDatabaseSynchronizationResponse);

    // List all group synchronization, optionally restricted to a database or storage pool.
    rpc ListGroupSynchronization(Ydb.Bridge.ListGroupSynchronizationRequest) returns (Ydb.Bridge.ListGroupSynchronizationResponse);

    // Update cluster state by providing a list of desired pile states
    // This is the main operation for failover and promotion scenarios
    rpc UpdateClusterState(Ydb.Bridge.UpdateClusterStateRequest) returns (Ydb.Bridge.UpdateClusterStateResponse);

    // Convert a running non-bridged cluster into a bridged one with a single pile
    rpc ConvertToBridge(Ydb.Bridge.ConvertToBridgeRequest) returns (Ydb.Bridge.ConvertToBridgeResponse);

    // Add an INACTIVE pile to the cluster, so that it can be rejoined then
    rpc AddPile(Ydb.Bridge.AddPileRequest) returns (Ydb.Bridge.AddPileResponse);

    // Remove a DISCONNECTED pile from the cluster along with all its data, so that it becomes INACTIVE
    rpc RemovePile(Ydb.Bridge.RemovePileRequest) returns (Ydb.Bridge.RemovePileResponse);

    // Report how far the rollback of a cluster prepared for bridge mode back to ordinary mode has gone
    rpc GetRollbackStatus(Ydb.Bridge.GetRollbackStatusRequest) returns (Ydb.Bridge.GetRollbackStatusResponse);

    // Roll a cluster converted from an ordinary one back to it, while it has the only pile, the original one
    rpc Rollback(Ydb.Bridge.RollbackRequest) returns (Ydb.Bridge.RollbackResponse);

}
