syntax = "proto3";

import "ydb/public/api/protos/draft/ydb_replication.proto";

package Ydb.Replication.V1;
option java_package = "com.yandex.ydb.replication.v1";

service ReplicationService {
    rpc DescribeReplication(Replication.DescribeReplicationRequest) returns (Replication.DescribeReplicationResponse);
    rpc DescribeTransfer(Replication.DescribeTransferRequest) returns (Replication.DescribeTransferResponse);

    // Internal protocol for replication controllers. Not intended for application use.
    rpc StreamChecksumTablesInternal(Replication.StreamChecksumTablesInternalRequest) returns (stream Replication.StreamChecksumTablesInternalResponse);
}
