syntax = "proto3";

package Ydb.Secret.V1;
option java_package = "com.yandex.ydb.secret.v1";

import "ydb/public/api/protos/ydb_secret.proto";

service SecretService {
    // Publish current secret values to a topic.
    rpc ExportSecrets(Secret.ExportSecretsRequest) returns (Secret.ExportSecretsResponse);

    // Describe secret command.
    rpc DescribeSecret(Secret.DescribeSecretRequest) returns (Secret.DescribeSecretResponse);
}
