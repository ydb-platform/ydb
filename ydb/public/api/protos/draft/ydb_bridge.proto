syntax = "proto3";
option cc_enable_arenas = true;

package Ydb.Bridge;

option java_package = "com.yandex.ydb.bridge.proto";
option java_outer_classname = "BridgeProtos";
option java_multiple_files = true;

import "ydb/public/api/protos/annotations/validation.proto";
import "ydb/public/api/protos/ydb_bridge_common.proto";
import "ydb/public/api/protos/ydb_operation.proto"; 
import "google/protobuf/timestamp.proto";

// Atomically change bridge mode of the selected database.
// Requires administrator privileges and non-uniform storage; data synchronization and cleanup continue in the background.
message SetDatabaseBridgeModeRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    optional bool bridge_mode = 2; // Required: true for bridged storage, false for ordinary storage.
    // With bridge_mode=false, retain data copies in this pile. Empty selects copies automatically.
    string retain_pile_name = 3;
    // Required absolute path of the target database.
    string database_path = 4;
}

message SetDatabaseBridgeModeResponse {
    Ydb.Operations.Operation operation = 1;
}

message SetDatabaseBridgeModeResult {}

message GetClusterStateRequest {
    Ydb.Operations.OperationParams operation_params = 1;

    // Also query static-node connectivity, without requiring BSC or tablets.
    // An older node in the forwarding path may reject this optional query.
    bool include_pile_connectivity = 2;
}

message GetClusterStateResponse {
    Ydb.Operations.Operation operation = 1;
}

message GetClusterStateResult {
    // Current cluster state
    repeated PileState pile_states = 1;
    // Generation of the cluster state
    uint64 generation = 2;
    // Set after the cluster has been converted from a non-bridged one, until all its storage groups are converted
    // too; no piles can be added to the cluster meanwhile
    bool conversion_in_progress = 3;
    // Operation changing the set of piles of the cluster that is not finished yet
    optional PendingPileOperation pending_pile_operation = 4;
    optional PileConnectivityReport pile_connectivity = 5;
}

// Bridge synchronization is observed independently of the committed pile states.
// These methods require cluster administrator privileges. Each request reads the
// current controller state; the result is a diagnostic observation.
// Lists are returned in full. A request that exceeds the diagnostic size or work
// budget fails with PRECONDITION_FAILED; narrow the database, pool, pile or status filter.
message ListPileSynchronizationRequest {
    Ydb.Operations.OperationParams operation_params = 1;
}

message ListPileSynchronizationResponse {
    Ydb.Operations.Operation operation = 1;
}

message ListPileSynchronizationResult {
    repeated PileSynchronization piles = 1;
    uint64 cluster_state_generation = 2;
    google.protobuf.Timestamp observed_at = 3;
    // Pools lacking a complete storage-owner ID. They are excluded from database counts.
    uint64 unattributed_storage_pools = 4;
}

message ListDatabaseSynchronizationRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    // Optional absolute database path. Serverless databases select their shared storage.
    optional string database_path = 2;
    // When set, select only rows attributed to this pile. An empty name is valid.
    optional string pile_name = 3;
    // Required groups whose synchronization is not confirmed, including UNKNOWN.
    // Ordinary storage and zero required groups do not match.
    bool only_incomplete = 4;
    // Optional policy filter, applied after combining all pools of an owner.
    // Supported values: BRIDGED, ORDINARY, MIXED.
    optional StorageMode storage_mode = 5;
}

message ListDatabaseSynchronizationResponse {
    Ydb.Operations.Operation operation = 1;
}

message ListDatabaseSynchronizationResult {
    // Storage-owner summaries, not an inventory of all logical databases.
    repeated DatabaseSynchronization databases = 1;
    uint64 cluster_state_generation = 2;
    google.protobuf.Timestamp observed_at = 3;
    // Resolved owner of a selected database, including an empty filtered result.
    optional string storage_owner_database_path = 4;
}

message ListGroupSynchronizationRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    // Absent scope selects all groups, including groups outside dynamic pools.
    // Explicit paths/names must be nonempty. Pool names must be unique;
    // use its ID when names are ambiguous. The ID is independent of pool renames.
    oneof scope {
        string database_path = 2;
        string storage_pool_name = 3;
        StoragePoolId storage_pool_id = 4;
    }
    // Absent means all placements. Present-empty selects the pile named "".
    optional string pile_name = 5;
    // Empty means all statuses; otherwise OR. Order and duplicates do not matter.
    // UNSPECIFIED and unsupported values are rejected.
    repeated SynchronizationStatus statuses = 6;
}

message ListGroupSynchronizationResponse {
    Ydb.Operations.Operation operation = 1;
}

message ListGroupSynchronizationResult {
    repeated GroupSynchronization groups = 1;
    uint64 cluster_state_generation = 2;
    google.protobuf.Timestamp observed_at = 3;
    optional string storage_owner_database_path = 4;
}

// Concrete pool identity. Names are display labels and may be ambiguous.
message StoragePoolId {
    uint64 box_id = 1;
    // Must be nonzero; box_id may be zero.
    uint64 pool_id = 2;
}

message StoragePool {
    StoragePoolId id = 1;
    string name = 2;
}

enum StorageMode {
    STORAGE_MODE_UNSPECIFIED = 0;
    BRIDGED = 1;
    ORDINARY = 2;
    MIXED = 3;
}

enum SynchronizationStatus {
    SYNCHRONIZATION_STATUS_UNSPECIFIED = 0;
    SYNCED = 1;
    SYNCING = 2;
    // Synchronization is required but is not currently running.
    PENDING = 3;
    // Bridge synchronization is not required: ordinary storage or an INACTIVE pile.
    NOT_REQUIRED = 4;
    // The available observations cannot confirm synchronization.
    UNKNOWN = 5;
}

message GroupSyncCounts {
    // Required groups only: required = synced + syncing + pending + unknown.
    // NOT_REQUIRED groups, including ordinary storage, are excluded.
    uint64 required = 1;
    uint64 synced = 2;
    uint64 syncing = 3;
    uint64 pending = 4;
    uint64 unknown = 5;
}

// Known storage owners observed in this pile, counted once regardless of the
// number of their pools or groups. Total is the sum of the five status counts.
// NOT_REQUIRED includes ordinary storage, inactive piles and empty storage.
message DatabaseSyncCounts {
    uint64 total = 1;
    uint64 synced = 2;
    uint64 syncing = 3;
    uint64 pending = 4;
    uint64 unknown = 5;
    uint64 not_required = 6;
}

message PileSynchronization {
    // Absent for known databases whose placement cannot be determined.
    // A present empty name identifies an actual pile named "".
    optional string pile_name = 1;
    DatabaseSyncCounts databases = 2;
}

message SynchronizationError {
    // Error of an earlier synchronization attempt, not a failure of this RPC.
    // It may coexist with the current SYNCING status.
    string message = 1;
    google.protobuf.Timestamp occurred_at = 2;
}

message DatabaseSynchronization {
    // Best-effort name of the storage owner. Missing metadata does not discard
    // the summary: the concrete pools remain available for further inspection.
    optional string database_path = 1;
    repeated StoragePool storage_pools = 2;
    StorageMode storage_mode = 3;
    // Pile of this observation. Ordinary placement is derived from the groups'
    // VDisk nodes; absent if placement cannot be determined.
    optional string pile_name = 4;
    // For MIXED storage, counts cover only the bridged pools listed above.
    GroupSyncCounts groups = 5;
    SynchronizationError last_sync_error = 6;
}

message GroupSynchronization {
    // ID of the storage group used by tablets.
    uint32 group_id = 1;
    // ID of its physical group with VDisks, for low-level diagnostics.
    // Absent when the required physical group has not been created yet.
    optional uint32 physical_group_id = 2;
    // Absent for groups outside dynamic storage pools.
    StoragePool storage_pool = 3;
    // Pile of this observation. An ordinary physical group spanning several
    // piles has one row per pile; absent if placement cannot be determined.
    optional string pile_name = 4;
    SynchronizationStatus sync_status = 5;
    // Recorded protocol phase, for diagnostics only. This text is not a stable
    // state machine; use sync_status for programmatic decisions.
    string sync_phase = 6;
    SynchronizationError last_sync_error = 7;
}

message PileConnectivity {
    string pile_name = 1;
    uint32 static_nodes = 2;
    uint32 connected_static_nodes = 3;

    // Whether connected static nodes satisfy this pile's distconf node quorum.
    // This measures node connectivity, not working disks. INACTIVE piles report false.
    bool has_node_quorum = 4;

    // Only piles in config quorum can block configuration commits. NOT_SYNCHRONIZED
    // stage 1 is in neither quorum; stage 2 is in both quorums.
    bool in_config_quorum = 5;
    bool in_data_quorum = 6;
}

// A snapshot of one distconf binding component. During a partition, each side can
// report the other as lacking quorum. This is not a vote and must not select which
// side survives. Rebinding can temporarily report only part of a reachable pile.
// DISCONNECTED and INACTIVE piles do not connect to other piles, so their missing
// quorum is expected when viewed from another pile.
message PileConnectivityReport {
    uint32 reporter_node_id = 1;
    bool reporter_is_root = 2;
    bool binding_in_progress = 3;

    // Reporter cluster-state generation; may differ from GetClusterStateResult.generation.
    uint64 generation = 4;

    // Names and quorum requirements come from the reporter, independently of pile_states.
    repeated PileConnectivity piles = 5;
}

message PendingPileOperation {
    enum Kind {
        KIND_UNSPECIFIED = 0;
        // The pile is being added to the cluster: its storage groups are being created
        ADD = 1;
        // The pile is being removed from the cluster: its storage groups are being deleted
        REMOVE = 2;
    }
    string pile_name = 1;
    Kind kind = 2;
    // Why the last attempt to perform the operation has failed; it is retried meanwhile
    string error_reason = 3;
}

message UpdateClusterStateRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    // List of desired pile states to update
    repeated PileState updates = 2 [(size).ge = 1];
    // Deprecated and ignored. The update is committed by the quorum of every pile that takes part in the
    // configuration quorum in the new cluster state, that is, every pile not DISCONNECTED, SUSPENDED or INACTIVE
    // there; to go on without an unavailable pile, set it DISCONNECTED in the same update.
    repeated string quorum_piles = 3;
    // Compare-and-set guard: the generation of the cluster state (GetClusterStateResult.generation) that this
    // update is based on. When set, the update is applied only if the cluster state still has this generation
    // when the change executes; the committed state then has generation expected_generation + 1.
    // ABORTED: the cluster state has another generation; the update was not applied. Read the state again
    // before deciding the next update.
    // UNAVAILABLE with a lagging-node message: the receiving node has not yet received this generation; the
    // update was not applied and may be sent again, preferably to another node.
    // Other failures, such as INTERNAL_ERROR, do not tell whether the update was applied. Once a generation
    // greater than expected_generation is observed, the update can no longer be applied.
    // When unset, the update is applied on top of the receiving node's current cluster state.
    // Nodes of older versions ignore this field.
    optional uint64 expected_generation = 4;
}

message UpdateClusterStateResponse {
    Ydb.Operations.Operation operation = 1;
}

message UpdateClusterStateResult {
}

// Convert a running non-bridged cluster into a bridged one with a single pile. All nodes of the cluster must already
// run with a single-pile bridge config. By default, existing storage pools and their groups are converted in the
// background after the call succeeds; see GetClusterStateResult.conversion_in_progress.
message ConvertToBridgeRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    // Leave existing storage pools and their groups non-bridged; they are not replicated to added piles until converted
    // separately. Static storage groups are still converted to bridge mode. The bridge config must enable non-uniform
    // storage, which gets activated along with the conversion.
    bool skip_storage_pool_conversion = 2;
}

message ConvertToBridgeResponse {
    Ydb.Operations.Operation operation = 1;
}

message ConvertToBridgeResult {
}

// Add an INACTIVE pile, listed in the bridge config with its hosts, to the cluster: create its parts of storage
// groups and state storage, then make it DISCONNECTED; the pile may be rejoined after that. The call returns when every
// storage group has got its part in the pile, or when this has failed.
message AddPileRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    string pile_name = 2 [(length).le = 128];
}

message AddPileResponse {
    Ydb.Operations.Operation operation = 1;
}

message AddPileResult {
}

// Remove a DISCONNECTED pile from the cluster: delete its parts of storage groups with all their data and its parts of
// state storage, then make it INACTIVE; the pile may be dropped from the bridge config along with its hosts after that.
// The call returns when every storage group has lost its part in the pile, or when this has failed.
message RemovePileRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    string pile_name = 2 [(length).le = 128];
}

message RemovePileResponse {
    Ydb.Operations.Operation operation = 1;
}

message RemovePileResult {
}

message BridgeHistoryEvent {
    // Timestamp of the event
    google.protobuf.Timestamp timestamp = 1;
    // UUID of the request that initiated the change
    string request_id = 2 [(length).le = 64];
    // UUID of the cluster state generation
    string generation_uuid = 3 [(length).le = 64];
    // The primary pile at the time of the event
    string primary_pile = 4 [(length).le = 128];
    // Name of the pile that changed state
    string pile_name = 5 [(length).le = 128];
    // Event type
    string event = 6;
    // State before the change
    PileState.State from_state = 7;
    // State after the change
    PileState.State to_state = 8;
    // Who initiated the change (e.g., "admin" or "system")
    string initiator = 9;
}

message GetClusterHistoryRequest {
    Ydb.Operations.OperationParams operation_params = 1;
    // Limit the number of history records to show
    uint64 limit = 2;
    // Pagination token
    string page_token = 3 [(length).le = 256];
}

message GetClusterHistoryResponse {
    Ydb.Operations.Operation operation = 1;
}

message GetClusterHistoryResult {
    // List of history events
    repeated BridgeHistoryEvent events = 1;
    // Pagination token
    string next_page_token = 2;
}
