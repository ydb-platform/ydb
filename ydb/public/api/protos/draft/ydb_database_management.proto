syntax = "proto3";
option cc_enable_arenas = true;

package Ydb.DatabaseManagement;
option java_package = "com.yandex.ydb.database_management";

import "ydb/public/api/protos/ydb_operation.proto";

message TriggerRediscoveryRequest {
    Ydb.Operations.OperationParams operation_params = 1;
}

message TriggerRediscoveryResponse {
    // SUCCESS means the rediscovery marker has been committed for this database.
    Ydb.Operations.Operation operation = 1;
}
