syntax = "proto3";
option cc_enable_arenas = true;

package Ydb.Secret;
option java_package = "com.yandex.ydb.secret";

import "ydb/public/api/protos/annotations/validation.proto";
import "ydb/public/api/protos/ydb_operation.proto";
import "ydb/public/api/protos/ydb_scheme.proto";

// Describe secret request sent from client to server.
message DescribeSecretRequest {
    Ydb.Operations.OperationParams operation_params = 1;

    // Secret path
    string path = 2;
}

// Describe secret response sent from server to client.
// If the secret does not exist then response status will be "SCHEME_ERROR".
message DescribeSecretResponse {
    Ydb.Operations.Operation operation = 1;
}

// The IAM delegation a secret with SOURCE = "IAM_DELEGATION" gets its tokens from.
// Not sensitive: a description of the secret shows it, the value of a secret is never shown.
message IamDelegation {
    // The service account YDB impersonates
    string service_account_id = 1;

    // The cloud the delegation is set up in
    string cloud_id = 2;

    // The id of the delegation on the YDB side (the referrer in IAM)
    string referrer_id = 3;
}

// Describe secret result message that will be inside DescribeSecretResponse.operation.
message DescribeSecretResult {
    // Description of scheme object.
    Ydb.Scheme.Entry self = 1;

    // Internal version of the secret object
    int64 version = 2 [(Ydb.value) = ">= 0"];

    // The delegation of a secret with SOURCE = "IAM_DELEGATION"; absent for a secret with a value
    IamDelegation iam_delegation = 3;

    // A replacement of the delegation staged by ALTER SECRET and not promoted yet
    IamDelegation pending_iam_delegation = 4;
}
