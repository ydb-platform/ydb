}

message DescribeTopicResult {
    message Consumer {
        string path = 1;
        repeated NLogBroker.TopicInstance instances = 2;
    }

    NLogBroker.TopicProperties properties = 1;
    NLogBroker.TopicAdminProperties admin_properties = 2;
    string parent_template = 3;
    repeated NLogBroker.TopicRateLimitProperties rate_limits = 4;
    repeated NLogBroker.InheritedDirectoryRateLimit inherited_rate_limits = 5;
    repeated NLogBroker.Permissions permissions = 6;
    repeated NLogBroker.Permissions effective_permissions = 7;
    repeated NLogBroker.ReadRuleAdmin read_rules = 10;
    repeated NLogBroker.Metadata metadata = 11;
    string owner = 12;
    repeated NLogBroker.TopicInstance instances = 13;
    repeated Consumer consumers = 14;
    repeated NLogBroker.RemoteMirrorRuleAdmin remote_mirror_rules = 15;
}

message DescribeConsumerResult {
    message Topic {
        string path = 1;
        repeated NLogBroker.TopicInstance instances = 2;
    }

    NLogBroker.ConsumerProperties properties = 1;
    NLogBroker.ConsumerAdminProperties admin_properties = 10;
    string parent_template = 2;
    repeated NLogBroker.ConsumerRateLimitProperties rate_limits = 3;
    repeated NLogBroker.InheritedDirectoryRateLimit inherited_rate_limits = 4;
    repeated NLogBroker.Permissions permissions = 5;
    repeated NLogBroker.Permissions effective_permissions = 6;
    repeated NLogBroker.ReadRuleAdmin read_rules = 8;
    repeated NLogBroker.Metadata metadata = 9;
    string owner = 11;
    repeated Topic topics = 12;
}

