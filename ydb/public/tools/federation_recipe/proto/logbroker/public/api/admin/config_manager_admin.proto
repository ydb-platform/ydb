        DescribeAccountResult account = 2;
        DescribeDirectoryResult directory = 3;
        DescribeTopicResult topic = 4;
        DescribeConsumerResult consumer = 5;
    }
    uint64 creation_time_ms = 20;
    uint64 modification_time_ms = 21;
    string created_by = 22;
    string modified_by = 23;
}

message DescribeAccountResult {
    string name = 1;
    string parent_template = 2;
    NLogBroker.AccountProperties properties = 3;
    NLogBroker.AccountAdminProperties admin_properties = 10;
    NLogBroker.QuotaUsageProperties quota_usage = 8;
    NLogBroker.AdminQuotaUsageProperties admin_quota_usage = 9;
    repeated NLogBroker.AccountRateLimitProperties account_rate_limits = 14;
    repeated NLogBroker.DirectoryRateLimitProperties rate_limits = 4;
    repeated NLogBroker.Permissions permissions = 5;
    repeated NLogBroker.Permissions effective_permissions = 13;
    repeated NLogBroker.Metadata metadata = 7;
