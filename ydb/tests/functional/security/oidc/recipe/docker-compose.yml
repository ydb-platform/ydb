version: "2.4"

services:
  keycloak:
    build: ${OIDC_KEYCLOAK_CONTEXT}
    ports:
      - "127.0.0.1:${OIDC_KEYCLOAK_PORT}:8443"
    mem_limit: 1g
    labels:
      ydb.test: oidc
    environment:
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx512m
      KC_BOOTSTRAP_ADMIN_USERNAME: ${OIDC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${OIDC_KEYCLOAK_ADMIN_PASSWORD}
      OIDC_KEYCLOAK_PORT: ${OIDC_KEYCLOAK_PORT}
      OIDC_REALM: ${OIDC_REALM}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_CLUSTER_ADMIN_CLIENT_ID: ${OIDC_CLUSTER_ADMIN_CLIENT_ID}
      OIDC_CLUSTER_ADMIN_CLIENT_SECRET: ${OIDC_CLUSTER_ADMIN_CLIENT_SECRET}
      OIDC_DEVICE_CLIENT_ID: ${OIDC_DEVICE_CLIENT_ID}
      OIDC_DEVICE_USERNAME: ${OIDC_DEVICE_USERNAME}
      OIDC_DEVICE_PASSWORD: ${OIDC_DEVICE_PASSWORD}
    command:
      - start-dev
      - --import-realm
