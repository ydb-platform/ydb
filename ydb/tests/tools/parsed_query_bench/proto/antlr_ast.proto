syntax = "proto3";

package Ydb.Query;
option cc_enable_arenas = true;

import "ydb/tests/tools/parsed_query_bench/proto/yql_parser_metadata.proto";

import "yql/essentials/parser/proto_ast/gen/v1_proto_split_antlr4/SQLv1Antlr4Parser.proto";

message SqlV1ParserAst {
  uint32 format_version = 1; // Required: 1 for this envelope revision.
  YqlParserMetadata metadata = 2;
  .NSQLv1Generated.TSQLv1ParserAST ast = 3;
  repeated YqlParserToken tokens = 4;
}
