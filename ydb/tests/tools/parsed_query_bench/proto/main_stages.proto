syntax = "proto3";
option cc_enable_arenas = true;

package Ydb.Query;

message YqlAst {
    uint32 format_version = 1;
    Node root = 2;

    message Node {
        uint32 row = 1;
        uint32 column = 2;
        string file = 3;
        oneof kind {
            Atom atom = 4;
            List list = 5;
        }
    }
    message Atom {
        bytes content = 1;
        uint32 flags = 2;
    }
    message List {
        repeated Node children = 1;
    }
}

// A postorder expression DAG at the output of BuildKqlQuery. The last node is
// the root. A one-based child ID references an earlier node in the same graph.
message KqlQueryList {
    uint32 format_version = 1;
    repeated Node nodes = 2;
    // Version 1 omits these fields and uses derive_column_order=true, ordered_columns=false.
    // Version 2 carries both fields explicitly for other settings.
    optional bool derive_column_order = 3;
    optional bool ordered_columns = 4;

    message Node {
        enum Kind {
            UNSPECIFIED = 0;
            ATOM = 1;
            LIST = 2;
            CALLABLE = 3;
            LAMBDA = 4;
            ARGUMENT = 5;
            ARGUMENTS = 6;
            WORLD = 7;
        }
        Kind kind = 1;
        bytes content = 2;
        uint32 atom_flags = 3;
        repeated uint32 children = 4;
        uint32 row = 5;
        uint32 column = 6;
        string file = 7;
    }
}
