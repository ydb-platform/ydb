syntax = "proto3";

package Ydb.Query.Benchmark;

import "ydb/tests/tools/parsed_query_bench/proto/kql_query_list.proto";
import "yql/essentials/parser/proto_ast/gen/v1_proto_split_antlr4/SQLv1Antlr4Parser.proto";

message ParsedQuery {
    oneof stage {
        SqlV1ParserAst antlr_ast = 1;
        YqlAst yql_ast = 5;
        KqlQueryList kql_query_list = 6;
    }
}

message SqlV1ParserAst {
    bytes grammar_fingerprint = 1;
    .NSQLv1Generated.TSQLv1ParserAST ast = 2;
    repeated Token tokens = 3;

    message Token {
        string name = 1;
        bytes content = 2;
        uint32 line = 3;
        uint32 column = 4;
    }
}

message YqlAst {
    uint32 format_version = 1;
    Node root = 2;

    message Node {
        uint32 row = 1;
        uint32 column = 2;
        string file = 3;
        oneof kind {
            Atom atom = 4;
            List list = 5;
        }
    }
    message Atom {
        bytes content = 1;
        uint32 flags = 2;
    }
    message List {
        repeated Node children = 1;
    }
}
