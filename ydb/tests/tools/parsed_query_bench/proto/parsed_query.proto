syntax = "proto3";

package Ydb.Query;
option cc_enable_arenas = true;

import "ydb/tests/tools/parsed_query_bench/proto/antlr_ast.proto";
import "ydb/tests/tools/parsed_query_bench/proto/antlr_cst.proto";
import "ydb/tests/tools/parsed_query_bench/proto/syntax_script.proto";
import "ydb/tests/tools/parsed_query_bench/proto/native_query.proto";
import "ydb/tests/tools/parsed_query_bench/proto/main_stages.proto";

message ParsedQuery {
  reserved 1;
  reserved "sql_for_fallback";

  oneof stage {
    // NewParser
    SqlV1ParserAst antlr_ast = 2;
    AntlrCst antlr_cst = 3;
    SyntaxScript script = 4;
    NativeQuery native_query = 5;
    // main
    YqlAst yql_ast = 6;
    KqlQueryList kql_query_list = 7;
    MainSqlV1ParserAst main_antlr_ast = 8;
  }
}
